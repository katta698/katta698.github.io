name: Deploy the site

# Pages serves the main branch directly today, which means a push is live
# the moment it lands and nothing can stand between the two. That is why
# the browser checks have to run on a laptop before the push: it is the
# only place left to put them.
#
# This moves the deploy behind a workflow, so there is somewhere to put a
# gate. Nothing changes about what is served -- the artifact is the same
# tree Pages reads now, minus the things it was never serving anyway.
#
# It is deliberately inert until the repository variable PAGES_VIA_ACTIONS
# is set to "true" AND Settings -> Pages -> Source is switched to "GitHub
# Actions". Until then this builds the artifact and reports on it, so the
# fidelity can be proved before anything is switched over. Setting the
# variable back to anything else disables the deploy again without
# touching a line of this file.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy, rather than only building and reporting"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys, never cancel one. Two windows publishing at the same
# moment is the normal case here, not the exception, and a cancelled
# deploy would leave the site on whichever build lost the race.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Faithful to a fault, on purpose. Pages serves this branch
          # verbatim today -- scripts/, .github/ and all -- so the
          # first version of this ships exactly that. Nothing else is
          # allowed to change at the same time as the mechanism:
          # trimming what gets served is a real improvement and a
          # SEPARATE decision, and doing both at once would leave a
          # 404 with two possible causes.
          rsync -a --delete --exclude '.git' ./ _site/
          touch _site/.nojekyll

      - name: What is in the artifact
        run: |
          set -euo pipefail
          echo "files: $(find _site -type f | wc -l)"
          echo "size : $(du -sh _site | cut -f1)"
          echo
          echo "top-level:"
          ls -1 _site | sed 's/^/  /'

      - name: Does it match what is live right now
        continue-on-error: true
        run: |
          set -uo pipefail
          # Proof, for the window before the switch: the artifact should be
          # byte-identical to what jayanthkatta.com serves today. After the
          # switch this compares the site to itself and always passes, so it
          # never blocks -- it is evidence, not a gate.
          same=0; differ=0; missing=0
          for path in index.html connect/index.html blog/index.html \
                      resume.html now.html blog/rss.xml sitemap.xml; do
            if [ ! -f "_site/$path" ]; then
              echo "  MISSING from artifact: $path"; missing=$((missing+1)); continue
            fi
            curl -fsS --max-time 30 "https://jayanthkatta.com/$path" \
              -o /tmp/live.out || { echo "  could not fetch $path"; continue; }
            if diff -q <(tr -d '\r' < /tmp/live.out) \
                       <(tr -d '\r' < "_site/$path") >/dev/null 2>&1; then
              echo "  same as live: $path"; same=$((same+1))
            else
              a=$(wc -c < /tmp/live.out); b=$(wc -c < "_site/$path")
              echo "  DIFFERS: $path (live ${a}b, artifact ${b}b)"
              differ=$((differ+1))
            fi
          done
          echo
          echo "identical: $same   differing: $differ   missing: $missing"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # The browser checks, moved off the laptop. They lived in the pre-push hook
  # because Pages served the branch directly and there was nowhere else to put
  # them -- the comment at the top of this file says exactly that. Now that the
  # deploy goes through a workflow, this is the somewhere.
  #
  # Why this is not a reduction in coverage: the same checks run, on the same
  # pages, and they run BEFORE anything is served, because deploy needs them.
  # What changes is that they run once per merged tree rather than once per
  # window per push. Three windows were each re-checking the same 439 pages,
  # serialised on the lock in the shared git directory.
  #
  # preflight.py decides its own severity. Checks in its ADVISORY set report
  # without failing -- advisory results are collected separately from failures
  # -- which is why a check_contrast failure on /reinvent-2026/, red since
  # 8 October and caused by no post, cannot block a deploy and strand the site.
  checks:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same two prepublish.yml installs. Named explicitly rather than
      # read from a requirements file, because there is no requirements.txt
      # in this repo -- the first version of this job pointed at one and hid
      # the failure behind `|| true`, so the checks ran without pyyaml and
      # seven of them failed in under a second on ModuleNotFoundError. A
      # dependency failure must stop the job, not be swallowed into a wall of
      # meaningless check failures.
      - name: Install dependencies
        run: pip install --quiet pyyaml beautifulsoup4

      # The same pair health.yml installs: some checks compare the two engines,
      # and without webkit they degrade to a note rather than a failure.
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium webkit

      - name: Run the full preflight, browser checks included
        run: python scripts/preflight.py

  deploy:
    needs: [build, checks]
    # Inert until the repository variable is set AND Pages is switched to
    # "GitHub Actions" as its source. Either one missing and this is a
    # build-and-report workflow, which is what it should be until the
    # artifact has been proved.
    if: >-
      vars.PAGES_VIA_ACTIONS == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
