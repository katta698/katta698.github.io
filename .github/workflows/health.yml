# A dated verdict on whether the site can be trusted this morning.
#
# Opens one GitHub issue a day with the full report. GitHub emails the issue to
# the repository owner, so the delivery costs nothing and needs no secrets, no
# SMTP credentials and no third-party service -- and every report stays
# browsable and dated, which is the same standard the site holds its own
# numbers to.
#
# It reports and never blocks. A typo, or a slow morning at Amazon, must not
# stop this site from publishing.
name: Site health — the daily report

on:
  schedule:
    # 13:00 UTC is 08:00 in Chicago while daylight saving is in force, and
    # 07:00 once it ends. GitHub's scheduler only speaks UTC, so one of the two
    # has to drift; an hour early in winter is the harmless direction.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the health report
        env:
          # The report reads workflow history to see whether the scheduled jobs
          # ran and passed. Without this it degrades to a note rather than
          # failing, which is the right behaviour but a less useful report.
          GH_TOKEN: ${{ github.token }}
        run: python scripts/health_report.py --markdown health-report.md

      - name: Open today's issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Site health — $(date -u '+%d %b %Y')"
          # The verdict goes in the title so it is legible from an email
          # subject line without opening anything.
          if grep -q "NEEDS ATTENTION" health-report.md; then
            TITLE="$TITLE — needs attention"
          fi
          gh issue create \
            --title "$TITLE" \
            --body-file health-report.md \
            --label "health" \
          || gh issue create --title "$TITLE" --body-file health-report.md
