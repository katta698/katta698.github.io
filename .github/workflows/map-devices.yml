name: Map — render it on the engines readers actually use

# The live-incident pulse was written and checked in Chromium, and on an iPad
# it read as static. It was in fact animating; it just never grew, so a 2px
# ring dimming was imperceptible on a tablet. Nothing about the desktop render
# said so, and the way it was found was somebody opening the page on their own
# device and saying it looked wrong.
#
# That is not a check, it is luck. This drives real WebKit and Gecko at phone,
# tablet and desktop widths and asks the page what it is doing.
#
# It runs only when the map's own code changes, because installing browsers
# costs a minute or two and coastlines do not regress on their own.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'intelligence/status/pm.js'
      - 'intelligence/status/status.css'
      - 'scripts/check_map_devices.py'
      - '.github/workflows/map-devices.yml'

permissions:
  contents: read

concurrency:
  group: map-devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and the three engines
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium webkit firefox

      - name: Render the map at every size on every engine
        run: python scripts/check_map_devices.py
