name: On Publish — Re-index RAG search and update the GitHub README

on:
  workflow_dispatch:
  push:
    branches: [main]
    # blog/index.html alone was not enough. It fires when the site index is
    # regenerated, which is most publishes -- but 09c3c73 rebuilt one post's own
    # page without touching the index, so this never ran and that post's summary
    # was never generated. The widget reported "still being generated" and was
    # telling the truth: the record did not exist and nothing was going to create
    # it.
    #
    # cards.json is the precise signal, because it is exactly what the indexer
    # reads -- if the post list or any card's title, excerpt or date changed, the
    # index is stale by definition. posts/** covers a body edit that leaves the
    # card identical, which is what today's citation fixes were.
    #
    # Deliberately NOT blog/*/index.html: a CSS change re-stamps the ?v= token on
    # every post page, so that would re-index the whole corpus on every styling
    # push -- 570 embeddings for a change that alters no post text.
    paths:
      - 'blog/index.html'
      - 'blog/cards.json'
      - 'posts/**'

permissions:
  id-token: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::684346483786:role/github-actions-blog-publish
          aws-region: us-east-1

      # Waits on cards.json, not posts.json. The indexer reads cards.json;
      # posts.json is the home page's top-7 widget feed. Guarding a different
      # file than the one being consumed is how the index ended up holding 117
      # posts while the site served 118 -- the wait passed because posts.json[0]
      # already matched, and the indexer then read a cards.json that had not
      # landed yet. Same deploy, but nothing guaranteed the ordering.
      #
      # Compares the post COUNT rather than the newest URL, because the failure
      # is a missing post, and a stale file can have the right newest entry and
      # still be short.
      - name: Wait for GitHub Pages to deploy
        run: |
          EXPECTED=$(python3 -c "import json; print(len(json.load(open('blog/cards.json'))))")
          echo "Waiting for Pages to serve cards.json with $EXPECTED posts"
          for i in $(seq 1 40); do
            LIVE=$(curl -sf https://jayanthkatta.com/blog/cards.json | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "")
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Pages deployed after $i attempts; cards.json has $LIVE posts."
              break
            fi
            echo "Attempt $i: live='$LIVE', expected='$EXPECTED' — retrying in 15s"
            sleep 15
          done

      # --cli-read-timeout 0 disables the socket read timeout, which otherwise
      # defaults to 60 seconds and is shorter than the function now takes.
      #
      # The indexer used to read one page of the paginated blog index, so it
      # handled 24 posts and returned in ~25s. Reading cards.json means all 114,
      # which measures 71s. The CLI hit its 60s read timeout, retried, and failed
      # the step with "Read timeout on endpoint URL" after ~3 minutes -- while the
      # Lambda ran to completion and wrote a correct index. A red run and a
      # working search, which is the least useful combination available.
      #
      # Synchronous rather than --invocation-type Event on purpose: the response
      # payload is the only place the completeness guard's message can be read,
      # and a fire-and-forget invoke would make a genuinely failed re-index look
      # identical to a successful one. That is the exact failure mode that let 90
      # posts sit unindexed for weeks.
      - name: Re-index RAG search
        run: |
          aws lambda invoke \
            --function-name blog-search-indexer \
            --region us-east-1 \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 0 \
            --cli-connect-timeout 60 \
            response.json
          cat response.json
          echo
          # `aws lambda invoke` exits 0 when the FUNCTION fails -- the API call
          # succeeded, and the error is in the payload. Without this, the guard
          # inside the indexer that refuses to write a partial index would print
          # its reason and the workflow would go green anyway.
          if grep -q '"errorMessage"' response.json; then
            echo "::error::The indexer returned an error; the search index was NOT updated."
            exit 1
          fi

          # Assert the OUTCOME, not the trigger.
          #
          # Every failure this workflow has had was a silent shortfall that
          # returned 200: the indexer read one page of a paginated index and
          # covered 24 of 114 posts for weeks, and later covered 117 while the
          # site served 118, leaving one post with no summary and a widget
          # reporting "still being generated" forever.
          #
          # Both were visible in the response payload the whole time and nothing
          # compared it to anything. This does. A trigger can be wrong again --
          # this catches it when it is.
          INDEXED=$(python3 -c "import json,re;b=json.load(open('response.json'))['body'];print(re.search(r'from (\d+) posts',b).group(1))")
          LIVE=$(curl -sf https://jayanthkatta.com/blog/cards.json | python3 -c "import sys,json;print(len(json.load(sys.stdin)))")
          echo "Indexed $INDEXED posts; the site serves $LIVE."
          if [ "$INDEXED" != "$LIVE" ]; then
            echo "::error::The index covers $INDEXED posts but the site serves $LIVE. \
          Posts missing from the index return no search results and no At a glance \
          summary, and nothing else reports it."
            exit 1
          fi
          # The SUMMARIES are a second outcome, and the guard above cannot see
          # them. Measured on 2026-09-04, the indexer returned
          #   "Indexed 1183 chunks from 195 posts, 194 summaries cached"
          # on a push publishing GCP arch #22. Posts matched the site exactly so
          # this step went green -- while that post's At a glance returned 404
          # from the summary API and its widget told readers the summary was
          # still being generated. Nothing was going to generate it.
          #
          # That is the same silent shortfall the comment above describes, on the
          # one dimension the check did not read, out of a string it was already
          # parsing. The runs either side were 193/193 and 194/194, so it is a
          # real per-post miss rather than an artefact of how the count is taken.
          #
          # Fails rather than warns: a post with no summary is missing from the
          # one widget every reader meets first, and the widget's own message
          # ("appears within a few hours") is untrue in this state.
          CACHED=$(python3 -c "import json,re;b=json.load(open('response.json'))['body'];m=re.search(r'(\d+) summaries cached',b);print(m.group(1) if m else '')")
          if [ -z "$CACHED" ]; then
            echo "::warning::The indexer response carried no summaries count; it may predate that field. Skipping the summary check."
          else
            echo "Cached $CACHED summaries for $INDEXED posts."
            if [ "$CACHED" != "$INDEXED" ]; then
              echo "::error::$CACHED summaries cached for $INDEXED indexed posts.           The shortfall is a post whose At a glance will 404 indefinitely. Re-run           this workflow; if it recurs, the fault is in the indexer summary path."
              exit 1
            fi
          fi

      # Retried, because this failed a run today on "HTTP 503: No server is
      # currently available to service your request" from GitHub's own GraphQL
      # API. The re-index above had already succeeded, so the red run reported a
      # problem with the search index that did not exist -- and a gate that cries
      # wolf gets ignored, which is how a real failure goes unread.
      #
      # It is also the least consequential step in the workflow: the profile
      # README is regenerated by a twice-daily cron in the other repo regardless,
      # so this only makes it prompt. Hence a warning rather than a failure when
      # all three attempts lose.
      - name: Trigger GitHub README update
        run: |
          for i in 1 2 3; do
            if gh workflow run blog-posts.yml --repo katta698/katta698; then
              echo "Triggered on attempt $i."
              exit 0
            fi
            echo "Attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::warning::Could not trigger the README update after 3 attempts. \
          The twice-daily cron in katta698/katta698 will pick it up."
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
