name: On Publish — Re-index RAG search and update the GitHub README

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blog/index.html'

permissions:
  id-token: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::684346483786:role/github-actions-blog-publish
          aws-region: us-east-1

      - name: Wait for GitHub Pages to deploy
        run: |
          EXPECTED=$(python3 -c "import json; print(json.load(open('blog/posts.json'))[0]['url'])")
          echo "Waiting for Pages to serve first post: $EXPECTED"
          for i in $(seq 1 40); do
            LIVE=$(curl -sf https://jayanthkatta.com/blog/posts.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['url'])" 2>/dev/null || echo "")
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Pages deployed after $i attempts."
              break
            fi
            echo "Attempt $i: live='$LIVE', expected='$EXPECTED' — retrying in 15s"
            sleep 15
          done

      - name: Re-index RAG search
        run: |
          aws lambda invoke \
            --function-name blog-search-indexer \
            --region us-east-1 \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json

      - name: Trigger GitHub README update
        run: |
          gh workflow run blog-posts.yml --repo katta698/katta698
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
