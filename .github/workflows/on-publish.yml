name: On Publish — Update RAG index and GitHub README

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blog/rss.xml'

permissions:
  id-token: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::684346483786:role/github-actions-blog-publish
          aws-region: us-east-1

      - name: Re-index RAG search
        run: |
          aws lambda invoke \
            --function-name blog-search-indexer \
            --region us-east-1 \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json

      - name: Trigger GitHub README update
        run: |
          gh workflow run blog-posts.yml --repo katta698/katta698
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
