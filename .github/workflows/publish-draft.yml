name: Publish Draft Post

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Draft slug (e.g. arch-003-draft)
        required: true
      token:
        description: Draft approval token
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::684346483786:role/github-actions-blog-publish
          aws-region: us-east-1

      - name: Download and build post files
        run: |
          aws s3 cp s3://jay-blog-search-index-v2/drafts/${{ inputs.slug }}.json draft.json

          python3 - <<'PYEOF'
          import json, os, re
          from datetime import datetime

          d = json.load(open('draft.json'))
          num = d['num']          # e.g. "003"
          topic = d['topic']
          body_html = d['html_content']
          svg1 = d.get('diagram_svg_1', '')
          svg2 = d.get('diagram_svg_2', '')

          # Extract title from first h2
          m = re.search(r'<h2[^>]*>(.*?)</h2>', body_html, re.DOTALL)
          title = re.sub(r'<[^>]+>', '', m.group(1)).strip() if m else f"AWS Architecture Series #{num}"

          # Derive slug from title: "AWS Architecture Series #003 -- ECS vs EKS..." -> "aws-architecture-ecs-vs-eks"
          slug_title = re.sub(r'AWS Architecture Series #\d+\s*[-–—]+\s*', '', title, flags=re.IGNORECASE)
          url_slug = re.sub(r'[^a-z0-9]+', '-', slug_title.lower()).strip('-')
          file_slug = f"arch-{num}-{url_slug}"   # e.g. arch-003-ecs-vs-eks
          url_path = f"aws-architecture-{url_slug}"  # e.g. aws-architecture-ecs-vs-eks

          today = datetime.now().strftime('%b %Y')
          canonical = f"https://jayanthkatta.com/blog/{url_path}/"

          # Save SVG diagram files
          if svg1:
              os.makedirs('blog/assets/diagrams', exist_ok=True)
              open(f'blog/assets/diagrams/{file_slug}-model.svg', 'w').write(svg1)
          if svg2:
              open(f'blog/assets/diagrams/{file_slug}-flow.svg', 'w').write(svg2)

          # Build diagram figure HTML to inject into post body
          diagram_figures = ''
          if svg1:
              diagram_figures += f'\n<figure class="screenshot"><img alt="Architecture diagram: {title} model" src="/blog/assets/diagrams/{file_slug}-model.svg"/></figure>\n'
          if svg2:
              diagram_figures += f'\n<figure class="screenshot"><img alt="Architecture diagram: {title} flow" src="/blog/assets/diagrams/{file_slug}-flow.svg"/></figure>\n'

          # Inject diagrams after first h3 (after the "Architecture" section heading)
          if diagram_figures:
              body_html = re.sub(r'(<h3[^>]*>Architecture</h3>)', r'\1' + diagram_figures, body_html, count=1, flags=re.IGNORECASE)
              if diagram_figures not in body_html:
                  # fallback: insert after first h3
                  body_html = re.sub(r'(<h3[^>]*>.*?</h3>)', r'\1' + diagram_figures, body_html, count=1, flags=re.DOTALL)

          # Load template from arch-002 post
          template = open('posts/arch-002-iam-identity-center.html').read()

          # Update YAML frontmatter slug and title
          post_html = re.sub(r'^(title:\s*)".+?"', f'\\1"{title}"', template, flags=re.MULTILINE)
          post_html = re.sub(r'^(slug:\s*)\S+', f'\\1{url_path}', post_html, flags=re.MULTILINE)

          # Replace title tag
          post_html = re.sub(r'<title>[^<]+</title>', f'<title>{title} | Jayanth Katta Blog</title>', post_html)

          # Replace canonical URL
          post_html = re.sub(r'<link rel="canonical"[^>]+>', f'<link rel="canonical" href="{canonical}"/>', post_html)

          # Replace og:title
          post_html = re.sub(r'(<meta property="og:title"\s+content=")[^"]*(")', rf'\g<1>{title}\2', post_html)

          # Replace the post body — template uses <div id="jk-post">
          marker = '<div id="jk-post">'
          idx = post_html.index(marker)
          post_html = post_html[:idx + len(marker)] + '\n' + body_html + '\n</div>'

          # Write output files
          os.makedirs(f'blog/{url_path}', exist_ok=True)
          open(f'posts/{file_slug}.html', 'w').write(post_html)
          open(f'blog/{url_path}/index.html', 'w').write(post_html)

          # Update blog index — insert new post card before first existing card
          excerpt_raw = re.search(r'<p>(.*?)</p>', body_html, re.DOTALL)
          excerpt = re.sub(r'<[^>]+>', '', excerpt_raw.group(1)).strip()[:160] + '...' if excerpt_raw else ''
          read_svg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
          arrow_svg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>'
          new_card = (
              f'<a href="/blog/{url_path}/" class="post-card"'
              f' data-title="{title}" data-excerpt="{excerpt}" data-tags="aws architecture">'
              f'<div class="post-card-body">'
              f'<div class="post-meta"><span class="tag-badge">AWS</span><span class="post-date">{today}</span></div>'
              f'<div class="post-title">{title}</div>'
              f'<div class="post-excerpt">{excerpt}</div>'
              f'<div class="post-footer">'
              f'<span class="read-time">{read_svg} 10 min read</span>'
              f'<span class="read-more">Read {arrow_svg}</span>'
              f'</div></div></a>'
          )
          blog_index = open('blog/index.html').read()
          first_card = blog_index.index('<a href="/blog/', blog_index.index('post-card'))
          blog_index = blog_index[:first_card] + new_card + blog_index[first_card:]
          open('blog/index.html', 'w').write(blog_index)

          # Write metadata for commit message
          open('publish_meta.txt', 'w').write(f'{file_slug}\n{url_path}\n{title}')
          print(f"Built: posts/{file_slug}.html")
          print(f"Built: blog/{url_path}/index.html")
          if svg1: print(f"Built: blog/assets/diagrams/{file_slug}-model.svg")
          if svg2: print(f"Built: blog/assets/diagrams/{file_slug}-flow.svg")
          PYEOF

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          META=$(cat publish_meta.txt)
          FILE_SLUG=$(echo "$META" | sed -n '1p')
          URL_PATH=$(echo "$META" | sed -n '2p')
          TITLE=$(echo "$META" | sed -n '3p')

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/katta698/katta698.github.io.git"
          git add "posts/${FILE_SLUG}.html" "blog/${URL_PATH}/" "blog/assets/diagrams/" "blog/index.html" 2>/dev/null || true
          git add "posts/${FILE_SLUG}.html" "blog/${URL_PATH}/index.html" "blog/index.html"
          git status
          git commit -m "Publish ${FILE_SLUG} via mobile approve"
          git push

      - name: Wait for Pages to deploy
        run: sleep 90

      - name: Re-index RAG search
        run: |
          aws lambda invoke \
            --function-name blog-search-indexer \
            --region us-east-1 \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json

      - name: Update GitHub README
        run: |
          gh workflow run blog-posts.yml --repo katta698/katta698
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
