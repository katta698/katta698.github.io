name: Regenerate hero schedule

# The two pages under schedule/ are snapshots: they are generated by running
# the real rotation code, so they are correct the moment they are built and
# silently wrong the moment a clip count, a track, or the week plan changes.
# Regenerating them by hand means remembering to, which is the failure mode
# this repo already has enough of.
#
# Only the inputs that can change what the pages say are listed. Adding a blog
# post does not affect the hero rotation, so posts do not trigger this.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blog/assets/hero-media.js'      # COUNTS, AUDIO_COUNTS, CLIP_AUDIO, PLAN
      - 'index.html'                     # the occasion-banner block lives here
      - 'blog/assets/videos/**'
      - 'blog/assets/audio/**'
      - 'CREDITS.md'                     # track names shown on the theme page
      - 'scripts/build_hero_schedule.js'
      - 'scripts/build_theme_preview.py'

permissions:
  contents: write

concurrency:
  # A media change often lands as several pushes in a row. Only the last one
  # needs to produce a commit.
  group: regenerate-schedule
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # If the counts and the files on disk disagree, the pages would be built
      # from a lie. Fail here rather than publish a schedule that lists clips
      # nobody can see.
      - name: Validate hero media
        run: python scripts/validate_hero_media.py

      - name: Rebuild the schedule and theme pages
        run: |
          node scripts/build_hero_schedule.js
          python scripts/build_theme_preview.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule/
          # The schedule window starts from the day it is built, so a run on a
          # new day always produces a diff even when nothing else moved. That is
          # intended: the page should track the coming year, not the year that
          # was current when someone last edited a clip.
          git diff --cached --quiet && echo "schedule unchanged" && exit 0
          git commit -m "chore: regenerate hero schedule [skip ci]"
          git push
