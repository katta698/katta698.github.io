name: Cloud status — refresh the incident dashboard

on:
  workflow_dispatch:

  # A SECOND, INDEPENDENT TRIGGER, because the scheduler cannot be trusted.
  #
  # */15 fired zero times in fourteen hours. Hourly then fired once and not
  # again for the next three and a half. GitHub drops scheduled runs on free
  # runners whenever it likes and says nothing, so a dashboard that depends on
  # the schedule alone is a dashboard that is stale at random.
  #
  # Any push to the site refreshes it too. That is not a cadence, but it means
  # the data is never older than the last time the site was touched, and it
  # costs nothing on a push that was happening regardless.
  #
  # paths-ignore is what stops the loop: this workflow COMMITS to
  # intelligence/, and without it every refresh would trigger another refresh
  # forever.
  push:
    branches: [main]
    paths-ignore:
      - 'intelligence/**'
      - '.github/**'

  schedule:
    # Hourly, because */15 never fired ONCE.
    #
    # In the first 14 hours after this workflow landed, a 15-minute cron should
    # have produced about 56 runs. It produced zero: the only run in the
    # history was a manual workflow_dispatch. Meanwhile ingest-news.yml, on a
    # daily cron in this same repo, has fired every day without missing. So the
    # scheduler works here -- it simply drops schedules this frequent on free
    # runners, silently, with nothing in the Actions log to say so.
    #
    # The page said "refreshed every 15 minutes" the whole time. A promise the
    # infrastructure never once kept is worse on this page than on any other,
    # because the entire argument of it is that the numbers are checkable.
    #
    # Hourly matches the cadence that demonstrably works. The page no longer
    # promises an interval at all: it prints how old the data is and says the
    # schedule can run late, which is the honest version of the same fact.
    - cron: '0 * * * *'

# Only one run at a time, and let a newer one win. These runs are pure
# refreshes: if three have queued up behind a slow one, the oldest two would
# commit data that is already stale by the time they land.
concurrency:
  group: cloud-status
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch each vendor's status feed
        run: python scripts/fetch_status.py

      # The vendors' post-incident write-ups. This was not automated at all:
      # it had only ever been run by hand, so a new AWS summary or Azure PIR
      # would never have appeared on the page without someone remembering.
      # For a section whose whole promise is "when it broke, here is what they
      # said", that is the difference between a living record and a snapshot.
      #
      # Cheap to run this often because it is incremental: only the three
      # index pages are read every time, and a detail page is fetched once.
      # A failure here must not stop the status refresh -- the incident data
      # is the time-critical half.
      - name: Collect any new post-incident write-ups
        continue-on-error: true
        run: python scripts/fetch_postmortems.py

      - name: Rebuild the page
        run: python scripts/build_status_page.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- intelligence/status.json intelligence/status-history.json intelligence/status-runs.json intelligence/postmortems.json intelligence/timeline-index.json intelligence/gcp-history.json intelligence/status/; then
            echo "No change since the last run."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence/status.json intelligence/status-history.json intelligence/status-runs.json intelligence/postmortems.json intelligence/timeline-index.json intelligence/gcp-history.json intelligence/status/

          # The message carries the headline fact so the commit list doubles as
          # an incident log -- "2 active" against a row of "all clear" is a
          # visible timeline without opening anything.
          N=$(python -c "import json;d=json.load(open('intelligence/status.json'));print(sum(len(v) for v in d['clouds'].values()))")
          git commit -m "Cloud status: ${N} active incident(s)"

          # Rebase, never force. Publishing pushes to this branch from four
          # worktrees, and a refresh landing every 15 minutes will eventually
          # collide with one of them.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::warning::Could not push the status refresh. The next run will retry."
