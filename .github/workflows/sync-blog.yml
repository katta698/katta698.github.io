name: Sync Blog from Blogger

on:
  schedule:
    - cron: '0 1 * * *'   # 1 AM UTC daily (6:30 AM IST)
  workflow_dispatch:        # also triggerable manually from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run blog sync
        run: python scripts/sync_blog.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/
          if git diff --cached --quiet; then
            echo "No changes — blog is already up to date."
          else
            POSTS=$(git diff --cached --name-only | grep -c "index.html" || true)
            git commit -m "Sync blog from Blogger — ${POSTS} page(s) updated [skip ci]"
            git push
          fi
