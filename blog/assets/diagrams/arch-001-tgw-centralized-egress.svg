<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-width:780px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Centralized Egress via Transit Gateway</title>
  <defs>
    <marker id="arr-gold" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#C4A484"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#3D9970"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#4A90D9"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#7B8FA1"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#F8F7F5" rx="10"/>

  <!-- Cost callout bar -->
  <rect x="30" y="25" width="340" height="22" rx="4" fill="#FFF8E7" stroke="#C4A484" stroke-width="1"/>
  <text x="200" y="40" text-anchor="middle" font-size="9" fill="#9E7B55">TGW $0.02/GB · NAT GW $0.045/GB · S3 Gateway endpoint free → place in every spoke</text>

  <!-- Prod Account -->
  <rect x="30" y="60" width="180" height="100" rx="8" fill="#F0F5FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="120" y="82" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#4A90D9">PROD ACCOUNT</text>
  <rect x="52" y="92" width="136" height="52" rx="5" fill="#fff" stroke="#4A90D9" stroke-width="1"/>
  <text x="120" y="112" text-anchor="middle" font-size="10" fill="#4A90D9">Workload VPC A</text>
  <text x="120" y="128" text-anchor="middle" font-size="9" fill="#7B9EC9">Route: 0.0.0.0/0 → TGW</text>
  <text x="120" y="141" text-anchor="middle" font-size="9" fill="#7B9EC9">No internet gateway</text>

  <!-- Dev Account -->
  <rect x="30" y="200" width="180" height="100" rx="8" fill="#F5F6F7" stroke="#7B8FA1" stroke-width="1.5"/>
  <text x="120" y="222" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#7B8FA1">DEV ACCOUNT</text>
  <rect x="52" y="232" width="136" height="52" rx="5" fill="#fff" stroke="#7B8FA1" stroke-width="1"/>
  <text x="120" y="252" text-anchor="middle" font-size="10" fill="#7B8FA1">Workload VPC B</text>
  <text x="120" y="268" text-anchor="middle" font-size="9" fill="#9FAAB5">Route: 0.0.0.0/0 → TGW</text>
  <text x="120" y="281" text-anchor="middle" font-size="9" fill="#9FAAB5">No internet gateway</text>

  <!-- S3 Gateway Endpoint note -->
  <rect x="30" y="340" width="180" height="68" rx="8" fill="#FFFBF0" stroke="#C4A484" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="120" y="361" text-anchor="middle" font-size="10" font-weight="600" fill="#9E7B55">S3 Gateway Endpoint</text>
  <text x="120" y="377" text-anchor="middle" font-size="9" fill="#BFA882">In every spoke VPC</text>
  <text x="120" y="391" text-anchor="middle" font-size="9" fill="#BFA882">S3 traffic bypasses TGW</text>
  <text x="120" y="404" text-anchor="middle" font-size="9" fill="#BFA882">Free · removes biggest cost</text>

  <!-- TGW centre -->
  <circle cx="390" cy="180" r="58" fill="#1D2322" stroke="#C4A484" stroke-width="2"/>
  <circle cx="390" cy="172" r="8" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="390" y1="164" x2="390" y2="152" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="398" y1="167" x2="408" y2="159" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="398" y1="177" x2="408" y2="185" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="390" y1="180" x2="390" y2="192" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="382" y1="177" x2="372" y2="185" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="382" y1="167" x2="372" y2="159" stroke="#C4A484" stroke-width="1.5"/>
  <text x="390" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#C4A484">Transit Gateway</text>
  <text x="390" y="214" text-anchor="middle" font-size="9" fill="#A3ABA9">Egress route table</text>
  <text x="390" y="227" text-anchor="middle" font-size="9" fill="#A3ABA9">0.0.0.0/0 → Egress VPC</text>

  <!-- Networking Account boundary -->
  <rect x="520" y="40" width="220" height="280" rx="10" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="630" y="32" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#C4A484">NETWORKING ACCOUNT</text>

  <!-- Egress VPC -->
  <rect x="540" y="60" width="180" height="240" rx="8" fill="#F0FBF5" stroke="#3D9970" stroke-width="1.5"/>
  <text x="630" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#3D9970">Egress VPC</text>

  <!-- TGW Attachment -->
  <rect x="558" y="92" width="144" height="38" rx="5" fill="#fff" stroke="#C4A484" stroke-width="1"/>
  <text x="630" y="108" text-anchor="middle" font-size="9" fill="#9E7B55">TGW Attachment</text>
  <text x="630" y="123" text-anchor="middle" font-size="9" fill="#BFA882">Receives spoke traffic</text>

  <!-- NAT Gateways -->
  <rect x="558" y="145" width="144" height="52" rx="5" fill="#fff" stroke="#3D9970" stroke-width="1"/>
  <text x="630" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="#3D9970">NAT Gateways</text>
  <text x="630" y="177" text-anchor="middle" font-size="9" fill="#5AAA82">1 per AZ (us-east-1a/b/c)</text>
  <text x="630" y="192" text-anchor="middle" font-size="9" fill="#5AAA82">Elastic IPs — fixed outbound</text>

  <!-- IGW -->
  <rect x="558" y="212" width="144" height="52" rx="5" fill="#fff" stroke="#3D9970" stroke-width="1"/>
  <text x="630" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#3D9970">Internet Gateway</text>
  <text x="630" y="245" text-anchor="middle" font-size="9" fill="#5AAA82">Only IGW in the topology</text>
  <text x="630" y="260" text-anchor="middle" font-size="9" fill="#5AAA82">NAT EIPs face internet here</text>

  <!-- Internet -->
  <ellipse cx="630" cy="390" rx="80" ry="28" fill="#EDF7FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="630" y="395" text-anchor="middle" font-size="12" fill="#4A90D9">Internet</text>

  <!-- VPC A to TGW -->
  <line x1="210" y1="110" x2="332" y2="172" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="252" y="128" font-size="9" fill="#4A90D9">0.0.0.0/0</text>

  <!-- VPC B to TGW -->
  <line x1="210" y1="258" x2="332" y2="200" stroke="#7B8FA1" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="250" y="243" font-size="9" fill="#7B8FA1">0.0.0.0/0</text>

  <!-- TGW to Egress VPC -->
  <line x1="448" y1="175" x2="540" y2="111" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  <text x="478" y="145" font-size="9" fill="#C4A484">→ Egress VPC</text>

  <!-- TGW attachment to NAT -->
  <line x1="630" y1="130" x2="630" y2="145" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- NAT to IGW -->
  <line x1="630" y1="197" x2="630" y2="212" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- IGW to Internet -->
  <line x1="630" y1="264" x2="630" y2="362" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- S3 bypass arc -->
  <path d="M120,340 C120,310 390,310 390,250" fill="none" stroke="#C4A484" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-gold)"/>
  <text x="200" y="316" font-size="9" fill="#C4A484">S3 traffic bypasses TGW</text>

  <!-- Legend -->
  <rect x="470" y="368" width="270" height="68" rx="6" fill="#F0EDE8" stroke="#DDD8D0" stroke-width="1"/>
  <text x="605" y="385" text-anchor="middle" font-size="9" font-weight="700" fill="#555" letter-spacing=".08em">TRAFFIC FLOW</text>
  <line x1="482" y1="400" x2="506" y2="400" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="514" y="404" font-size="9" fill="#3d3d3d">Prod internet-bound traffic</text>
  <line x1="482" y1="416" x2="506" y2="416" stroke="#7B8FA1" stroke-width="1.5"/>
  <text x="514" y="420" font-size="9" fill="#3d3d3d">Dev internet-bound traffic</text>
  <line x1="612" y1="400" x2="636" y2="400" stroke="#3D9970" stroke-width="1.5"/>
  <text x="644" y="404" font-size="9" fill="#3d3d3d">NAT/IGW path to internet</text>
  <line x1="612" y1="416" x2="636" y2="416" stroke="#C4A484" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="644" y="420" font-size="9" fill="#3d3d3d">S3 gateway endpoint bypass</text>
</svg>
