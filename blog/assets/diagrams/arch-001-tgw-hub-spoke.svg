<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-width:860px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Transit Gateway Hub-and-Spoke Architecture</title>
  <defs>
    <marker id="arr-gold" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#C4A484"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#4A90D9"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#7B8FA1"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#8E6DBE"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#3D9970"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#C94040"/>
    </marker>
  </defs>

  <rect width="860" height="520" fill="#F8F7F5" rx="10"/>

  <!-- Networking Account boundary -->
  <rect x="320" y="130" width="220" height="260" rx="10" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="430" y="122" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".12em" fill="#C4A484">NETWORKING ACCOUNT</text>

  <!-- TGW node -->
  <circle cx="430" cy="232" r="52" fill="#1D2322" stroke="#C4A484" stroke-width="2"/>
  <circle cx="430" cy="224" r="7" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="430" y1="217" x2="430" y2="207" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="437" y1="220" x2="445" y2="213" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="437" y1="228" x2="445" y2="235" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="430" y1="231" x2="430" y2="241" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="423" y1="228" x2="415" y2="235" stroke="#C4A484" stroke-width="1.5"/>
  <line x1="423" y1="220" x2="415" y2="213" stroke="#C4A484" stroke-width="1.5"/>
  <text x="430" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#C4A484">Transit Gateway</text>
  <text x="430" y="263" text-anchor="middle" font-size="9" fill="#A3ABA9">Route Tables · RAM shared</text>

  <!-- Egress VPC -->
  <rect x="348" y="315" width="164" height="52" rx="6" fill="#F0FBF5" stroke="#3D9970" stroke-width="1.2"/>
  <text x="430" y="335" text-anchor="middle" font-size="10" font-weight="600" fill="#3D9970">Egress VPC</text>
  <text x="430" y="350" text-anchor="middle" font-size="9" fill="#3D9970">NAT Gateways · Internet GW</text>
  <text x="430" y="362" text-anchor="middle" font-size="9" fill="#5AAA82">Fixed Elastic IPs for allowlisting</text>

  <!-- TGW to Egress -->
  <line x1="430" y1="284" x2="430" y2="315" stroke="#3D9970" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Prod Account -->
  <rect x="38" y="80" width="190" height="90" rx="8" fill="#F0F5FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="133" y="103" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#4A90D9">PROD ACCOUNT</text>
  <rect x="60" y="113" width="148" height="44" rx="5" fill="#fff" stroke="#4A90D9" stroke-width="1"/>
  <text x="134" y="130" text-anchor="middle" font-size="10" fill="#4A90D9">Workload VPC</text>
  <text x="134" y="147" text-anchor="middle" font-size="9" fill="#7B9EC9">No internet gateway · private only</text>

  <!-- Dev/Staging Account -->
  <rect x="38" y="210" width="190" height="90" rx="8" fill="#F5F6F7" stroke="#7B8FA1" stroke-width="1.5"/>
  <text x="133" y="233" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#7B8FA1">DEV / STAGING</text>
  <rect x="60" y="243" width="148" height="44" rx="5" fill="#fff" stroke="#7B8FA1" stroke-width="1"/>
  <text x="134" y="260" text-anchor="middle" font-size="10" fill="#7B8FA1">Workload VPC</text>
  <text x="134" y="277" text-anchor="middle" font-size="9" fill="#9FAAB5">No on-prem route · isolated from prod</text>

  <!-- Shared Services -->
  <rect x="38" y="340" width="190" height="90" rx="8" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.5"/>
  <text x="133" y="362" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#C4A484">SHARED SERVICES</text>
  <rect x="60" y="372" width="148" height="44" rx="5" fill="#fff" stroke="#C4A484" stroke-width="1"/>
  <text x="134" y="389" text-anchor="middle" font-size="10" fill="#9E7B55">DNS · Active Directory · Patch</text>
  <text x="134" y="406" text-anchor="middle" font-size="9" fill="#BFA882">Reachable from prod AND dev RTs</text>

  <!-- On-premises -->
  <rect x="632" y="80" width="190" height="90" rx="8" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1.5"/>
  <text x="727" y="103" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#8E6DBE">ON-PREMISES</text>
  <rect x="654" y="113" width="148" height="44" rx="5" fill="#fff" stroke="#8E6DBE" stroke-width="1"/>
  <text x="728" y="130" text-anchor="middle" font-size="10" fill="#8E6DBE">Direct Connect / VPN</text>
  <text x="728" y="147" text-anchor="middle" font-size="9" fill="#A989D4">BGP routes propagate into TGW</text>

  <!-- Security Account -->
  <rect x="632" y="300" width="190" height="90" rx="8" fill="#FFF5F5" stroke="#C94040" stroke-width="1.5"/>
  <text x="727" y="323" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#C94040">SECURITY ACCOUNT</text>
  <rect x="654" y="333" width="148" height="44" rx="5" fill="#fff" stroke="#C94040" stroke-width="1"/>
  <text x="728" y="350" text-anchor="middle" font-size="10" fill="#C94040">Read-only vantage point</text>
  <text x="728" y="367" text-anchor="middle" font-size="9" fill="#D47070">Flow logs · GuardDuty · SIEM</text>

  <!-- Internet -->
  <ellipse cx="430" cy="470" rx="70" ry="26" fill="#EDF7FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="430" y="475" text-anchor="middle" font-size="11" fill="#4A90D9">Internet</text>

  <!-- Egress to Internet -->
  <line x1="430" y1="367" x2="430" y2="444" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="444" y="412" font-size="9" fill="#3D9970">NAT → IGW</text>

  <!-- Prod to TGW -->
  <path d="M228,125 C280,125 290,205 378,218" fill="none" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Dev to TGW -->
  <line x1="228" y1="255" x2="378" y2="240" stroke="#7B8FA1" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <!-- Shared to TGW -->
  <path d="M228,385 C280,385 290,268 378,252" fill="none" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  <!-- On-prem to TGW -->
  <path d="M632,125 C580,125 570,205 482,218" fill="none" stroke="#8E6DBE" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <!-- Security to TGW (dashed) -->
  <path d="M632,345 C590,345 570,268 482,248" fill="none" stroke="#C94040" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- Route table labels -->
  <text x="270" y="148" font-size="9" fill="#4A90D9" font-weight="600">Prod RT</text>
  <text x="254" y="248" font-size="9" fill="#7B8FA1" font-weight="600">Non-prod RT</text>
  <text x="258" y="340" font-size="9" fill="#C4A484" font-weight="600">Both RTs</text>
  <text x="560" y="148" font-size="9" fill="#8E6DBE" font-weight="600">Prod RT only</text>
  <text x="548" y="308" font-size="9" fill="#C94040" font-weight="600">Spoke (read)</text>

  <!-- Legend -->
  <rect x="38" y="458" width="270" height="48" rx="6" fill="#F0EDE8" stroke="#DDD8D0" stroke-width="1"/>
  <line x1="54" y1="475" x2="78" y2="475" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="86" y="479" font-size="9" fill="#3d3d3d">Prod TGW attachment</text>
  <line x1="54" y1="493" x2="78" y2="493" stroke="#7B8FA1" stroke-width="1.5"/>
  <text x="86" y="497" font-size="9" fill="#3d3d3d">Non-prod TGW attachment</text>
  <line x1="166" y1="475" x2="190" y2="475" stroke="#C4A484" stroke-width="1.5"/>
  <text x="198" y="479" font-size="9" fill="#3d3d3d">Shared across both RTs</text>
  <line x1="166" y1="493" x2="190" y2="493" stroke="#C94040" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="198" y="497" font-size="9" fill="#3d3d3d">Read-only / log access</text>
</svg>
