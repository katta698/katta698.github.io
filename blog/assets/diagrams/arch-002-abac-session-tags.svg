<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-width:860px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>ABAC — Session Tag Flow from IdP to IAM Policy Condition</title>
  <defs>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#3D9970"/></marker>
    <marker id="arr-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#C4A484"/></marker>
    <marker id="arr-b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#4A90D9"/></marker>
  </defs>

  <rect width="860" height="400" fill="#F8F7F5" rx="10"/>
  <text x="430" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2322">ABAC — Attribute-Based Access Control via Session Tags</text>

  <!-- Step 1: IdP -->
  <rect x="28" y="48" width="155" height="130" rx="8" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1.5"/>
  <text x="105" y="68" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".1em" fill="#8E6DBE">OKTA USER PROFILE</text>
  <rect x="42" y="76" width="127" height="92" rx="4" fill="#fff" stroke="#C4C0D0" stroke-width="1"/>
  <text x="60" y="93" font-size="9" font-weight="600" fill="#8E6DBE">Attributes:</text>
  <text x="60" y="108" font-size="9" fill="#5C5C7A">department = platform</text>
  <text x="60" y="122" font-size="9" fill="#5C5C7A">team       = infra</text>
  <text x="60" y="136" font-size="9" fill="#5C5C7A">costcenter = cc-1042</text>
  <text x="60" y="150" font-size="9" fill="#5C5C7A">env-access = prod</text>

  <line x1="183" y1="113" x2="218" y2="113" stroke="#8E6DBE" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="200" y="107" text-anchor="middle" font-size="8" fill="#8E6DBE">SAML</text>
  <text x="200" y="118" text-anchor="middle" font-size="8" fill="#8E6DBE">assertion</text>

  <!-- Step 2: IC attribute mapping -->
  <rect x="218" y="48" width="185" height="130" rx="8" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.5"/>
  <text x="310" y="68" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".1em" fill="#C4A484">IDENTITY CENTER</text>
  <text x="310" y="82" text-anchor="middle" font-size="8" fill="#BFA882">Attribute mapping config</text>
  <rect x="232" y="88" width="157" height="80" rx="4" fill="#fff" stroke="#E8DDD0" stroke-width="1"/>
  <text x="250" y="104" font-size="8" font-weight="600" fill="#9E7B55">SAML attr → Session tag</text>
  <line x1="232" y1="110" x2="389" y2="110" stroke="#F0EAE0" stroke-width="1"/>
  <text x="250" y="122" font-size="8.5" fill="#777">dept    → aws:PrincipalTag/dept</text>
  <text x="250" y="135" font-size="8.5" fill="#777">team    → aws:PrincipalTag/team</text>
  <text x="250" y="148" font-size="8.5" fill="#777">env-access → aws:PrincipalTag/env</text>
  <text x="250" y="161" font-size="8.5" fill="#777">costcenter → aws:PrincipalTag/cc</text>

  <line x1="403" y1="113" x2="438" y2="113" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="420" y="107" text-anchor="middle" font-size="8" fill="#C4A484">STS</text>
  <text x="420" y="118" text-anchor="middle" font-size="8" fill="#C4A484">assume</text>

  <!-- Step 3: Session -->
  <rect x="438" y="48" width="185" height="130" rx="8" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="530" y="68" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".1em" fill="#4A90D9">AWS SESSION</text>
  <text x="530" y="82" text-anchor="middle" font-size="8" fill="#7B9EC9">Temporary credentials + tags</text>
  <rect x="452" y="88" width="157" height="80" rx="4" fill="#fff" stroke="#C8DCF0" stroke-width="1"/>
  <text x="470" y="104" font-size="8" font-weight="600" fill="#4A90D9">Session tags (1h):</text>
  <line x1="452" y1="110" x2="609" y2="110" stroke="#E0ECFA" stroke-width="1"/>
  <text x="470" y="122" font-size="8.5" fill="#777">aws:PrincipalTag/dept = platform</text>
  <text x="470" y="135" font-size="8.5" fill="#777">aws:PrincipalTag/team = infra</text>
  <text x="470" y="148" font-size="8.5" fill="#777">aws:PrincipalTag/env  = prod</text>
  <text x="470" y="161" font-size="8.5" fill="#777">aws:PrincipalTag/cc   = cc-1042</text>

  <line x1="623" y1="113" x2="658" y2="113" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="640" y="107" text-anchor="middle" font-size="8" fill="#4A90D9">evaluated</text>
  <text x="640" y="118" text-anchor="middle" font-size="8" fill="#4A90D9">by IAM</text>

  <!-- Step 4: IAM Policy -->
  <rect x="658" y="48" width="174" height="130" rx="8" fill="#F0FBF5" stroke="#3D9970" stroke-width="1.5"/>
  <text x="745" y="68" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".1em" fill="#3D9970">IAM POLICY CONDITION</text>
  <rect x="672" y="76" width="146" height="92" rx="4" fill="#1E2938" stroke="#2D3D50" stroke-width="1"/>
  <text x="688" y="92" font-size="8" fill="#60A5FA" font-family="monospace">"Condition": {</text>
  <text x="696" y="105" font-size="8" fill="#34D399" font-family="monospace">"StringEquals": {</text>
  <text x="700" y="117" font-size="7.5" fill="#FCD34D" font-family="monospace">"aws:PrincipalTag/env":</text>
  <text x="704" y="129" font-size="7.5" fill="#F87171" font-family="monospace">["prod","staging"]</text>
  <text x="696" y="141" font-size="8" fill="#34D399" font-family="monospace">},</text>
  <text x="688" y="153" font-size="8" fill="#60A5FA" font-family="monospace">}</text>

  <!-- ABAC vs RBAC -->
  <rect x="28" y="200" width="804" height="175" rx="8" fill="#fff" stroke="#E0DDD8" stroke-width="1.5"/>
  <text x="430" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#1D2322">ABAC vs. per-account IAM users — why it matters at scale</text>

  <rect x="44" y="232" width="370" height="128" rx="6" fill="#FFF5F5" stroke="#C94040" stroke-width="1.2"/>
  <text x="229" y="251" text-anchor="middle" font-size="10" font-weight="700" fill="#C94040">WITHOUT Identity Center (per-account IAM users)</text>
  <text x="60" y="268" font-size="9" fill="#7B3030">• 50 accounts × 20 engineers = 1,000 IAM users to manage</text>
  <text x="60" y="282" font-size="9" fill="#7B3030">• Access keys live forever unless manually rotated</text>
  <text x="60" y="296" font-size="9" fill="#7B3030">• Engineer leaves → 50 manual deactivations across accounts</text>
  <text x="60" y="310" font-size="9" fill="#7B3030">• No central view of "who has what access where"</text>
  <text x="60" y="324" font-size="9" fill="#7B3030">• MFA enforcement inconsistent across accounts</text>
  <text x="60" y="338" font-size="9" fill="#7B3030">• Audit: pull CloudTrail from every account individually</text>

  <rect x="446" y="232" width="370" height="128" rx="6" fill="#F0FBF5" stroke="#3D9970" stroke-width="1.2"/>
  <text x="631" y="251" text-anchor="middle" font-size="10" font-weight="700" fill="#3D9970">WITH Identity Center + ABAC</text>
  <text x="462" y="268" font-size="9" fill="#1A5C3A">• 1 identity per engineer in IdP — synced to all accounts</text>
  <text x="462" y="282" font-size="9" fill="#1A5C3A">• No long-term credentials anywhere — only 1h STS sessions</text>
  <text x="462" y="296" font-size="9" fill="#1A5C3A">• Engineer leaves → disable in Okta → access gone everywhere</text>
  <text x="462" y="310" font-size="9" fill="#1A5C3A">• Central access portal shows every account assignment</text>
  <text x="462" y="324" font-size="9" fill="#1A5C3A">• MFA enforced once at IdP — applies to all accounts</text>
  <text x="462" y="338" font-size="9" fill="#1A5C3A">• CloudTrail shows username + session tags in every account</text>

  <circle cx="430" cy="296" r="16" fill="#1D2322"/>
  <text x="430" y="301" text-anchor="middle" font-size="10" font-weight="700" fill="#C4A484">VS</text>
</svg>
