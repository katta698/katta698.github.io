<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-width:860px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>IAM Identity Center — Permission Set and Account Assignment Model</title>
  <defs>
    <marker id="arr-gold2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#C4A484"/></marker>
    <marker id="arr-blue2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#4A90D9"/></marker>
    <marker id="arr-green2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#3D9970"/></marker>
    <marker id="arr-purple2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#8E6DBE"/></marker>
  </defs>

  <rect width="860" height="480" fill="#F8F7F5" rx="10"/>
  <text x="430" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2322">IAM Identity Center — Permission Set · Account Assignment Model</text>

  <!-- Identity Source -->
  <rect x="28" y="55" width="170" height="170" rx="8" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1.5"/>
  <text x="113" y="74" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#8E6DBE">IDENTITY SOURCE</text>
  <rect x="44" y="82" width="138" height="36" rx="5" fill="#fff" stroke="#8E6DBE" stroke-width="1"/>
  <text x="113" y="97" text-anchor="middle" font-size="10" font-weight="600" fill="#8E6DBE">External IdP (Okta/AD)</text>
  <text x="113" y="111" text-anchor="middle" font-size="9" fill="#A989D4">SAML 2.0 / SCIM sync</text>
  <rect x="44" y="128" width="62" height="44" rx="4" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1"/>
  <text x="75" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#8E6DBE">platform-</text>
  <text x="75" y="158" text-anchor="middle" font-size="9" font-weight="600" fill="#8E6DBE">engineers</text>
  <text x="75" y="168" text-anchor="middle" font-size="8" fill="#A989D4">group</text>
  <rect x="120" y="128" width="62" height="44" rx="4" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1"/>
  <text x="151" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#8E6DBE">dev-team</text>
  <text x="151" y="168" text-anchor="middle" font-size="8" fill="#A989D4">group</text>
  <rect x="44" y="182" width="138" height="30" rx="4" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1"/>
  <text x="113" y="201" text-anchor="middle" font-size="9" fill="#8E6DBE">Users synced via SCIM</text>

  <!-- IAM Identity Center -->
  <rect x="240" y="45" width="380" height="310" rx="10" fill="#FEFAF5" stroke="#C4A484" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="430" y="65" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".12em" fill="#C4A484">IAM IDENTITY CENTER  ·  us-east-1 (home region)</text>
  <text x="290" y="88" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".1em" fill="#C4A484">PERMISSION SETS</text>
  <rect x="256" y="94" width="152" height="52" rx="5" fill="#fff" stroke="#C4A484" stroke-width="1.2"/>
  <text x="332" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="#9E7B55">AdministratorAccess</text>
  <text x="332" y="127" text-anchor="middle" font-size="9" fill="#BFA882">→ creates IAM role in each</text>
  <text x="332" y="139" text-anchor="middle" font-size="9" fill="#BFA882">assigned account (1h session)</text>
  <rect x="256" y="155" width="152" height="52" rx="5" fill="#fff" stroke="#C4A484" stroke-width="1.2"/>
  <text x="332" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#9E7B55">ReadOnlyAccess</text>
  <text x="332" y="188" text-anchor="middle" font-size="9" fill="#BFA882">→ ViewOnlyAccess + custom</text>
  <text x="332" y="200" text-anchor="middle" font-size="9" fill="#BFA882">inline policy per team</text>
  <rect x="256" y="216" width="152" height="52" rx="5" fill="#fff" stroke="#C4A484" stroke-width="1.2"/>
  <text x="332" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#9E7B55">PlatformEngineer</text>
  <text x="332" y="249" text-anchor="middle" font-size="9" fill="#BFA882">Custom: EC2, EKS, TGW,</text>
  <text x="332" y="261" text-anchor="middle" font-size="9" fill="#BFA882">no IAM, no billing</text>
  <text x="545" y="88" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".1em" fill="#C4A484">ACCOUNT ASSIGNMENTS</text>
  <rect x="428" y="94" width="178" height="180" rx="5" fill="#fff" stroke="#C4A484" stroke-width="1.2"/>
  <rect x="428" y="94" width="178" height="22" rx="5" fill="#F5EFE6" stroke="#C4A484" stroke-width="1.2"/>
  <line x1="428" y1="116" x2="606" y2="116" stroke="#C4A484" stroke-width="1"/>
  <text x="480" y="109" text-anchor="middle" font-size="8" font-weight="700" fill="#9E7B55">Group</text>
  <line x1="532" y1="94" x2="532" y2="274" stroke="#E8DDD0" stroke-width="1"/>
  <text x="569" y="109" text-anchor="middle" font-size="8" font-weight="700" fill="#9E7B55">Perm Set → Account</text>
  <line x1="428" y1="131" x2="606" y2="131" stroke="#F0EAE0" stroke-width="1"/>
  <text x="480" y="127" text-anchor="middle" font-size="8" fill="#8E6DBE">platform-eng</text>
  <text x="569" y="121" text-anchor="middle" font-size="8" fill="#3D9970">Admin → networking</text>
  <text x="569" y="131" text-anchor="middle" font-size="8" fill="#3D9970">Admin → security</text>
  <line x1="428" y1="155" x2="606" y2="155" stroke="#F0EAE0" stroke-width="1"/>
  <text x="480" y="147" text-anchor="middle" font-size="8" fill="#8E6DBE">platform-eng</text>
  <text x="569" y="145" text-anchor="middle" font-size="8" fill="#4A90D9">PlatformEng → prod</text>
  <text x="569" y="155" text-anchor="middle" font-size="8" fill="#4A90D9">PlatformEng → staging</text>
  <line x1="428" y1="179" x2="606" y2="179" stroke="#F0EAE0" stroke-width="1"/>
  <text x="480" y="171" text-anchor="middle" font-size="8" fill="#8E6DBE">dev-team</text>
  <text x="569" y="169" text-anchor="middle" font-size="8" fill="#4A90D9">PlatformEng → dev</text>
  <text x="569" y="179" text-anchor="middle" font-size="8" fill="#4A90D9">ReadOnly → staging</text>
  <line x1="428" y1="203" x2="606" y2="203" stroke="#F0EAE0" stroke-width="1"/>
  <text x="480" y="198" text-anchor="middle" font-size="8" fill="#8E6DBE">dev-team</text>
  <text x="569" y="196" text-anchor="middle" font-size="8" fill="#C4A484">ReadOnly → prod</text>
  <line x1="428" y1="227" x2="606" y2="227" stroke="#F0EAE0" stroke-width="1"/>
  <text x="480" y="222" text-anchor="middle" font-size="8" fill="#8E6DBE">security</text>
  <text x="569" y="218" text-anchor="middle" font-size="8" fill="#C94040">ReadOnly → ALL accts</text>
  <text x="480" y="248" text-anchor="middle" font-size="8" fill="#8E6DBE">security</text>
  <text x="569" y="248" text-anchor="middle" font-size="8" fill="#C94040">+ SecurityAudit</text>
  <rect x="256" y="280" width="330" height="28" rx="4" fill="#FFFBF0" stroke="#C4A484" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="421" y="298" text-anchor="middle" font-size="9" fill="#9E7B55">IAM roles auto-provisioned in target accounts · deleted when assignment removed</text>

  <!-- AWS Accounts -->
  <rect x="660" y="55" width="175" height="310" rx="8" fill="#F0F5FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="747" y="74" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#4A90D9">AWS ACCOUNTS</text>
  <rect x="676" y="82" width="143" height="34" rx="4" fill="#fff" stroke="#4A90D9" stroke-width="1"/>
  <text x="747" y="97" text-anchor="middle" font-size="10" font-weight="600" fill="#4A90D9">Management</text>
  <text x="747" y="110" text-anchor="middle" font-size="8" fill="#7B9EC9">IC enabled here (home)</text>
  <rect x="676" y="126" width="143" height="34" rx="4" fill="#fff" stroke="#3D9970" stroke-width="1"/>
  <text x="747" y="141" text-anchor="middle" font-size="10" font-weight="600" fill="#3D9970">Networking</text>
  <text x="747" y="154" text-anchor="middle" font-size="8" fill="#3D9970">AWSReservedSSO_Admin_*</text>
  <rect x="676" y="170" width="143" height="34" rx="4" fill="#fff" stroke="#C94040" stroke-width="1"/>
  <text x="747" y="185" text-anchor="middle" font-size="10" font-weight="600" fill="#C94040">Security</text>
  <text x="747" y="198" text-anchor="middle" font-size="8" fill="#C94040">AWSReservedSSO_Admin_*</text>
  <rect x="676" y="214" width="143" height="34" rx="4" fill="#fff" stroke="#4A90D9" stroke-width="1"/>
  <text x="747" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#4A90D9">Prod (×N)</text>
  <text x="747" y="242" text-anchor="middle" font-size="8" fill="#7B9EC9">AWSReservedSSO_Platform_*</text>
  <rect x="676" y="258" width="143" height="34" rx="4" fill="#fff" stroke="#7B8FA1" stroke-width="1"/>
  <text x="747" y="273" text-anchor="middle" font-size="10" font-weight="600" fill="#7B8FA1">Dev / Staging (×N)</text>
  <text x="747" y="286" text-anchor="middle" font-size="8" fill="#7B8FA1">AWSReservedSSO_Platform_*</text>
  <rect x="676" y="302" width="143" height="34" rx="4" fill="#fff" stroke="#7B8FA1" stroke-width="1"/>
  <text x="747" y="317" text-anchor="middle" font-size="10" font-weight="600" fill="#7B8FA1">Shared Services</text>
  <text x="747" y="330" text-anchor="middle" font-size="8" fill="#7B8FA1">AWSReservedSSO_ReadOnly_*</text>

  <!-- Arrows -->
  <line x1="198" y1="140" x2="240" y2="180" stroke="#8E6DBE" stroke-width="1.5" marker-end="url(#arr-purple2)"/>
  <text x="212" y="158" font-size="8" fill="#8E6DBE">SCIM</text>
  <line x1="606" y1="165" x2="660" y2="149" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green2)"/>
  <line x1="606" y1="185" x2="660" y2="187" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-gold2)"/>
  <line x1="606" y1="205" x2="660" y2="232" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue2)"/>
  <line x1="606" y1="220" x2="660" y2="275" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue2)"/>

  <!-- User login flow -->
  <rect x="28" y="370" width="804" height="90" rx="8" fill="#F0FBF5" stroke="#3D9970" stroke-width="1.5"/>
  <text x="430" y="390" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".1em" fill="#3D9970">USER LOGIN FLOW (AWS Access Portal)</text>
  <rect x="42" y="400" width="100" height="44" rx="4" fill="#fff" stroke="#3D9970" stroke-width="1"/>
  <text x="92" y="416" text-anchor="middle" font-size="9" font-weight="600" fill="#3D9970">1. User opens</text>
  <text x="92" y="428" text-anchor="middle" font-size="9" fill="#3D9970">access portal URL</text>
  <text x="92" y="440" text-anchor="middle" font-size="8" fill="#5AAA82">*.awsapps.com/start</text>
  <line x1="142" y1="422" x2="168" y2="422" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green2)"/>
  <rect x="168" y="400" width="110" height="44" rx="4" fill="#fff" stroke="#8E6DBE" stroke-width="1"/>
  <text x="223" y="416" text-anchor="middle" font-size="9" font-weight="600" fill="#8E6DBE">2. IdP challenge</text>
  <text x="223" y="428" text-anchor="middle" font-size="9" fill="#8E6DBE">MFA enforced by</text>
  <text x="223" y="440" text-anchor="middle" font-size="8" fill="#A989D4">Okta / Entra ID</text>
  <line x1="278" y1="422" x2="304" y2="422" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green2)"/>
  <rect x="304" y="400" width="130" height="44" rx="4" fill="#fff" stroke="#C4A484" stroke-width="1"/>
  <text x="369" y="412" text-anchor="middle" font-size="9" font-weight="600" fill="#9E7B55">3. Portal shows</text>
  <text x="369" y="424" text-anchor="middle" font-size="9" fill="#9E7B55">assigned accounts</text>
  <text x="369" y="436" text-anchor="middle" font-size="8" fill="#BFA882">only what they have access to</text>
  <text x="369" y="446" text-anchor="middle" font-size="8" fill="#BFA882">no extra accounts visible</text>
  <line x1="434" y1="422" x2="460" y2="422" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green2)"/>
  <rect x="460" y="400" width="130" height="44" rx="4" fill="#fff" stroke="#4A90D9" stroke-width="1"/>
  <text x="525" y="412" text-anchor="middle" font-size="9" font-weight="600" fill="#4A90D9">4. User clicks</text>
  <text x="525" y="424" text-anchor="middle" font-size="9" fill="#4A90D9">account + role</text>
  <text x="525" y="436" text-anchor="middle" font-size="8" fill="#7B9EC9">IC calls STS</text>
  <text x="525" y="446" text-anchor="middle" font-size="8" fill="#7B9EC9">AssumeRoleWithSAML</text>
  <line x1="590" y1="422" x2="616" y2="422" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green2)"/>
  <rect x="616" y="400" width="200" height="44" rx="4" fill="#fff" stroke="#3D9970" stroke-width="1"/>
  <text x="716" y="412" text-anchor="middle" font-size="9" font-weight="600" fill="#3D9970">5. Temp credentials issued</text>
  <text x="716" y="424" text-anchor="middle" font-size="9" fill="#3D9970">Console OR CLI profile</text>
  <text x="716" y="436" text-anchor="middle" font-size="8" fill="#5AAA82">aws configure sso · 1h session</text>
  <text x="716" y="446" text-anchor="middle" font-size="8" fill="#5AAA82">no IAM user · no long-term key</text>
</svg>
