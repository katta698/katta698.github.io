<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>ECS vs EKS Decision Framework — Four Signals</title>
  <defs>
    <marker id="arr-gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#C4A484"/></marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4A90D9"/></marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#3D9970"/></marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8E6DBE"/></marker>
  </defs>

  <rect width="860" height="400" rx="10" fill="#F8F7F5"/>
  <text x="430" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2322">ECS vs EKS — Decision Framework</text>

  <!-- Signal 1: Operational Complexity -->
  <rect x="20" y="44" width="188" height="140" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="114" y="64" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".05em" fill="#C4A484">SIGNAL 1</text>
  <text x="114" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Operational Complexity</text>
  <text x="114" y="96" text-anchor="middle" font-size="9" fill="#555">Budget</text>
  <line x1="40" y1="106" x2="208" y2="106" stroke="#E8E0D0" stroke-width="1"/>
  <text x="114" y="122" text-anchor="middle" font-size="9" fill="#3D9970" font-weight="600">→ ECS</text>
  <text x="114" y="136" text-anchor="middle" font-size="9" fill="#555">Platform team &lt; 4 engineers</text>
  <text x="114" y="150" text-anchor="middle" font-size="9" fill="#555">No dedicated infra role</text>
  <line x1="40" y1="160" x2="208" y2="160" stroke="#E8E0D0" stroke-width="1"/>
  <text x="114" y="174" text-anchor="middle" font-size="9" fill="#8E6DBE" font-weight="600">→ EKS</text>
  <text x="114" y="165" text-anchor="middle" font-size="9" fill="#555"/>
  <text x="114" y="174" text-anchor="middle" font-size="9" fill="#8E6DBE" font-weight="600">→ EKS</text>
  <text x="114" y="178" text-anchor="middle" font-size="9" fill="#555"> </text>

  <!-- Signal 1 EKS indicators -->
  <rect x="20" y="44" width="188" height="140" rx="5" fill="none" stroke="#C4A484" stroke-width="1.2"/>
  <text x="114" y="174" text-anchor="middle" font-size="9" fill="#8E6DBE" font-weight="600">→ EKS</text>
  <text x="114" y="176" text-anchor="middle" font-size="9" fill="#555"> </text>

  <!-- Redo signal 1 cleanly -->
  <rect x="20" y="44" width="188" height="160" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="114" y="65" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".08em" fill="#C4A484">SIGNAL 1</text>
  <text x="114" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Operational Budget</text>
  <line x1="30" y1="92" x2="198" y2="92" stroke="#E8E0D0" stroke-width="1"/>
  <text x="44" y="108" font-size="9" font-weight="600" fill="#3D9970">ECS if:</text>
  <text x="44" y="122" font-size="9" fill="#555">Platform team &lt; 4 engineers</text>
  <text x="44" y="136" font-size="9" fill="#555">Add-ons feel like overhead</text>
  <line x1="30" y1="148" x2="198" y2="148" stroke="#E8E0D0" stroke-width="1"/>
  <text x="44" y="164" font-size="9" font-weight="600" fill="#8E6DBE">EKS if:</text>
  <text x="44" y="178" font-size="9" fill="#555">Dedicated platform team 4+</text>
  <text x="44" y="192" font-size="9" fill="#555">Cluster ops is the job</text>

  <!-- Signal 2: Workload -->
  <rect x="224" y="44" width="188" height="160" rx="5" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="318" y="65" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".08em" fill="#4A90D9">SIGNAL 2</text>
  <text x="318" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Workload Type</text>
  <line x1="234" y1="92" x2="402" y2="92" stroke="#D0E4F7" stroke-width="1"/>
  <text x="238" y="108" font-size="9" font-weight="600" fill="#3D9970">ECS if:</text>
  <text x="238" y="122" font-size="9" fill="#555">Web APIs, workers, queues</text>
  <text x="238" y="136" font-size="9" fill="#555">Standard HTTP/gRPC services</text>
  <line x1="234" y1="148" x2="402" y2="148" stroke="#D0E4F7" stroke-width="1"/>
  <text x="238" y="164" font-size="9" font-weight="600" fill="#8E6DBE">EKS if:</text>
  <text x="238" y="178" font-size="9" fill="#555">DaemonSets required</text>
  <text x="238" y="192" font-size="9" fill="#555">StatefulSets + PVCs</text>

  <!-- Signal 3: Multi-cloud -->
  <rect x="428" y="44" width="188" height="160" rx="5" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1.2"/>
  <text x="522" y="65" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".08em" fill="#8E6DBE">SIGNAL 3</text>
  <text x="522" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Multi-Cloud Pressure</text>
  <line x1="438" y1="92" x2="606" y2="92" stroke="#E0D4F7" stroke-width="1"/>
  <text x="442" y="108" font-size="9" font-weight="600" fill="#3D9970">ECS if:</text>
  <text x="442" y="122" font-size="9" fill="#555">AWS-only, no GCP/Azure plan</text>
  <text x="442" y="136" font-size="9" fill="#555">Portability is hypothetical</text>
  <line x1="438" y1="148" x2="606" y2="148" stroke="#E0D4F7" stroke-width="1"/>
  <text x="442" y="164" font-size="9" font-weight="600" fill="#8E6DBE">EKS if:</text>
  <text x="442" y="178" font-size="9" fill="#555">Real multi-cloud &lt; 18 months</text>
  <text x="442" y="192" font-size="9" fill="#555">GKE/AKS migration planned</text>

  <!-- Signal 4: Tooling -->
  <rect x="632" y="44" width="208" height="160" rx="5" fill="#F0FFF8" stroke="#3D9970" stroke-width="1.2"/>
  <text x="736" y="65" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".08em" fill="#3D9970">SIGNAL 4</text>
  <text x="736" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Ecosystem / Tooling</text>
  <line x1="642" y1="92" x2="830" y2="92" stroke="#C8EEE0" stroke-width="1"/>
  <text x="646" y="108" font-size="9" font-weight="600" fill="#3D9970">ECS if:</text>
  <text x="646" y="122" font-size="9" fill="#555">AWS-native deploys (CodeDeploy)</text>
  <text x="646" y="136" font-size="9" fill="#555">No existing Helm/ArgoCD invest</text>
  <line x1="642" y1="148" x2="830" y2="148" stroke="#C8EEE0" stroke-width="1"/>
  <text x="646" y="164" font-size="9" font-weight="600" fill="#8E6DBE">EKS if:</text>
  <text x="646" y="178" font-size="9" fill="#555">ArgoCD, Crossplane, Kyverno</text>
  <text x="646" y="192" font-size="9" fill="#555">Helm charts already in use</text>

  <!-- Decision outcomes -->
  <rect x="20" y="228" width="388" height="80" rx="8" fill="#F0FFF8" stroke="#3D9970" stroke-width="2"/>
  <text x="214" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#3D9970">Choose ECS + Fargate</text>
  <text x="214" y="270" text-anchor="middle" font-size="9" fill="#555">3 or 4 signals above point here → ECS is your answer</text>
  <text x="214" y="286" text-anchor="middle" font-size="9" fill="#555">Lower cost to operate · AWS owns the orchestration layer</text>
  <text x="214" y="300" text-anchor="middle" font-size="9" fill="#555">Start here and migrate to EKS later if you hit the ceiling</text>

  <rect x="452" y="228" width="388" height="80" rx="8" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="2"/>
  <text x="646" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#8E6DBE">Choose EKS</text>
  <text x="646" y="270" text-anchor="middle" font-size="9" fill="#555">2+ signals above point here → EKS is justified</text>
  <text x="646" y="286" text-anchor="middle" font-size="9" fill="#555">Invest in a platform team to operate it properly</text>
  <text x="646" y="300" text-anchor="middle" font-size="9" fill="#555">EKS Managed Node Groups · Karpenter · AWS LB Controller</text>

  <!-- Arrows from signals to outcomes -->
  <line x1="114" y1="204" x2="114" y2="228" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="318" y1="204" x2="318" y2="228" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="522" y1="204" x2="646" y2="228" stroke="#8E6DBE" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="736" y1="204" x2="736" y2="228" stroke="#8E6DBE" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Rule -->
  <text x="430" y="370" text-anchor="middle" font-size="10" fill="#888" font-style="italic">If 3 of 4 signals agree, that is your answer. Split signals → ECS first, migrate later.</text>
</svg>
