<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>ECS Architecture — AWS-Managed vs Customer-Owned Layers</title>
  <defs>
    <marker id="arr-gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#C4A484"/></marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4A90D9"/></marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#3D9970"/></marker>
  </defs>

  <rect width="860" height="420" rx="10" fill="#F8F7F5"/>

  <text x="430" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2322">ECS Architecture — Ownership Model</text>

  <!-- AWS Managed Layer -->
  <rect x="20" y="44" width="820" height="130" rx="8" fill="none" stroke="#C4A484" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="36" y="62" font-size="10" font-weight="700" letter-spacing=".1em" fill="#C4A484">AWS MANAGED</text>

  <!-- ECS Control Plane -->
  <rect x="36" y="70" width="150" height="88" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="111" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">ECS Control Plane</text>
  <text x="111" y="108" text-anchor="middle" font-size="9" fill="#555">Scheduler</text>
  <text x="111" y="122" text-anchor="middle" font-size="9" fill="#555">Health checks</text>
  <text x="111" y="136" text-anchor="middle" font-size="9" fill="#555">Rolling deploys</text>
  <text x="111" y="150" text-anchor="middle" font-size="9" fill="#555">Service discovery</text>

  <!-- ALB -->
  <rect x="210" y="70" width="140" height="88" rx="5" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="280" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Application LB</text>
  <text x="280" y="108" text-anchor="middle" font-size="9" fill="#555">Target group</text>
  <text x="280" y="122" text-anchor="middle" font-size="9" fill="#555">Health checks</text>
  <text x="280" y="136" text-anchor="middle" font-size="9" fill="#555">Path routing</text>
  <text x="280" y="150" text-anchor="middle" font-size="9" fill="#555">TLS termination</text>

  <!-- Service Connect -->
  <rect x="374" y="70" width="140" height="88" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="444" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Service Connect</text>
  <text x="444" y="108" text-anchor="middle" font-size="9" fill="#555">Envoy proxy (managed)</text>
  <text x="444" y="122" text-anchor="middle" font-size="9" fill="#555">Retries + circuit break</text>
  <text x="444" y="136" text-anchor="middle" font-size="9" fill="#555">CloudWatch metrics</text>
  <text x="444" y="150" text-anchor="middle" font-size="9" fill="#555">No control plane</text>

  <!-- CloudWatch -->
  <rect x="538" y="70" width="140" height="88" rx="5" fill="#F0FFF8" stroke="#3D9970" stroke-width="1.2"/>
  <text x="608" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">CloudWatch</text>
  <text x="608" y="108" text-anchor="middle" font-size="9" fill="#555">Container Insights</text>
  <text x="608" y="122" text-anchor="middle" font-size="9" fill="#555">Task metrics</text>
  <text x="608" y="136" text-anchor="middle" font-size="9" fill="#555">Log groups</text>
  <text x="608" y="150" text-anchor="middle" font-size="9" fill="#555">Auto Scaling alarms</text>

  <!-- ECR -->
  <rect x="702" y="70" width="120" height="88" rx="5" fill="#F0FFF8" stroke="#3D9970" stroke-width="1.2"/>
  <text x="762" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">ECR</text>
  <text x="762" y="108" text-anchor="middle" font-size="9" fill="#555">Image registry</text>
  <text x="762" y="122" text-anchor="middle" font-size="9" fill="#555">Vulnerability scan</text>
  <text x="762" y="136" text-anchor="middle" font-size="9" fill="#555">Lifecycle policies</text>
  <text x="762" y="150" text-anchor="middle" font-size="9" fill="#555">VPC endpoints</text>

  <!-- Customer Layer -->
  <rect x="20" y="192" width="820" height="210" rx="8" fill="none" stroke="#8E6DBE" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="36" y="210" font-size="10" font-weight="700" letter-spacing=".1em" fill="#8E6DBE">CUSTOMER OWNED</text>

  <!-- Task Definition -->
  <rect x="36" y="218" width="170" height="88" rx="5" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1.2"/>
  <text x="121" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Task Definition</text>
  <text x="121" y="256" text-anchor="middle" font-size="9" fill="#555">Container image + tag</text>
  <text x="121" y="270" text-anchor="middle" font-size="9" fill="#555">CPU / memory</text>
  <text x="121" y="284" text-anchor="middle" font-size="9" fill="#555">IAM task role</text>
  <text x="121" y="298" text-anchor="middle" font-size="9" fill="#555">Environment vars</text>

  <!-- Service Config -->
  <rect x="226" y="218" width="170" height="88" rx="5" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1.2"/>
  <text x="311" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Service Config</text>
  <text x="311" y="256" text-anchor="middle" font-size="9" fill="#555">Desired count</text>
  <text x="311" y="270" text-anchor="middle" font-size="9" fill="#555">Deployment config</text>
  <text x="311" y="284" text-anchor="middle" font-size="9" fill="#555">Auto Scaling policy</text>
  <text x="311" y="298" text-anchor="middle" font-size="9" fill="#555">Capacity provider</text>

  <!-- Fargate Tasks -->
  <rect x="416" y="218" width="170" height="88" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="501" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">Fargate Tasks</text>
  <text x="501" y="256" text-anchor="middle" font-size="9" fill="#555">No EC2 to manage</text>
  <text x="501" y="270" text-anchor="middle" font-size="9" fill="#555">Per-task billing</text>
  <text x="501" y="284" text-anchor="middle" font-size="9" fill="#555">20–30s cold start</text>
  <text x="501" y="298" text-anchor="middle" font-size="9" fill="#555">FARGATE_SPOT 70% off</text>

  <!-- EC2 Capacity -->
  <rect x="606" y="218" width="170" height="88" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="691" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#1D2322">EC2 Capacity Provider</text>
  <text x="691" y="256" text-anchor="middle" font-size="9" fill="#555">Auto Scaling Group</text>
  <text x="691" y="270" text-anchor="middle" font-size="9" fill="#555">Reserved instance savings</text>
  <text x="691" y="284" text-anchor="middle" font-size="9" fill="#555">GPU support</text>
  <text x="691" y="298" text-anchor="middle" font-size="9" fill="#555">Node patch required</text>

  <!-- Bottom label -->
  <text x="416" y="322" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Fargate: no node management. EC2: cheaper at sustained high utilisation.</text>

  <!-- Arrows -->
  <line x1="186" y1="114" x2="210" y2="114" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  <line x1="350" y1="114" x2="374" y2="114" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  <line x1="121" y1="158" x2="121" y2="218" stroke="#8E6DBE" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="311" y1="158" x2="311" y2="218" stroke="#8E6DBE" stroke-width="1.2" stroke-dasharray="4,3"/>
</svg>
