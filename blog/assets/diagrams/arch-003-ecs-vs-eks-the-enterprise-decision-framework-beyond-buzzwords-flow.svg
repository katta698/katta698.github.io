<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <marker id="arr-gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C4A484"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A90D9"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3D9970"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8E6DBE"/>
    </marker>
  </defs>
  
  <rect width="860" height="480" fill="#F8F7F5" rx="10"/>
  
  <title>ECS vs EKS Decision Flow</title>
  
  <text x="430" y="28" font-size="13" font-weight="700" fill="#1D2322" text-anchor="middle">
    Container Orchestration Decision Flow
  </text>
  
  <!-- Start Decision -->
  <rect x="330" y="50" width="200" height="60" rx="5" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="430" y="75" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Enterprise Container</text>
  <text x="430" y="92" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Workload Requirement</text>
  
  <line x1="430" y1="110" x2="430" y2="140" stroke="#4A90D9" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <!-- First Decision Point -->
  <rect x="300" y="140" width="260" height="70" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="430" y="165" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Do you need Kubernetes API compatibility</text>
  <text x="430" y="182" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">or multi-cloud portability?</text>
  <text x="430" y="197" font-size="9" fill="#666" text-anchor="middle">(Helm charts, kubectl, YAML manifests)</text>
  
  <!-- Left path: No K8s needed -->
  <line x1="300" y1="175" x2="180" y2="175" stroke="#C4A484" stroke-width="2" marker-end="url(#arr-gold)"/>
  <text x="240" y="165" font-size="9" fill="#666" text-anchor="middle">NO</text>
  
  <rect x="30" y="250" width="300" height="80" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="180" y="275" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Choose ECS</text>
  <text x="180" y="293" font-size="9" fill="#666" text-anchor="middle">AWS-native, simpler operations</text>
  <text x="180" y="308" font-size="9" fill="#666" text-anchor="middle">Task definitions, CloudWatch integration</text>
  <text x="180" y="323" font-size="9" fill="#666" text-anchor="middle">Lower learning curve for AWS teams</text>
  
  <!-- Right path: K8s needed -->
  <line x1="560" y1="175" x2="680" y2="175" stroke="#C4A484" stroke-width="2" marker-end="url(#arr-gold)"/>
  <text x="620" y="165" font-size="9" fill="#666" text-anchor="middle">YES</text>
  
  <rect x="530" y="250" width="300" height="80" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="680" y="275" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Choose EKS</text>
  <text x="680" y="293" font-size="9" fill="#666" text-anchor="middle">Kubernetes standard, multi-cloud ready</text>
  <text x="680" y="308" font-size="9" fill="#666" text-anchor="middle">Helm, kubectl, YAML manifests supported</text>
  <text x="680" y="323" font-size="9" fill="#666" text-anchor="middle">Ecosystem: Istio, Prometheus, Karpenter</text>
  
  <!-- Bottom convergence -->
  <line x1="180" y1="330" x2="180" y2="360" stroke="#C4A484" stroke-width="2" marker-end="url(#arr-gold)"/>
  <line x1="680" y1="330" x2="680" y2="360" stroke="#C4A484" stroke-width="2" marker-end="url(#arr-gold)"/>
  
  <!-- Implementation Phase -->
  <rect x="100" y="360" width="560" height="100" rx="5" fill="#F0FFF8" stroke="#3D9970" stroke-width="1.2"/>
  <text x="380" y="385" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Implementation & Operations</text>
  
  <text x="200" y="410" font-size="9" fill="#1D2322" text-anchor="start" font-weight="700">ECS Path:</text>
  <text x="200" y="425" font-size="9" fill="#666" text-anchor="start">CloudFormation/CDK • Task definitions • Service scaling • CloudWatch Logs</text>
  
  <text x="500" y="410" font-size="9" fill="#1D2322" text-anchor="start" font-weight="700">EKS Path:</text>
  <text x="500" y="425" font-size="9" fill="#666" text-anchor="start">Terraform/Helm • Deployments • HPA/Karpenter • Prometheus/Grafana</text>
  
  <text x="380" y="450" font-size="9" fill="#666" text-anchor="middle">Both: IAM roles, VPC networking, RDS/DynamoDB, S3, Secrets Manager, monitoring</text>
</svg>