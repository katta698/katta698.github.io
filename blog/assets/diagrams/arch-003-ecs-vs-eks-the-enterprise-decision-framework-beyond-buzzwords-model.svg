<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <marker id="arr-gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C4A484"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A90D9"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3D9970"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8E6DBE"/>
    </marker>
  </defs>
  
  <rect width="860" height="560" fill="#F8F7F5" rx="10"/>
  
  <title>ECS vs EKS Enterprise Decision Framework</title>
  
  <text x="430" y="28" font-size="13" font-weight="700" fill="#1D2322" text-anchor="middle">
    ECS vs EKS: Enterprise Container Orchestration Architecture
  </text>
  
  <!-- AWS Control Plane Section -->
  <text x="50" y="55" font-size="10" font-weight="700" letter-spacing=".1em" fill="#1D2322" text-anchor="start">
    AWS CONTROL PLANE
  </text>
  
  <rect x="30" y="65" width="800" height="140" rx="8" stroke="#C4A484" stroke-dasharray="8,4" stroke-width="2" fill="none"/>
  
  <!-- ECS Cluster Management -->
  <rect x="50" y="80" width="160" height="110" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="130" y="100" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">ECS Cluster</text>
  <text x="130" y="118" font-size="9" fill="#666" text-anchor="middle">AWS-managed</text>
  <text x="130" y="133" font-size="9" fill="#666" text-anchor="middle">orchestration</text>
  <text x="130" y="148" font-size="9" fill="#666" text-anchor="middle">No K8s API</text>
  <text x="130" y="163" font-size="9" fill="#666" text-anchor="middle">EC2/Fargate</text>
  
  <!-- EKS Cluster Management -->
  <rect x="250" y="80" width="160" height="110" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="330" y="100" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">EKS Cluster</text>
  <text x="330" y="118" font-size="9" fill="#666" text-anchor="middle">AWS-managed</text>
  <text x="330" y="133" font-size="9" fill="#666" text-anchor="middle">Kubernetes</text>
  <text x="330" y="148" font-size="9" fill="#666" text-anchor="middle">Native K8s API</text>
  <text x="330" y="163" font-size="9" fill="#666" text-anchor="middle">EC2/Fargate</text>
  
  <!-- IAM & Security -->
  <rect x="450" y="80" width="160" height="110" rx="5" fill="#F5F0FF" stroke="#8E6DBE" stroke-width="1.2"/>
  <text x="530" y="100" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">IAM & Security</text>
  <text x="530" y="118" font-size="9" fill="#666" text-anchor="middle">IAM Roles for</text>
  <text x="530" y="133" font-size="9" fill="#666" text-anchor="middle">Service Accounts</text>
  <text x="530" y="148" font-size="9" fill="#666" text-anchor="middle">RBAC policies</text>
  <text x="530" y="163" font-size="9" fill="#666" text-anchor="middle">Network policies</text>
  
  <!-- CloudWatch Monitoring -->
  <rect x="650" y="80" width="160" height="110" rx="5" fill="#FEFAF5" stroke="#C4A484" stroke-width="1.2"/>
  <text x="730" y="100" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">CloudWatch</text>
  <text x="730" y="118" font-size="9" fill="#666" text-anchor="middle">Container Insights</text>
  <text x="730" y="133" font-size="9" fill="#666" text-anchor="middle">Metrics & Logs</text>
  <text x="730" y="148" font-size="9" fill="#666" text-anchor="middle">Performance</text>
  <text x="730" y="163" font-size="9" fill="#666" text-anchor="middle">monitoring</text>
  
  <!-- Compute Layer Section -->
  <text x="50" y="235" font-size="10" font-weight="700" letter-spacing=".1em" fill="#1D2322" text-anchor="start">
    COMPUTE & NETWORKING
  </text>
  
  <!-- ECS Compute -->
  <rect x="50" y="250" width="180" height="130" rx="5" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="140" y="270" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">ECS Services</text>
  <text x="140" y="288" font-size="9" fill="#666" text-anchor="middle">Task definitions</text>
  <text x="140" y="303" font-size="9" fill="#666" text-anchor="middle">EC2 instances</text>
  <text x="140" y="318" font-size="9" fill="#666" text-anchor="middle">or Fargate</text>
  <text x="140" y="333" font-size="9" fill="#666" text-anchor="middle">Auto Scaling</text>
  <text x="140" y="348" font-size="9" fill="#666" text-anchor="middle">Groups</text>
  <text x="140" y="363" font-size="9" fill="#666" text-anchor="middle">ALB/NLB</text>
  
  <!-- EKS Compute -->
  <rect x="270" y="250" width="180" height="130" rx="5" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="360" y="270" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">EKS Node Groups</text>
  <text x="360" y="288" font-size="9" fill="#666" text-anchor="middle">Kubernetes Pods</text>
  <text x="360" y="303" font-size="9" fill="#666" text-anchor="middle">EC2 instances</text>
  <text x="360" y="318" font-size="9" fill="#666" text-anchor="middle">or Fargate</text>
  <text x="360" y="333" font-size="9" fill="#666" text-anchor="middle">Karpenter or</text>
  <text x="360" y="348" font-size="9" fill="#666" text-anchor="middle">Cluster Autoscaler</text>
  <text x="360" y="363" font-size="9" fill="#666" text-anchor="middle">Service mesh</text>
  
  <!-- VPC & Networking -->
  <rect x="490" y="250" width="180" height="130" rx="5" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="580" y="270" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">VPC & Networking</text>
  <text x="580" y="288" font-size="9" fill="#666" text-anchor="middle">VPC subnets</text>
  <text x="580" y="303" font-size="9" fill="#666" text-anchor="middle">Security Groups</text>
  <text x="580" y="318" font-size="9" fill="#666" text-anchor="middle">ENI management</text>
  <text x="580" y="333" font-size="9" fill="#666" text-anchor="middle">AWS CNI plugin</text>
  <text x="580" y="348" font-size="9" fill="#666" text-anchor="middle">(EKS only)</text>
  <text x="580" y="363" font-size="9" fill="#666" text-anchor="middle">Service discovery</text>
  
  <!-- Data & Storage Section -->
  <text x="50" y="425" font-size="10" font-weight="700" letter-spacing=".1em" fill="#1D2322" text-anchor="start">
    DATA & STORAGE
  </text>
  
  <!-- ECS Storage -->
  <rect x="50" y="440" width="180" height="100" rx="5" fill="#F0FFF8" stroke="#3D9970" stroke-width="1.2"/>
  <text x="140" y="460" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">ECS Storage</text>
  <text x="140" y="478" font-size="9" fill="#666" text-anchor="middle">EBS volumes</text>
  <text x="140" y="493" font-size="9" fill="#666" text-anchor="middle">EFS mounts</text>
  <text x="140" y="508" font-size="9" fill="#666" text-anchor="middle">S3 integration</text>
  <text x="140" y="523" font-size="9" fill="#666" text-anchor="middle">RDS/DynamoDB</text>
  
  <!-- EKS Storage -->
  <rect x="270" y="440" width="180" height="100" rx="5" fill="#F0FFF8" stroke="#3D9970" stroke-width="1.2"/>
  <text x="360" y="460" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">EKS Storage</text>
  <text x="360" y="478" font-size="9" fill="#666" text-anchor="middle">PersistentVolumes</text>
  <text x="360" y="493" font-size="9" fill="#666" text-anchor="middle">EBS CSI driver</text>
  <text x="360" y="508" font-size="9" fill="#666" text-anchor="middle">EFS CSI driver</text>
  <text x="360" y="523" font-size="9" fill="#666" text-anchor="middle">StatefulSets</text>
  
  <!-- Shared Services -->
  <rect x="490" y="440" width="360" height="100" rx="5" fill="#F0FFF8" stroke="#3D9970" stroke-width="1.2"/>
  <text x="670" y="460" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Shared Data Services</text>
  <text x="670" y="478" font-size="9" fill="#666" text-anchor="middle">RDS (MySQL, PostgreSQL, Aurora) • DynamoDB • ElastiCache</text>
  <text x="670" y="493" font-size="9" fill="#666" text-anchor="middle">S3 buckets • Secrets Manager • Parameter Store</text>
  <text x="670" y="508" font-size="9" fill="#666" text-anchor="middle">EventBridge • SQS/SNS • Kinesis</text>
  <text x="670" y="523" font-size="9" fill="#666" text-anchor="middle">Both ECS and EKS can access these services</text>
  
  <!-- Arrows showing relationships -->
  <line x1="130" y1="190" x2="130" y2="250" stroke="#C4A484" stroke-width="2" marker-end="url(#arr-gold)"/>
  <line x1="330" y1="190" x2="360" y2="250" stroke="#C4A484" stroke-width="2" marker-end="url(#arr-gold)"/>
  <line x1="140" y1="380" x2="140" y2="440" stroke="#3D9970" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="360" y1="380" x2="360" y2="440" stroke="#3D9970" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>