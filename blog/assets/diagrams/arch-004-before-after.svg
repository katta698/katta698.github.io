  <text x="641" y="340" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#0f1111">Fulfilment</text>
  <text x="641" y="354" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">Step Functions</text>

