    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#4A90D9"/></marker>
  </defs>

  <rect width="860" height="415" fill="#F8F7F5" rx="6"/>

