<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#6c757d"/></marker>
    <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#C4A484"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#4A90D9"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#3D9970"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#cc0c39"/></marker>
  </defs>

  <rect width="860" height="340" fill="#F8F7F5" rx="6"/>

  <!-- Producers (left column) -->
  <text x="72" y="22" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#6c757d" letter-spacing="0.5">PRODUCERS</text>
  <rect x="12" y="32" width="120" height="38" rx="4" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="72" y="50" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#0f1111">Order Service</text>
  <text x="72" y="64" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">PutEvents API</text>

  <rect x="12" y="84" width="120" height="38" rx="4" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="72" y="102" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#0f1111">Auth Service</text>
  <text x="72" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">PutEvents API</text>

  <rect x="12" y="136" width="120" height="38" rx="4" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="72" y="154" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#0f1111">AWS Services</text>
  <text x="72" y="168" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">default bus only</text>

  <!-- Arrows producers → bus -->
  <line x1="132" y1="51" x2="200" y2="150" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="132" y1="103" x2="200" y2="155" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="132" y1="155" x2="200" y2="160" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <!-- Central event bus -->
  <rect x="200" y="120" width="200" height="80" rx="5" fill="#C4A484" stroke="#b8956e" stroke-width="2"/>
  <text x="300" y="148" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Custom Event Bus</text>
  <text x="300" y="165" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#fff9f0">"orders"</text>
  <text x="300" y="182" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#fff9f0">256 KB max payload · at-least-once</text>

  <!-- Schema Registry (above bus) -->
  <rect x="204" y="28" width="192" height="60" rx="4" fill="#fff" stroke="#8E6DBE" stroke-width="1.5"/>
  <text x="300" y="48" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#8E6DBE">Schema Registry</text>
  <text x="300" y="64" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">OpenAPI 3.0 schemas</text>
  <text x="300" y="78" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">auto-discovery · code bindings</text>

  <!-- Bidirectional arrow: bus ↔ schema -->
  <line x1="300" y1="88" x2="300" y2="120" stroke="#8E6DBE" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Archive (below bus) -->
  <rect x="204" y="234" width="192" height="56" rx="4" fill="#fff" stroke="#3D9970" stroke-width="1.5"/>
  <text x="300" y="254" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#3D9970">Event Archive</text>
  <text x="300" y="270" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">configurable retention (1 day – indefinite)</text>
  <text x="300" y="284" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">replay against any rule at any time</text>

  <line x1="300" y1="200" x2="300" y2="234" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Rules + Targets (right side) -->
  <text x="620" y="22" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#6c757d" letter-spacing="0.5">RULES → TARGETS</text>

  <!-- Rule 1 -->
  <rect x="420" y="32" width="100" height="34" rx="3" fill="#f0f4ff" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="470" y="50" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Rule 1</text>
  <text x="470" y="62" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#6c757d">order.placed</text>

  <rect x="560" y="32" width="130" height="34" rx="3" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="625" y="50" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#0f1111">SQS — Inventory</text>
  <text x="625" y="63" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#6c757d">+ DLQ on failure</text>

  <!-- Rule 2 -->
  <rect x="420" y="102" width="100" height="34" rx="3" fill="#f0f4ff" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="470" y="120" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Rule 2</text>
  <text x="470" y="132" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#6c757d">order.placed</text>

  <rect x="560" y="102" width="130" height="34" rx="3" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="625" y="120" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#0f1111">Lambda — Notify</text>
  <text x="625" y="133" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#6c757d">+ DLQ on failure</text>

  <!-- Rule 3 -->
  <rect x="420" y="172" width="100" height="34" rx="3" fill="#f0f4ff" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="470" y="190" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Rule 3</text>
  <text x="470" y="202" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#6c757d">order.placed</text>

  <rect x="560" y="172" width="130" height="34" rx="3" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="625" y="190" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#0f1111">Kinesis — Analytics</text>
  <text x="625" y="203" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#6c757d">+ DLQ on failure</text>

  <!-- Rule 4 -->
  <rect x="420" y="242" width="100" height="34" rx="3" fill="#f0f4ff" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="470" y="260" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Rule 4</text>
  <text x="470" y="272" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#6c757d">order.shipped</text>

  <rect x="560" y="242" width="130" height="34" rx="3" fill="#fff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="625" y="260" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#0f1111">Step Functions</text>
  <text x="625" y="273" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#6c757d">+ DLQ on failure</text>

  <!-- Bus → Rules arrows -->
  <line x1="400" y1="149" x2="420" y2="49" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="400" y1="155" x2="420" y2="119" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="400" y1="160" x2="420" y2="189" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="400" y1="165" x2="420" y2="259" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Rule → Target arrows -->
  <line x1="520" y1="49" x2="560" y2="49" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="119" x2="560" y2="119" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="189" x2="560" y2="189" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="259" x2="560" y2="259" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DLQ boxes (right-most) -->
  <rect x="706" y="38" width="48" height="24" rx="3" fill="#fff5f5" stroke="#cc0c39" stroke-width="1"/>
  <text x="730" y="55" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#cc0c39">DLQ</text>
  <line x1="690" y1="49" x2="706" y2="49" stroke="#cc0c39" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <rect x="706" y="108" width="48" height="24" rx="3" fill="#fff5f5" stroke="#cc0c39" stroke-width="1"/>
  <text x="730" y="125" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#cc0c39">DLQ</text>
  <line x1="690" y1="119" x2="706" y2="119" stroke="#cc0c39" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <rect x="706" y="178" width="48" height="24" rx="3" fill="#fff5f5" stroke="#cc0c39" stroke-width="1"/>
  <text x="730" y="195" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#cc0c39">DLQ</text>
  <line x1="690" y1="189" x2="706" y2="189" stroke="#cc0c39" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <rect x="706" y="248" width="48" height="24" rx="3" fill="#fff5f5" stroke="#cc0c39" stroke-width="1"/>
  <text x="730" y="265" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#cc0c39">DLQ</text>
  <line x1="690" y1="259" x2="706" y2="259" stroke="#cc0c39" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- Legend at bottom -->
  <text x="300" y="318" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6c757d">Each rule matches on event pattern (source + detail-type). Multiple rules can match the same event independently.</text>
</svg>
