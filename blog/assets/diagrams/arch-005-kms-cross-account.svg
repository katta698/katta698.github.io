<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="KMS cross-account encryption pattern">
  <rect width="860" height="340" fill="#F8F7F5"/>

  <text x="430" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1D2322">Cross-Account Encryption — The Grant Pattern</text>

  <!-- Account A: Key Owner -->
  <rect x="20" y="50" width="240" height="260" rx="10" fill="#1E2828" stroke="#C4A484" stroke-width="2"/>
  <text x="140" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#C4A484">Account A — Key Owner</text>

  <rect x="36" y="84" width="208" height="64" rx="6" fill="#2B3333" stroke="#C4A484" stroke-width="1"/>
  <text x="140" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#C4A484">CMK (alias/shared/data)</text>
  <text x="140" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Key policy allows Account B</text>
  <text x="140" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">kms:Decrypt, kms:GenerateDataKey</text>

  <rect x="36" y="160" width="208" height="52" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="140" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Key Policy Statement</text>
  <text x="140" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Principal: arn:aws:iam::ACCT-B:root</text>
  <text x="140" y="207" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Effect: Allow, Action: kms:Decrypt</text>

  <rect x="36" y="224" width="208" height="52" rx="6" fill="#2B3333" stroke="#8E6DBE" stroke-width="1"/>
  <text x="140" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#8E6DBE">CloudTrail (Account A)</text>
  <text x="140" y="259" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Every Decrypt logged with</text>
  <text x="140" y="271" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">caller identity from Account B</text>
  <text x="140" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Full cross-account audit trail</text>

  <!-- Center arrows -->
  <!-- Encrypt request -->
  <line x1="260" y1="130" x2="360" y2="130" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-gold2)"/>
  <text x="310" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#C4A484">GenerateDataKey</text>

  <!-- Decrypt request -->
  <line x1="360" y1="150" x2="260" y2="150" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue2)"/>
  <text x="310" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#4A90D9">Decrypt(encryptedDEK)</text>

  <!-- KMS API box -->
  <rect x="360" y="100" width="140" height="78" rx="8" fill="#2B3333" stroke="#C4A484" stroke-width="1.5"/>
  <text x="430" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#C4A484">KMS API</text>
  <text x="430" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Validates caller identity</text>
  <text x="430" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Checks key policy</text>
  <text x="430" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Returns DEK (never raw key)</text>

  <!-- Account B -->
  <rect x="600" y="50" width="240" height="260" rx="10" fill="#1E2828" stroke="#4A90D9" stroke-width="2"/>
  <text x="720" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#4A90D9">Account B — Key Consumer</text>

  <rect x="616" y="84" width="208" height="64" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="720" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">IAM Role (must also allow kms:*)</text>
  <text x="720" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Both key policy AND IAM policy</text>
  <text x="720" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">must grant access (AND logic)</text>

  <rect x="616" y="160" width="208" height="52" rx="6" fill="#2B3333" stroke="#3D9970" stroke-width="1"/>
  <text x="720" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3D9970">S3 / Lambda / ECS Task</text>
  <text x="720" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Encrypts/decrypts data using</text>
  <text x="720" y="207" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">cross-account CMK ARN directly</text>

  <rect x="616" y="224" width="208" height="70" rx="6" fill="#2B3333" stroke="#E55C5C" stroke-width="1"/>
  <text x="720" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#E55C5C">Common Mistake</text>
  <text x="720" y="259" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Granting kms:* in IAM is not enough.</text>
  <text x="720" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Account B root must be in the</text>
  <text x="720" y="287" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">key policy in Account A too.</text>

  <!-- Arrow from KMS to Account B -->
  <line x1="500" y1="139" x2="600" y2="139" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green2)"/>
  <text x="550" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#3D9970">plaintext DEK</text>

  <defs>
    <marker id="arr-gold2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C4A484"/>
    </marker>
    <marker id="arr-blue2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4A90D9"/>
    </marker>
    <marker id="arr-green2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3D9970"/>
    </marker>
  </defs>
</svg>
