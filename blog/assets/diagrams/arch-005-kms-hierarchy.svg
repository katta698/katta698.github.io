<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="KMS key hierarchy across AWS accounts">
  <rect width="860" height="420" fill="#F8F7F5"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1D2322">KMS Key Hierarchy — Multi-Account Encryption</text>

  <!-- Management Account -->
  <rect x="20" y="52" width="200" height="80" rx="8" fill="#2B3333" stroke="#C4A484" stroke-width="1.5"/>
  <text x="120" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#C4A484">Management Account</text>
  <text x="120" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#F5F5F3">Root KMS CMK</text>
  <text x="120" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Key policy governs all grants</text>
  <text x="120" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">CloudTrail audit in central account</text>

  <!-- Arrow down to workload accounts -->
  <line x1="120" y1="132" x2="120" y2="168" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <text x="145" y="155" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">key grants</text>

  <!-- Workload Account A -->
  <rect x="20" y="170" width="200" height="88" rx="8" fill="#1E2828" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="120" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#4A90D9">Workload Account A</text>
  <text x="120" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#F5F5F3">Service-specific CMK (alias/prod/s3)</text>
  <text x="120" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Key policy: account A admins + root grant</text>
  <text x="120" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Used by: S3, EBS, Secrets Manager</text>
  <text x="120" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Rotation: enabled (annual)</text>

  <!-- Workload Account B -->
  <rect x="20" y="278" width="200" height="88" rx="8" fill="#1E2828" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="120" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#4A90D9">Workload Account B</text>
  <text x="120" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#F5F5F3">Service-specific CMK (alias/prod/rds)</text>
  <text x="120" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Key policy: account B admins + root grant</text>
  <text x="120" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Used by: RDS, DynamoDB, SQS</text>
  <text x="120" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Rotation: enabled (annual)</text>

  <!-- Shared Services Account -->
  <rect x="330" y="52" width="210" height="104" rx="8" fill="#2B3333" stroke="#8E6DBE" stroke-width="1.5"/>
  <text x="435" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#8E6DBE">Shared Services Account</text>
  <text x="435" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#F5F5F3">Cross-Account Encryption CMK</text>
  <text x="435" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Key policy grants kms:Decrypt to</text>
  <text x="435" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">specific roles in other accounts</text>
  <text x="435" y="142" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Used by: cross-account S3 replication,</text>
  <text x="435" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">centralized secrets, ECR images</text>

  <!-- Arrow from shared to workload A -->
  <line x1="330" y1="110" x2="220" y2="200" stroke="#8E6DBE" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-purple)"/>
  <!-- Arrow from shared to workload B -->
  <line x1="330" y1="130" x2="220" y2="310" stroke="#8E6DBE" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-purple)"/>

  <!-- Security Account -->
  <rect x="330" y="180" width="210" height="88" rx="8" fill="#2B3333" stroke="#3D9970" stroke-width="1.5"/>
  <text x="435" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#3D9970">Security Account</text>
  <text x="435" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#F5F5F3">Audit CMK (alias/security/audit)</text>
  <text x="435" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Encrypts: CloudTrail logs, Config,</text>
  <text x="435" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">GuardDuty findings, Security Hub</text>
  <text x="435" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Key admins: break-glass role only</text>

  <!-- Key Components legend area -->
  <rect x="330" y="290" width="210" height="108" rx="8" fill="#F0EDE8" stroke="#D5CFC8" stroke-width="1"/>
  <text x="435" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1D2322">Key Policy Must-Haves</text>
  <text x="345" y="332" font-family="system-ui,sans-serif" font-size="9" fill="#1D2322">✓  Root account always has full access</text>
  <text x="345" y="349" font-family="system-ui,sans-serif" font-size="9" fill="#1D2322">✓  Separate key admin vs key user roles</text>
  <text x="345" y="366" font-family="system-ui,sans-serif" font-size="9" fill="#1D2322">✓  kms:ViaService condition on user stmts</text>
  <text x="345" y="383" font-family="system-ui,sans-serif" font-size="9" fill="#1D2322">✓  No wildcard Principal in Decrypt stmt</text>
  <text x="345" y="394" font-family="system-ui,sans-serif" font-size="9" fill="#3D9970">✓  CloudTrail enabled for all key events</text>

  <!-- Right column: Envelope Encryption -->
  <rect x="560" y="52" width="280" height="346" rx="8" fill="#F0EDE8" stroke="#D5CFC8" stroke-width="1"/>
  <text x="700" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1D2322">Envelope Encryption Flow</text>

  <!-- Step 1 -->
  <rect x="575" y="88" width="250" height="52" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="700" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">1 — Generate Data Key</text>
  <text x="700" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">kms:GenerateDataKey → plaintext DEK</text>
  <text x="700" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">+ encrypted DEK (wrapped by CMK)</text>

  <line x1="700" y1="140" x2="700" y2="155" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 -->
  <rect x="575" y="157" width="250" height="52" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="700" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">2 — Encrypt Locally</text>
  <text x="700" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Use plaintext DEK to encrypt data</text>
  <text x="700" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Discard plaintext DEK immediately</text>

  <line x1="700" y1="209" x2="700" y2="224" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 3 -->
  <rect x="575" y="226" width="250" height="52" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="700" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">3 — Store Together</text>
  <text x="700" y="261" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Store: encrypted data + encrypted DEK</text>
  <text x="700" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">KMS never sees your data, only the DEK</text>

  <line x1="700" y1="278" x2="700" y2="293" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 4 -->
  <rect x="575" y="295" width="250" height="52" rx="6" fill="#2B3333" stroke="#3D9970" stroke-width="1"/>
  <text x="700" y="314" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3D9970">4 — Decrypt on Demand</text>
  <text x="700" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">kms:Decrypt encrypted DEK → plaintext DEK</text>
  <text x="700" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Decrypt data locally, discard DEK again</text>

  <!-- KMS never touches your data note -->
  <rect x="575" y="358" width="250" height="28" rx="5" fill="#3D9970" fill-opacity="0.15" stroke="#3D9970" stroke-width="1"/>
  <text x="700" y="377" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#3D9970">KMS never encrypts your data directly — only the DEK</text>

  <defs>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C4A484"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8E6DBE"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4A90D9"/>
    </marker>
  </defs>
</svg>
