<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Aurora Global Database planned vs unplanned failover flow">
  <rect width="860" height="360" fill="#F8F7F5"/>

  <text x="430" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1D2322">Failover Patterns — Planned vs Unplanned</text>

  <!-- Planned Failover (Switchover) -->
  <rect x="20" y="44" width="400" height="296" rx="10" fill="#1E2828" stroke="#3D9970" stroke-width="2"/>
  <text x="220" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#3D9970">Planned Failover (Switchover)</text>
  <text x="220" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Zero data loss · use for maintenance, region migration</text>

  <rect x="40" y="96" width="360" height="44" rx="6" fill="#2B3333" stroke="#3D9970" stroke-width="1"/>
  <text x="220" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3D9970">1 — Initiate switchover via console or API</text>
  <text x="220" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">aws rds switchover-global-cluster --target-db-cluster-identifier</text>

  <line x1="220" y1="140" x2="220" y2="155" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green6)"/>

  <rect x="40" y="157" width="360" height="44" rx="6" fill="#2B3333" stroke="#3D9970" stroke-width="1"/>
  <text x="220" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3D9970">2 — Aurora drains in-flight writes to primary</text>
  <text x="220" y="191" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Waits for replication lag to reach zero before promoting</text>

  <line x1="220" y1="201" x2="220" y2="216" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green6)"/>

  <rect x="40" y="218" width="360" height="44" rx="6" fill="#2B3333" stroke="#3D9970" stroke-width="1"/>
  <text x="220" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3D9970">3 — Secondary promoted to primary writer</text>
  <text x="220" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Old primary demoted to secondary reader cluster</text>

  <line x1="220" y1="262" x2="220" y2="277" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green6)"/>

  <rect x="40" y="279" width="360" height="44" rx="6" fill="#2B3333" stroke="#3D9970" stroke-width="1"/>
  <text x="220" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3D9970">4 — Update Route 53 write record</text>
  <text x="220" y="313" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Point write.db alias to new primary cluster endpoint</text>

  <rect x="40" y="330" width="360" height="0" rx="4"/>
  <text x="220" y="346" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#3D9970">RPO = 0 · RTO &lt; 1 minute · apps reconnect automatically</text>

  <!-- Unplanned Failover -->
  <rect x="440" y="44" width="400" height="296" rx="10" fill="#1E2828" stroke="#E55C5C" stroke-width="2"/>
  <text x="640" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#E55C5C">Unplanned Failover (Region Failure)</text>
  <text x="640" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Potential data loss = replication lag at failure moment</text>

  <rect x="460" y="96" width="360" height="44" rx="6" fill="#2B3333" stroke="#E55C5C" stroke-width="1"/>
  <text x="640" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#E55C5C">1 — Primary region becomes unavailable</text>
  <text x="640" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Route 53 health check fails · CloudWatch alarm fires</text>

  <line x1="640" y1="140" x2="640" y2="155" stroke="#E55C5C" stroke-width="1.5" marker-end="url(#arr-red6)"/>

  <rect x="460" y="157" width="360" height="44" rx="6" fill="#2B3333" stroke="#E55C5C" stroke-width="1"/>
  <text x="640" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#E55C5C">2 — Detach secondary from global cluster</text>
  <text x="640" y="191" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">remove-from-global-cluster → secondary becomes standalone</text>

  <line x1="640" y1="201" x2="640" y2="216" stroke="#E55C5C" stroke-width="1.5" marker-end="url(#arr-red6)"/>

  <rect x="460" y="218" width="360" height="44" rx="6" fill="#2B3333" stroke="#E55C5C" stroke-width="1"/>
  <text x="640" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#E55C5C">3 — Standalone cluster accepts writes</text>
  <text x="640" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Update app connection strings · update Route 53 write record</text>

  <line x1="640" y1="262" x2="640" y2="277" stroke="#E55C5C" stroke-width="1.5" marker-end="url(#arr-red6)"/>

  <rect x="460" y="279" width="360" height="44" rx="6" fill="#2B3333" stroke="#d97706" stroke-width="1"/>
  <text x="640" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#d97706">4 — Plan failback before primary recovers</text>
  <text x="640" y="313" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Re-attach old primary as new secondary · most teams skip this</text>

  <text x="640" y="346" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#E55C5C">RPO = replication lag · RTO ~1–2 min · failback is manual</text>

  <defs>
    <marker id="arr-green6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3D9970"/>
    </marker>
    <marker id="arr-red6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#E55C5C"/>
    </marker>
  </defs>
</svg>
