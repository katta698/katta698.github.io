<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Aurora Global Database multi-region topology">
  <rect width="860" height="420" fill="#F8F7F5"/>

  <text x="430" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1D2322">Aurora Global Database — Multi-Region Topology</text>

  <!-- Primary Region -->
  <rect x="20" y="44" width="360" height="340" rx="10" fill="#1E2828" stroke="#C4A484" stroke-width="2"/>
  <text x="200" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#C4A484">Primary Region — us-east-1</text>

  <!-- Writer instance -->
  <rect x="40" y="80" width="320" height="64" rx="6" fill="#2B3333" stroke="#C4A484" stroke-width="1.5"/>
  <text x="200" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#C4A484">Aurora Writer (db.r6g.2xlarge)</text>
  <text x="200" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Handles all writes · cluster endpoint</text>
  <text x="200" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">cluster.us-east-1.rds.amazonaws.com</text>

  <!-- Reader instances primary -->
  <rect x="40" y="158" width="150" height="54" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="115" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Reader AZ-a</text>
  <text x="115" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Read replica</text>
  <text x="115" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">reader endpoint</text>

  <rect x="210" y="158" width="150" height="54" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="285" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Reader AZ-b</text>
  <text x="285" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Read replica</text>
  <text x="285" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">reader endpoint</text>

  <!-- Route 53 primary -->
  <rect x="40" y="226" width="320" height="46" rx="6" fill="#2B3333" stroke="#8E6DBE" stroke-width="1"/>
  <text x="200" y="247" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#8E6DBE">Route 53 — write.db.jayanthkatta.com</text>
  <text x="200" y="263" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Alias → cluster writer endpoint · health check enabled</text>

  <!-- RDS Proxy -->
  <rect x="40" y="284" width="320" height="46" rx="6" fill="#2B3333" stroke="#3D9970" stroke-width="1"/>
  <text x="200" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3D9970">RDS Proxy (optional)</text>
  <text x="200" y="321" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Connection pooling · faster failover for app layer</text>

  <!-- Storage replication note -->
  <rect x="40" y="344" width="320" height="30" rx="4" fill="#3D9970" fill-opacity="0.12" stroke="#3D9970" stroke-width="1"/>
  <text x="200" y="364" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#3D9970">Shared distributed storage — replicates to secondary in &lt;1s</text>

  <!-- Replication arrow -->
  <line x1="380" y1="210" x2="480" y2="210" stroke="#C4A484" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-gold6)"/>
  <text x="430" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#C4A484">storage-level</text>
  <text x="430" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#C4A484">replication</text>
  <text x="430" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">&lt; 1s lag</text>

  <!-- Secondary Region -->
  <rect x="480" y="44" width="360" height="340" rx="10" fill="#1E2828" stroke="#4A90D9" stroke-width="2"/>
  <text x="660" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#4A90D9">Secondary Region — eu-west-1</text>

  <!-- Secondary readers -->
  <rect x="500" y="80" width="320" height="64" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="660" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#4A90D9">Aurora Reader Cluster</text>
  <text x="660" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Read-only by default · write-forwarding optional</text>
  <text x="660" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">cluster.eu-west-1.rds.amazonaws.com</text>

  <!-- Secondary reader instances -->
  <rect x="500" y="158" width="150" height="54" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="575" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Reader AZ-a</text>
  <text x="575" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Serves local reads</text>
  <text x="575" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">low latency EU</text>

  <rect x="670" y="158" width="150" height="54" rx="6" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="745" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Reader AZ-b</text>
  <text x="745" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#F5F5F3">Serves local reads</text>
  <text x="745" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">low latency EU</text>

  <!-- Route 53 secondary -->
  <rect x="500" y="226" width="320" height="46" rx="6" fill="#2B3333" stroke="#8E6DBE" stroke-width="1"/>
  <text x="660" y="247" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#8E6DBE">Route 53 — read.db.jayanthkatta.com</text>
  <text x="660" y="263" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Latency-based routing · EU traffic served locally</text>

  <!-- Failover note -->
  <rect x="500" y="284" width="320" height="46" rx="6" fill="#2B3333" stroke="#E55C5C" stroke-width="1"/>
  <text x="660" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#E55C5C">On Failover — Promote to Writer</text>
  <text x="660" y="321" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Detach from global cluster · becomes independent</text>

  <!-- Promote time note -->
  <rect x="500" y="344" width="320" height="30" rx="4" fill="#E55C5C" fill-opacity="0.12" stroke="#E55C5C" stroke-width="1"/>
  <text x="660" y="364" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#E55C5C">Managed failover RTO &lt; 1 min · unplanned RTO ~1–2 min</text>

  <defs>
    <marker id="arr-gold6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C4A484"/>
    </marker>
  </defs>
</svg>
