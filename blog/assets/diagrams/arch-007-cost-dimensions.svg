<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Cost allocation dimensions diagram">
  <rect width="860" height="360" fill="#F8F7F5"/>

  <text x="430" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1D2322">Cost Allocation Dimensions in CUR 2.0</text>

  <!-- Dimension 1: AWS Service -->
  <rect x="20" y="48" width="190" height="290" rx="8" fill="#1E2828" stroke="#C4A484" stroke-width="2"/>
  <text x="115" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#C4A484">AWS Service</text>
  <rect x="34" y="82" width="162" height="20" rx="3" fill="#2B3333"/>
  <text x="115" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">product_service_code</text>
  <rect x="34" y="108" width="162" height="20" rx="3" fill="#2B3333"/>
  <text x="115" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">line_item_usage_type</text>
  <rect x="34" y="134" width="162" height="20" rx="3" fill="#2B3333"/>
  <text x="115" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">product_region</text>
  <line x1="34" y1="164" x2="196" y2="164" stroke="#2B3333" stroke-width="1"/>
  <text x="34" y="182" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">✓ Always available</text>
  <text x="34" y="198" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">✓ No setup required</text>
  <text x="34" y="214" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">✓ Historical data works</text>
  <text x="115" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20">🔒</text>
  <text x="115" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#C4A484">Native — zero setup</text>

  <!-- Dimension 2: Account -->
  <rect x="225" y="48" width="190" height="290" rx="8" fill="#1E2828" stroke="#4A90D9" stroke-width="2"/>
  <text x="320" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#4A90D9">AWS Account</text>
  <rect x="239" y="82" width="162" height="20" rx="3" fill="#2B3333"/>
  <text x="320" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">line_item_usage_account_id</text>
  <rect x="239" y="108" width="162" height="20" rx="3" fill="#2B3333"/>
  <text x="320" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">bill_payer_account_id</text>
  <line x1="239" y1="138" x2="401" y2="138" stroke="#2B3333" stroke-width="1"/>
  <text x="239" y="156" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">✓ Always available</text>
  <text x="239" y="172" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">✓ All linked accounts</text>
  <text x="239" y="188" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">✓ No setup required</text>
  <text x="239" y="210" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">Map account ID → team in</text>
  <text x="239" y="224" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">a separate lookup table,</text>
  <text x="239" y="238" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">JOIN in Athena query.</text>
  <text x="320" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#4A90D9">Native — zero setup</text>

  <!-- Dimension 3: Resource Tag -->
  <rect x="430" y="48" width="190" height="290" rx="8" fill="#1E2828" stroke="#d97706" stroke-width="2"/>
  <text x="525" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#d97706">Resource Tags</text>
  <rect x="444" y="82" width="162" height="20" rx="3" fill="#2B3333"/>
  <text x="525" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">resource_tags_user_team</text>
  <rect x="444" y="108" width="162" height="20" rx="3" fill="#2B3333"/>
  <text x="525" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">resource_tags_user_environment</text>
  <rect x="444" y="134" width="162" height="20" rx="3" fill="#2B3333"/>
  <text x="525" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">resource_tags_user_cost_centre</text>
  <line x1="444" y1="164" x2="606" y2="164" stroke="#2B3333" stroke-width="1"/>
  <text x="444" y="182" font-family="system-ui,sans-serif" font-size="9" fill="#d97706">⚠ Requires tag activation</text>
  <text x="444" y="198" font-family="system-ui,sans-serif" font-size="9" fill="#d97706">⚠ 24h lag after activation</text>
  <text x="444" y="214" font-family="system-ui,sans-serif" font-size="9" fill="#d97706">⚠ Not retroactive</text>
  <text x="444" y="234" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">Activate in Billing console</text>
  <text x="444" y="249" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">→ Cost Allocation Tags.</text>
  <text x="444" y="264" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">One column per tag key.</text>
  <text x="525" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#d97706">Activate on day one</text>

  <!-- Dimension 4: Business (custom) -->
  <rect x="635" y="48" width="205" height="290" rx="8" fill="#1E2828" stroke="#1d8102" stroke-width="2"/>
  <text x="737" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1d8102">Business Dimension</text>
  <rect x="649" y="82" width="177" height="20" rx="3" fill="#2B3333"/>
  <text x="737" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Your own mapping table</text>
  <rect x="649" y="108" width="177" height="20" rx="3" fill="#2B3333"/>
  <text x="737" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">JOIN with CUR in Athena</text>
  <line x1="649" y1="138" x2="826" y2="138" stroke="#2B3333" stroke-width="1"/>
  <text x="649" y="156" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">Map account_id → product</text>
  <text x="649" y="171" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">Map account_id → team</text>
  <text x="649" y="186" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">Map account_id → customer tier</text>
  <line x1="649" y1="200" x2="826" y2="200" stroke="#2B3333" stroke-width="1"/>
  <text x="649" y="218" font-family="system-ui,sans-serif" font-size="9" fill="#1d8102">✓ Unlimited dimensions</text>
  <text x="649" y="233" font-family="system-ui,sans-serif" font-size="9" fill="#1d8102">✓ Cost Explorer cannot</text>
  <text x="649" y="248" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">  do this at all</text>
  <text x="649" y="268" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">Store mapping in S3 CSV</text>
  <text x="649" y="283" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">or DynamoDB, query via</text>
  <text x="649" y="298" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">Athena federated query.</text>
  <text x="737" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#1d8102">Your own business logic</text>
</svg>
