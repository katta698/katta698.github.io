<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="CUR 2.0 data pipeline diagram">
  <rect width="860" height="400" fill="#F8F7F5"/>

  <text x="430" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1D2322">CUR 2.0 Cost Intelligence Pipeline</text>

  <!-- Step 1: Management Account / CUR -->
  <rect x="20" y="48" width="180" height="120" rx="8" fill="#1E2828" stroke="#C4A484" stroke-width="2"/>
  <text x="110" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#C4A484">Management Account</text>
  <rect x="36" y="84" width="148" height="40" rx="4" fill="#2B3333" stroke="#C4A484" stroke-width="1"/>
  <text x="110" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#C4A484">CUR 2.0 Report</text>
  <text x="110" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Parquet · DAILY · OVERWRITE</text>
  <text x="110" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">All 80 linked accounts included</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="108" x2="238" y2="108" stroke="#C4A484" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="219" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#7A8A88">daily</text>

  <!-- Step 2: S3 -->
  <rect x="240" y="48" width="175" height="120" rx="8" fill="#1E2828" stroke="#4A90D9" stroke-width="2"/>
  <text x="327" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#4A90D9">S3 — Billing Bucket</text>
  <rect x="254" y="84" width="148" height="56" rx="4" fill="#2B3333" stroke="#4A90D9" stroke-width="1"/>
  <text x="328" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#4A90D9">cur2/year=2026/month=07/</text>
  <text x="328" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">billing-report-00001.snappy.parquet</text>
  <text x="328" y="129" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">billing-report-00002.snappy.parquet</text>
  <text x="328" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">Snappy Parquet · ~5 GB/month</text>

  <!-- Arrow 2 -->
  <line x1="415" y1="108" x2="453" y2="108" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="434" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#7A8A88">partition</text>
  <text x="434" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#7A8A88">projection</text>

  <!-- Step 3: Glue / Athena -->
  <rect x="455" y="48" width="180" height="120" rx="8" fill="#1E2828" stroke="#8E6DBE" stroke-width="2"/>
  <text x="545" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#8E6DBE">Athena Workgroup</text>
  <rect x="470" y="84" width="150" height="40" rx="4" fill="#2B3333" stroke="#8E6DBE" stroke-width="1"/>
  <text x="545" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#8E6DBE">cur-analysis workgroup</text>
  <text x="545" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">10 GB per-query scan limit</text>
  <rect x="470" y="130" width="150" height="24" rx="4" fill="#2B3333" stroke="#5A4480" stroke-width="1"/>
  <text x="545" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">billing.cur2_daily (Glue table)</text>
  <text x="545" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7A8A88">No crawler · partition projection</text>

  <!-- Arrow 3 -->
  <line x1="635" y1="108" x2="673" y2="108" stroke="#8E6DBE" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 4: Engineering Teams -->
  <rect x="675" y="48" width="165" height="120" rx="8" fill="#1E2828" stroke="#1d8102" stroke-width="2"/>
  <text x="757" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1d8102">Engineering Teams</text>
  <rect x="690" y="82" width="136" height="24" rx="4" fill="#2B3333" stroke="#1d8102" stroke-width="1"/>
  <text x="758" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Named saved queries</text>
  <rect x="690" y="112" width="136" height="24" rx="4" fill="#2B3333" stroke="#2A5A20" stroke-width="1"/>
  <text x="758" y="129" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A3ABA9">Athena console / QuickSight</text>
  <rect x="690" y="142" width="136" height="14" rx="3" fill="#1A3010" stroke="none"/>
  <text x="758" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#1d8102">30-second cost answers</text>

  <!-- Bottom legend -->
  <rect x="20" y="196" width="820" height="185" rx="8" fill="#F0EDE8" stroke="#D8D4CE" stroke-width="1"/>
  <text x="430" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1D2322">Key cost columns in CUR 2.0</text>

  <!-- Column 1 -->
  <rect x="36" y="228" width="185" height="138" rx="6" fill="#fff" stroke="#E0DBD4" stroke-width="1"/>
  <text x="128" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#C4A484">Amortised cost (use this)</text>
  <text x="44" y="266" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">reservation_effective_cost</text>
  <text x="44" y="281" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">savings_plan_effective_cost</text>
  <line x1="44" y1="290" x2="212" y2="290" stroke="#E0DBD4" stroke-width="1"/>
  <text x="44" y="305" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">Spreads RI/SP commitment</text>
  <text x="44" y="319" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">evenly across the term.</text>
  <text x="44" y="333" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">Use for month-over-month</text>
  <text x="44" y="347" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">trend analysis.</text>

  <!-- Column 2 -->
  <rect x="232" y="228" width="185" height="138" rx="6" fill="#fff" stroke="#E0DBD4" stroke-width="1"/>
  <text x="324" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#d97706">Avoid for trend analysis</text>
  <text x="240" y="266" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">line_item_unblended_cost</text>
  <line x1="240" y1="276" x2="410" y2="276" stroke="#E0DBD4" stroke-width="1"/>
  <text x="240" y="292" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">Shows full RI upfront charge</text>
  <text x="240" y="306" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">in purchase month, $0 for</text>
  <text x="240" y="320" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">remaining 35 months.</text>
  <text x="240" y="340" font-family="system-ui,sans-serif" font-size="9" fill="#cc0c39">Makes month comparison</text>
  <text x="240" y="354" font-family="system-ui,sans-serif" font-size="9" fill="#cc0c39">meaningless on RI accounts.</text>

  <!-- Column 3 -->
  <rect x="428" y="228" width="185" height="138" rx="6" fill="#fff" stroke="#E0DBD4" stroke-width="1"/>
  <text x="520" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#4A90D9">Dimensions</text>
  <text x="436" y="266" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">line_item_usage_account_id</text>
  <text x="436" y="281" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">product_service_code</text>
  <text x="436" y="296" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">resource_tags_user_team</text>
  <text x="436" y="311" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">product_region</text>
  <line x1="436" y1="320" x2="605" y2="320" stroke="#E0DBD4" stroke-width="1"/>
  <text x="436" y="335" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">Tag columns need activation</text>
  <text x="436" y="349" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">in Billing console (24h lag).</text>

  <!-- Column 4 -->
  <rect x="624" y="228" width="196" height="138" rx="6" fill="#fff" stroke="#E0DBD4" stroke-width="1"/>
  <text x="722" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#1d8102">Cost controls</text>
  <text x="632" y="266" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">Athena: $5 per TB scanned</text>
  <text x="632" y="281" font-family="system-ui,sans-serif" font-size="9" fill="#3d3d3d">Parquet: ~5 GB vs 50 GB CSV</text>
  <line x1="632" y1="290" x2="812" y2="290" stroke="#E0DBD4" stroke-width="1"/>
  <text x="632" y="306" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">Workgroup 10 GB scan limit</text>
  <text x="632" y="320" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">cancels expensive queries</text>
  <text x="632" y="334" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">before they run. Partition</text>
  <text x="632" y="348" font-family="system-ui,sans-serif" font-size="9" fill="#6c757d">filter = &lt;$0.01 per query.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C4A484"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4A90D9"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8E6DBE"/>
    </marker>
  </defs>
</svg>
