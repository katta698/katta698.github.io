<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;background:#1a1a2e;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" fill="#C4A484" font-size="14" font-weight="700">ARC Routing Control Architecture</text>

  <!-- ARC Cluster box -->
  <rect x="290" y="50" width="280" height="110" rx="8" fill="#0d1117" stroke="#C4A484" stroke-width="1.5"/>
  <text x="430" y="70" text-anchor="middle" fill="#C4A484" font-size="11" font-weight="700">ARC Cluster (Control Plane)</text>
  <text x="430" y="88" text-anchor="middle" fill="#8b9dc3" font-size="9">5 regional endpoints · quorum = 3 of 5</text>

  <!-- 5 cluster endpoints -->
  <circle cx="320" cy="115" r="14" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="320" y="119" text-anchor="middle" fill="#4a9eff" font-size="8">us-e1</text>
  <circle cx="360" cy="115" r="14" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="360" y="119" text-anchor="middle" fill="#4a9eff" font-size="8">us-w2</text>
  <circle cx="400" cy="115" r="14" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="400" y="119" text-anchor="middle" fill="#4a9eff" font-size="8">eu-w1</text>
  <circle cx="440" cy="115" r="14" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="440" y="119" text-anchor="middle" fill="#4a9eff" font-size="8">ap-se1</text>
  <circle cx="480" cy="115" r="14" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="480" y="119" text-anchor="middle" fill="#4a9eff" font-size="8">sa-e1</text>

  <!-- Routing controls on cluster -->
  <rect x="310" y="138" width="80" height="16" rx="3" fill="#2d4a22" stroke="#4caf50" stroke-width="1"/>
  <text x="350" y="150" text-anchor="middle" fill="#4caf50" font-size="9" font-weight="600">us-east-1 ● ON</text>
  <rect x="470" y="138" width="80" height="16" rx="3" fill="#3d2020" stroke="#e57373" stroke-width="1"/>
  <text x="510" y="150" text-anchor="middle" fill="#e57373" font-size="9" font-weight="600">us-west-2 ○ OFF</text>

  <!-- Safety rule label -->
  <text x="430" y="172" text-anchor="middle" fill="#9e9e9e" font-size="8" font-style="italic">Safety rule: exactly 1 of 2 controls ON at all times</text>

  <!-- Arrow: cluster → Route 53 health checks -->
  <line x1="350" y1="160" x2="210" y2="220" stroke="#C4A484" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="510" y1="160" x2="650" y2="220" stroke="#C4A484" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Route 53 health check (east - healthy) -->
  <rect x="120" y="220" width="170" height="40" rx="6" fill="#0d1117" stroke="#4caf50" stroke-width="1.5"/>
  <text x="205" y="237" text-anchor="middle" fill="#e0e0e0" font-size="10" font-weight="600">Route 53 Health Check</text>
  <text x="205" y="252" text-anchor="middle" fill="#4caf50" font-size="9">us-east-1 → HEALTHY</text>

  <!-- Route 53 health check (west - unhealthy) -->
  <rect x="570" y="220" width="170" height="40" rx="6" fill="#0d1117" stroke="#e57373" stroke-width="1.5"/>
  <text x="655" y="237" text-anchor="middle" fill="#e0e0e0" font-size="10" font-weight="600">Route 53 Health Check</text>
  <text x="655" y="252" text-anchor="middle" fill="#e57373" font-size="9">us-west-2 → UNHEALTHY</text>

  <!-- Route 53 DNS failover record -->
  <rect x="310" y="220" width="240" height="40" rx="6" fill="#1a1a2e" stroke="#C4A484" stroke-width="1.5"/>
  <text x="430" y="237" text-anchor="middle" fill="#C4A484" font-size="10" font-weight="700">Route 53 DNS</text>
  <text x="430" y="252" text-anchor="middle" fill="#9e9e9e" font-size="9">api.example.com  failover record</text>

  <!-- Arrows: health checks → DNS -->
  <line x1="290" y1="240" x2="310" y2="240" stroke="#4caf50" stroke-width="1.5"/>
  <polygon points="310,237 318,240 310,243" fill="#4caf50"/>
  <line x1="570" y1="240" x2="550" y2="240" stroke="#e57373" stroke-width="1.5"/>
  <polygon points="550,237 542,240 550,243" fill="#e57373"/>

  <!-- Clients -->
  <rect x="360" y="295" width="140" height="36" rx="6" fill="#0d1117" stroke="#8b9dc3" stroke-width="1.5"/>
  <text x="430" y="312" text-anchor="middle" fill="#e0e0e0" font-size="10" font-weight="600">Clients</text>
  <text x="430" y="326" text-anchor="middle" fill="#8b9dc3" font-size="9">api.example.com</text>

  <!-- Arrow: DNS → client resolve -->
  <line x1="430" y1="295" x2="430" y2="260" stroke="#e0e0e0" stroke-width="1.5"/>
  <polygon points="427,260 430,252 433,260" fill="#e0e0e0"/>

  <!-- Arrow: client → us-east-1 app -->
  <line x1="360" y1="313" x2="220" y2="350" stroke="#4caf50" stroke-width="1.5"/>
  <polygon points="217,347 213,355 221,352" fill="#4caf50"/>

  <!-- us-east-1 app box -->
  <rect x="60" y="348" width="160" height="50" rx="6" fill="#0d2d0d" stroke="#4caf50" stroke-width="1.5"/>
  <text x="140" y="367" text-anchor="middle" fill="#4caf50" font-size="10" font-weight="700">us-east-1 (ACTIVE)</text>
  <text x="140" y="381" text-anchor="middle" fill="#8bc34a" font-size="8">ALB · ECS · Aurora primary</text>
  <text x="140" y="393" text-anchor="middle" fill="#8bc34a" font-size="8">serving 100% of traffic</text>

  <!-- us-west-2 app box -->
  <rect x="640" y="348" width="160" height="50" rx="6" fill="#1a0d0d" stroke="#e57373" stroke-width="1.5"/>
  <text x="720" y="367" text-anchor="middle" fill="#e57373" font-size="10" font-weight="700">us-west-2 (PASSIVE)</text>
  <text x="720" y="381" text-anchor="middle" fill="#ef9a9a" font-size="8">ALB · ECS · Aurora replica</text>
  <text x="720" y="393" text-anchor="middle" fill="#ef9a9a" font-size="8">standby · 0% traffic</text>

  <!-- Aurora replication arrow -->
  <line x1="220" y1="380" x2="640" y2="380" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="636,377 644,380 636,383" fill="#9e9e9e"/>
  <text x="430" y="376" text-anchor="middle" fill="#9e9e9e" font-size="8">Aurora Global DB replication</text>

  <!-- Legend -->
  <rect x="60" y="50" width="200" height="90" rx="6" fill="#0d1117" stroke="#444" stroke-width="1"/>
  <text x="160" y="68" text-anchor="middle" fill="#9e9e9e" font-size="10" font-weight="600">Legend</text>
  <rect x="75" y="76" width="28" height="12" rx="2" fill="#2d4a22" stroke="#4caf50" stroke-width="1"/>
  <text x="110" y="87" fill="#9e9e9e" font-size="9">Control ON / Healthy</text>
  <rect x="75" y="96" width="28" height="12" rx="2" fill="#3d2020" stroke="#e57373" stroke-width="1"/>
  <text x="110" y="107" fill="#9e9e9e" font-size="9">Control OFF / Unhealthy</text>
  <line x1="75" y1="122" x2="103" y2="122" stroke="#C4A484" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="110" y="126" fill="#9e9e9e" font-size="9">State propagation</text>

</svg>
