<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;font-family:system-ui,sans-serif;">
  <rect width="860" height="480" fill="#F8F7F5" rx="8"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" fill="#1D2322" font-size="15" font-weight="700">Account Factory for Terraform (AFT) — Pipeline Flow</text>

  <!-- ===================== Git Repos (left column) ===================== -->
  <rect x="30" y="60" width="170" height="52" rx="6" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="115" y="80" text-anchor="middle" fill="#1D2322" font-size="12" font-weight="600">account-request</text>
  <text x="115" y="97" text-anchor="middle" fill="#555" font-size="11">GitHub / GitLab / Bitbucket</text>

  <rect x="30" y="130" width="170" height="52" rx="6" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="115" y="150" text-anchor="middle" fill="#1D2322" font-size="12" font-weight="600">global-customizations</text>
  <text x="115" y="167" text-anchor="middle" fill="#555" font-size="11">Terraform / bash (all accts)</text>

  <rect x="30" y="200" width="170" height="52" rx="6" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="115" y="220" text-anchor="middle" fill="#1D2322" font-size="12" font-weight="600">account-customizations</text>
  <text x="115" y="237" text-anchor="middle" fill="#555" font-size="11">Per-profile (sandbox, prod…)</text>

  <rect x="30" y="270" width="170" height="52" rx="6" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="115" y="290" text-anchor="middle" fill="#1D2322" font-size="12" font-weight="600">acct-provisioning-custom.</text>
  <text x="115" y="307" text-anchor="middle" fill="#555" font-size="11">Lambda hooks (pre/post)</text>

  <!-- Label -->
  <text x="115" y="348" text-anchor="middle" fill="#4A90D9" font-size="11" font-weight="600">Git Repositories</text>

  <!-- ===================== AFT Mgmt Account (centre) ===================== -->
  <rect x="260" y="55" width="200" height="310" rx="8" fill="#FFF8F0" stroke="#C4A484" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" fill="#C4A484" font-size="12" font-weight="700">AFT Management Account</text>

  <!-- CodePipeline: provisioning -->
  <rect x="280" y="90" width="160" height="46" rx="5" fill="#C4A484" fill-opacity="0.18" stroke="#C4A484" stroke-width="1.2"/>
  <text x="360" y="110" text-anchor="middle" fill="#1D2322" font-size="11" font-weight="600">CodePipeline</text>
  <text x="360" y="126" text-anchor="middle" fill="#555" font-size="10.5">Account Provisioning</text>

  <!-- CodePipeline: global -->
  <rect x="280" y="160" width="160" height="46" rx="5" fill="#C4A484" fill-opacity="0.18" stroke="#C4A484" stroke-width="1.2"/>
  <text x="360" y="180" text-anchor="middle" fill="#1D2322" font-size="11" font-weight="600">CodePipeline</text>
  <text x="360" y="196" text-anchor="middle" fill="#555" font-size="10.5">Global Customizations</text>

  <!-- CodePipeline: account-specific -->
  <rect x="280" y="230" width="160" height="46" rx="5" fill="#C4A484" fill-opacity="0.18" stroke="#C4A484" stroke-width="1.2"/>
  <text x="360" y="250" text-anchor="middle" fill="#1D2322" font-size="11" font-weight="600">CodePipeline</text>
  <text x="360" y="266" text-anchor="middle" fill="#555" font-size="10.5">Account Customizations</text>

  <!-- Step Functions re-invoke note -->
  <rect x="280" y="300" width="160" height="40" rx="5" fill="#E8F5E9" stroke="#3D9970" stroke-width="1.2"/>
  <text x="360" y="318" text-anchor="middle" fill="#1D2322" font-size="10.5" font-weight="600">aft-invoke-customizations</text>
  <text x="360" y="333" text-anchor="middle" fill="#555" font-size="10">Step Functions (re-invoke)</text>

  <!-- arrows inside AFT box -->
  <line x1="360" y1="136" x2="360" y2="160" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  <line x1="360" y1="206" x2="360" y2="230" stroke="#C4A484" stroke-width="1.5" marker-end="url(#arr-gold)"/>

  <!-- ===================== Control Tower (right-top) ===================== -->
  <rect x="530" y="60" width="180" height="120" rx="8" fill="#F0F4FF" stroke="#8E6DBE" stroke-width="2"/>
  <text x="620" y="82" text-anchor="middle" fill="#8E6DBE" font-size="12" font-weight="700">Control Tower</text>
  <text x="620" y="100" text-anchor="middle" fill="#1D2322" font-size="11">Account Factory API</text>
  <text x="620" y="116" text-anchor="middle" fill="#555" font-size="10.5">provisions account in</text>
  <text x="620" y="132" text-anchor="middle" fill="#555" font-size="10.5">Org → new OU placement</text>
  <text x="620" y="152" text-anchor="middle" fill="#3D9970" font-size="10.5" font-weight="600">~30 min end-to-end</text>

  <!-- ===================== New Account (right-bottom) ===================== -->
  <rect x="530" y="220" width="180" height="145" rx="8" fill="#E8F5E9" stroke="#3D9970" stroke-width="2"/>
  <text x="620" y="242" text-anchor="middle" fill="#3D9970" font-size="12" font-weight="700">New AWS Account</text>
  <text x="620" y="262" text-anchor="middle" fill="#1D2322" font-size="10.5">✓ Break-glass IAM role</text>
  <text x="620" y="278" text-anchor="middle" fill="#1D2322" font-size="10.5">✓ Default VPC deleted</text>
  <text x="620" y="294" text-anchor="middle" fill="#1D2322" font-size="10.5">✓ GuardDuty enabled</text>
  <text x="620" y="310" text-anchor="middle" fill="#1D2322" font-size="10.5">✓ Mandatory tags applied</text>
  <text x="620" y="326" text-anchor="middle" fill="#1D2322" font-size="10.5">✓ Profile customizations</text>
  <text x="620" y="342" text-anchor="middle" fill="#1D2322" font-size="10.5">✓ SSO assignments</text>

  <!-- ===================== Arrows ===================== -->
  <!-- Repos → AFT provisioning pipeline (account-request only) -->
  <line x1="200" y1="86" x2="280" y2="113" stroke="#4A90D9" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <!-- global-custom repo → global pipeline -->
  <line x1="200" y1="156" x2="280" y2="183" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <!-- account-custom repo → account pipeline -->
  <line x1="200" y1="226" x2="280" y2="253" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <!-- provisioning-custom repo → provisioning pipeline -->
  <line x1="200" y1="296" x2="280" y2="130" stroke="#4A90D9" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr-blue)"/>

  <!-- AFT provisioning pipeline → Control Tower -->
  <line x1="440" y1="113" x2="530" y2="113" stroke="#8E6DBE" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Control Tower → New Account -->
  <line x1="620" y1="180" x2="620" y2="220" stroke="#3D9970" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Global+Account pipelines → New Account -->
  <line x1="440" y1="183" x2="530" y2="270" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="440" y1="253" x2="530" y2="305" stroke="#3D9970" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ===================== Legend ===================== -->
  <rect x="30" y="380" width="800" height="80" rx="6" fill="#F0F0EE" stroke="#CCC" stroke-width="1"/>
  <text x="50" y="400" fill="#1D2322" font-size="11" font-weight="700">Legend</text>
  <line x1="50" y1="418" x2="90" y2="418" stroke="#4A90D9" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="96" y="422" fill="#555" font-size="11">Solid — account-request merge triggers provisioning</text>
  <line x1="50" y1="440" x2="90" y2="440" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="96" y="444" fill="#555" font-size="11">Dashed — customization repos feed their respective pipelines</text>
  <line x1="420" y1="418" x2="460" y2="418" stroke="#8E6DBE" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="466" y="422" fill="#555" font-size="11">Purple — Control Tower Account Factory API call</text>
  <line x1="420" y1="440" x2="460" y2="440" stroke="#3D9970" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="466" y="444" fill="#555" font-size="11">Green — baseline applied to new account</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4A90D9"/>
    </marker>
    <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C4A484"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8E6DBE"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3D9970"/>
    </marker>
  </defs>
</svg>
