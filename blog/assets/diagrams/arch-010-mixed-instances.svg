<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" style="width:100%;max-width:860px;" role="img" aria-labelledby="t d">
  <title id="t">One Auto Scaling group serving both Graviton and x86 instances</title>
  <desc id="d">Two launch templates feed a single mixed instances policy containing two InstanceRequirements blocks. The resulting fleet is an On-Demand base plus Spot capacity drawn from both arm64 and x86 pools.</desc>

  <defs>
    <style>
      .lbl{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#fff}
      .sub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:rgba(255,255,255,.82)}
      .dark{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .darksub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .hdr{font:700 11px 'DM Sans',system-ui,sans-serif;fill:#7E8584;letter-spacing:.08em}
      .mono{font:400 10px 'Courier New',monospace;fill:rgba(255,255,255,.9)}
      .monod{font:400 10px 'Courier New',monospace;fill:#5c6360}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect width="860" height="500" fill="#ffffff"/>

  <!-- ── Launch templates ─────────────────────────────── -->
  <text x="24" y="34" class="hdr">LAUNCH TEMPLATES</text>

  <rect x="24" y="48" width="176" height="70" rx="8" fill="#4A90D9"/>
  <text x="38" y="72" class="lbl">arm64 launch template</text>
  <text x="38" y="90" class="sub">Graviton AMI</text>
  <text x="38" y="107" class="mono">ImageId: ami-…arm64</text>

  <rect x="24" y="136" width="176" height="70" rx="8" fill="#8E6DBE"/>
  <text x="38" y="160" class="lbl">x86_64 launch template</text>
  <text x="38" y="178" class="sub">Intel / AMD AMI</text>
  <text x="38" y="195" class="mono">ImageId: ami-…x86_64</text>

  <path d="M200,83 L246,83 L246,150 L262,150" stroke="#9aa0a6" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M200,171 L230,171 L230,214 L262,214" stroke="#9aa0a6" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- ── Mixed instances policy ───────────────────────── -->
  <text x="268" y="34" class="hdr">MIXED INSTANCES POLICY &#8212; ONE AUTO SCALING GROUP</text>

  <rect x="268" y="48" width="300" height="240" rx="10" fill="none" stroke="#C4A484" stroke-width="2"/>

  <rect x="284" y="66" width="268" height="14" rx="3" fill="#F4EFE6"/>
  <text x="292" y="77" class="monod">Overrides[ ]  &#8212; max 4 blocks</text>

  <rect x="284" y="92" width="268" height="82" rx="7" fill="#4A90D9"/>
  <text x="296" y="112" class="lbl">InstanceRequirements #1</text>
  <text x="296" y="131" class="mono">CpuManufacturers:</text>
  <text x="296" y="145" class="mono">  ["amazon-web-services"]</text>
  <text x="296" y="163" class="sub">&#8594; every current Graviton size</text>

  <rect x="284" y="186" width="268" height="82" rx="7" fill="#8E6DBE"/>
  <text x="296" y="206" class="lbl">InstanceRequirements #2</text>
  <text x="296" y="225" class="mono">CpuManufacturers:</text>
  <text x="296" y="239" class="mono">  ["intel", "amd"]</text>
  <text x="296" y="257" class="sub">&#8594; every matching x86 size</text>

  <!-- allocation bar -->
  <rect x="268" y="302" width="300" height="60" rx="8" fill="#C4A484"/>
  <text x="284" y="324" class="dark">SpotAllocationStrategy</text>
  <text x="284" y="342" class="dark" style="font-family:'Courier New',monospace;font-weight:400">price-capacity-optimized</text>
  <text x="284" y="356" class="darksub">cheapest pool that is also least likely to be interrupted</text>

  <path d="M568,168 L610,168 L610,120 L634,120" stroke="#9aa0a6" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M568,200 L610,200 L610,230 L634,230" stroke="#9aa0a6" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M568,332 L610,332 L610,330 L634,330" stroke="#9aa0a6" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- ── Resulting fleet ──────────────────────────────── -->
  <text x="640" y="34" class="hdr">RESULTING FLEET</text>

  <rect x="640" y="86" width="196" height="68" rx="8" fill="#4A90D9"/>
  <text x="654" y="110" class="lbl">Spot &#8212; Graviton</text>
  <text x="654" y="128" class="sub">arm64 pools, deepest discount</text>
  <text x="654" y="145" class="sub">stacks with Graviton pricing</text>

  <rect x="640" y="196" width="196" height="68" rx="8" fill="#8E6DBE"/>
  <text x="654" y="220" class="lbl">Spot &#8212; x86</text>
  <text x="654" y="238" class="sub">Intel / AMD pools</text>
  <text x="654" y="255" class="sub">widens total pool count</text>

  <rect x="640" y="296" width="196" height="68" rx="8" fill="#3D9970"/>
  <text x="654" y="320" class="lbl">On-Demand base</text>
  <text x="654" y="338" class="sub">OnDemandBaseCapacity</text>
  <text x="654" y="355" class="sub">survives total Spot loss</text>

  <!-- ── Capacity Rebalancing strip ───────────────────── -->
  <rect x="24" y="398" width="812" height="76" rx="10" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="44" y="422" class="dark">Capacity Rebalancing</text>
  <text x="44" y="441" class="darksub">Rebalance recommendation arrives before the two-minute interruption notice.</text>
  <text x="44" y="458" class="darksub">Auto Scaling launches the replacement first, waits for its health check, then terminates the at-risk instance.</text>

  <rect x="600" y="416" width="216" height="42" rx="6" fill="#fff" stroke="#D2D2CB"/>
  <text x="614" y="432" class="darksub">May exceed max size by up to</text>
  <text x="614" y="449" class="dark" style="font-size:11px">10% of desired capacity</text>
</svg>
