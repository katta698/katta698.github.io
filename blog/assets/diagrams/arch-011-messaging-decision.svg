<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" style="width:100%;max-width:860px;" role="img" aria-labelledby="t d">
  <title id="t">SQS, SNS and EventBridge do three different jobs</title>
  <desc id="d">SQS is a buffer holding work for competing consumers. SNS is a broadcast delivering one message to every subscriber. EventBridge is a router matching events against rules and sending them to selected targets.</desc>

  <defs>
    <style>
      .lbl{font:600 12.5px 'DM Sans',system-ui,sans-serif;fill:#fff}
      .sub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:rgba(255,255,255,.82)}
      .dark{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .darksub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .hdr{font:700 11px 'DM Sans',system-ui,sans-serif;fill:#7E8584;letter-spacing:.08em}
      .role{font:700 13px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .tiny{font:400 9.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .mono{font:400 10px 'Courier New',monospace;fill:#5c6360}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect width="860" height="520" fill="#F8F7F5"/>

  <!-- ─────────── SQS : buffer ─────────── -->
  <text x="24" y="30" class="hdr">AMAZON SQS</text>
  <text x="24" y="52" class="role">A buffer</text>
  <text x="24" y="70" class="tiny">Holds work until a consumer is ready</text>

  <rect x="24" y="84" width="248" height="176" rx="10" fill="none" stroke="#D2D2CB"/>

  <circle cx="60" cy="126" r="16" fill="#4A90D9"/>
  <text x="60" y="130" class="lbl" text-anchor="middle">P</text>

  <rect x="96" y="108" width="104" height="36" rx="5" fill="#4A90D9"/>
  <rect x="102" y="114" width="92" height="4" rx="2" fill="rgba(255,255,255,.55)"/>
  <rect x="102" y="122" width="92" height="4" rx="2" fill="rgba(255,255,255,.55)"/>
  <rect x="102" y="130" width="92" height="4" rx="2" fill="rgba(255,255,255,.55)"/>
  <text x="148" y="158" class="darksub" text-anchor="middle">queue</text>

  <path d="M78,126 L94,126" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M200,126 L222,126" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="242" cy="126" r="16" fill="#3D9970"/>
  <text x="242" y="130" class="lbl" text-anchor="middle">C</text>

  <text x="40" y="192" class="darksub">One message &#8594; exactly one consumer</text>
  <text x="40" y="210" class="darksub">Backpressure, retry, dead-letter queue</text>
  <text x="40" y="228" class="darksub">Standard: at-least-once, near-unlimited</text>
  <text x="40" y="246" class="darksub">FIFO: ordered, exactly-once processing</text>

  <!-- ─────────── SNS : broadcast ─────────── -->
  <text x="306" y="30" class="hdr">AMAZON SNS</text>
  <text x="306" y="52" class="role">A broadcast</text>
  <text x="306" y="70" class="tiny">Pushes the same message to everyone</text>

  <rect x="306" y="84" width="248" height="176" rx="10" fill="none" stroke="#D2D2CB"/>

  <circle cx="340" cy="126" r="16" fill="#4A90D9"/>
  <text x="340" y="130" class="lbl" text-anchor="middle">P</text>
  <path d="M358,126 L378,126" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="382" y="108" width="62" height="36" rx="5" fill="#8E6DBE"/>
  <text x="413" y="131" class="lbl" text-anchor="middle">topic</text>

  <path d="M444,120 L472,104" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M444,126 L472,126" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M444,132 L472,148" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="492" cy="100" r="13" fill="#3D9970"/>
  <circle cx="492" cy="126" r="13" fill="#3D9970"/>
  <circle cx="492" cy="152" r="13" fill="#3D9970"/>

  <text x="322" y="192" class="darksub">One message &#8594; every subscriber</text>
  <text x="322" y="210" class="darksub">SQS, Lambda, HTTPS, email, SMS, Firehose</text>
  <text x="322" y="228" class="darksub">Filter policies on attributes or JSON body</text>
  <text x="322" y="246" class="darksub">No storage &#8212; subscribe a queue to buffer</text>

  <!-- ─────────── EventBridge : router ─────────── -->
  <text x="588" y="30" class="hdr">AMAZON EVENTBRIDGE</text>
  <text x="588" y="52" class="role">A router</text>
  <text x="588" y="70" class="tiny">Matches events, sends only what fits</text>

  <rect x="588" y="84" width="248" height="176" rx="10" fill="none" stroke="#D2D2CB"/>

  <circle cx="616" cy="110" r="12" fill="#4A90D9"/>
  <circle cx="616" cy="142" r="12" fill="#4A90D9"/>
  <path d="M630,112 L652,120" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M630,140 L652,132" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="656" y="104" width="46" height="44" rx="5" fill="#C4A484"/>
  <text x="679" y="130" class="dark" text-anchor="middle">bus</text>

  <rect x="716" y="96" width="72" height="20" rx="3" fill="#F4EFE6" stroke="#D2D2CB"/>
  <text x="752" y="110" class="mono" text-anchor="middle">rule A</text>
  <rect x="716" y="122" width="72" height="20" rx="3" fill="#F4EFE6" stroke="#D2D2CB"/>
  <text x="752" y="136" class="mono" text-anchor="middle">rule B</text>
  <rect x="716" y="148" width="72" height="20" rx="3" fill="#F4EFE6" stroke="#D2D2CB"/>
  <text x="752" y="162" class="mono" text-anchor="middle">rule C</text>

  <path d="M702,120 L714,106" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M702,126 L714,132" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M702,134 L714,156" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#a)"/>

  <text x="604" y="192" class="darksub">Content-based routing on the event body</text>
  <text x="604" y="210" class="darksub">Many producers, many teams, one bus</text>
  <text x="604" y="228" class="darksub">Archive and replay; 90+ AWS sources</text>
  <text x="604" y="246" class="darksub">Hard ceiling: 5 targets per rule</text>

  <!-- ─────────── the question ─────────── -->
  <rect x="24" y="290" width="812" height="86" rx="10" fill="#1D2322"/>
  <text x="44" y="320" class="lbl">The question that picks the service is not "what is this message?"</text>
  <text x="44" y="344" class="sub">It is: does one consumer do the work (SQS), does everyone need to hear it (SNS),</text>
  <text x="44" y="362" class="sub">or does the routing decision depend on what is inside the event (EventBridge)?</text>

  <!-- ─────────── the numbers ─────────── -->
  <rect x="24" y="392" width="264" height="104" rx="10" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="44" y="416" class="dark">SQS FIFO throughput</text>
  <text x="44" y="437" class="darksub">3,000 msg/s per partition with batching,</text>
  <text x="44" y="454" class="darksub">300 without. Partitions follow the</text>
  <text x="44" y="471" class="darksub">message group ID &#8212; few groups,</text>
  <text x="44" y="488" class="darksub">little parallelism.</text>

  <rect x="298" y="392" width="264" height="104" rx="10" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="318" y="416" class="dark">EventBridge is regional</text>
  <text x="318" y="437" class="darksub">PutEvents: 10,000/s in us-east-1 and</text>
  <text x="318" y="454" class="darksub">eu-west-1, but 400/s in the smaller</text>
  <text x="318" y="471" class="darksub">Regions. A 25x difference that does</text>
  <text x="318" y="488" class="darksub">not appear in any architecture diagram.</text>

  <rect x="572" y="392" width="264" height="104" rx="10" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="592" y="416" class="dark">They compose</text>
  <text x="592" y="437" class="darksub">The common production shape is</text>
  <text x="592" y="454" class="darksub">EventBridge or SNS for distribution,</text>
  <text x="592" y="471" class="darksub">with an SQS queue in front of every</text>
  <text x="592" y="488" class="darksub">consumer that can fall behind.</text>
</svg>
