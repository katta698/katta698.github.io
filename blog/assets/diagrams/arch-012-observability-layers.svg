<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" style="width:100%;max-width:860px;" role="img" aria-labelledby="t d">
  <title id="t">Observability is three separate decisions, not one</title>
  <desc id="d">Collection, routing and storage are independent choices. Collection is the CloudWatch agent or an OpenTelemetry collector. Routing is subscription filters, OTLP exporters or cross-account links. Storage is the CloudWatch Logs Standard class, the Infrequent Access class, a third-party platform, or S3. Choosing Infrequent Access removes subscription filters, and the log class cannot be changed after a log group is created.</desc>

  <defs>
    <style>
      .lbl{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#fff}
      .sub{font:400 10px 'DM Sans',system-ui,sans-serif;fill:rgba(255,255,255,.82)}
      .dark{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .darksub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .hdr{font:700 10.5px 'DM Sans',system-ui,sans-serif;fill:#7E8584;letter-spacing:.09em}
      .step{font:700 22px 'DM Sans',system-ui,sans-serif;fill:#D2D2CB}
      .tiny{font:400 9.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .mono{font:400 9.5px 'Courier New',monospace;fill:rgba(255,255,255,.9)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect width="860" height="560" fill="#F8F7F5"/>

  <!-- ── 1. COLLECT ─────────────────────────────────── -->
  <text x="24" y="30" class="step">1</text>
  <text x="48" y="30" class="hdr">COLLECT &#8212; what runs on the workload</text>

  <rect x="24" y="44" width="386" height="92" rx="9" fill="#4A90D9"/>
  <text x="42" y="68" class="lbl">CloudWatch agent</text>
  <text x="42" y="86" class="sub">AWS-native. Least effort inside AWS.</text>
  <text x="42" y="104" class="sub">Emits straight to CloudWatch.</text>
  <text x="42" y="122" class="sub">Moving off it means reinstrumenting.</text>

  <rect x="426" y="44" width="410" height="92" rx="9" fill="#3D9970"/>
  <text x="444" y="68" class="lbl">ADOT &#8212; AWS Distro for OpenTelemetry</text>
  <text x="444" y="86" class="sub">CNCF OpenTelemetry, AWS-supported build.</text>
  <text x="444" y="104" class="sub">Traces, metrics and logs; auto-instrumentation.</text>
  <text x="444" y="122" class="sub">Exports to any OTLP backend &#8212; instrument once.</text>

  <path d="M217,140 L217,166" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M631,140 L631,166" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ── 2. ROUTE ───────────────────────────────────── -->
  <text x="24" y="196" class="step">2</text>
  <text x="48" y="196" class="hdr">ROUTE &#8212; how it reaches the people who need it</text>

  <rect x="24" y="210" width="258" height="84" rx="9" fill="#8E6DBE"/>
  <text x="42" y="234" class="lbl">Subscription filters</text>
  <text x="42" y="252" class="sub">CloudWatch Logs &#8594; Firehose,</text>
  <text x="42" y="270" class="sub">Lambda, or a third-party SIEM.</text>
  <text x="42" y="288" class="mono">Standard log class only</text>

  <rect x="296" y="210" width="258" height="84" rx="9" fill="#8E6DBE"/>
  <text x="314" y="234" class="lbl">OTLP exporters</text>
  <text x="314" y="252" class="sub">One collector, many destinations,</text>
  <text x="314" y="270" class="sub">chosen by config rather than by</text>
  <text x="314" y="288" class="sub">re-instrumenting the workload.</text>

  <rect x="568" y="210" width="268" height="84" rx="9" fill="#C4A484"/>
  <text x="586" y="234" class="dark">Cross-account links</text>
  <text x="586" y="252" class="darksub">One monitoring account, up to</text>
  <text x="586" y="270" class="darksub">100,000 source accounts. Logs and</text>
  <text x="586" y="288" class="darksub">metrics shared at no extra charge.</text>

  <path d="M153,298 L153,324" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M425,298 L425,324" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M702,298 L702,324" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ── 3. STORE ───────────────────────────────────── -->
  <text x="24" y="354" class="step">3</text>
  <text x="48" y="354" class="hdr">STORE &#8212; what you actually pay for</text>

  <rect x="24" y="368" width="196" height="88" rx="9" fill="#1D2322"/>
  <text x="40" y="392" class="lbl">Logs &#8212; Standard</text>
  <text x="40" y="410" class="sub">Every feature. Live Tail,</text>
  <text x="40" y="428" class="sub">metric filters, subscription</text>
  <text x="40" y="446" class="sub">filters, field indexing.</text>

  <rect x="232" y="368" width="196" height="88" rx="9" fill="#5c6360"/>
  <text x="248" y="392" class="lbl">Logs &#8212; Infrequent Access</text>
  <text x="248" y="410" class="sub">Cheaper ingestion only;</text>
  <text x="248" y="428" class="sub">storage and Insights cost</text>
  <text x="248" y="446" class="sub">the same. Fewer features.</text>

  <rect x="440" y="368" width="196" height="88" rx="9" fill="#1D2322"/>
  <text x="456" y="392" class="lbl">Datadog / Splunk</text>
  <text x="456" y="410" class="sub">Correlation with the rest</text>
  <text x="456" y="428" class="sub">of the estate &#8212; and a</text>
  <text x="456" y="446" class="sub">second ingestion bill.</text>

  <rect x="648" y="368" width="188" height="88" rx="9" fill="#1D2322"/>
  <text x="664" y="392" class="lbl">S3</text>
  <text x="664" y="410" class="sub">Cheapest per GB.</text>
  <text x="664" y="428" class="sub">Retention and forensics,</text>
  <text x="664" y="446" class="sub">not live troubleshooting.</text>

  <!-- ── the trap ───────────────────────────────────── -->
  <rect x="24" y="478" width="812" height="62" rx="9" fill="#FBF3E8" stroke="#C4A484"/>
  <text x="44" y="502" class="dark">The trap that connects layer 3 back to layer 2</text>
  <text x="44" y="522" class="darksub">Infrequent Access has no subscription filters &#8212; so the cheaper log class silently removes the mechanism that forwards logs to Datadog or Splunk.</text>
  <text x="44" y="536" class="darksub">And a log group's class cannot be changed after it is created: fixing the mistake means creating new log groups and repointing every producer.</text>
</svg>
