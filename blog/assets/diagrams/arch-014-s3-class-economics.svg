<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" style="width:100%;max-width:860px;" role="img" aria-labelledby="t d">
  <title id="t">What S3 actually bills for, and why small objects break the maths</title>
  <desc id="d">A comparison of S3 storage classes by minimum storage duration and minimum billable object size, followed by a worked example showing that a 20 kilobyte object is billed as 128 kilobytes in the infrequent access and Glacier Instant Retrieval classes, and carries 40 kilobytes of metadata in Glacier Flexible Retrieval and Deep Archive.</desc>

  <defs>
    <style>
      .lbl{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#fff}
      .sub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:rgba(255,255,255,.82)}
      .dark{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .darksub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .hdr{font:700 10.5px 'DM Sans',system-ui,sans-serif;fill:#7E8584;letter-spacing:.09em}
      .cell{font:400 11px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .cellm{font:400 10.5px 'Courier New',monospace;fill:#5c6360}
      .warn{font:600 10.5px 'DM Sans',system-ui,sans-serif;fill:#B4574B}
      .ok{font:600 10.5px 'DM Sans',system-ui,sans-serif;fill:#3D9970}
    </style>
  </defs>

  <rect width="860" height="640" fill="#F8F7F5"/>

  <text x="24" y="28" class="hdr">THE TWO NUMBERS THAT DECIDE THE BILL</text>

  <!-- table header -->
  <rect x="24" y="42" width="812" height="30" rx="5" fill="#1D2322"/>
  <text x="38"  y="62" class="sub">Storage class</text>
  <text x="300" y="62" class="sub">Min storage duration</text>
  <text x="470" y="62" class="sub">Min billable object size</text>
  <text x="660" y="62" class="sub">Retrieval</text>

  <!-- rows -->
  <rect x="24" y="76" width="812" height="30" fill="#F7F5F1"/>
  <text x="38"  y="96" class="cell">S3 Standard</text>
  <text x="300" y="96" class="cellm">none</text>
  <text x="470" y="96" class="cellm">none</text>
  <text x="660" y="96" class="ok">no fee</text>

  <rect x="24" y="108" width="812" height="30" fill="#F8F7F5"/>
  <text x="38"  y="128" class="cell">S3 Intelligent-Tiering</text>
  <text x="300" y="128" class="cellm">none</text>
  <text x="470" y="128" class="cellm">none &#8212; but &lt;128 KB never tiers</text>
  <text x="660" y="128" class="ok">no fee &#8212; monitoring instead</text>

  <rect x="24" y="140" width="812" height="30" fill="#F7F5F1"/>
  <text x="38"  y="160" class="cell">S3 Standard-IA</text>
  <text x="300" y="160" class="cellm">30 days</text>
  <text x="470" y="160" class="warn">128 KB</text>
  <text x="660" y="160" class="cellm">per-GB fee</text>

  <rect x="24" y="172" width="812" height="30" fill="#F8F7F5"/>
  <text x="38"  y="192" class="cell">S3 One Zone-IA</text>
  <text x="300" y="192" class="cellm">30 days</text>
  <text x="470" y="192" class="warn">128 KB</text>
  <text x="660" y="192" class="cellm">per-GB fee &#183; single AZ</text>

  <rect x="24" y="204" width="812" height="30" fill="#F7F5F1"/>
  <text x="38"  y="224" class="cell">S3 Glacier Instant Retrieval</text>
  <text x="300" y="224" class="warn">90 days</text>
  <text x="470" y="224" class="warn">128 KB</text>
  <text x="660" y="224" class="cellm">per-GB fee &#183; milliseconds</text>

  <rect x="24" y="236" width="812" height="30" fill="#F8F7F5"/>
  <text x="38"  y="256" class="cell">S3 Glacier Flexible Retrieval</text>
  <text x="300" y="256" class="warn">90 days</text>
  <text x="470" y="256" class="warn">+40 KB metadata per object</text>
  <text x="660" y="256" class="cellm">restore first &#183; mins to hours</text>

  <rect x="24" y="268" width="812" height="30" fill="#F7F5F1"/>
  <text x="38"  y="288" class="cell">S3 Glacier Deep Archive</text>
  <text x="300" y="288" class="warn">180 days</text>
  <text x="470" y="288" class="warn">+40 KB metadata per object</text>
  <text x="660" y="288" class="cellm">restore first &#183; hours</text>

  <!-- worked example -->
  <text x="24" y="336" class="hdr">A 20 KB OBJECT, BILLED</text>

  <rect x="24" y="350" width="248" height="96" rx="9" fill="#3D9970"/>
  <text x="42" y="376" class="lbl">S3 Standard</text>
  <text x="42" y="398" class="sub">Billed for 20 KB.</text>
  <text x="42" y="416" class="sub">No minimum duration.</text>
  <text x="42" y="434" class="sub">Delete whenever you like.</text>

  <rect x="306" y="350" width="248" height="96" rx="9" fill="#C4A484"/>
  <text x="324" y="376" class="dark">Standard-IA</text>
  <text x="324" y="398" class="darksub">Billed for 128 KB &#8212; 6.4&#215; the</text>
  <text x="324" y="416" class="darksub">object. Plus 30 days minimum,</text>
  <text x="324" y="434" class="darksub">plus a retrieval fee to read it.</text>

  <rect x="588" y="350" width="248" height="96" rx="9" fill="#8E6DBE"/>
  <text x="606" y="376" class="lbl">Deep Archive</text>
  <text x="606" y="398" class="sub">20 KB + 40 KB metadata,</text>
  <text x="606" y="416" class="sub">180-day minimum, and hours</text>
  <text x="606" y="434" class="sub">to get it back.</text>

  <!-- the trap -->
  <rect x="24" y="466" width="812" height="72" rx="9" fill="#FBF3E8" stroke="#C4A484"/>
  <text x="44" y="490" class="dark">Transitioning counts as deleting</text>
  <text x="44" y="510" class="darksub">Moving an object to another class before its minimum duration expires is charged the same as deleting it early &#8212; so a</text>
  <text x="44" y="526" class="darksub">lifecycle rule that hops Standard &#8594; IA &#8594; Glacier in under 30 days pays the IA minimum in full, for storage it never used.</text>

  <rect x="24" y="550" width="812" height="72" rx="9" fill="#1D2322"/>
  <text x="44" y="574" class="lbl">The deciding factor is object count, not total bytes</text>
  <text x="44" y="594" class="sub">Every mechanism above is priced per object. A petabyte in large files archives beautifully; the same petabyte in 20 KB files</text>
  <text x="44" y="610" class="sub">can cost more after &#8220;optimisation&#8221; than before it.</text>
</svg>
