<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" style="width:100%;max-width:860px;" role="img" aria-labelledby="t d">
  <title id="t">Where configuration belongs, and what each tier costs</title>
  <desc id="d">A comparison of three places to store configuration and secrets. Parameter Store standard parameters are free, limited to ten thousand parameters of four kilobytes each. Advanced parameters cost five cents per parameter per month, allow one hundred thousand parameters of eight kilobytes, and add policies and cross-account sharing, but cannot be converted back to standard. Secrets Manager costs forty cents per secret per month and adds managed rotation. A decision path shows rotation as the question that settles the choice.</desc>

  <defs>
    <style>
      .lbl{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#fff}
      .sub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:rgba(255,255,255,.82)}
      .dark{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .darksub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .hdr{font:700 10.5px 'DM Sans',system-ui,sans-serif;fill:#7E8584;letter-spacing:.09em}
      .mono{font:400 10px 'Courier New',monospace;fill:#5c6360}
      .monow{font:400 10px 'Courier New',monospace;fill:rgba(255,255,255,.9)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect width="860" height="610" fill="#ffffff"/>

  <text x="24" y="28" class="hdr">THREE PLACES TO PUT A STRING, AND WHAT THEY COST</text>

  <!-- Standard -->
  <rect x="24" y="42" width="262" height="176" rx="9" fill="#3D9970"/>
  <text x="44" y="68" class="lbl">Parameter Store &#183; Standard</text>
  <text x="44" y="92" class="monow">no additional charge</text>
  <text x="44" y="116" class="sub">10,000 parameters per account</text>
  <text x="44" y="132" class="sub">per Region</text>
  <text x="44" y="152" class="sub">4 KB maximum value</text>
  <text x="44" y="172" class="sub">No policies. No cross-account</text>
  <text x="44" y="188" class="sub">sharing. No rotation.</text>
  <text x="44" y="208" class="sub">Upgradeable to Advanced.</text>

  <!-- Advanced -->
  <rect x="299" y="42" width="262" height="176" rx="9" fill="#C4A484"/>
  <text x="319" y="68" class="dark">Parameter Store &#183; Advanced</text>
  <text x="319" y="92" class="mono">$0.05 / parameter / month</text>
  <text x="319" y="116" class="darksub">100,000 parameters</text>
  <text x="319" y="136" class="darksub">8 KB maximum value</text>
  <text x="319" y="156" class="darksub">Parameter policies supported</text>
  <text x="319" y="176" class="darksub">Shareable across accounts</text>
  <text x="319" y="200" class="darksub">Cannot be changed back.</text>

  <!-- Secrets Manager -->
  <rect x="574" y="42" width="262" height="176" rx="9" fill="#4A90D9"/>
  <text x="594" y="68" class="lbl">Secrets Manager</text>
  <text x="594" y="92" class="monow">$0.40 / secret / month</text>
  <text x="594" y="116" class="sub">Managed rotation, built in</text>
  <text x="594" y="136" class="sub">Cross-Region replication</text>
  <text x="594" y="156" class="sub">Resource policies</text>
  <text x="594" y="180" class="sub">8&#215; the price of an advanced</text>
  <text x="594" y="196" class="sub">parameter. Rotation is what</text>
  <text x="594" y="212" class="sub">you are buying.</text>

  <text x="24" y="256" class="hdr">THE QUESTION THAT ACTUALLY SETTLES IT</text>

  <rect x="24" y="270" width="812" height="40" rx="8" fill="#F4EFE6" stroke="#D2D2CB"/>
  <text x="44" y="295" class="dark">Does this value need to be rotated on a schedule, without a deployment?</text>
  <path d="M240,312 L240,336" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M620,312 L620,336" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="252" y="330" class="darksub">no</text>
  <text x="632" y="330" class="darksub">yes</text>

  <rect x="24" y="340" width="400" height="76" rx="8" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="44" y="364" class="dark">Parameter Store</text>
  <text x="44" y="384" class="darksub">Start standard. Move the individual parameter to</text>
  <text x="44" y="400" class="darksub">advanced only when it exceeds 4 KB or needs a policy.</text>

  <rect x="436" y="340" width="400" height="76" rx="8" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="456" y="364" class="dark">Secrets Manager</text>
  <text x="456" y="384" class="darksub">Database credentials, API keys with an expiry, anything</text>
  <text x="456" y="400" class="darksub">an auditor expects to see rotating on a schedule.</text>

  <!-- one-way door -->
  <rect x="24" y="432" width="812" height="56" rx="9" fill="#FBF3E8" stroke="#C4A484"/>
  <text x="44" y="456" class="dark">Advanced is a one-way door</text>
  <text x="44" y="474" class="darksub">AWS states you cannot change an advanced parameter back to standard: it would truncate the value from 8 KB to 4 KB, drop attached policies, and the two tiers use a different form of encryption. To undo it you delete the</text>
  <text x="44" y="490" class="darksub">parameter and recreate it &#8212; which means changing whatever reads it.</text>

  <!-- intelligent tiering -->
  <rect x="24" y="500" width="812" height="52" rx="9" fill="#B4574B"/>
  <text x="44" y="524" class="lbl">The default tier setting can walk you through that door on its own</text>
  <text x="44" y="542" class="sub">The account-and-Region default tier can be set to Intelligent-Tiering. New parameters created without an explicit tier are then upgraded to Advanced when they need it &#8212; which starts the charge, and is not reversible per parameter.</text>

  <rect x="24" y="564" width="812" height="34" rx="8" fill="#1D2322"/>
  <text x="44" y="586" class="sub">Tiers are not throughput. Tiers govern size, count and policies; throughput governs request rate, and is billed separately once you raise it.</text>
</svg>
