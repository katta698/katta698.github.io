<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" style="width:100%;max-width:860px;" role="img" aria-labelledby="t d">
  <title id="t">Three execution guarantees, and the choice that cannot be undone</title>
  <desc id="d">Step Functions offers three execution models. Standard workflows are exactly-once, run up to one year, and are billed per state transition. Asynchronous Express workflows are at-least-once and may run more than once. Synchronous Express workflows are at-most-once and do not restart if an exception occurs. Both Express types run for at most five minutes, do not persist state between transitions, and are billed by executions, duration and memory. The workflow type cannot be changed after the state machine is created.</desc>

  <defs>
    <style>
      .lbl{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#fff}
      .sub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:rgba(255,255,255,.82)}
      .dark{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .darksub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .hdr{font:700 10.5px 'DM Sans',system-ui,sans-serif;fill:#7E8584;letter-spacing:.09em}
      .mono{font:400 10px 'Courier New',monospace;fill:#5c6360}
      .monow{font:400 10px 'Courier New',monospace;fill:rgba(255,255,255,.9)}
    </style>
  </defs>

  <rect width="860" height="620" fill="#ffffff"/>

  <text x="24" y="28" class="hdr">THE GUARANTEE IS THE DECISION</text>

  <!-- Standard -->
  <rect x="24" y="42" width="262" height="212" rx="9" fill="#3D9970"/>
  <text x="44" y="68" class="lbl">Standard</text>
  <text x="44" y="90" class="monow">exactly-once</text>
  <text x="44" y="116" class="sub">Runs up to one year.</text>
  <text x="44" y="136" class="sub">State persists between</text>
  <text x="44" y="152" class="sub">transitions.</text>
  <text x="44" y="176" class="sub">Same execution name returns</text>
  <text x="44" y="192" class="sub">an idempotent response.</text>
  <text x="44" y="216" class="sub">History via API for 90 days.</text>
  <text x="44" y="240" class="monow">$0.000025 per state transition</text>

  <!-- Async Express -->
  <rect x="299" y="42" width="262" height="212" rx="9" fill="#C4A484"/>
  <text x="319" y="68" class="dark">Express &#183; Asynchronous</text>
  <text x="319" y="90" class="mono">at-least-once</text>
  <text x="319" y="116" class="darksub">Five minutes, maximum.</text>
  <text x="319" y="136" class="darksub">State does not persist</text>
  <text x="319" y="152" class="darksub">between transitions.</text>
  <text x="319" y="176" class="darksub">Idempotency is not managed.</text>
  <text x="319" y="192" class="darksub">It may run more than once.</text>
  <text x="319" y="216" class="darksub">No history unless you enable</text>
  <text x="319" y="232" class="darksub">CloudWatch Logs.</text>

  <!-- Sync Express -->
  <rect x="574" y="42" width="262" height="212" rx="9" fill="#B4574B"/>
  <text x="594" y="68" class="lbl">Express &#183; Synchronous</text>
  <text x="594" y="90" class="monow">at-most-once</text>
  <text x="594" y="116" class="sub">Five minutes, maximum.</text>
  <text x="594" y="136" class="sub">Returns the result to the</text>
  <text x="594" y="152" class="sub">caller when it completes.</text>
  <text x="594" y="176" class="sub">Does not restart if an</text>
  <text x="594" y="192" class="sub">exception occurs &#8212; so it can</text>
  <text x="594" y="208" class="sub">end up not running at all.</text>
  <text x="594" y="240" class="monow">$1.00 / million + duration</text>

  <!-- immutable -->
  <rect x="24" y="272" width="812" height="52" rx="9" fill="#1D2322"/>
  <text x="44" y="296" class="lbl">The type is fixed at creation</text>
  <text x="44" y="314" class="sub">AWS states the workflow type cannot be updated after you create a state machine. Changing your mind means a new state machine, a new ARN, and changing everything that starts it.</text>

  <text x="24" y="360" class="hdr">WHAT EXPRESS GIVES UP</text>

  <rect x="24" y="374" width="400" height="88" rx="8" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="44" y="398" class="dark">Integration patterns</text>
  <text x="44" y="418" class="darksub">No Job-run (.sync) &#8212; cannot wait for an EMR job</text>
  <text x="44" y="434" class="darksub">or Glue crawler to finish.</text>
  <text x="44" y="452" class="darksub">No Callback (.waitForTaskToken) &#8212; no human step.</text>

  <rect x="436" y="374" width="400" height="88" rx="8" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="456" y="398" class="dark">States</text>
  <text x="456" y="418" class="darksub">No Distributed Map &#8212; the state built for</text>
  <text x="456" y="434" class="darksub">large-scale parallel processing.</text>
  <text x="456" y="452" class="darksub">No Activities &#8212; no external worker polling.</text>

  <text x="24" y="498" class="hdr">WHY THE COST GAP IS SO LARGE</text>

  <rect x="24" y="512" width="812" height="86" rx="9" fill="#FBF3E8" stroke="#C4A484"/>
  <text x="44" y="536" class="dark">One million runs of a ten-state workflow</text>
  <text x="44" y="558" class="darksub">Standard bills every transition: 10,000,000 &#215; $0.000025 = <tspan class="dark">$250</tspan></text>
  <text x="44" y="576" class="darksub">Express bills the run, not the steps: $1.00 per million, plus a fraction of a GB-hour at 100 ms and 64 MB &#8212; under <tspan class="dark">$1.20</tspan></text>
  <text x="44" y="592" class="darksub">Standard is not overpriced. You are buying durability and exactly-once semantics, and at high volume with many states, that is what they cost.</text>
</svg>
