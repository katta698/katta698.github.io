<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 690" style="width:100%;max-width:860px;" role="img" aria-labelledby="t d">
  <title id="t">The seven migration strategies, and the question that comes before choosing one</title>
  <desc id="d">Six of the seven strategies move an application to AWS and one removes it. AWS defines zombie applications as averaging under five percent CPU and memory and idle applications as five to twenty percent over ninety days, both of which are retirement candidates. A candidate becomes a decision only after observed dependency data and a controlled stop that simulates the shutdown. Application Discovery Service closed to new customers on 7 November 2025 and AWS Transform provides the equivalent capability.</desc>

  <defs>
    <style>
      .lbl{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#fff}
      .sub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:rgba(255,255,255,.82)}
      .dark{font:600 12px 'DM Sans',system-ui,sans-serif;fill:#1D2322}
      .darksub{font:400 10.5px 'DM Sans',system-ui,sans-serif;fill:#5c6360}
      .hdr{font:700 10.5px 'DM Sans',system-ui,sans-serif;fill:#7E8584;letter-spacing:.09em}
      .mono{font:400 10px 'Courier New',monospace;fill:#5c6360}
      .monow{font:400 10px 'Courier New',monospace;fill:rgba(255,255,255,.9)}
    </style>
  </defs>

  <rect width="860" height="690" fill="#ffffff"/>

  <text x="24" y="28" class="hdr">SEVEN STRATEGIES &#8212; SIX MOVE THE APPLICATION, ONE REMOVES IT</text>

  <rect x="24" y="42" width="116" height="72" rx="7" fill="#B4574B"/>
  <text x="40" y="68" class="lbl">Retire</text>
  <text x="40" y="86" class="sub">removes every</text>
  <text x="40" y="100" class="sub">downstream cost</text>

  <rect x="150" y="42" width="104" height="72" rx="7" fill="#3E4A5C"/>
  <text x="166" y="68" class="lbl">Retain</text>
  <text x="166" y="86" class="sub">deliberately</text>
  <text x="166" y="100" class="sub">not moving</text>

  <rect x="264" y="42" width="104" height="72" rx="7" fill="#8B5A3C"/>
  <text x="280" y="68" class="lbl">Rehost</text>
  <text x="280" y="86" class="sub">lift and shift</text>

  <rect x="378" y="42" width="104" height="72" rx="7" fill="#8B5A3C"/>
  <text x="394" y="68" class="lbl">Relocate</text>
  <text x="394" y="86" class="sub">move the</text>
  <text x="394" y="100" class="sub">platform</text>

  <rect x="492" y="42" width="104" height="72" rx="7" fill="#8B5A3C"/>
  <text x="508" y="68" class="lbl">Replatform</text>
  <text x="508" y="86" class="sub">lift, tinker</text>
  <text x="508" y="100" class="sub">and shift</text>

  <rect x="606" y="42" width="104" height="72" rx="7" fill="#8B5A3C"/>
  <text x="622" y="68" class="lbl">Repurchase</text>
  <text x="622" y="86" class="sub">drop and shop</text>

  <rect x="720" y="42" width="116" height="72" rx="7" fill="#2E3635" stroke="#7E8584" stroke-dasharray="3 3"/>
  <text x="736" y="68" class="lbl">Refactor</text>
  <text x="736" y="86" class="sub">AWS: not during</text>
  <text x="736" y="100" class="sub">a large migration</text>

  <text x="24" y="140" class="darksub">AWS recommends rehost, replatform, relocate and retire for large migrations, and modernising after the move rather than during it.</text>

  <text x="24" y="180" class="hdr">THE QUESTION THAT COMES FIRST</text>

  <rect x="24" y="194" width="812" height="96" rx="9" fill="#F7F5F1" stroke="#D2D2CB"/>
  <text x="44" y="220" class="dark">Does this application need to exist at all? Answered from utilisation data, before any target is chosen.</text>
  <text x="44" y="244" class="mono">zombie    average CPU and memory below 5%</text>
  <text x="44" y="260" class="mono">idle      average CPU and memory 5% to 20%, measured over 90 days</text>
  <text x="44" y="278" class="darksub">Plus a second free signal: no inbound connection to the application in the last 90 days.</text>

  <text x="24" y="326" class="hdr">CANDIDATE IS NOT A DECISION &#8212; THREE CHECKS, EACH REVERSIBLE</text>

  <rect x="24" y="340" width="258" height="118" rx="9" fill="#3E4A5C"/>
  <text x="44" y="366" class="lbl">1 &#183; Observed dependencies</text>
  <text x="44" y="388" class="sub">Inbound and outbound connections</text>
  <text x="44" y="404" class="sub">on the server, not the diagram.</text>
  <text x="44" y="426" class="monow">diagrams are &#8220;outdated or</text>
  <text x="44" y="440" class="monow">incomplete&#8221; &#8212; AWS</text>

  <rect x="292" y="340" width="258" height="118" rx="9" fill="#3E4A5C"/>
  <text x="312" y="366" class="lbl">2 &#183; Controlled stop</text>
  <text x="312" y="388" class="sub">Block traffic, pause the VM or stop</text>
  <text x="312" y="404" class="sub">the service. Simulates retirement.</text>
  <text x="312" y="426" class="monow">a week proves nothing about</text>
  <text x="312" y="440" class="monow">a monthly batch job</text>

  <rect x="560" y="340" width="276" height="118" rx="9" fill="#3E4A5C"/>
  <text x="580" y="366" class="lbl">3 &#183; Reassess, or park it</text>
  <text x="580" y="388" class="sub">Inconclusive and the lease expires:</text>
  <text x="580" y="404" class="sub">rehost, snapshot EBS, terminate.</text>
  <text x="580" y="426" class="monow">recoverable while the snapshot</text>
  <text x="580" y="440" class="monow">is kept &#8212; test the restore first</text>

  <text x="24" y="494" class="hdr">TWO THINGS THAT DATE A MIGRATION PLAN WRITTEN THIS YEAR</text>

  <rect x="24" y="508" width="812" height="70" rx="9" fill="#1D2322"/>
  <text x="44" y="532" class="lbl">Application Discovery Service closed to new customers on 7 November 2025</text>
  <text x="44" y="552" class="sub">Existing projects continue. New ones start on AWS Transform, which carries the same discovery and assessment</text>
  <text x="44" y="568" class="sub">capability &#8212; agent-based and agentless collectors, dependency mapping, wave planning.</text>

  <rect x="24" y="590" width="812" height="70" rx="8" fill="#FBF3E8" stroke="#C4A484"/>
  <text x="44" y="614" class="dark">Twenty to fifty percent of an enterprise portfolio is repeated patterns</text>
  <text x="44" y="634" class="darksub">So the work is not 340 individual decisions: a retirement pass over the whole estate, a handful of patterns covering a</text>
  <text x="44" y="650" class="darksub">third of the remainder, and genuine case-by-case attention for what is left.</text>
</svg>
