<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="What closed and what did not when AWS Application Discovery Service stopped accepting new customers, the capability gap between agentless and agent-based collection that still governs the choice, and the Migration Hub home Region decision that binds all discovery data">
  <title>AWS Application Discovery Service closed to new customers on 7 November 2025. AWS Migration Hub did not close, and AWS Transform is where new discovery projects start. The decision that mattered in Application Discovery Service still matters in any successor: agentless collection reaches every virtual machine in a vCenter without touching them but cannot see inside them, so it returns no running processes and no time-series data, while an agent installed per server returns processes, per-second detail and exportable connection data. Separately, the Migration Hub home Region is where all discovery data is stored, must be chosen before any collection begins, and is the only Region in which agents, collectors and imports work.</title>
  <rect width="1000" height="760" fill="#F8F7F5"/>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">What closed, and what did not</text>

    <rect x="40" y="52" width="296" height="120" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="188" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Application Discovery Service</text>
    <text x="188" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Closed to new customers</text>
    <text x="188" y="124" text-anchor="middle" font-size="12" fill="#3d3d3d">7 November 2025</text>
    <text x="188" y="148" text-anchor="middle" font-size="12" fill="#6c757d">Existing projects continue,</text>
    <text x="188" y="164" text-anchor="middle" font-size="12" fill="#6c757d">no new features</text>

    <rect x="352" y="52" width="296" height="120" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">AWS Migration Hub</text>
    <text x="500" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Not affected</text>
    <text x="500" y="124" text-anchor="middle" font-size="12" fill="#3d3d3d">Still the console, still the</text>
    <text x="500" y="144" text-anchor="middle" font-size="12" fill="#3d3d3d">home Region, still where</text>
    <text x="500" y="164" text-anchor="middle" font-size="12" fill="#3d3d3d">migration status aggregates</text>

    <rect x="664" y="52" width="296" height="120" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="812" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">AWS Transform</text>
    <text x="812" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Where new projects start</text>
    <text x="812" y="124" text-anchor="middle" font-size="12" fill="#3d3d3d">Agent-based and agentless</text>
    <text x="812" y="144" text-anchor="middle" font-size="12" fill="#3d3d3d">collection, dependency</text>
    <text x="812" y="164" text-anchor="middle" font-size="12" fill="#3d3d3d">mapping, wave planning</text>

    <text x="500" y="196" text-anchor="middle" font-size="12" fill="#3d3d3d">No data migration is required between them, and existing discovery projects run to completion.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="220" width="920" height="284" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">The decision that outlived the service: what you can see without touching the server</text>

    <text x="300" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Agentless, per vCenter</text>
    <text x="700" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Agent, per server</text>
    <line x1="500" y1="262" x2="500" y2="488" stroke="#e5e5e5" stroke-width="1"/>

    <text x="72" y="312" font-size="12" fill="#1d8102">Deployed once as an appliance</text>
    <text x="544" y="312" font-size="12" fill="#cc0c39">Installed on every machine</text>

    <text x="72" y="338" font-size="12" fill="#1d8102">Reaches every VM in the vCenter</text>
    <text x="544" y="338" font-size="12" fill="#cc0c39">Physical servers too, one by one</text>

    <text x="72" y="364" font-size="12" fill="#3d3d3d">Static configuration and utilisation</text>
    <text x="544" y="364" font-size="12" fill="#3d3d3d">Static configuration and utilisation</text>

    <text x="72" y="390" font-size="12" fill="#3d3d3d">TCP network connections</text>
    <text x="544" y="390" font-size="12" fill="#3d3d3d">TCP network connections</text>

    <text x="72" y="416" font-size="12" font-weight="700" fill="#cc0c39">No running processes</text>
    <text x="544" y="416" font-size="12" font-weight="700" fill="#1d8102">Running processes</text>

    <text x="72" y="442" font-size="12" font-weight="700" fill="#cc0c39">No time-series export</text>
    <text x="544" y="442" font-size="12" font-weight="700" fill="#1d8102">Time-series export, and to Athena</text>

    <text x="72" y="468" font-size="12" fill="#6c757d">Collection interval about 60 minutes</text>
    <text x="544" y="468" font-size="12" fill="#6c757d">Collection interval about 15 seconds</text>

    <text x="500" y="494" text-anchor="middle" font-size="12" font-style="italic" fill="#3d3d3d">An appliance cannot look inside a VM. That single fact decides everything above it.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="528" width="920" height="212" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The one-time decision nobody treats as one: the Migration Hub home Region</text>

    <rect x="72" y="576" width="272" height="128" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="208" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">It holds everything</text>
    <text x="96" y="624" font-size="12" fill="#3d3d3d">The home Region is the only</text>
    <text x="96" y="642" font-size="12" fill="#3d3d3d">Region where discovery and</text>
    <text x="96" y="660" font-size="12" fill="#3d3d3d">planning data is stored.</text>
    <text x="96" y="686" font-size="12" font-weight="700" fill="#0f1111">Not a console preference.</text>

    <rect x="364" y="576" width="272" height="128" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">It gates the tooling</text>
    <text x="388" y="624" font-size="12" fill="#3d3d3d">Agents, collectors and</text>
    <text x="388" y="642" font-size="12" fill="#3d3d3d">imports work in the home</text>
    <text x="388" y="660" font-size="12" fill="#3d3d3d">Region only.</text>
    <text x="388" y="686" font-size="12" font-weight="700" fill="#cc0c39">Wrong Region, no data.</text>

    <rect x="656" y="576" width="272" height="128" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="792" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">It comes first</text>
    <text x="680" y="624" font-size="12" fill="#3d3d3d">It must be set before any</text>
    <text x="680" y="642" font-size="12" fill="#3d3d3d">discovery begins, because</text>
    <text x="680" y="660" font-size="12" fill="#3d3d3d">that is where data lands.</text>
    <text x="680" y="686" font-size="12" font-weight="700" fill="#1d8102">Decide it with the sponsor.</text>
  </g>
</svg>
