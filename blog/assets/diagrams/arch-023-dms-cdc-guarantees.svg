<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="What DMS ongoing replication promises and what it does not: no latency SLA, tables only, an immutable start point, and open transactions dropped">
  <title>AWS DMS change data capture reads the source engine's transaction log and applies changes to the target. AWS states plainly that it does not provide real-time replication and that there are no SLAs for CDC latency, which can reach several minutes or longer. A task that starts CDC migrates tables only, so views are absent. The CDC start point is fixed when the task is created and needs a new task to change. On Oracle, starting from an SCN or timestamp drops transactions that were open at that position unless openTransactionWindow is set. None of these raise an error.</title>
  <rect width="1000" height="470" fill="#F8F7F5"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">What the change stream actually guarantees</text>

    <rect x="40" y="54" width="920" height="86" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="140" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Source engine log</text>
    <text x="140" y="106" text-anchor="middle" font-size="11" fill="#6c757d">redo / binlog / WAL</text>
    <text x="140" y="124" text-anchor="middle" font-size="11" fill="#6c757d">SCN, LSN, position</text>

    <text x="410" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">DMS replication task</text>
    <text x="410" y="106" text-anchor="middle" font-size="11" fill="#6c757d">engine-specific API</text>
    <text x="410" y="124" text-anchor="middle" font-size="11" fill="#6c757d">start point fixed at creation</text>

    <text x="700" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Target</text>
    <text x="700" y="106" text-anchor="middle" font-size="11" fill="#6c757d">rows arrive</text>
    <text x="700" y="124" text-anchor="middle" font-size="11" fill="#6c757d">status reads healthy</text>

    <text x="890" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">lag: unknown</text>
    <text x="890" y="116" text-anchor="middle" font-size="11" fill="#cc0c39">and unbounded</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="162" width="920" height="86" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">AWS says this in a note on the CDC page itself</text>
    <text x="500" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">&#8220;AWS DMS CDC does not provide real-time replication.&#8221;   &#8220;There are no SLAs for CDC latency.&#8221;</text>
    <text x="500" y="238" text-anchor="middle" font-size="12" fill="#3d3d3d">Latency &#8220;can increase to several minutes or longer&#8221;. That is the guarantee, not a degraded state.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="270" width="920" height="182" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">Four silent omissions, none of which raise an error</text>

    <rect x="66" y="314" width="212" height="120" rx="4" fill="#f8f7f5" stroke="#e5e5e5"/>
    <text x="172" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Views</text>
    <text x="82" y="362" font-size="11" fill="#3d3d3d">A task that starts CDC</text>
    <text x="82" y="380" font-size="11" fill="#3d3d3d">migrates tables only.</text>
    <text x="82" y="404" font-size="11" fill="#cc0c39">Every row present, and</text>
    <text x="82" y="422" font-size="11" fill="#cc0c39">the app still fails.</text>

    <rect x="292" y="314" width="212" height="120" rx="4" fill="#f8f7f5" stroke="#e5e5e5"/>
    <text x="398" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">The start point</text>
    <text x="308" y="362" font-size="11" fill="#3d3d3d">Marked at task creation</text>
    <text x="308" y="380" font-size="11" fill="#3d3d3d">and cannot be changed.</text>
    <text x="308" y="404" font-size="11" fill="#cc0c39">The remedy at 2am is a</text>
    <text x="308" y="422" font-size="11" fill="#cc0c39">whole new task.</text>

    <rect x="518" y="314" width="212" height="120" rx="4" fill="#f8f7f5" stroke="#e5e5e5"/>
    <text x="624" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Open transactions</text>
    <text x="534" y="362" font-size="11" fill="#3d3d3d">Oracle: starting from an</text>
    <text x="534" y="380" font-size="11" fill="#3d3d3d">SCN drops those open.</text>
    <text x="534" y="404" font-size="11" fill="#cc0c39">Long-running jobs, so it</text>
    <text x="534" y="422" font-size="11" fill="#cc0c39">surfaces at month end.</text>

    <rect x="744" y="314" width="212" height="120" rx="4" fill="#f8f7f5" stroke="#e5e5e5"/>
    <text x="850" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Two-way replication</text>
    <text x="760" y="362" font-size="11" fill="#3d3d3d">No conflict detection</text>
    <text x="760" y="380" font-size="11" fill="#3d3d3d">and no resolution.</text>
    <text x="760" y="404" font-size="11" fill="#cc0c39">Conflicts corrupt rather</text>
    <text x="760" y="422" font-size="11" fill="#cc0c39">than fail.</text>
  </g>
</svg>
