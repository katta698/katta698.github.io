<svg viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Three different outcomes share the word converted: native translation, emulation by an extension pack you now depend on, and work genuinely left for a human">
  <title>An Oracle to Aurora PostgreSQL conversion report presents one percentage, but converted covers three different outcomes. Where PostgreSQL has the same concept the translation is genuine. Where it has none, AWS SCT reproduces the Oracle behaviour through an extension pack installed into your target database, so system views become aws_oracle_ext objects and Oracle date and number formatting is emulated by default. Only the first outcome has actually left Oracle. The second is a compatibility layer that is now part of your production database and that somebody has to own.</title>
  <rect width="1000" height="450" fill="#F8F7F5"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">One word in the report, three different outcomes</text>

    <rect x="40" y="56" width="290" height="188" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="185" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">Native conversion</text>
    <text x="185" y="106" text-anchor="middle" font-size="11" fill="#6c757d">PostgreSQL has the concept</text>
    <text x="64" y="134" font-size="12" fill="#3d3d3d">Sequences, with the last</text>
    <text x="64" y="152" font-size="12" fill="#3d3d3d">generated value carried over.</text>
    <text x="64" y="176" font-size="12" fill="#3d3d3d">Partitioning: range, list,</text>
    <text x="64" y="194" font-size="12" fill="#3d3d3d">hash and the composites.</text>
    <text x="64" y="222" font-size="12" font-weight="700" fill="#1d8102">Oracle genuinely left behind.</text>

    <rect x="354" y="56" width="292" height="188" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Emulation</text>
    <text x="500" y="106" text-anchor="middle" font-size="11" fill="#6c757d">PostgreSQL has no equivalent</text>
    <text x="378" y="134" font-size="12" fill="#3d3d3d">V$VERSION becomes</text>
    <text x="378" y="152" font-size="12" font-family="Consolas,Monaco,monospace" fill="#0f1111">aws_oracle_ext.v$version</text>
    <text x="378" y="176" font-size="12" fill="#3d3d3d">TO_CHAR / TO_DATE params</text>
    <text x="378" y="194" font-size="12" fill="#3d3d3d">emulated <tspan font-weight="700">by default</tspan>, and slower.</text>
    <text x="378" y="222" font-size="12" font-weight="700" fill="#cc0c39">Counted as converted.</text>

    <rect x="670" y="56" width="290" height="188" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="815" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Left for a human</text>
    <text x="815" y="106" text-anchor="middle" font-size="11" fill="#6c757d">the part everyone plans for</text>
    <text x="694" y="134" font-size="12" fill="#3d3d3d">The action items in the</text>
    <text x="694" y="152" font-size="12" fill="#3d3d3d">report, with a number</text>
    <text x="694" y="170" font-size="12" fill="#3d3d3d">against them.</text>
    <text x="694" y="198" font-size="12" fill="#6c757d">Visible, estimated, and</text>
    <text x="694" y="216" font-size="12" fill="#6c757d">not the problem.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="264" width="920" height="76" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Decisions the tool makes once, for the whole schema</text>
    <text x="500" y="314" text-anchor="middle" font-size="12" fill="#3d3d3d">A materialized view can convert as a plain table &#8212; right rows on day one, never refreshes again.</text>
    <text x="500" y="332" text-anchor="middle" font-size="12" fill="#3d3d3d">ROWID becomes a real column, and where no primary key exists it becomes the primary key.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="358" width="920" height="76" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">One option trades correctness for speed on an assertion nothing checks</text>
    <text x="500" y="408" text-anchor="middle" font-size="12" fill="#3d3d3d">Converting NUMBER keys to BIGINT &#8220;improves the performance of your converted code&#8221;, guarded</text>
    <text x="500" y="426" text-anchor="middle" font-size="12" fill="#3d3d3d">only by: &#8220;Make sure that your source doesn&#8217;t include floating point values&#8230; to avoid data loss.&#8221;</text>
  </g>
</svg>
