<svg viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Both AWS Mainframe Modernization experiences are closed to new customers and each closure notice points at the other, leaving vendor-direct offerings and AWS Transform as the live paths">
  <title>Both AWS Mainframe Modernization experiences are closed to new customers. The Managed Runtime Environment notice directs new projects to the self-managed version, and the self-managed notice says it is itself no longer open to new customers, pointing instead at vendor-direct offerings and AWS Transform. Each notice is accurate for the audience it addresses, but read in sequence a new reader gets a loop. The self-managed closure names five partner paths, and none of that capability disappeared: what closed is the route to it through AWS, turning one AWS relationship into one AWS relationship plus up to four vendor contracts.</title>
  <rect width="1000" height="450" fill="#F8F7F5"/>
  <defs>
    <marker id="mf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0c39"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Two closure notices, each pointing at the other</text>

    <rect x="70" y="58" width="360" height="112" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="250" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Managed Runtime Environment</text>
    <text x="250" y="106" text-anchor="middle" font-size="12" fill="#3d3d3d">&#8220;has stopped accepting new customers&#8221;</text>
    <text x="250" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">&#8220;New projects will be directed to</text>
    <text x="250" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">the self-managed version.&#8221;</text>

    <rect x="570" y="58" width="360" height="112" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="750" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Self-managed experience</text>
    <text x="750" y="106" text-anchor="middle" font-size="12" fill="#3d3d3d">&#8220;no longer open to new customers&#8221;</text>
    <text x="750" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">explore vendor-direct offerings</text>
    <text x="750" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">and AWS Transform</text>

    <g stroke="#cc0c39" stroke-width="1.6" marker-end="url(#mf-arrow)" fill="none">
      <line x1="434" y1="100" x2="564" y2="100"/>
    </g>
    <text x="500" y="196" text-anchor="middle" font-size="12" fill="#6c757d">Both accurate for the reader each addresses. Read in sequence, a new customer gets a loop.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="216" width="920" height="106" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">The five partner paths the self-managed closure names</text>
    <text x="140" y="272" text-anchor="middle" font-size="12" fill="#3d3d3d">Rocket</text>
    <text x="340" y="272" text-anchor="middle" font-size="12" fill="#3d3d3d">Precisely</text>
    <text x="510" y="272" text-anchor="middle" font-size="12" fill="#3d3d3d">NTT DATA</text>
    <text x="680" y="272" text-anchor="middle" font-size="12" fill="#3d3d3d">mLogica</text>
    <text x="870" y="272" text-anchor="middle" font-size="12" fill="#3d3d3d">Stromasys</text>
    <text x="140" y="292" text-anchor="middle" font-size="11" fill="#6c757d">replatform</text>
    <text x="340" y="292" text-anchor="middle" font-size="11" fill="#6c757d">data replication</text>
    <text x="510" y="292" text-anchor="middle" font-size="11" fill="#6c757d">replatform</text>
    <text x="680" y="292" text-anchor="middle" font-size="11" fill="#6c757d">assembler</text>
    <text x="870" y="292" text-anchor="middle" font-size="11" fill="#6c757d">SPARC</text>
    <text x="500" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">None of it disappeared. What closed is the route to it through AWS.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="340" width="920" height="94" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">So refactor-or-replatform is no longer a symmetric choice</text>
    <text x="500" y="390" text-anchor="middle" font-size="12" fill="#3d3d3d">Refactor has a live AWS path: AWS Transform for mainframe. Replatform has a live <tspan font-weight="700">vendor</tspan> path.</text>
    <text x="500" y="410" text-anchor="middle" font-size="12" fill="#3d3d3d">One AWS relationship became one AWS relationship plus up to four vendor contracts.</text>
    <text x="500" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">A workshop weighing them on technical merit compares a service against a procurement exercise.</text>
  </g>
</svg>
