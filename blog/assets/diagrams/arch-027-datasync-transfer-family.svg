<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="DataSync is a job you run between two locations you control; Transfer Family is a server you operate that someone else's client connects to">
  <title>The difference between AWS DataSync and AWS Transfer Family is who starts the transfer. DataSync is a task between two locations, both known to you in advance, run on your schedule, with encryption and data integrity validation included. Transfer Family is an endpoint you operate over SFTP, FTPS, FTP or AS2, which a counterparty's existing client connects to without changing its configuration. When you control both ends you want the job; when someone else's client must reach you, you need the server.</title>
  <rect width="1000" height="520" fill="#F8F7F5"/>

  <defs>
    <marker id="dt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">The question is who starts the transfer</text>

    <rect x="40" y="56" width="440" height="200" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="260" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">DataSync &#8212; a job you run</text>

    <rect x="66" y="102" width="150" height="56" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="141" y="126" text-anchor="middle" font-size="12" fill="#0f1111">Source location</text>
    <text x="141" y="145" text-anchor="middle" font-size="12" fill="#6c757d">NFS, SMB, HDFS</text>

    <rect x="304" y="102" width="150" height="56" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="379" y="126" text-anchor="middle" font-size="12" fill="#0f1111">Destination</text>
    <text x="379" y="145" text-anchor="middle" font-size="12" fill="#6c757d">S3, EFS, FSx</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#dt-arrow)" fill="none">
      <line x1="220" y1="130" x2="300" y2="130"/>
    </g>
    <text x="260" y="122" text-anchor="middle" font-size="11" fill="#1d8102">task</text>

    <text x="66" y="184" font-size="12" fill="#3d3d3d">Both ends known in advance. You choose when.</text>
    <text x="66" y="204" font-size="12" fill="#3d3d3d">Encryption and integrity validation included.</text>
    <text x="66" y="224" font-size="12" fill="#3d3d3d">VPC endpoints keep it off the public internet.</text>
    <text x="66" y="244" font-size="12" font-weight="700" fill="#1d8102">No endpoint to operate.</text>

    <rect x="520" y="56" width="440" height="200" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="740" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">Transfer Family &#8212; a server you run</text>

    <rect x="546" y="102" width="150" height="56" rx="4" fill="#ffffff" stroke="#cc0c39" stroke-width="1.4"/>
    <text x="621" y="126" text-anchor="middle" font-size="12" fill="#0f1111">Their client</text>
    <text x="621" y="145" text-anchor="middle" font-size="12" fill="#cc0c39">not yours to change</text>

    <rect x="784" y="102" width="150" height="56" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="859" y="126" text-anchor="middle" font-size="12" fill="#0f1111">Your endpoint</text>
    <text x="859" y="145" text-anchor="middle" font-size="12" fill="#6c757d">S3 or EFS behind it</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#dt-arrow)" fill="none">
      <line x1="700" y1="130" x2="780" y2="130"/>
    </g>
    <text x="740" y="122" text-anchor="middle" font-size="11" fill="#6c757d">connects</text>

    <text x="546" y="184" font-size="12" fill="#3d3d3d">SFTP v3, FTPS, FTP, AS2, browser.</text>
    <text x="546" y="204" font-size="12" fill="#3d3d3d">FTP and FTPS data channel: ports 8192-8200.</text>
    <text x="546" y="224" font-size="12" fill="#3d3d3d">Up to 3 AZs, auto scaling redundant fleet.</text>
    <text x="546" y="244" font-size="12" font-weight="700" fill="#0f1111">You do not initiate anything.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="280" width="920" height="106" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">Choosing, in one question</text>
    <text x="500" y="334" text-anchor="middle" font-size="12" fill="#3d3d3d">Both ends yours &#8594; DataSync. Someone else&#8217;s client must reach you &#8594; Transfer Family.</text>
    <text x="500" y="356" text-anchor="middle" font-size="12" fill="#3d3d3d">AS2 named in the requirement &#8594; Transfer Family, and stop evaluating.</text>
    <text x="500" y="376" text-anchor="middle" font-size="12" fill="#6c757d">Another cloud&#8217;s object storage is a supported DataSync location, not a custom job.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="404" width="920" height="96" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">The two ways this goes wrong are not symmetric</text>
    <text x="500" y="454" text-anchor="middle" font-size="12" fill="#3d3d3d">Transfer Family as a migration tool <tspan font-weight="700">works</tspan> &#8212; and leaves you running an endpoint, credentials</text>
    <text x="500" y="472" text-anchor="middle" font-size="12" fill="#3d3d3d">and a scripted client in place of a scheduled task, with validation you now write yourself.</text>
    <text x="500" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">DataSync where a partner&#8217;s client is fixed fails in a meeting, not in testing.</text>
  </g>
</svg>
