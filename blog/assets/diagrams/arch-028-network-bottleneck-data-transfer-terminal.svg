<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Snowball shipped a device to you; Data Transfer Terminal is a room you drive to, and billing by the port hour moves the risk onto how fast your own equipment can read">
  <title>The old answer to a saturated network was a shipped appliance: AWS sent a device, you filled it, you sent it back, and AWS handled the logistics. AWS Data Transfer Terminal inverts that. It is a secure facility with at least two 100G optical fibre cables into the AWS network, booked one to six hours at a time and at least twenty-four hours ahead. You bring the laptop and the drives, you install and operate and remove all of your own equipment, and you drive your data to the building. Billing is per port hour regardless of how many bytes move, so the cost per terabyte is set entirely by how fast your own equipment can read.</title>
  <rect width="1000" height="520" fill="#F8F7F5"/>
  <defs>
    <marker id="dt2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">The direction of travel reversed</text>

    <rect x="40" y="56" width="440" height="150" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="260" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#6c757d">Before &#8212; Snowball Edge</text>
    <rect x="66" y="98" width="120" height="46" rx="4" fill="#f8f7f5" stroke="#e5e5e5"/>
    <text x="126" y="126" text-anchor="middle" font-size="12" fill="#0f1111">AWS</text>
    <rect x="334" y="98" width="120" height="46" rx="4" fill="#f8f7f5" stroke="#e5e5e5"/>
    <text x="394" y="126" text-anchor="middle" font-size="12" fill="#0f1111">Your site</text>
    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#dt2-arrow)" fill="none">
      <line x1="192" y1="121" x2="328" y2="121"/>
    </g>
    <text x="260" y="114" text-anchor="middle" font-size="11" fill="#6c757d">device ships to you</text>
    <text x="66" y="170" font-size="12" fill="#3d3d3d">AWS owned the logistics. Your data</text>
    <text x="66" y="190" font-size="12" fill="#3d3d3d">never left the building.</text>

    <rect x="520" y="56" width="440" height="150" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="740" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Now &#8212; Data Transfer Terminal</text>
    <rect x="546" y="98" width="120" height="46" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="606" y="126" text-anchor="middle" font-size="12" fill="#0f1111">Your site</text>
    <rect x="814" y="98" width="120" height="46" rx="4" fill="#ffffff" stroke="#C4A484" stroke-width="1.4"/>
    <text x="874" y="126" text-anchor="middle" font-size="12" fill="#0f1111">The terminal</text>
    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#dt2-arrow)" fill="none">
      <line x1="672" y1="121" x2="808" y2="121"/>
    </g>
    <text x="740" y="114" text-anchor="middle" font-size="11" fill="#cc0c39">you drive the drives</text>
    <text x="546" y="170" font-size="12" fill="#3d3d3d">You own the logistics. Getting the data</text>
    <text x="546" y="190" font-size="12" font-weight="700" fill="#cc0c39">to the building is now your problem.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="228" width="920" height="120" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">What the facility gives you, and what it does not</text>

    <rect x="66" y="270" width="410" height="62" rx="4" fill="#f6f9f4" stroke="#e5e5e5"/>
    <text x="271" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">AWS provides</text>
    <text x="271" y="312" text-anchor="middle" font-size="12" fill="#3d3d3d">A secure suite and at least two 100G fibres</text>
    <text x="271" y="328" text-anchor="middle" font-size="11" fill="#6c757d">booked 1&#8211;6 hours, at least 24 hours ahead</text>

    <rect x="524" y="270" width="410" height="62" rx="4" fill="#fdf2f2" stroke="#e5e5e5"/>
    <text x="729" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">You provide</text>
    <text x="729" y="312" text-anchor="middle" font-size="12" fill="#3d3d3d">Laptop, SSDs, tools, and the transport</text>
    <text x="729" y="328" text-anchor="middle" font-size="11" fill="#6c757d">&#8220;solely responsible for the installation, operation, and removal&#8221;</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="370" width="920" height="134" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The trap: you are billed for time, not for bytes</text>
    <text x="500" y="420" text-anchor="middle" font-size="12" fill="#3d3d3d">Per port hour, from $300 within North America. &#8220;No additional fees based on the volume of data.&#8221;</text>

    <rect x="150" y="434" width="700" height="56" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="456" text-anchor="middle" font-size="12" fill="#0f1111">A 6-hour booking at $300 costs $1,800. Saturating 100 Gbps for all six hours moves ~270 TB.</text>
    <text x="500" y="478" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">That is about $6.67/TB &#8212; if your own drives can read at 12.5 GB/s for six hours. They cannot.</text>
  </g>
</svg>
