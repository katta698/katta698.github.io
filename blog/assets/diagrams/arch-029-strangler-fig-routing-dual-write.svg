<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="The three AWS places to split traffic in a strangler fig migration, each with its documented hard limit and the behaviour that inverts what an operator expects">
  <title>A strangler fig migration puts a routing layer in front of the old system and moves one slice of functionality at a time. There are three places on AWS to put that split. Route 53 weighted records take an integer from 0 to 255 and are only as fast as the shared TTL, and setting every weight in the group to zero distributes traffic evenly rather than stopping it. Application Load Balancer listener rules are the right default, but a forward action references at most five target groups and that quota cannot be raised. CloudFront continuous deployment caps the staging weight at fifteen percent, cannot be used with HTTP/3, and sends all requests to the primary distribution during CloudFront-wide peak hours regardless of the policy. Underneath all three sits the dual-write decision, which determines whether moving a route back actually undoes anything.</title>
  <rect width="1000" height="600" fill="#F8F7F5"/>
  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Three places to put the split, and what each one does that you did not expect</text>

    <rect x="40" y="52" width="150" height="52" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="115" y="74" text-anchor="middle" font-size="12" fill="#0f1111">Client request</text>
    <text x="115" y="92" text-anchor="middle" font-size="11" fill="#6c757d">one slice of traffic</text>
    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#sf-arrow)" fill="none">
      <line x1="194" y1="78" x2="228" y2="78"/>
    </g>
    <rect x="234" y="52" width="180" height="52" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="324" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">The routing layer</text>
    <text x="324" y="92" text-anchor="middle" font-size="11" fill="#6c757d">this is the migration</text>
    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#sf-arrow)" fill="none">
      <line x1="418" y1="78" x2="452" y2="78"/>
    </g>
    <rect x="458" y="52" width="150" height="52" rx="4" fill="#ffffff" stroke="#6c757d" stroke-width="1.4"/>
    <text x="533" y="74" text-anchor="middle" font-size="12" fill="#0f1111">Legacy system</text>
    <text x="533" y="92" text-anchor="middle" font-size="11" fill="#6c757d">shrinking</text>
    <rect x="628" y="52" width="150" height="52" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.4"/>
    <text x="703" y="74" text-anchor="middle" font-size="12" fill="#0f1111">New service</text>
    <text x="703" y="92" text-anchor="middle" font-size="11" fill="#6c757d">growing</text>
    <rect x="798" y="52" width="162" height="52" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.4"/>
    <text x="879" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">Rollback = move</text>
    <text x="879" y="92" text-anchor="middle" font-size="11" fill="#3d3d3d">the rule back</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="126" width="300" height="196" rx="4" fill="#ffffff" stroke="#6c757d" stroke-width="1.4"/>
    <text x="180" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Route 53 weighted records</text>
    <text x="180" y="172" text-anchor="middle" font-size="11" fill="#3d3d3d">Weight is an integer 0&#8211;255</text>
    <text x="180" y="190" text-anchor="middle" font-size="11" fill="#6c757d">1 against 255 is about 0.39% of traffic</text>
    <rect x="48" y="204" width="264" height="46" rx="4" fill="#f8f7f5" stroke="#e5e5e5"/>
    <text x="180" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#6c757d">Hard limit</text>
    <text x="180" y="240" text-anchor="middle" font-size="10.5" fill="#3d3d3d">One shared TTL, rewritten to the last set</text>
    <rect x="48" y="258" width="264" height="50" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.2"/>
    <text x="180" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">The inversion</text>
    <text x="180" y="294" text-anchor="middle" font-size="10.5" fill="#3d3d3d">All weights 0 = even split, not off</text>

    <rect x="350" y="126" width="300" height="196" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">ALB listener rules</text>
    <text x="500" y="172" text-anchor="middle" font-size="11" fill="#3d3d3d">Per request, effective immediately</text>
    <text x="500" y="190" text-anchor="middle" font-size="11" fill="#6c757d">the right default for most migrations</text>
    <rect x="368" y="204" width="264" height="46" rx="4" fill="#f6f9f4" stroke="#e5e5e5"/>
    <text x="500" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#1d8102">Hard limit</text>
    <text x="500" y="240" text-anchor="middle" font-size="10.5" fill="#3d3d3d">5 target groups per forward action</text>
    <rect x="368" y="258" width="264" height="50" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.2"/>
    <text x="500" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">The inversion</text>
    <text x="500" y="294" text-anchor="middle" font-size="10.5" fill="#3d3d3d">100 rules is adjustable; the 5 is not</text>

    <rect x="670" y="126" width="300" height="196" rx="4" fill="#ffffff" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="820" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">CloudFront continuous deployment</text>
    <text x="820" y="172" text-anchor="middle" font-size="11" fill="#3d3d3d">Staging distribution, real traffic</text>
    <text x="820" y="190" text-anchor="middle" font-size="11" fill="#6c757d">for CDN config changes, not migrations</text>
    <rect x="688" y="204" width="264" height="46" rx="4" fill="#fdf2f2" stroke="#e5e5e5"/>
    <text x="820" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">Hard limit</text>
    <text x="820" y="240" text-anchor="middle" font-size="10.5" fill="#3d3d3d">15% ceiling, and no HTTP/3 at all</text>
    <rect x="688" y="258" width="264" height="50" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.4"/>
    <text x="820" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">The inversion</text>
    <text x="820" y="294" text-anchor="middle" font-size="10.5" fill="#3d3d3d">All traffic reverts to primary at peak</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="342" width="940" height="112" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">Underneath all three: the write decision the router cannot make for you</text>
    <rect x="52" y="380" width="288" height="58" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="196" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1111">Legacy stays system of record</text>
    <text x="196" y="418" text-anchor="middle" font-size="10.5" fill="#3d3d3d">New service shadows. Fully reversible,</text>
    <text x="196" y="432" text-anchor="middle" font-size="10.5" fill="#6c757d">and the slowest to finish.</text>
    <rect x="356" y="380" width="288" height="58" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1111">New service takes the record</text>
    <text x="500" y="418" text-anchor="middle" font-size="10.5" fill="#3d3d3d">Needs a backfill and reconciliation.</text>
    <text x="500" y="432" text-anchor="middle" font-size="10.5" fill="#cc0c39">Moving the route back undoes nothing.</text>
    <rect x="660" y="380" width="288" height="58" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="804" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1111">Events are the source of truth</text>
    <text x="804" y="418" text-anchor="middle" font-size="10.5" fill="#3d3d3d">Both consume the log. Most work up</text>
    <text x="804" y="432" text-anchor="middle" font-size="10.5" fill="#6c757d">front, least coupling afterwards.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="474" width="940" height="98" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The failure mode is not a bad cutover</text>
    <text x="56" y="522" font-size="11.5" fill="#3d3d3d">It is a migration that reaches 95% and stops, because the remaining slices are the hard ones and the pain has already gone.</text>
    <text x="56" y="542" font-size="11.5" fill="#3d3d3d">The router makes running both systems indefinitely comfortable, so the end state needs a date rather than a condition.</text>
    <text x="56" y="562" font-size="11.5" font-weight="700" fill="#cc0c39">Put the decommissioning date on the calendar when the first slice moves, not when the last one is ready.</text>
  </g>
</svg>
