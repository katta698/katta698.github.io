<svg viewBox="0 0 860 500" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Two monthly cost curves plotted against freshness on a logarithmic cost axis. The batch curve rises steeply from thirteen dollars twenty at a daily schedule to over three thousand eight hundred dollars at every five minutes and runs off the top of the chart at once a minute. The streaming line stays flat at the ten dollar eighty shard floor across the whole range and steps up to sixty four dollars eighty only when five enhanced fan-out consumers are added.">
  <title>The latency and cost curve: batch cost rises with freshness, streaming cost rises with fan-out</title>
  <rect width="860" height="500" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">The cost of freshness, and the two different things it buys</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Monthly cost, logarithmic. Batch anchored on a 10-DPU Glue job at $0.44 a run; streaming on one Kinesis shard at $0.015 an hour.</text>

  <rect x="100" y="82" width="270" height="268" fill="#C4A484" opacity="0.07"/>
  <rect x="370" y="82" width="170" height="268" fill="#4A90D9" opacity="0.06"/>
  <rect x="540" y="82" width="180" height="268" fill="#8E6DBE" opacity="0.06"/>

  <text x="106" y="96" font-family="Georgia, serif" font-size="10" fill="#8A7A6A">REGIME 1 &#183; BATCH</text>
  <text x="376" y="96" font-family="Georgia, serif" font-size="10" fill="#4A7BA0">REGIME 2 &#183; MICRO-BATCH</text>
  <text x="546" y="96" font-family="Georgia, serif" font-size="10" fill="#7A5FA8">REGIME 3 &#183; REAL TIME</text>

  <line x1="100" y1="350" x2="720" y2="350" stroke="#C9C3BC" stroke-width="1"/>
  <line x1="100" y1="270" x2="720" y2="270" stroke="#E2DDD6" stroke-width="1"/>
  <line x1="100" y1="190" x2="720" y2="190" stroke="#E2DDD6" stroke-width="1"/>
  <line x1="100" y1="110" x2="720" y2="110" stroke="#E2DDD6" stroke-width="1"/>
  <line x1="100" y1="82" x2="100" y2="350" stroke="#C9C3BC" stroke-width="1"/>

  <text x="92" y="354" font-family="Georgia, serif" font-size="10" fill="#6B6560" text-anchor="end">$10</text>
  <text x="92" y="274" font-family="Georgia, serif" font-size="10" fill="#6B6560" text-anchor="end">$100</text>
  <text x="92" y="194" font-family="Georgia, serif" font-size="10" fill="#6B6560" text-anchor="end">$1,000</text>
  <text x="92" y="114" font-family="Georgia, serif" font-size="10" fill="#6B6560" text-anchor="end">$10,000</text>

  <text x="160" y="370" font-family="Georgia, serif" font-size="10" fill="#1D2322" text-anchor="middle">once a day</text>
  <text x="300" y="370" font-family="Georgia, serif" font-size="10" fill="#1D2322" text-anchor="middle">hourly</text>
  <text x="440" y="370" font-family="Georgia, serif" font-size="10" fill="#1D2322" text-anchor="middle">every 5 min</text>
  <text x="580" y="370" font-family="Georgia, serif" font-size="10" fill="#1D2322" text-anchor="middle">every minute</text>
  <text x="680" y="370" font-family="Georgia, serif" font-size="10" fill="#1D2322" text-anchor="middle">sub-second</text>
  <text x="410" y="390" font-family="Georgia, serif" font-size="10" fill="#6B6560" text-anchor="middle">fresher &#8594;</text>

  <polyline points="160,340 300,230 440,144 505,104" fill="none" stroke="#8E6DBE" stroke-width="2.5"/>
  <polyline points="505,104 520,95" fill="none" stroke="#8E6DBE" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="520,95 512,101 517,103" fill="#8E6DBE"/>
  <circle cx="160" cy="340" r="4" fill="#8E6DBE"/>
  <circle cx="300" cy="230" r="4" fill="#8E6DBE"/>
  <circle cx="440" cy="144" r="4" fill="#8E6DBE"/>

  <text x="172" y="336" font-family="Georgia, serif" font-size="10" fill="#6B4F94">$13.20</text>
  <text x="312" y="226" font-family="Georgia, serif" font-size="10" fill="#6B4F94">$316.80</text>
  <text x="452" y="140" font-family="Georgia, serif" font-size="10" fill="#6B4F94">$3,801.60</text>
  <text x="470" y="118" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#6B4F94">$19,008 at once a minute</text>

  <polyline points="128,347 600,347" fill="none" stroke="#3D9970" stroke-width="2.5"/>
  <polyline points="600,347 600,285 700,285" fill="none" stroke="#3D9970" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="600" cy="285" r="4" fill="#3D9970"/>

  <text x="132" y="336" font-family="Georgia, serif" font-size="10" fill="#2E7355">$10.80 &#8212; flat, whatever the freshness</text>
  <text x="612" y="278" font-family="Georgia, serif" font-size="10" fill="#2E7355">$64.80 with five enhanced fan-out consumers</text>

  <circle cx="140" cy="347" r="5.5" fill="none" stroke="#C4A484" stroke-width="2"/>
  <line x1="140" y1="341" x2="140" y2="300" stroke="#C4A484" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="146" y="296" font-family="Georgia, serif" font-size="10" fill="#8A6A44">the curves cross at about 24.5 runs a month</text>

  <line x1="736" y1="330" x2="752" y2="330" stroke="#8E6DBE" stroke-width="2.5"/>
  <text x="758" y="334" font-family="Georgia, serif" font-size="10" fill="#1D2322">Glue batch</text>
  <line x1="736" y1="348" x2="752" y2="348" stroke="#3D9970" stroke-width="2.5"/>
  <text x="758" y="352" font-family="Georgia, serif" font-size="10" fill="#1D2322">Kinesis stream</text>

  <line x1="44" y1="414" x2="816" y2="414" stroke="#E2DDD6" stroke-width="1"/>
  <text x="44" y="434" font-family="Georgia, serif" font-size="10.5" fill="#1D2322">Batch cost = runs &#215; DPU-hours &#215; rate. Freshness is a multiplier on the whole expression, so it rises with every extra run.</text>
  <text x="44" y="452" font-family="Georgia, serif" font-size="10.5" fill="#1D2322">Streaming cost = shards &#215; hours &#215; (1 + fan-out) &#215; rate. Freshness does not appear at all; the shard hour was already bought.</text>
  <text x="44" y="470" font-family="Georgia, serif" font-size="10.5" fill="#6B6560">The boundary between regimes 2 and 3 is priced: below a 60-second Firehose buffer, delivery switches to multi-part upload and S3 PUT costs rise.</text>
  <text x="44" y="488" font-family="Georgia, serif" font-size="10" fill="#8A8078">Transport only. Something still has to process what comes off the shard &#8212; the comparison is of scale, not of substitutes.</text>
</svg>
