<svg viewBox="0 0 860 636" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="A vertical pipeline of the gates AWS evaluates for every request. A request starts implicitly denied. The first gate looks for an explicit deny in any policy type and ends the request immediately if it finds one. Then Organizations resource control policies, then service control policies, then resource-based policies, then identity-based policies, then the permissions boundary, then the session policy. Only a request that clears every gate is allowed. Annotations on the right show which gates can only subtract permission and which can grant it.">
  <title>The order AWS evaluates policy types in, and which gates can grant permission rather than only remove it</title>
  <rect width="860" height="636" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">The order a request is actually decided in</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Every gate must pass. One explicit deny anywhere ends it. Only two gates can grant; the rest can only take away.</text>

  <rect x="64" y="74" width="430" height="30" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="110" y="93" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">Request arrives &#8212; implicitly denied</text>
  <text x="516" y="93" font-family="Georgia, serif" font-size="10" fill="#6B6560">Nothing is permitted until something says so.</text>

  <line x1="120" y1="104" x2="120" y2="118" stroke="#C9C3BC" stroke-width="1.5"/>

  <rect x="64" y="118" width="430" height="42" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="64" y="118" width="430" height="42" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <circle cx="90" cy="139" r="11" fill="#B5654A"/>
  <text x="90" y="143" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F8F7F5" text-anchor="middle">1</text>
  <text x="112" y="136" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">Deny evaluation</text>
  <text x="112" y="151" font-family="Georgia, serif" font-size="10" fill="#6B6560">An explicit Deny in any policy type below ends it here.</text>
  <text x="516" y="143" font-family="Georgia, serif" font-size="10" fill="#8F4A32">Nothing downstream can undo this.</text>

  <line x1="120" y1="160" x2="120" y2="174" stroke="#C9C3BC" stroke-width="1.5"/>

  <rect x="64" y="174" width="430" height="42" rx="3" fill="#C4A484" opacity="0.14"/>
  <rect x="64" y="174" width="430" height="42" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <circle cx="90" cy="195" r="11" fill="#C4A484"/>
  <text x="90" y="199" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3D2E20" text-anchor="middle">2</text>
  <text x="112" y="192" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8A6A44">Organizations RCPs</text>
  <text x="112" y="207" font-family="Georgia, serif" font-size="10" fill="#6B6560">Ceiling on the resource. No Allow found means Deny.</text>
  <text x="516" y="199" font-family="Georgia, serif" font-size="10" fill="#8A6A44">Subset of services. Never the mgmt account.</text>

  <line x1="120" y1="216" x2="120" y2="230" stroke="#C9C3BC" stroke-width="1.5"/>

  <rect x="64" y="230" width="430" height="42" rx="3" fill="#C4A484" opacity="0.14"/>
  <rect x="64" y="230" width="430" height="42" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <circle cx="90" cy="251" r="11" fill="#C4A484"/>
  <text x="90" y="255" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3D2E20" text-anchor="middle">3</text>
  <text x="112" y="248" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8A6A44">Organizations SCPs</text>
  <text x="112" y="263" font-family="Georgia, serif" font-size="10" fill="#6B6560">Ceiling on the principal. No Allow found means Deny.</text>
  <text x="516" y="255" font-family="Georgia, serif" font-size="10" fill="#8A6A44">Grants nothing. Only ever removes.</text>

  <line x1="120" y1="272" x2="120" y2="286" stroke="#C9C3BC" stroke-width="1.5"/>

  <rect x="64" y="286" width="430" height="42" rx="3" fill="#3D9970" opacity="0.12"/>
  <rect x="64" y="286" width="430" height="42" rx="3" fill="none" stroke="#3D9970" stroke-width="1.5"/>
  <circle cx="90" cy="307" r="11" fill="#3D9970"/>
  <text x="90" y="311" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F8F7F5" text-anchor="middle">4</text>
  <text x="112" y="304" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#2E7355">Resource-based policy</text>
  <text x="112" y="319" font-family="Georgia, serif" font-size="10" fill="#6B6560">Can grant. Union with the identity policy, not intersection.</text>
  <text x="516" y="307" font-family="Georgia, serif" font-size="10" fill="#2E7355">CAN GRANT &#8212; and can short-circuit 5&#8211;7.</text>

  <line x1="120" y1="328" x2="120" y2="342" stroke="#C9C3BC" stroke-width="1.5"/>

  <rect x="64" y="342" width="430" height="42" rx="3" fill="#3D9970" opacity="0.12"/>
  <rect x="64" y="342" width="430" height="42" rx="3" fill="none" stroke="#3D9970" stroke-width="1.5"/>
  <circle cx="90" cy="363" r="11" fill="#3D9970"/>
  <text x="90" y="367" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F8F7F5" text-anchor="middle">5</text>
  <text x="112" y="360" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#2E7355">Identity-based policy</text>
  <text x="112" y="375" font-family="Georgia, serif" font-size="10" fill="#6B6560">Can grant. No Allow here is an implicit deny.</text>
  <text x="516" y="363" font-family="Georgia, serif" font-size="10" fill="#2E7355">CAN GRANT &#8212; the only one most teams write.</text>

  <line x1="120" y1="384" x2="120" y2="398" stroke="#C9C3BC" stroke-width="1.5"/>

  <rect x="64" y="398" width="430" height="42" rx="3" fill="#4A90D9" opacity="0.10"/>
  <rect x="64" y="398" width="430" height="42" rx="3" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
  <circle cx="90" cy="419" r="11" fill="#4A90D9"/>
  <text x="90" y="423" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F8F7F5" text-anchor="middle">6</text>
  <text x="112" y="416" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3A6F9F">Permissions boundary</text>
  <text x="112" y="431" font-family="Georgia, serif" font-size="10" fill="#6B6560">Intersects with the identity policy. Grants nothing.</text>
  <text x="516" y="423" font-family="Georgia, serif" font-size="10" fill="#3A6F9F">A ceiling on a role, set by someone else.</text>

  <line x1="120" y1="440" x2="120" y2="454" stroke="#C9C3BC" stroke-width="1.5"/>

  <rect x="64" y="454" width="430" height="42" rx="3" fill="#8E6DBE" opacity="0.10"/>
  <rect x="64" y="454" width="430" height="42" rx="3" fill="none" stroke="#8E6DBE" stroke-width="1.5"/>
  <circle cx="90" cy="475" r="11" fill="#8E6DBE"/>
  <text x="90" y="479" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F8F7F5" text-anchor="middle">7</text>
  <text x="112" y="472" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#6B4F94">Session policy</text>
  <text x="112" y="487" font-family="Georgia, serif" font-size="10" fill="#6B6560">Only for role sessions and federated users. Grants nothing.</text>
  <text x="516" y="479" font-family="Georgia, serif" font-size="10" fill="#6B4F94">Passed at AssumeRole. Easy to forget exists.</text>

  <line x1="120" y1="496" x2="120" y2="510" stroke="#C9C3BC" stroke-width="1.5"/>

  <rect x="64" y="510" width="430" height="32" rx="3" fill="#3D9970" opacity="0.18"/>
  <rect x="64" y="510" width="430" height="32" rx="3" fill="none" stroke="#3D9970" stroke-width="1.5"/>
  <text x="112" y="530" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#2E7355">Allow</text>
  <text x="516" y="530" font-family="Georgia, serif" font-size="10" fill="#2E7355">Reached only by clearing all seven.</text>

  <line x1="530" y1="118" x2="530" y2="160" stroke="#B5654A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="530" y1="139" x2="700" y2="139" stroke="#B5654A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="139" x2="700" y2="560" stroke="#B5654A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="560" x2="330" y2="560" stroke="#B5654A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="330,560 340,555 340,565" fill="#B5654A"/>
  <rect x="196" y="546" width="132" height="28" rx="3" fill="#B5654A"/>
  <text x="262" y="565" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F8F7F5" text-anchor="middle">Deny</text>
  <text x="712" y="352" font-family="Georgia, serif" font-size="10" fill="#8F4A32">any gate</text>
  <text x="712" y="366" font-family="Georgia, serif" font-size="10" fill="#8F4A32">can exit</text>
  <text x="712" y="380" font-family="Georgia, serif" font-size="10" fill="#8F4A32">here</text>

  <line x1="44" y1="588" x2="816" y2="588" stroke="#E2DDD6" stroke-width="1"/>
  <text x="44" y="606" font-family="Georgia, serif" font-size="10.5" fill="#1D2322">Gates 2, 3, 6 and 7 can only subtract. Adding one never grants access; it can only take access already granted away.</text>
  <text x="44" y="624" font-family="Georgia, serif" font-size="10.5" fill="#6B6560">Cross-account runs this whole pipeline twice, once per account. The request is allowed only if both sides return Allow.</text>
</svg>
