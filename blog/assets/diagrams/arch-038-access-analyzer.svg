<svg viewBox="0 0 860 500" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Three IAM Access Analyzer types side by side. External access answers whether anything outside the zone of trust can reach a resource, is proved by logic-based reasoning over resource policies, must be created in every Region, and is free. Internal access answers which principals inside the organisation can reach nominated resources, is also provable, and costs nine dollars per resource per Region per month. Unused access answers which permissions nobody has used, is observed from last-accessed data over a tracking period, is Region-independent, and costs twenty cents per role or user per month per analyzer. Below, a warning that creating unused access analyzers per Region multiplies the bill for identical findings, and a note that custom policy checks cost two tenths of a cent per call.">
  <title>The three IAM Access Analyzer types, the different question each answers, and the Region behaviour that decides the bill</title>
  <rect width="860" height="500" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">Three analyzers, three different questions</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Two of them prove a property of a policy. The third observes behaviour over time. They are not interchangeable evidence.</text>

  <rect x="44" y="80" width="250" height="190" rx="3" fill="#C4A484" opacity="0.14"/>
  <rect x="44" y="80" width="250" height="190" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="60" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8A6A44">External access</text>
  <text x="60" y="126" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Can anything outside my zone of</text>
  <text x="60" y="140" font-family="Georgia, serif" font-size="10" fill="#3D2E20">trust reach this resource?</text>
  <text x="60" y="164" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Proved. Logic-based reasoning</text>
  <text x="60" y="178" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">over resource-based policies.</text>
  <text x="60" y="204" font-family="Georgia, serif" font-size="10" fill="#6B6560">15 resource types.</text>
  <text x="60" y="226" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">One per Region, required.</text>
  <text x="60" y="252" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#5F6E38">No additional charge.</text>

  <rect x="305" y="80" width="250" height="190" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="305" y="80" width="250" height="190" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="321" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">Internal access</text>
  <text x="321" y="126" font-family="Georgia, serif" font-size="10" fill="#2E4256">Which principals inside my org</text>
  <text x="321" y="140" font-family="Georgia, serif" font-size="10" fill="#2E4256">can reach this resource?</text>
  <text x="321" y="164" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Proved, on resources you</text>
  <text x="321" y="178" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">nominate one at a time.</text>
  <text x="321" y="204" font-family="Georgia, serif" font-size="10" fill="#6B6560">6 resource types.</text>
  <text x="321" y="226" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">Priced per resource, per Region.</text>
  <text x="321" y="252" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8F4A32">$9.00 per resource per month.</text>

  <rect x="566" y="80" width="250" height="190" rx="3" fill="#8A9A5B" opacity="0.14"/>
  <rect x="566" y="80" width="250" height="190" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="582" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">Unused access</text>
  <text x="582" y="126" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Which of these permissions has</text>
  <text x="582" y="140" font-family="Georgia, serif" font-size="10" fill="#3D4A22">nobody actually used?</text>
  <text x="582" y="164" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Observed. Last-accessed data</text>
  <text x="582" y="178" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">over a tracking period.</text>
  <text x="582" y="204" font-family="Georgia, serif" font-size="10" fill="#6B6560">Roles, users, keys, passwords.</text>
  <text x="582" y="226" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#5F6E38">Region-independent. One is enough.</text>
  <text x="582" y="252" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8F4A32">$0.20 per role or user per month.</text>

  <rect x="44" y="292" width="772" height="74" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="44" y="292" width="772" height="74" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="60" y="314" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">The habit that multiplies the bill</text>
  <text x="60" y="333" font-family="Georgia, serif" font-size="10" fill="#3D2E20">External access analyzers are free and have to exist in every Region. Copying that habit onto unused access buys nothing:</text>
  <text x="60" y="349" font-family="Georgia, serif" font-size="10" fill="#3D2E20">its findings do not change by Region, and every analyzer is billed. AWS's own example: 850 roles and users is $170 a month.</text>
  <text x="60" y="365" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">The same 850 analysed by four Region-local analyzers is $680 a month for identical findings.</text>

  <rect x="44" y="388" width="772" height="56" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="60" y="410" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">The third thing, and the one that belongs in CI</text>
  <text x="60" y="429" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Custom policy checks answer "does this change grant access the old policy did not" at $0.0020 a call &#8212; 10,000 checks is $20 a month.</text>

  <text x="44" y="470" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">A finding from the left two columns is a proof about a policy. A finding from the right one is a statement about the past. Remediate them with different confidence.</text>
</svg>
