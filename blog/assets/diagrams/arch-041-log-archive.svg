<svg viewBox="0 0 860 486" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of three distinct guarantees for a log archive. A separate account limits who can attempt a change but does not stop an administrator of that account. S3 Object Lock in compliance mode makes the attempt fail, and cannot be overridden by anyone including the root user, but protects a version rather than a name. CloudTrail log file integrity validation detects modification or deletion through an hourly digest file whose signature chains to the previous one, but prevents nothing. Below, the gap the three together are needed to close: a simple delete returns 200 OK and inserts a delete marker, so the object appears gone while the locked version survives underneath.">
  <title>Three guarantees for a log archive — blast radius, prevention and detection — and what each one does not do</title>
  <rect width="860" height="486" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">Three guarantees, routinely mistaken for one</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Each closes a different gap. None of them substitutes for another, and the third one prevents nothing at all.</text>

  <rect x="44" y="80" width="250" height="196" rx="3" fill="#C4A484" opacity="0.14"/>
  <rect x="44" y="80" width="250" height="196" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="60" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8A6A44">A separate account</text>
  <text x="60" y="124" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Limits who can even try. The</text>
  <text x="60" y="138" font-family="Georgia, serif" font-size="10" fill="#3D2E20">principals that generate the logs</text>
  <text x="60" y="152" font-family="Georgia, serif" font-size="10" fill="#3D2E20">have no path to the archive.</text>
  <text x="60" y="176" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8A6A44">Guarantee: blast radius</text>
  <text x="60" y="200" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">What it does not do: an</text>
  <text x="60" y="214" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">administrator of the archive</text>
  <text x="60" y="228" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">account can still delete, and</text>
  <text x="60" y="242" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">so can the management</text>
  <text x="60" y="256" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">account, which no SCP binds.</text>

  <rect x="305" y="80" width="250" height="196" rx="3" fill="#8A9A5B" opacity="0.14"/>
  <rect x="305" y="80" width="250" height="196" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="321" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">Object Lock, compliance mode</text>
  <text x="321" y="124" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Makes the attempt fail. Cannot</text>
  <text x="321" y="138" font-family="Georgia, serif" font-size="10" fill="#3D4A22">be overridden by any user,</text>
  <text x="321" y="152" font-family="Georgia, serif" font-size="10" fill="#3D4A22">including the root user.</text>
  <text x="321" y="176" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#5F6E38">Guarantee: prevention</text>
  <text x="321" y="200" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">What it does not do: it protects</text>
  <text x="321" y="214" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">a version, not a name. New</text>
  <text x="321" y="228" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">versions and delete markers</text>
  <text x="321" y="242" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">can still be written on top of</text>
  <text x="321" y="256" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">a locked object.</text>

  <rect x="566" y="80" width="250" height="196" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="566" y="80" width="250" height="196" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="582" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">Log file integrity validation</text>
  <text x="582" y="124" font-family="Georgia, serif" font-size="10" fill="#2E4256">An hourly digest file hashes the</text>
  <text x="582" y="138" font-family="Georgia, serif" font-size="10" fill="#2E4256">last hour's logs, and carries the</text>
  <text x="582" y="152" font-family="Georgia, serif" font-size="10" fill="#2E4256">signature of the digest before it.</text>
  <text x="582" y="176" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#3F5A73">Guarantee: detection</text>
  <text x="582" y="200" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">What it does not do: it prevents</text>
  <text x="582" y="214" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">nothing whatsoever. It tells you</text>
  <text x="582" y="228" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">afterwards &#8212; and only if</text>
  <text x="582" y="242" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">somebody runs the validation,</text>
  <text x="582" y="256" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">which nothing does by itself.</text>

  <rect x="44" y="300" width="772" height="86" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="44" y="300" width="772" height="86" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="60" y="322" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">The gap that needs all three: a delete that succeeds without deleting anything</text>
  <text x="60" y="343" font-family="Georgia, serif" font-size="10" fill="#3D2E20">A simple DELETE &#8212; one that names no version &#8212; returns <tspan font-weight="bold">200 OK</tspan> and inserts a delete marker. The locked version is untouched underneath,</text>
  <text x="60" y="358" font-family="Georgia, serif" font-size="10" fill="#3D2E20">and the object is gone from every listing. Object Lock did its job and the archive still looks empty. Only the digest chain shows otherwise,</text>
  <text x="60" y="373" font-family="Georgia, serif" font-size="10" fill="#3D2E20">and only the separate account stops the person who could do it having had the permission at all.</text>

  <text x="44" y="416" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1D2322">A backup and an immutable log are answers to different questions</text>
  <text x="44" y="437" font-family="Georgia, serif" font-size="10" fill="#3D2E20">A backup protects against loss, and restores what was there when it ran. An immutable log protects against alteration.</text>
  <text x="44" y="452" font-family="Georgia, serif" font-size="10" fill="#3D2E20">A backup taken after tampering preserves the tampered version faithfully, on schedule, and reports success.</text>
</svg>
