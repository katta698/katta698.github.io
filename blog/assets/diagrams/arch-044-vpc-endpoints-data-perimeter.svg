<svg viewBox="0 0 860 506" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram about VPC endpoints and the data perimeter. On the left, what an endpoint changes: the path, so traffic to the service no longer traverses the internet. On the right, what it does not change: the destination, because the default endpoint policy grants full access, so every bucket in every account is still reachable through it. In the middle, the default endpoint policy shown in full: Allow, Principal star, Action star, Resource star. At the bottom, three controls facing three directions: an endpoint policy limits which resources can be reached from this network, a resource policy with the source VPC endpoint condition limits which networks can reach this resource, and an organisation policy with the resource organisation condition limits which resources our identities may touch anywhere.">
  <title>What a VPC endpoint changes, what it does not, and the three controls that face three different directions</title>
  <rect width="860" height="506" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">"It never leaves AWS" is a claim about the path</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">It says nothing about which destination is at the other end, and the default settles that question generously.</text>

  <rect x="44" y="80" width="376" height="108" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="44" y="80" width="376" height="108" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">What the endpoint changes</text>
  <text x="60" y="126" font-family="Georgia, serif" font-size="10" fill="#3D4A22">The path. Traffic to the service stops traversing</text>
  <text x="60" y="141" font-family="Georgia, serif" font-size="10" fill="#3D4A22">the internet gateway and the NAT gateway.</text>
  <text x="60" y="164" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Real, and worth having. It removes a network</text>
  <text x="60" y="178" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">path and a per-gigabyte charge.</text>

  <rect x="440" y="80" width="376" height="108" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="440" y="80" width="376" height="108" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="456" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">What it does not change</text>
  <text x="456" y="126" font-family="Georgia, serif" font-size="10" fill="#3D2E20">The destination. Every bucket in every account</text>
  <text x="456" y="141" font-family="Georgia, serif" font-size="10" fill="#3D2E20">is still reachable through it, by default.</text>
  <text x="456" y="164" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">So the exfiltration path a team believes it</text>
  <text x="456" y="178" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">closed is open, and now it is also private.</text>

  <text x="44" y="216" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">The default endpoint policy, in full</text>

  <rect x="44" y="226" width="376" height="86" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="62" y="246" font-family="Consolas, monospace" font-size="10" fill="#3D2E20">{ "Statement": [ {</text>
  <text x="62" y="261" font-family="Consolas, monospace" font-size="10" fill="#3D2E20">    "Effect": "Allow",</text>
  <text x="62" y="276" font-family="Consolas, monospace" font-size="10" fill="#8F4A32">    "Principal": "*", "Action": "*",</text>
  <text x="62" y="291" font-family="Consolas, monospace" font-size="10" fill="#8F4A32">    "Resource": "*"</text>
  <text x="62" y="306" font-family="Consolas, monospace" font-size="10" fill="#3D2E20">} ] }</text>

  <rect x="440" y="226" width="376" height="86" rx="3" fill="none" stroke="#C9C3BC" stroke-width="1.2"/>
  <text x="456" y="248" font-family="Georgia, serif" font-size="10" fill="#3D2E20">If you attach no policy, AWS attaches that one.</text>
  <text x="456" y="266" font-family="Georgia, serif" font-size="10" fill="#3D2E20">And where a service does not support endpoint</text>
  <text x="456" y="280" font-family="Georgia, serif" font-size="10" fill="#3D2E20">policies at all, AWS allows full access to any</text>
  <text x="456" y="294" font-family="Georgia, serif" font-size="10" fill="#3D2E20">endpoint for that service.</text>

  <text x="44" y="346" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1D2322">Three controls, facing three different directions</text>

  <rect x="44" y="358" width="250" height="98" rx="3" fill="#C4A484" opacity="0.14"/>
  <rect x="44" y="358" width="250" height="98" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="60" y="380" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8A6A44">Endpoint policy</text>
  <text x="60" y="400" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Which resources can be</text>
  <text x="60" y="414" font-family="Georgia, serif" font-size="10" fill="#3D2E20">reached <tspan font-weight="bold">from</tspan> this network.</text>
  <text x="60" y="436" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">aws:ResourceOrgID on the</text>
  <text x="60" y="449" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">endpoint itself</text>

  <rect x="305" y="358" width="250" height="98" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="305" y="358" width="250" height="98" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="321" y="380" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3F5A73">Resource policy</text>
  <text x="321" y="400" font-family="Georgia, serif" font-size="10" fill="#2E4256">Which networks can reach</text>
  <text x="321" y="414" font-family="Georgia, serif" font-size="10" fill="#2E4256"><tspan font-weight="bold">this</tspan> resource.</text>
  <text x="321" y="436" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">aws:SourceVpce or</text>
  <text x="321" y="449" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">aws:SourceVpc on the bucket</text>

  <rect x="566" y="358" width="250" height="98" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="566" y="358" width="250" height="98" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="582" y="380" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#5F6E38">Organisation policy</text>
  <text x="582" y="400" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Which resources our</text>
  <text x="582" y="414" font-family="Georgia, serif" font-size="10" fill="#3D4A22">identities may touch <tspan font-weight="bold">anywhere</tspan>.</text>
  <text x="582" y="436" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">aws:ResourceOrgID in an SCP,</text>
  <text x="582" y="449" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">covering every network path</text>

  <text x="44" y="486" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">AWS states the goal in one sentence: access can only be allowed if the identity is trusted, the resource is trusted, and the network is expected.</text>
</svg>
