<svg viewBox="0 0 860 512" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram about egress domain filtering in AWS Network Firewall, in three columns. The first column, what it reads: for HTTPS the TLS SNI, for HTTP the Host header, both written by the client, with no out-of-band DNS lookup and no IP address check. The second column, what it is scoped to: HOME_NET, which defaults to the CIDR of the inspection VPC, so traffic arriving from spoke VPCs over a transit gateway is not inspected at all until HOME_NET is set manually to include the spoke ranges. The third column, the escalation to TLS inspection, which decrypts and re-encrypts but drops traffic with no server name in the client hello, Encrypted Client Hello, QUIC, StartTLS, WebSockets over HTTP 2, and non-TLS traffic inside the configured scope. At the bottom, the summary: the domain is an assertion by the client, so AWS advises pairing domain rules with IP address rules.">
  <title>What an egress domain allowlist reads, what scopes it, and what the decrypting alternative refuses to carry</title>
  <rect width="860" height="512" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">A domain allowlist is a check on what the client says</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Three separable decisions, usually taken as one. The middle one defaults to inspecting nothing in a hub-and-spoke deployment.</text>

  <!-- Column 1: what it reads -->
  <rect x="44" y="80" width="243" height="196" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="44" y="80" width="243" height="196" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">1 &#183; What it reads</text>
  <text x="60" y="128" font-family="Consolas, monospace" font-size="10" fill="#2E4256">HTTPS &#8594; TLS SNI</text>
  <text x="60" y="145" font-family="Consolas, monospace" font-size="10" fill="#2E4256">HTTP  &#8594; Host header</text>
  <text x="60" y="171" font-family="Georgia, serif" font-size="10" fill="#2E4256">Both are written by the client.</text>
  <text x="60" y="196" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">No out-of-band DNS lookup.</text>
  <text x="60" y="211" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">The IP address is not checked.</text>
  <text x="60" y="240" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">So the allowlist constrains a</text>
  <text x="60" y="254" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">declaration, not a destination.</text>

  <!-- Column 2: what scopes it -->
  <rect x="308" y="80" width="243" height="196" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="308" y="80" width="243" height="196" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="324" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">2 &#183; What scopes it</text>
  <text x="324" y="128" font-family="Consolas, monospace" font-size="10" fill="#3D2E20">HOME_NET</text>
  <text x="324" y="152" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Defaults to the CIDR of the VPC</text>
  <text x="324" y="166" font-family="Georgia, serif" font-size="10" fill="#3D2E20">where the firewall is deployed.</text>
  <text x="324" y="191" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">In a central inspection VPC the</text>
  <text x="324" y="205" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">traffic comes from the spokes,</text>
  <text x="324" y="219" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">so nothing is inspected.</text>
  <text x="324" y="244" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">No error, no alarm. Set it to the</text>
  <text x="324" y="258" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">spoke CIDRs plus the local range.</text>

  <!-- Column 3: the escalation -->
  <rect x="572" y="80" width="244" height="196" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="572" y="80" width="244" height="196" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="588" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">3 &#183; The escalation</text>
  <text x="588" y="128" font-family="Georgia, serif" font-size="10" fill="#3D4A22">TLS inspection decrypts, inspects</text>
  <text x="588" y="142" font-family="Georgia, serif" font-size="10" fill="#3D4A22">and re-encrypts. Certificates in</text>
  <text x="588" y="156" font-family="Georgia, serif" font-size="10" fill="#3D4A22">AWS Certificate Manager.</text>
  <text x="588" y="181" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">It also drops, by design:</text>
  <text x="588" y="200" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">&#183; no server name in client hello</text>
  <text x="588" y="214" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">&#183; Encrypted Client Hello (RST)</text>
  <text x="588" y="228" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">&#183; QUIC, StartTLS</text>
  <text x="588" y="242" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">&#183; WebSockets over HTTP/2</text>
  <text x="588" y="256" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">&#183; non-TLS traffic inside the scope</text>

  <!-- path strip -->
  <text x="44" y="312" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1D2322">Where it sits, and what each hop can still see</text>

  <rect x="44" y="326" width="166" height="70" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="58" y="348" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">Spoke VPC</text>
  <text x="58" y="367" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">No internet gateway.</text>
  <text x="58" y="381" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Default route to the TGW.</text>

  <text x="219" y="366" font-family="Georgia, serif" font-size="15" fill="#8A6A44">&#8594;</text>

  <rect x="240" y="326" width="166" height="70" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="254" y="348" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">Transit gateway</text>
  <text x="254" y="367" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Source is still the spoke</text>
  <text x="254" y="381" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">address, not the hub's.</text>

  <text x="415" y="366" font-family="Georgia, serif" font-size="15" fill="#8A6A44">&#8594;</text>

  <rect x="436" y="326" width="180" height="70" rx="3" fill="#C4A484" opacity="0.18"/>
  <rect x="436" y="326" width="180" height="70" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="450" y="348" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8A6A44">Network Firewall</text>
  <text x="450" y="367" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">Reads SNI or Host &#8212; but</text>
  <text x="450" y="381" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">only if HOME_NET covers it.</text>

  <text x="625" y="366" font-family="Georgia, serif" font-size="15" fill="#8A6A44">&#8594;</text>

  <rect x="646" y="326" width="170" height="70" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="660" y="348" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">NAT gateway</text>
  <text x="660" y="367" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Fixed Elastic IPs out.</text>
  <text x="660" y="381" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">$0.395/endpoint-hour before.</text>

  <rect x="44" y="420" width="772" height="60" rx="3" fill="none" stroke="#B5654A" stroke-width="1.2"/>
  <text x="60" y="444" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">AWS states the mitigation, and it is not optional dressing</text>
  <text x="60" y="461" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Write separate IP address rules &#8220;to mitigate situations where the SNI or host headers have been</text>
  <text x="60" y="474" font-family="Georgia, serif" font-size="10" fill="#3D2E20">manipulated&#8221;, and use them in conjunction with the domain rules.</text>

  <text x="44" y="500" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">A control against accident and drift is worth having. Recording it as a control against a deliberate adversary is the error.</text>
</svg>
