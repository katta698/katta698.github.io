<svg viewBox="0 0 860 524" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of three egress paths out of a VPC and which control sits on each. The first path, to AWS services through a VPC endpoint, is governed by an endpoint policy and an organisation policy. The second path, to the internet through a transit gateway and a central inspection VPC, is governed by the Network Firewall domain allowlist. The third path, DNS resolution to the Route 53 VPC Resolver, is on neither of those controls, because AWS states Network Firewall has no visibility into queries made by the VPC Resolver; it is filtered instead by Resolver DNS Firewall rule groups associated with the VPC. Below the three paths, the DNS Firewall evaluation order is shown as four steps: rule groups in association priority order from the lowest number up, then rules within each group by rule priority, then first match terminates evaluation, and finally no match at all resolves as normal. A footer notes that the VPC fail mode defaults to closed, returning SERVFAIL.">
  <title>Three egress paths, three controls, and the one the inspection VPC never sees</title>
  <rect width="860" height="524" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">&#8220;Egress is controlled&#8221; is a sentence with no path in it</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">There are three paths out of a VPC. Each has a different control, and one of them is not in the inspection VPC at all.</text>

  <!-- Path 1 -->
  <rect x="44" y="80" width="243" height="150" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="44" y="80" width="243" height="150" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">Path 1 &#183; AWS services</text>
  <text x="60" y="126" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Workload &#8594; VPC endpoint &#8594; S3</text>
  <text x="60" y="150" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#5F6E38">Control: endpoint policy</text>
  <text x="60" y="167" font-family="Georgia, serif" font-size="10" fill="#3D4A22">plus aws:ResourceOrgID in an SCP.</text>
  <text x="60" y="192" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">Says nothing about the internet.</text>
  <text x="60" y="212" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Covered in #44.</text>

  <!-- Path 2 -->
  <rect x="308" y="80" width="243" height="150" rx="3" fill="#C4A484" opacity="0.16"/>
  <rect x="308" y="80" width="243" height="150" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="324" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8A6A44">Path 2 &#183; The internet</text>
  <text x="324" y="126" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Workload &#8594; TGW &#8594; inspection VPC</text>
  <text x="324" y="150" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8A6A44">Control: domain allowlist</text>
  <text x="324" y="167" font-family="Georgia, serif" font-size="10" fill="#3D2E20">on SNI or Host, scoped by HOME_NET.</text>
  <text x="324" y="192" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">Reads a client-supplied field.</text>
  <text x="324" y="212" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Covered in #45.</text>

  <!-- Path 3 -->
  <rect x="572" y="80" width="244" height="150" rx="3" fill="#B5654A" opacity="0.11"/>
  <rect x="572" y="80" width="244" height="150" rx="3" fill="none" stroke="#B5654A" stroke-width="1.8"/>
  <text x="588" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">Path 3 &#183; DNS resolution</text>
  <text x="588" y="126" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Workload &#8594; Route 53 VPC Resolver</text>
  <text x="588" y="150" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">Not on paths 1 or 2.</text>
  <text x="588" y="167" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Network Firewall has &#8220;no visibility</text>
  <text x="588" y="181" font-family="Georgia, serif" font-size="10" fill="#3D2E20">into queries made by VPC Resolver&#8221;.</text>
  <text x="588" y="206" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#8F4A32">Filtered only by Resolver</text>
  <text x="588" y="220" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#8F4A32">DNS Firewall rule groups.</text>

  <!-- evaluation order -->
  <text x="44" y="270" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1D2322">DNS Firewall evaluation order &#8212; first match wins, and everything below it is never consulted</text>

  <rect x="44" y="284" width="180" height="82" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="58" y="306" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">1 &#183; Rule groups</text>
  <text x="58" y="325" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">By association priority,</text>
  <text x="58" y="339" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">lowest number first.</text>
  <text x="58" y="356" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#8F4A32">Threat lists belong here.</text>

  <text x="233" y="330" font-family="Georgia, serif" font-size="15" fill="#8A6A44">&#8594;</text>

  <rect x="254" y="284" width="180" height="82" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="268" y="306" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">2 &#183; Rules in a group</text>
  <text x="268" y="325" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">By rule priority, lowest</text>
  <text x="268" y="339" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">number first. One list or</text>
  <text x="268" y="353" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">one protection per rule.</text>

  <text x="443" y="330" font-family="Georgia, serif" font-size="15" fill="#8A6A44">&#8594;</text>

  <rect x="464" y="284" width="180" height="82" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="464" y="284" width="180" height="82" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="478" y="306" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8F4A32">3 &#183; First match ends it</text>
  <text x="478" y="325" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">An Allow rule placed above</text>
  <text x="478" y="339" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">a managed list switches</text>
  <text x="478" y="353" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">that list off for its names.</text>

  <text x="653" y="330" font-family="Georgia, serif" font-size="15" fill="#8A6A44">&#8594;</text>

  <rect x="674" y="284" width="142" height="82" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="688" y="306" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">4 &#183; No match</text>
  <text x="688" y="325" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Resolves as normal.</text>
  <text x="688" y="339" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Deny-by-default must</text>
  <text x="688" y="353" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">be written explicitly.</text>

  <rect x="44" y="392" width="772" height="62" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="60" y="416" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">What a domain list cannot enumerate</text>
  <text x="60" y="437" font-family="Georgia, serif" font-size="10" fill="#2E4256">The attacker picks the domain, so you learn it afterwards. Advanced protections match the shape instead: DGA, DNS tunneling, Dictionary DGA</text>
  <text x="60" y="450" font-family="Georgia, serif" font-size="10" fill="#2E4256">&#8212; block or alert only, never allow, so a walled garden is always built from domain lists.</text>

  <text x="44" y="486" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Fail mode defaults to closed: no reply from DNS Firewall means the query is blocked and VPC Resolver returns SERVFAIL. Fail open is the deliberate opposite.</text>
  <text x="44" y="504" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">DNS Firewall filters the name only. It does not resolve it to an address, and it does not filter HTTPS, SSH, TLS or FTP.</text>
</svg>
