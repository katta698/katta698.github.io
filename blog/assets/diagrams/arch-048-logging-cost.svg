<svg viewBox="0 0 860 486" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of the three prices in an AWS log archive and how each behaves over time. The first price is delivery and ingestion, paid once per gigabyte: CloudWatch Logs Standard class ingestion at fifty cents per gigabyte, Infrequent Access at twenty-five cents, and vended logs delivery on a tiered scale from fifty cents per gigabyte below ten terabytes, twenty-five cents from ten to thirty terabytes, ten cents from thirty to fifty terabytes, and five cents above fifty terabytes, with the tiers resetting monthly and the same rate applying whether the destination is CloudWatch Logs, Amazon S3 or Amazon Data Firehose. The second price is retention, paid every month at three cents per gigabyte per month. The third is query, paid per use at one cent per gigabyte scanned by Logs Insights. A panel at the bottom shows the crossover: one gigabyte kept for one year costs eighty-six cents, of which fifty cents is ingestion, so cutting retention attacks the smaller half while cutting ingestion attacks the larger half but only for data that has not yet arrived.">
  <title>Ingestion is paid once and dominates a young archive; retention is small, recurring, and dominates an old one</title>
  <rect width="860" height="486" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">Three prices, three different half-lives</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Which one a saving acts on decides whether it is worth making. US East (N. Virginia) rates.</text>

  <!-- Price 1 -->
  <rect x="44" y="80" width="376" height="196" rx="3" fill="#B5654A" opacity="0.11"/>
  <rect x="44" y="80" width="376" height="196" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="60" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">1 &#183; Delivery and ingestion &#8212; paid once</text>

  <text x="60" y="128" font-family="Georgia, serif" font-size="10" fill="#3D2E20">CloudWatch Logs, Standard class</text>
  <text x="330" y="128" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#8F4A32">$0.50 /GB</text>
  <text x="60" y="145" font-family="Georgia, serif" font-size="10" fill="#3D2E20">CloudWatch Logs, Infrequent Access</text>
  <text x="330" y="145" font-family="Consolas, monospace" font-size="10" fill="#3D2E20">$0.25 /GB</text>

  <text x="60" y="172" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#3D2E20">Vended logs delivery &#8212; tiered, resets monthly</text>
  <text x="60" y="191" font-family="Georgia, serif" font-size="10" fill="#3D2E20">0 &#8211; 10 TB</text>
  <text x="330" y="191" font-family="Consolas, monospace" font-size="10" fill="#3D2E20">$0.50 /GB</text>
  <text x="60" y="207" font-family="Georgia, serif" font-size="10" fill="#3D2E20">10 &#8211; 30 TB</text>
  <text x="330" y="207" font-family="Consolas, monospace" font-size="10" fill="#3D2E20">$0.25 /GB</text>
  <text x="60" y="223" font-family="Georgia, serif" font-size="10" fill="#3D2E20">30 &#8211; 50 TB</text>
  <text x="330" y="223" font-family="Consolas, monospace" font-size="10" fill="#3D2E20">$0.10 /GB</text>
  <text x="60" y="239" font-family="Georgia, serif" font-size="10" fill="#3D2E20">50 TB and above</text>
  <text x="330" y="239" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#5F6E38">$0.05 /GB</text>

  <text x="60" y="263" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#8F4A32">Same rate to CloudWatch Logs, S3 or Firehose. S3 does not avoid it.</text>

  <!-- Price 2 and 3 -->
  <rect x="440" y="80" width="376" height="94" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="440" y="80" width="376" height="94" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="456" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">2 &#183; Retention &#8212; paid every month</text>
  <text x="456" y="128" font-family="Georgia, serif" font-size="10" fill="#2E4256">CloudWatch Logs storage</text>
  <text x="726" y="128" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#3F5A73">$0.03 /GB/mo</text>
  <text x="456" y="152" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">The only one that compounds. Identical in both log classes.</text>

  <rect x="440" y="186" width="376" height="90" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="440" y="186" width="376" height="90" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="456" y="210" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">3 &#183; Query &#8212; paid per use</text>
  <text x="456" y="234" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Logs Insights, per GB scanned</text>
  <text x="726" y="234" font-family="Consolas, monospace" font-size="10" fill="#3D4A22">$0.01 /GB</text>
  <text x="456" y="257" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">Negligible until an unbounded query scans the whole year.</text>

  <!-- crossover panel -->
  <rect x="44" y="300" width="772" height="106" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="60" y="324" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8A6A44">One gigabyte, Standard class, kept twelve months</text>

  <rect x="60" y="336" width="330" height="26" rx="2" fill="#B5654A" opacity="0.30"/>
  <text x="70" y="354" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#3D2E20">ingestion &#8212; $0.50, paid on day one</text>
  <rect x="390" y="336" width="238" height="26" rx="2" fill="#5B7B9A" opacity="0.30"/>
  <text x="400" y="354" font-family="Georgia, serif" font-size="10" fill="#2E4256">storage &#8212; $0.36 over the year</text>
  <text x="640" y="354" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#8A6A44">= $0.86</text>

  <text x="60" y="382" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Cutting retention attacks the right-hand bar, on data whose left-hand bar is already spent.</text>
  <text x="60" y="397" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Cutting what you ingest attacks both &#8212; but only for data that has not arrived yet.</text>

  <text x="44" y="434" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322">And separately, CloudTrail</text>
  <text x="44" y="452" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Management events are free for the first copy. Additional copies are $2.00 per 100,000 events; data events are $0.10 per 100,000.</text>
  <text x="44" y="467" font-family="Georgia, serif" font-size="10" fill="#3D2E20">A second trail over the same events is the usual source of a CloudTrail line nobody can explain.</text>
</svg>
