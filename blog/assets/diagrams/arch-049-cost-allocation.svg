<svg viewBox="0 0 860 508" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of three reasons an AWS cost is unallocated, each needing a different mechanism. The first is a tag that existed on the resource but was never activated in the Billing console; this is recoverable by requesting a backfill of up to twelve months, which retroactively applies the current activation status. The second is a resource that was never tagged at the time; this is not recoverable, because AWS states the resource tag must have been historically assigned for backfilled cost data to be available, so backfill changes an activation status rather than history. The third is a cost with no single owner, such as a NAT gateway, a transit gateway or enterprise support; this was never a tagging problem and needs split charge rules in Cost Categories, using a proportional, fixed or even allocation method. A panel across the bottom records the reporting caveat: split charge rules and the total allocated costs are presented only on the cost categories details page, and do not appear in or affect the Cost and Usage Report, Cost Explorer or other AWS Cost Management tools.">
  <title>Three reasons a cost is unallocated, and only one of them gives history back</title>
  <rect width="860" height="508" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">Tagging coverage measures one of these three</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Which is why a programme can report 94% coverage and still hand finance a report that does not reconcile.</text>

  <!-- 1 -->
  <rect x="44" y="82" width="243" height="206" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="44" y="82" width="243" height="206" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="106" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">1 &#183; Tagged, not activated</text>
  <text x="60" y="130" font-family="Georgia, serif" font-size="10" fill="#3D4A22">The tag was on the resource.</text>
  <text x="60" y="144" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Nobody activated the key in the</text>
  <text x="60" y="158" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Billing console.</text>

  <rect x="60" y="172" width="211" height="48" rx="3" fill="#8A9A5B" opacity="0.22"/>
  <text x="72" y="191" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#3D4A22">Backfill, up to 12 months</text>
  <text x="72" y="209" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">Applies today's activation status</text>

  <text x="60" y="242" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#5F6E38">Recoverable.</text>
  <text x="60" y="262" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">One request per 24 hours, and</text>
  <text x="60" y="275" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">none while another is running.</text>

  <!-- 2 -->
  <rect x="308" y="82" width="243" height="206" rx="3" fill="#B5654A" opacity="0.11"/>
  <rect x="308" y="82" width="243" height="206" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="324" y="106" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">2 &#183; Never tagged</text>
  <text x="324" y="130" font-family="Georgia, serif" font-size="10" fill="#3D2E20">The resource carried no tag at</text>
  <text x="324" y="144" font-family="Georgia, serif" font-size="10" fill="#3D2E20">the time the cost was incurred.</text>

  <rect x="324" y="158" width="211" height="62" rx="3" fill="#B5654A" opacity="0.18"/>
  <text x="336" y="177" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#3D2E20">&#8220;The resource tag must be</text>
  <text x="336" y="191" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#3D2E20">historically assigned to the AWS</text>
  <text x="336" y="205" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#3D2E20">resource for the backfilled cost</text>
  <text x="336" y="216" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#3D2E20">data to be available.&#8221;</text>

  <text x="324" y="242" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8F4A32">Not recoverable.</text>
  <text x="324" y="262" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Backfill changes an activation</text>
  <text x="324" y="275" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">status, not history.</text>

  <!-- 3 -->
  <rect x="572" y="82" width="244" height="206" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="572" y="82" width="244" height="206" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="588" y="106" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">3 &#183; No single owner</text>
  <text x="588" y="130" font-family="Georgia, serif" font-size="10" fill="#2E4256">NAT gateway. Transit gateway.</text>
  <text x="588" y="144" font-family="Georgia, serif" font-size="10" fill="#2E4256">Enterprise Support. Data transfer.</text>
  <text x="588" y="162" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">One owner in the tag, eleven in reality.</text>

  <rect x="588" y="176" width="212" height="62" rx="3" fill="#5B7B9A" opacity="0.20"/>
  <text x="600" y="195" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#2E4256">Split charge rules</text>
  <text x="600" y="212" font-family="Georgia, serif" font-size="9.5" fill="#2E4256">Source &#8594; targets, allocated</text>
  <text x="600" y="226" font-family="Georgia, serif" font-size="9.5" fill="#2E4256">Proportional, Fixed or Even</text>

  <text x="588" y="256" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3F5A73">Never a tagging problem.</text>
  <text x="588" y="276" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Max 10 rules per cost category.</text>

  <!-- caveat -->
  <rect x="44" y="314" width="772" height="76" rx="3" fill="#B5654A" opacity="0.09"/>
  <rect x="44" y="314" width="772" height="76" rx="3" fill="none" stroke="#B5654A" stroke-width="1.8"/>
  <text x="60" y="338" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">Where the shared-cost answer is allowed to be seen</text>
  <text x="60" y="359" font-family="Georgia, serif" font-size="10" fill="#3D2E20">&#8220;Split charge rules and the total allocated costs are only presented on the cost categories details page. These costs do not appear</text>
  <text x="60" y="374" font-family="Georgia, serif" font-size="10" fill="#3D2E20">and don&#8217;t impact your AWS Cost and Usage Reports, Cost Explorer, and other AWS Cost Management tools.&#8221;</text>

  <text x="44" y="428" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322">So decide the deliverable before configuring anything</text>
  <text x="44" y="447" font-family="Georgia, serif" font-size="10" fill="#3D2E20">A monthly statement a finance team reads and signs &#8212; the details page and its CSV are enough, and this is the shortest path to it.</text>
  <text x="44" y="462" font-family="Georgia, serif" font-size="10" fill="#3D2E20">A live chargeback dashboard &#8212; it is not enough, and the allocation has to be re-implemented downstream against the CUR.</text>

  <text x="44" y="492" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">The cost allocation report includes tagged and untagged resources and reconciles to the Bills page, so the residue is always visible. Show it.</text>
</svg>
