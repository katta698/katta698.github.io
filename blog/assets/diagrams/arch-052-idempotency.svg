<svg viewBox="0 0 860 520" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram: the three layers at which a duplicate request can be suppressed in AWS, and the boundary each one has. At the top, three sources issue retries that the application did not write: Lambda retries a failed asynchronous invocation up to two times by default, Amazon SQS makes a message visible again for another processing attempt if it is not deleted before the visibility timeout expires, and the client itself may retry after an ambiguous timeout. Below that, three suppression layers are shown with their limits. The transport layer is SQS FIFO deduplication, which prevents duplicates being sent into the queue within a five-minute deduplication interval, but is producer-side only and carries no absolute guarantee against redelivery to a consumer. The API layer is the Amazon EC2 client token, a string of up to 64 ASCII characters whose idempotency is scoped either regionally or zonally, so the same token used in another Region launches additional instances, and which returns an IdempotentParameterMismatch error if retried with different parameters. The application layer is an idempotency key held in DynamoDB, where a conditional write is idempotent only when the condition tests the same attribute being updated, and where the Powertools utility expires its records after one hour by default and raises an already-in-progress error when a second invocation arrives with the same payload before the first has completed. A panel at the bottom records the gap: a dead-letter queue replayed the morning after a three-hour incident falls outside both the five-minute deduplication interval and the one-hour record expiry, so every replayed message is new work by definition.">
  <title>Every layer suppresses duplicates within a boundary, and the boundaries differ</title>
  <rect width="860" height="520" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">You do not have to write a retry to get one</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Three layers can suppress a duplicate. Each one is bounded &#8212; by a window, by a scope, or by both.</text>

  <!-- retry sources -->
  <text x="44" y="79" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8F4A32">Who issued the retry</text>

  <rect x="44" y="88" width="250" height="52" rx="3" fill="#B5654A" opacity="0.11"/>
  <rect x="44" y="88" width="250" height="52" rx="3" fill="none" stroke="#B5654A" stroke-width="1.2"/>
  <text x="56" y="107" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">Lambda, asynchronously</text>
  <text x="56" y="123" font-family="Georgia, serif" font-size="9" fill="#3D2E20">Retries a failed async invocation</text>
  <text x="56" y="135" font-family="Georgia, serif" font-size="9" fill="#3D2E20">up to two times, by default.</text>

  <rect x="305" y="88" width="250" height="52" rx="3" fill="#B5654A" opacity="0.11"/>
  <rect x="305" y="88" width="250" height="52" rx="3" fill="none" stroke="#B5654A" stroke-width="1.2"/>
  <text x="317" y="107" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">SQS, on timeout expiry</text>
  <text x="317" y="123" font-family="Georgia, serif" font-size="9" fill="#3D2E20">Not deleted in time? The message</text>
  <text x="317" y="135" font-family="Georgia, serif" font-size="9" fill="#3D2E20">becomes visible again.</text>

  <rect x="566" y="88" width="250" height="52" rx="3" fill="#B5654A" opacity="0.11"/>
  <rect x="566" y="88" width="250" height="52" rx="3" fill="none" stroke="#B5654A" stroke-width="1.2"/>
  <text x="578" y="107" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">The client, on ambiguity</text>
  <text x="578" y="123" font-family="Georgia, serif" font-size="9" fill="#3D2E20">A timeout does not say whether</text>
  <text x="578" y="135" font-family="Georgia, serif" font-size="9" fill="#3D2E20">the work happened.</text>

  <!-- suppression layers -->
  <text x="44" y="167" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3F5A73">Where it can be suppressed &#8212; and the boundary of each</text>

  <rect x="44" y="176" width="250" height="156" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="44" y="176" width="250" height="156" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="56" y="197" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3F5A73">Transport</text>
  <text x="56" y="212" font-family="Consolas, monospace" font-size="8.5" fill="#2E4256">SQS FIFO deduplication</text>
  <text x="56" y="234" font-family="Georgia, serif" font-size="9.5" fill="#2E4256">Suppresses a duplicate</text>
  <text x="56" y="247" font-family="Georgia, serif" font-size="9.5" font-weight="bold" fill="#2E4256">send, within 5 minutes.</text>
  <text x="56" y="270" font-family="Georgia, serif" font-size="9.5" fill="#2E4256">Producer-side only.</text>
  <text x="56" y="292" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#8F4A32">&#8220;no absolute guarantee</text>
  <text x="56" y="304" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#8F4A32">that a message won&#8217;t be</text>
  <text x="56" y="316" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#8F4A32">delivered more than once&#8221;</text>

  <rect x="305" y="176" width="250" height="156" rx="3" fill="#C4A484" opacity="0.20"/>
  <rect x="305" y="176" width="250" height="156" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="317" y="197" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8A6A44">API</text>
  <text x="317" y="212" font-family="Consolas, monospace" font-size="8.5" fill="#6B6560">EC2 ClientToken</text>
  <text x="317" y="234" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">Up to 64 ASCII characters.</text>
  <text x="317" y="256" font-family="Georgia, serif" font-size="9.5" font-weight="bold" fill="#8A6A44">Scope: Regional or zonal.</text>
  <text x="317" y="272" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">The same token in another</text>
  <text x="317" y="284" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">Region launches more.</text>
  <text x="317" y="306" font-family="Georgia, serif" font-size="9" fill="#6B6560">Different parameters &#8594;</text>
  <text x="317" y="318" font-family="Consolas, monospace" font-size="8" fill="#8F4A32">IdempotentParameterMismatch</text>

  <rect x="566" y="176" width="250" height="156" rx="3" fill="#8A9A5B" opacity="0.14"/>
  <rect x="566" y="176" width="250" height="156" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="578" y="197" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#5F6E38">Application</text>
  <text x="578" y="212" font-family="Consolas, monospace" font-size="8.5" fill="#3D4A22">idempotency key in DynamoDB</text>
  <text x="578" y="234" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">Conditional write &#8212; the</text>
  <text x="578" y="246" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">condition must test the</text>
  <text x="578" y="258" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22">attribute being updated.</text>
  <text x="578" y="280" font-family="Georgia, serif" font-size="9.5" font-weight="bold" fill="#5F6E38">Records expire after</text>
  <text x="578" y="293" font-family="Georgia, serif" font-size="9.5" font-weight="bold" fill="#5F6E38">1 hour, by default.</text>
  <text x="578" y="315" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#6B6560">In progress &#8594; fail closed.</text>

  <!-- the gap -->
  <rect x="44" y="356" width="772" height="76" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="44" y="356" width="772" height="76" rx="3" fill="none" stroke="#B5654A" stroke-width="1.8"/>
  <text x="60" y="380" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">The window every default misses</text>
  <text x="60" y="401" font-family="Georgia, serif" font-size="10" fill="#3D2E20">A dead-letter queue replayed the morning after a three-hour incident is outside the 5-minute interval and outside the 1-hour expiry.</text>
  <text x="60" y="419" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">Every replayed message is new work by definition &#8212; and that replay is the case the guard was bought for.</text>

  <text x="44" y="458" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">The question is not whether the system is idempotent. It is for how long, and within what scope &#8212; those two answers are the design.</text>
  <text x="44" y="476" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Each boundary above is a default somebody accepted rather than chose: right for the retry you imagine, wrong for the replay that reaches a customer.</text>
</svg>
