<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the four Azure management scopes nested inside one another, showing what each scope is a boundary for and which limit applies at each level">
  <title>Azure scope hierarchy: management group, subscription, resource group, resource</title>
  <rect x="0" y="0" width="860" height="470" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Four scopes, one hierarchy per directory</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Settings applied at a scope inherit downward. Nothing inherits upward, and a child cannot decline what a parent assigned.</text>

  <rect x="44" y="76" width="500" height="352" rx="8" fill="#FFFFFF" stroke="#C4A484" stroke-width="1.5"/>
  <text x="60" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Tenant root management group</text>
  <text x="60" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Cannot be moved or deleted. New subscriptions land here by default.</text>

  <rect x="64" y="126" width="460" height="286" rx="7" fill="#FAF7F3" stroke="#C4A484" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="80" y="147" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Management groups &#8212; up to six levels deep</text>
  <text x="80" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Depth excludes the root and the subscription level. One parent each.</text>

  <rect x="84" y="176" width="420" height="222" rx="7" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="100" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Subscription</text>
  <text x="100" y="214" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Billing boundary, quota boundary, and the limit most designs hit first.</text>

  <rect x="104" y="228" width="380" height="152" rx="7" fill="#F4F8FC" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="120" y="250" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Resource group</text>
  <text x="120" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Lifecycle boundary. Deleting it deletes everything inside it.</text>
  <text x="120" y="281" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Holds metadata in its own region; its resources may sit elsewhere.</text>

  <rect x="124" y="294" width="340" height="70" rx="6" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.5"/>
  <text x="140" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Resource</text>
  <text x="140" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Belongs to exactly one resource group. Can be moved between them.</text>
  <text x="140" y="347" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Does not inherit the tags applied to its resource group.</text>

  <text x="576" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The limit that bites at each level</text>

  <rect x="576" y="112" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="590" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Management group</text>
  <text x="590" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">10,000 per directory</text>
  <text x="590" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">500 role assignments each</text>

  <rect x="576" y="180" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="590" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Subscription</text>
  <text x="590" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">980 resource groups</text>
  <text x="590" y="230" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">4,000 role assignments</text>

  <rect x="576" y="248" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="590" y="268" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Resource group</text>
  <text x="590" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">800 of each resource type</text>
  <text x="590" y="298" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">800 deployments in history</text>

  <rect x="576" y="316" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="590" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Any resource or group</text>
  <text x="590" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">50 tags</text>
  <text x="590" y="366" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">512-char keys, 256-char values</text>

  <text x="44" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A role assignment or policy can be placed at any of ten inheriting scopes: the root, six management group levels, the subscription, the group, the resource.</text>
</svg>
