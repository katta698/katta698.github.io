<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: one Microsoft Entra tenant trusted by many Azure subscriptions, showing which objects live in the directory and which live in the subscription, and what is destroyed when a subscription is moved to a different tenant">
  <title>The trust relationship between a Microsoft Entra tenant and Azure subscriptions</title>
  <rect x="0" y="0" width="860" height="500" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">One directory, many subscriptions &#8212; and a one-way trust</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A subscription trusts exactly one tenant. A tenant can be trusted by many. The trust is what turns a sign-in into an authorisation.</text>

  <rect x="44" y="78" width="772" height="128" rx="8" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1D2322">Microsoft Entra tenant (the directory)</text>
  <text x="60" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Holds identities. Has its own initial domain, contoso.onmicrosoft.com, and its own roles.</text>

  <rect x="60" y="130" width="176" height="58" rx="6" fill="#F4F7FA" stroke="#5B7B9A" stroke-width="1"/>
  <text x="72" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Users and groups</text>
  <text x="72" y="167" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sign in here. May be guests</text>
  <text x="72" y="180" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">in other directories too.</text>

  <rect x="248" y="130" width="176" height="58" rx="6" fill="#F4F7FA" stroke="#5B7B9A" stroke-width="1"/>
  <text x="260" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Service principals</text>
  <text x="260" y="167" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">App registrations and</text>
  <text x="260" y="180" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">managed identities.</text>

  <rect x="436" y="130" width="176" height="58" rx="6" fill="#F4F7FA" stroke="#5B7B9A" stroke-width="1"/>
  <text x="448" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Entra roles</text>
  <text x="448" y="167" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Global Administrator and</text>
  <text x="448" y="180" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">the rest. Directory only.</text>

  <rect x="624" y="130" width="176" height="58" rx="6" fill="#FFF8F0" stroke="#C4A484" stroke-width="1"/>
  <text x="636" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Not Azure roles</text>
  <text x="636" y="167" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Global Admin grants no</text>
  <text x="636" y="180" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">access to resources.</text>

  <text x="404" y="228" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#5B7B9A">trusts</text>
  <path d="M 200 244 L 200 216 L 620 216 L 620 244" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <path d="M 200 244 l -4 -8 l 8 0 z" fill="#5B7B9A"/>
  <path d="M 620 244 l -4 -8 l 8 0 z" fill="#5B7B9A"/>
  <path d="M 410 244 L 410 216" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <path d="M 410 244 l -4 -8 l 8 0 z" fill="#5B7B9A"/>

  <rect x="44" y="248" width="240" height="94" rx="7" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.5"/>
  <text x="58" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Subscription A</text>
  <text x="58" y="288" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Resources, resource groups,</text>
  <text x="58" y="301" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">and the Azure RBAC role</text>
  <text x="58" y="314" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">assignments that point at</text>
  <text x="58" y="327" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">identities in the directory.</text>

  <rect x="300" y="248" width="240" height="94" rx="7" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.5"/>
  <text x="314" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Subscription B</text>
  <text x="314" y="288" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Same directory, separate</text>
  <text x="314" y="301" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">billing and separate quota.</text>
  <text x="314" y="314" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">One assignment high in the</text>
  <text x="314" y="327" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">hierarchy can reach both.</text>

  <rect x="556" y="248" width="260" height="94" rx="7" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.5"/>
  <text x="570" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Subscription C</text>
  <text x="570" y="288" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Could trust a different tenant</text>
  <text x="570" y="301" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">instead &#8212; but only one, and</text>
  <text x="570" y="314" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">changing it destroys every</text>
  <text x="570" y="327" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">role assignment it holds.</text>

  <rect x="44" y="362" width="772" height="112" rx="8" fill="#FDF6F5" stroke="#E24B4A" stroke-width="1.2"/>
  <text x="60" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Moving a subscription to another tenant: what does not survive</text>
  <text x="60" y="404" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Permanently deleted: every role assignment, every custom role. Classic administrators lose access too.</text>
  <text x="60" y="420" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Rebuild by hand: system-assigned identities re-enabled, user-assigned identities re-created and re-attached,</text>
  <text x="60" y="436" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">key vault tenant IDs updated, access policies re-added, storage and Data Lake ACLs re-applied.</text>
  <text x="60" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Cannot move at all: AKS clusters, Entra Domain Services, Databricks, Dev Box, and databases using Entra auth.</text>
  <text x="60" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The resources themselves stay put. It is the authorisation layer on top of them that is thrown away.</text>
</svg>
