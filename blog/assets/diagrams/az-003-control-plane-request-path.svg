<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the path of a control plane request through management.azure.com and Azure Resource Manager to a resource provider, with the governance controls ARM applies on the way, and a separate data plane path that bypasses ARM entirely">
  <title>Control plane and data plane request paths in Azure</title>
  <rect x="0" y="0" width="860" height="470" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Two doors into the same resource</text>
  <text x="44" y="56" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Every governance control you configure sits on the top path. The bottom path does not pass through any of them.</text>

  <text x="44" y="88" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5B7B9A">CONTROL PLANE &#8212; manage the resource</text>

  <rect x="44" y="100" width="120" height="58" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="58" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Portal, CLI,</text>
  <text x="58" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">SDK, Terraform</text>

  <path d="M 168 129 L 204 129" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <path d="M 204 129 l -8 -4 l 0 8 z" fill="#5B7B9A"/>

  <rect x="208" y="100" width="150" height="58" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="222" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">management.azure.com</text>
  <text x="222" y="140" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">one global endpoint</text>

  <path d="M 362 129 L 398 129" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <path d="M 398 129 l -8 -4 l 0 8 z" fill="#5B7B9A"/>

  <rect x="402" y="88" width="264" height="140" rx="7" fill="#F4F7FA" stroke="#5B7B9A" stroke-width="1.6"/>
  <text x="416" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Azure Resource Manager</text>
  <text x="416" y="128" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Authenticates, then applies, in order:</text>
  <text x="416" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">1. Azure RBAC &#8212; may this principal?</text>
  <text x="416" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">2. Azure Policy &#8212; is this allowed here?</text>
  <text x="416" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">3. Management locks &#8212; is it protected?</text>
  <text x="416" y="199" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">4. Throttling &#8212; any tokens left?</text>
  <text x="416" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">5. Activity log &#8212; record what happened</text>

  <path d="M 670 129 L 706 129" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <path d="M 706 129 l -8 -4 l 0 8 z" fill="#5B7B9A"/>

  <rect x="710" y="100" width="106" height="58" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="724" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Resource</text>
  <text x="724" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">provider</text>

  <rect x="44" y="252" width="772" height="76" rx="7" fill="#FFFFFF" stroke="#C4A484" stroke-width="1.2"/>
  <text x="58" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">The throttle is a shared budget, not a per-tool one</text>
  <text x="58" y="294" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Per subscription, per service principal, per operation type: reads hold 250 tokens refilling at 25 a second;</text>
  <text x="58" y="310" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">writes and deletes hold 200 refilling at 10. Exhaust the bucket and every caller sharing it gets HTTP 429.</text>

  <text x="44" y="364" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#3D9970">DATA PLANE &#8212; use the resource</text>

  <rect x="44" y="376" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.4"/>
  <text x="58" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Application,</text>
  <text x="58" y="414" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">RDP, SQL client</text>

  <path d="M 168 402 L 706 402" fill="none" stroke="#3D9970" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 706 402 l -8 -4 l 0 8 z" fill="#3D9970"/>
  <text x="250" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3D9970">straight to the resource endpoint &#8212; myaccount.blob.core.windows.net</text>
  <text x="250" y="422" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">No RBAC-on-management, no policy, no lock, no activity log entry. Its own credentials, its own limits.</text>

  <rect x="710" y="376" width="106" height="52" rx="6" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.4"/>
  <text x="724" y="406" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Resource</text>

  <text x="44" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The planes fail independently: when management.azure.com is unavailable the application keeps reading and writing its data.</text>
</svg>
