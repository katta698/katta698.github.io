<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: geographies as fixed data residency boundaries containing regions, regions containing datacenters, and sovereign clouds as separate deployments of Azure with their own endpoints">
  <title>Geographies, regions and sovereign clouds</title>
  <rect x="0" y="0" width="860" height="470" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Three nested things, and one that is not nested at all</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A geography is a promise about where data stays. A region is a set of buildings. A sovereign cloud is a different Azure.</text>

  <rect x="44" y="78" width="470" height="196" rx="8" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1D2322">Geography &#8212; a fixed data residency boundary</text>
  <text x="60" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">United States, Europe, India. Every region sits inside exactly one, and at</text>
  <text x="60" y="133" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">least one region in each geography has availability zones.</text>

  <rect x="62" y="146" width="212" height="112" rx="6" fill="#F4F7FA" stroke="#5B7B9A" stroke-width="1"/>
  <text x="76" y="167" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Region</text>
  <text x="76" y="185" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">One or more datacenters on a</text>
  <text x="76" y="199" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">high-capacity, fault-tolerant,</text>
  <text x="76" y="213" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">low-latency network, usually</text>
  <text x="76" y="227" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">inside one metropolitan area.</text>
  <text x="76" y="247" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">May have availability zones.</text>

  <rect x="288" y="146" width="212" height="112" rx="6" fill="#F4F7FA" stroke="#5B7B9A" stroke-width="1"/>
  <text x="302" y="167" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Region</text>
  <text x="302" y="185" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Some regions are paired with</text>
  <text x="302" y="199" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">one other region. You cannot</text>
  <text x="302" y="213" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">choose the pair, and many</text>
  <text x="302" y="227" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">newer regions have none &#8212;</text>
  <text x="302" y="247" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">they use zones instead.</text>

  <rect x="534" y="78" width="282" height="196" rx="8" fill="#FDF6F5" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="550" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1D2322">Sovereign cloud</text>
  <text x="550" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Not a region of global Azure. A separate</text>
  <text x="550" y="135" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">deployment with its own endpoints:</text>
  <text x="550" y="158" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">portal.azure.com &#8594; portal.azure.us</text>
  <text x="550" y="176" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">management.azure.com &#8594;</text>
  <text x="562" y="190" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">management.usgovcloudapi.net</text>
  <text x="550" y="208" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">login.microsoftonline.com &#8594; .us</text>
  <text x="550" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Separate portals that share no information.</text>
  <text x="550" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Fewer services, and some feature gaps.</text>

  <rect x="44" y="292" width="772" height="70" rx="7" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.3"/>
  <text x="60" y="314" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Nonregional services sit outside all of this</text>
  <text x="60" y="334" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Some services are not deployed to a region at all. Microsoft deploys them across two or more regions, so a regional</text>
  <text x="60" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">failure leaves a healthy instance serving requests. Entra ID lets you pick the geographic area its data lives in.</text>

  <rect x="44" y="378" width="772" height="70" rx="7" fill="#FFF8F0" stroke="#C4A484" stroke-width="1.3"/>
  <text x="60" y="400" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The choice that is hard to reverse</text>
  <text x="60" y="420" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Region selection is usually reversible with effort. Cloud selection is not: data cannot be moved from global Azure to</text>
  <text x="60" y="436" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Azure Government, a Log Analytics workspace cannot cross, and Lighthouse cannot delegate between the two.</text>
</svg>
