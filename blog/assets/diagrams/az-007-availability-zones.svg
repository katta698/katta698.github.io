<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: a region containing three availability zones, the three deployment shapes zonal, zone-redundant and nonzonal, and the mapping of logical zone numbers to physical zones differing between two subscriptions">
  <title>Availability zones: the three deployment shapes, and why zone 1 is not zone 1</title>
  <rect x="0" y="0" width="860" height="490" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Three ways to sit in a region, and only one of them survives a zone</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Zones are separate datacenters with independent power, cooling and networking, a few kilometres apart, under 100 km.</text>

  <rect x="44" y="78" width="248" height="150" rx="7" fill="#FFFFFF" stroke="#C4A484" stroke-width="1.4"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Zonal</text>
  <text x="58" y="119" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">You pick one zone. The resource is</text>
  <text x="58" y="133" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">isolated from faults in other zones,</text>
  <text x="58" y="147" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">and dies with its own.</text>
  <text x="58" y="169" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">No automatic resilience. Failover is</text>
  <text x="58" y="183" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">yours to build and yours to run.</text>
  <text x="58" y="205" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Useful when latency between two</text>
  <text x="58" y="219" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">chatty components matters most.</text>

  <rect x="306" y="78" width="248" height="150" rx="7" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.4"/>
  <text x="320" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Zone-redundant</text>
  <text x="320" y="119" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The service spreads the resource</text>
  <text x="320" y="133" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">across zones and replicates data</text>
  <text x="320" y="147" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">between them.</text>
  <text x="320" y="169" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Microsoft handles the failover.</text>
  <text x="320" y="183" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Usually Microsoft picks the zones.</text>
  <text x="320" y="205" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Resilient to a zone failure as long</text>
  <text x="320" y="219" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">as it uses two or more zones.</text>

  <rect x="568" y="78" width="248" height="150" rx="7" fill="#FDF6F5" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="582" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Nonzonal (regional)</text>
  <text x="582" y="119" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">You said nothing, or the region has</text>
  <text x="582" y="133" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">no zones. Azure may place it in any</text>
  <text x="582" y="147" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">zone and does not tell you which.</text>
  <text x="582" y="169" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">If that zone fails, the resource may</text>
  <text x="582" y="183" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">go with it.</text>
  <text x="582" y="205" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">This is the default, and it is the one</text>
  <text x="582" y="219" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">most estates are actually running.</text>

  <rect x="44" y="248" width="772" height="128" rx="8" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1D2322">Your zone 1 is not my zone 1</text>
  <text x="60" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Each datacenter has a physical zone. Your subscription gets its own mapping of logical numbers to physical zones,</text>
  <text x="60" y="306" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">assigned when the subscription was created. Two subscriptions can disagree about what zone 1 means.</text>

  <rect x="70" y="320" width="330" height="44" rx="6" fill="#F4F7FA" stroke="#5B7B9A" stroke-width="1"/>
  <text x="84" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Subscription A</text>
  <text x="84" y="354" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#5A6260">logical 2  &#8594;  physical zone 1</text>

  <rect x="440" y="320" width="330" height="44" rx="6" fill="#F4F7FA" stroke="#5B7B9A" stroke-width="1"/>
  <text x="454" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Subscription B</text>
  <text x="454" y="354" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#5A6260">logical 3  &#8594;  physical zone 1</text>

  <rect x="44" y="392" width="772" height="76" rx="7" fill="#FFF8F0" stroke="#C4A484" stroke-width="1.3"/>
  <text x="60" y="414" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Two numbers worth remembering</text>
  <text x="60" y="434" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Microsoft targets inter-zone round-trip latency below approximately 2 milliseconds, which is what makes synchronous</text>
  <text x="60" y="450" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">replication across zones practical. And data transfer between zones in the same region is not charged, on any IP type.</text>
</svg>
