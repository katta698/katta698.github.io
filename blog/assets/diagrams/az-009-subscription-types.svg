<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the four Azure billing account types with their scope hierarchies and subscription ceilings, and the rule that deleted and disabled subscriptions still count toward the limit">
  <title>The four billing account types and what each one shapes</title>
  <rect x="0" y="0" width="860" height="470" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The agreement you signed decides the shape of everything above the subscription</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Same Azure underneath. Different hierarchy, different ceilings, different people who are allowed to create a subscription.</text>

  <rect x="44" y="78" width="186" height="196" rx="7" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Online Services</text>
  <text x="58" y="115" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Signed up on the website</text>
  <text x="58" y="140" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">billing account</text>
  <text x="58" y="156" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">  &#8735; subscription</text>
  <text x="58" y="184" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Invoice is at the</text>
  <text x="58" y="198" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">subscription.</text>
  <text x="58" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E24B4A">max 5 subscriptions</text>
  <text x="58" y="244" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">More is granted case by</text>
  <text x="58" y="258" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">case, on your history.</text>

  <rect x="240" y="78" width="186" height="196" rx="7" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.4"/>
  <text x="254" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Enterprise Agreement</text>
  <text x="254" y="115" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Organisation signed an EA</text>
  <text x="254" y="140" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">enrollment</text>
  <text x="254" y="156" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">  &#8735; department</text>
  <text x="254" y="172" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">      &#8735; account</text>
  <text x="254" y="198" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Invoice at the enrollment.</text>
  <text x="254" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3D9970">5,000 per account</text>
  <text x="254" y="244" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Unlimited accounts, so</text>
  <text x="254" y="258" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">add accounts to grow.</text>

  <rect x="436" y="78" width="186" height="196" rx="7" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.4"/>
  <text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Customer Agreement</text>
  <text x="450" y="115" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Signed with Microsoft</text>
  <text x="450" y="140" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">billing account</text>
  <text x="450" y="156" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">  &#8735; billing profile</text>
  <text x="450" y="172" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">      &#8735; invoice section</text>
  <text x="450" y="198" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Invoice at the profile.</text>
  <text x="450" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3D9970">10,000 enterprise</text>
  <text x="450" y="244" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">But only 5 for an</text>
  <text x="450" y="258" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">individual MCA.</text>

  <rect x="632" y="78" width="184" height="196" rx="7" fill="#FFF8F0" stroke="#C4A484" stroke-width="1.4"/>
  <text x="646" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Partner Agreement</text>
  <text x="646" y="115" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Bought through a CSP</text>
  <text x="646" y="140" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">billing account</text>
  <text x="646" y="156" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">  &#8735; billing profile</text>
  <text x="646" y="172" font-family="'DM Mono', Consolas, monospace" font-size="9.5" fill="#1D2322">      &#8735; customer</text>
  <text x="646" y="198" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">One profile per currency.</text>
  <text x="646" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3D9970">10,000 subscriptions</text>
  <text x="646" y="244" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Reseller is an optional</text>
  <text x="646" y="258" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">level in two-tier CSP.</text>

  <rect x="44" y="294" width="772" height="72" rx="7" fill="#FDF6F5" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="60" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The counting rule that surprises people</text>
  <text x="60" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Regardless of a subscription's state, it counts toward the limit. Deleted and disabled subscriptions are included, so a</text>
  <text x="60" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">team that creates and tears down subscriptions for testing can exhaust a ceiling it believes it is nowhere near.</text>

  <rect x="44" y="384" width="772" height="68" rx="7" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.3"/>
  <text x="60" y="406" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">And the advice that cuts against the instinct</text>
  <text x="60" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Microsoft recommends against creating multiple subscriptions just to implement access boundaries. To separate</text>
  <text x="60" y="442" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">resources with an access boundary, use a resource group instead. A subscription is, generally, a billing container.</text>
</svg>
