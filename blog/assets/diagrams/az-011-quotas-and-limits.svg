<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 706" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: how Azure counts quotas and limits, showing the two-tier standard vCPU check where a request passes the VM-family quota but fails the total regional vCPU quota, the five different scopes a ceiling can be counted at from tenant down to resource group, and the three kinds of ceiling with the route to raising each one">
  <title>Where an Azure ceiling is counted, and which kind of ceiling it is</title>
  <rect x="0" y="0" width="860" height="706" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A deployment is checked against more than one ceiling, and they are not counted at the same scope</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Everything below is per subscription unless the row says otherwise. Passing one check does not mean the request is admitted.</text>

  <rect x="44" y="78" width="772" height="150" rx="7" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.6"/>
  <text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Standard vCPU quota is enforced at two tiers, per subscription, per region</text>

  <rect x="60" y="112" width="150" height="52" rx="5" fill="#F1F3F5" stroke="#8A9290" stroke-width="1.1"/>
  <text x="72" y="132" font-family="'DM Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#1D2322">deploy 8 x D4s_v5</text>
  <text x="72" y="150" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">32 vCPUs, West Europe</text>

  <text x="216" y="142" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6260">&#8594;</text>

  <rect x="234" y="112" width="266" height="52" rx="5" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.4"/>
  <text x="246" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3D9970">Tier 2 &#183; VM-family vCPU quota</text>
  <text x="246" y="150" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Standard DSv5 Family vCPUs &#8212; room to spare, passes</text>

  <text x="506" y="142" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6260">&#8594;</text>

  <rect x="524" y="112" width="278" height="52" rx="5" fill="#FDF6F5" stroke="#E24B4A" stroke-width="1.6"/>
  <text x="536" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E24B4A">Tier 1 &#183; Total Regional vCPUs</text>
  <text x="536" y="150" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Counted across every family in the region &#8212; fails</text>

  <text x="60" y="186" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">On a new subscription the default total regional vCPU quota is not the sum of the individual VM-family defaults. So every family</text>
  <text x="60" y="202" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">quota can read as healthy while the regional total is the thing refusing the deployment. Raising a family quota does raise the</text>
  <text x="60" y="218" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">regional total by the same amount &#8212; but the regional total can also be short on its own, and then it has to be asked for directly.</text>

  <text x="44" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1D2322">Where the ceiling is counted &#8212; five different scopes, one table in the docs</text>

  <rect x="44" y="276" width="772" height="34" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="60" y="297" font-family="'DM Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#5B7B9A">per tenant</text>
  <text x="240" y="297" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Management groups: 10,000 &#183; Azure custom roles: 5,000 &#183; hierarchy depth: root plus 6 levels</text>

  <rect x="44" y="316" width="772" height="34" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="60" y="337" font-family="'DM Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#5B7B9A">per management group</text>
  <text x="240" y="337" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Role assignments: 500 &#183; deployments: 800 &#183; subscriptions beneath it: unlimited</text>

  <rect x="44" y="356" width="772" height="34" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="60" y="377" font-family="'DM Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#5B7B9A">per subscription</text>
  <text x="240" y="377" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Resource groups: 980 &#183; role assignments: 4,000 &#183; subscription-level deployments: 800</text>

  <rect x="44" y="396" width="772" height="34" rx="5" fill="#F5F8FA" stroke="#5B7B9A" stroke-width="1.6"/>
  <text x="60" y="417" font-family="'DM Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#5B7B9A">per subscription, per region</text>
  <text x="240" y="417" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Every networking limit &#183; storage accounts: 250 default, 500 maximum &#183; all vCPU quotas</text>

  <rect x="44" y="436" width="772" height="34" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="60" y="457" font-family="'DM Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#5B7B9A">per resource group</text>
  <text x="240" y="457" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">800 instances of each resource type &#8212; not 800 resources &#183; deployment history: 800 &#183; tags: 50</text>

  <text x="44" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The scope is the part that changes what you build. A per-region ceiling is not relieved by adding a subscription; a per-subscription</text>
  <text x="44" y="508" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">one is not relieved by adding a region.</text>

  <text x="44" y="546" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1D2322">Three kinds of ceiling, three different ways out</text>

  <rect x="44" y="560" width="248" height="118" rx="7" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.4"/>
  <text x="60" y="582" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#3D9970">Adjustable quota</text>
  <text x="60" y="602" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Has a default and a maximum. Raise it</text>
  <text x="60" y="617" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">yourself from My quotas; usually</text>
  <text x="60" y="632" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">answered within minutes.</text>
  <text x="60" y="654" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Needs Contributor. No cost.</text>
  <text x="60" y="670" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Approval is not guaranteed.</text>

  <rect x="306" y="560" width="248" height="118" rx="7" fill="#FFFFFF" stroke="#C4A484" stroke-width="1.4"/>
  <text x="322" y="582" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9A7B57">Non-adjustable quota</text>
  <text x="322" y="602" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">A hard limit, usually set by the scope</text>
  <text x="322" y="617" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">of the subscription. There is no self-</text>
  <text x="322" y="632" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">service path.</text>
  <text x="322" y="654" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Support request only.</text>
  <text x="322" y="670" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Design around it, not through it.</text>

  <rect x="568" y="560" width="248" height="118" rx="7" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="584" y="582" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#E24B4A">Rate limit</text>
  <text x="584" y="602" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Not a count of resources at all. A token</text>
  <text x="584" y="617" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">bucket per region, refilled per second.</text>
  <text x="584" y="632" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Returns 429 with Retry-After.</text>
  <text x="584" y="654" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Cannot be raised. Back off.</text>
  <text x="584" y="670" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Fix the caller, not the quota.</text>

  <text x="44" y="698" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5B7B9A">A granted quota does not reserve capacity. It is permission to ask, not a promise the region can serve it.</text>
</svg>
