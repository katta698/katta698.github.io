<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 838" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: what an Azure naming convention has to survive, showing one convention applied to five resource types where container registry and storage account reject the hyphen delimiter, the twenty-four character budget for a storage account name and how little of it is left for the workload, the five scopes a name must be unique within, and the split between the parts of an identity that can never be changed and the parts that can">
  <title>The three platform constraints on an Azure name, and the one that decides what may go in it</title>
  <rect x="0" y="0" width="860" height="838" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A naming convention is a schema, and Azure enforces a different schema for every resource type</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Scope of uniqueness, length and valid characters all vary by type. The convention is whatever survives all three at once.</text>

  <rect x="44" y="78" width="772" height="224" rx="7" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">One convention, five resource types. Only three of them accept the delimiter.</text>

  <text x="60" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Resource type</text>
  <text x="196" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Name as the convention writes it</text>
  <text x="444" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Length and valid characters</text>
  <text x="690" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Result</text>
  <line x1="60" y1="132" x2="800" y2="132" stroke="#E3E1DD" stroke-width="1"/>

  <text x="60" y="152" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Resource group</text>
  <text x="196" y="152" font-family="DM Mono, Consolas, monospace" font-size="10" fill="#1D2322">rg-retail-prod-weu-001</text>
  <text x="444" y="152" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">1-90, hyphens and periods allowed</text>
  <text x="690" y="152" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#3D9970">accepted</text>

  <text x="60" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Virtual network</text>
  <text x="196" y="176" font-family="DM Mono, Consolas, monospace" font-size="10" fill="#1D2322">vnet-retail-prod-weu-001</text>
  <text x="444" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">2-64, alphanumerics, underscore, period, hyphen</text>
  <text x="690" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#3D9970">accepted</text>

  <text x="60" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Key vault</text>
  <text x="196" y="200" font-family="DM Mono, Consolas, monospace" font-size="10" fill="#1D2322">kv-retail-prod-weu-001</text>
  <text x="444" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">3-24, no consecutive hyphens</text>
  <text x="690" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9A7B57">accepted, 22 of 24</text>

  <text x="60" y="224" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Container registry</text>
  <text x="196" y="224" font-family="DM Mono, Consolas, monospace" font-size="10" fill="#1D2322">cr-retail-prod-weu-001</text>
  <text x="444" y="224" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">5-50, alphanumerics only</text>
  <text x="690" y="224" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#E24B4A">rejected</text>

  <text x="60" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Storage account</text>
  <text x="196" y="248" font-family="DM Mono, Consolas, monospace" font-size="10" fill="#1D2322">st-retail-prod-weu-001</text>
  <text x="444" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">3-24, lowercase letters and numbers</text>
  <text x="690" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#E24B4A">rejected</text>

  <text x="60" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Storage account</text>
  <text x="196" y="272" font-family="DM Mono, Consolas, monospace" font-size="10" fill="#1D2322">stretailprodweu001</text>
  <text x="444" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">same rule, delimiter dropped</text>
  <text x="690" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#3D9970">accepted, 18 of 24</text>

  <text x="60" y="292" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Two rows down, the convention has already forked. Either every name loses the delimiter, or two families of name exist side by side.</text>

  <rect x="44" y="316" width="772" height="152" rx="7" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.4"/>
  <text x="60" y="338" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The 24-character budget, and what is left for the thing you actually wanted to name</text>

  <rect x="60" y="352" width="56" height="34" rx="4" fill="#F1F3F5" stroke="#8A9290" stroke-width="1"/>
  <text x="88" y="374" text-anchor="middle" font-family="DM Mono, Consolas, monospace" font-size="11" fill="#1D2322">st</text>

  <rect x="116" y="352" width="336" height="34" rx="4" fill="#F5F8FA" stroke="#5B7B9A" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="284" y="374" text-anchor="middle" font-family="DM Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#5B7B9A">12 characters for the workload</text>

  <rect x="452" y="352" width="112" height="34" rx="4" fill="#F1F3F5" stroke="#8A9290" stroke-width="1"/>
  <text x="508" y="374" text-anchor="middle" font-family="DM Mono, Consolas, monospace" font-size="11" fill="#1D2322">prod</text>

  <rect x="564" y="352" width="84" height="34" rx="4" fill="#F1F3F5" stroke="#8A9290" stroke-width="1"/>
  <text x="606" y="374" text-anchor="middle" font-family="DM Mono, Consolas, monospace" font-size="11" fill="#1D2322">weu</text>

  <rect x="648" y="352" width="84" height="34" rx="4" fill="#F1F3F5" stroke="#8A9290" stroke-width="1"/>
  <text x="690" y="374" text-anchor="middle" font-family="DM Mono, Consolas, monospace" font-size="11" fill="#1D2322">001</text>

  <text x="746" y="374" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">= 24 max</text>

  <text x="60" y="408" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Type abbreviation 2, environment 4, region 3, instance 3 &#8212; twelve characters spent before the workload has been named at all.</text>
  <text x="60" y="424" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">24 &#8722; 2 &#8722; 4 &#8722; 3 &#8722; 3 = 12. Every component the convention adds is taken from the one component a human reads to identify it.</text>
  <text x="60" y="440" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Writing the region out in full &#8212; westeurope, 10 characters &#8212; leaves 5. This is why region and environment so often go in tags.</text>
  <text x="60" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Key vault has the same 3-24 range, so the tightest type in the estate is what sets the shared budget for every other type.</text>

  <rect x="44" y="482" width="772" height="172" rx="7" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="60" y="504" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Uniqueness is enforced at five different scopes, and the scope decides how much a collision costs</text>

  <text x="60" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5B7B9A">Global</text>
  <text x="196" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Storage accounts, key vaults, container registries, web apps, SQL servers</text>
  <text x="628" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">unique across all of Azure</text>

  <text x="60" y="552" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5B7B9A">Tenant</text>
  <text x="196" y="552" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Management group IDs</text>
  <text x="628" y="552" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">unique in the directory</text>

  <text x="60" y="576" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5B7B9A">Subscription</text>
  <text x="196" y="576" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Resource groups</text>
  <text x="628" y="576" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">unique in the subscription</text>

  <text x="60" y="600" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5B7B9A">Resource group</text>
  <text x="196" y="600" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Virtual machines, virtual networks, NSGs, NICs, public IPs, disks</text>
  <text x="628" y="600" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">reusable in another group</text>

  <text x="60" y="624" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5B7B9A">Parent resource</text>
  <text x="196" y="624" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Subnets, SQL databases, blob containers, NSG rules, Service Bus queues</text>
  <text x="628" y="624" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">reusable under any parent</text>

  <text x="60" y="644" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">A globally scoped name is competing with every other Azure customer, so a convention that reads well can still be unavailable.</text>

  <rect x="44" y="668" width="376" height="146" rx="7" fill="#FDF6F5" stroke="#E24B4A" stroke-width="1.6"/>
  <text x="60" y="690" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#E24B4A">Fixed at creation</text>
  <text x="60" y="712" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Most resource names. There is no rename operation.</text>
  <text x="60" y="730" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Resource group names, and a resource group cannot be</text>
  <text x="60" y="746" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">moved to another subscription at all.</text>
  <text x="60" y="768" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Management group IDs.</text>
  <text x="60" y="790" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#5A6260">Put only facts here that outlive the resource.</text>

  <rect x="440" y="668" width="376" height="146" rx="7" fill="#F5F8FA" stroke="#3D9970" stroke-width="1.6"/>
  <text x="456" y="690" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3D9970">Editable for the life of the estate</text>
  <text x="456" y="712" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Tags &#8212; 50 per resource, changed with a write.</text>
  <text x="456" y="730" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Subscription display names.</text>
  <text x="456" y="748" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Management group display names.</text>
  <text x="456" y="770" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Resource group membership &#8212; a resource can move.</text>
  <text x="456" y="790" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#5A6260">Everything that can plausibly change belongs here.</text>
</svg>
