<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 756" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the three planes an Azure tag lives in, showing that the resource plane has no inheritance at all so a tag on a subscription or resource group is not on the resource and a management group cannot be tagged, that Azure Policy append and modify effects are what actually write an inherited tag and only modify can remediate resources that already exist, and that Cost Management tag inheritance stamps usage records rather than resources, takes 8 to 24 hours and rewrites the whole current month">
  <title>Where an Azure tag is inherited, and the two planes where it is not</title>
  <rect x="0" y="0" width="860" height="756" fill="#F8F7F5"/>
  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A tag lives in three planes, and the plane people design for is the one that never inherits</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Nothing in Resource Manager copies a tag downward. Everything that looks like inheritance is a separate mechanism with its own timing and its own gaps.</text>
  <rect x="44" y="78" width="772" height="214" rx="7" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">1 &#183; Resource plane &#8212; the tags property on the object itself</text>
  <text x="60" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Where a tag really is. Read by Resource Graph, the portal, the API and every script you own.</text>
  <rect x="60" y="134" width="124" height="52" rx="5" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.2"/>
  <text x="122" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Management group</text>
  <text x="122" y="172" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260" text-anchor="middle">no tags at all</text>
  <rect x="214" y="134" width="124" height="52" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="276" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Subscription</text>
  <text x="276" y="172" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260" text-anchor="middle">50 tag pairs</text>
  <rect x="368" y="134" width="124" height="52" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="430" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Resource group</text>
  <text x="430" y="172" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260" text-anchor="middle">50 tag pairs</text>
  <rect x="522" y="134" width="124" height="52" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="584" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Resource</text>
  <text x="584" y="172" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260" text-anchor="middle">50 tag pairs</text>
  <rect x="676" y="134" width="124" height="52" rx="5" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.2"/>
  <text x="738" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">Child resource</text>
  <text x="738" y="172" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260" text-anchor="middle">often unsupported</text>
  <line x1="184" y1="160" x2="214" y2="160" stroke="#E3E1DD" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="194.0" y1="154" x2="204.0" y2="166" stroke="#E24B4A" stroke-width="1.6"/>
  <line x1="204.0" y1="154" x2="194.0" y2="166" stroke="#E24B4A" stroke-width="1.6"/>
  <line x1="338" y1="160" x2="368" y2="160" stroke="#E3E1DD" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="348.0" y1="154" x2="358.0" y2="166" stroke="#E24B4A" stroke-width="1.6"/>
  <line x1="358.0" y1="154" x2="348.0" y2="166" stroke="#E24B4A" stroke-width="1.6"/>
  <line x1="492" y1="160" x2="522" y2="160" stroke="#E3E1DD" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="502.0" y1="154" x2="512.0" y2="166" stroke="#E24B4A" stroke-width="1.6"/>
  <line x1="512.0" y1="154" x2="502.0" y2="166" stroke="#E24B4A" stroke-width="1.6"/>
  <line x1="646" y1="160" x2="676" y2="160" stroke="#E3E1DD" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="656.0" y1="154" x2="666.0" y2="166" stroke="#E24B4A" stroke-width="1.6"/>
  <line x1="666.0" y1="154" x2="656.0" y2="166" stroke="#E24B4A" stroke-width="1.6"/>
  <text x="60" y="208" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#E24B4A">Every crossed link is a boundary a tag does not cross.</text>
  <text x="60" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Microsoft states it plainly: resources don't inherit the tags you apply to a resource group or a subscription. A tag on a resource is not on its</text>
  <text x="60" y="242" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">children either, and management groups cannot be tagged at all &#8212; so the top of the hierarchy carries no metadata for anything below it to inherit.</text>
  <text x="60" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Name 512 characters &#183; value 256 characters &#183; 50 pairs per resource, resource group and subscription &#183; a handful of types cap at 15.</text>
  <text x="60" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Tag names are case-insensitive for operations; tag values are case-sensitive, so Production and production are two lines in a cost report.</text>
  <rect x="44" y="306" width="772" height="190" rx="7" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="60" y="328" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">2 &#183; Policy plane &#8212; what actually writes an inherited tag onto the resource</text>
  <text x="60" y="346" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Azure Policy is the only thing that turns a resource-group tag into a real tag on a real resource. Two effects do it, and they are not equivalent.</text>
  <rect x="60" y="360" width="366" height="96" rx="5" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.2"/>
  <text x="76" y="380" font-family="DM Mono, Consolas, monospace" font-size="10.5" font-weight="700" fill="#9A7B57">append</text>
  <text x="76" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Append a tag and its value from the resource group</text>
  <text x="76" y="414" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Writes at create and update. Does not modify the tags of</text>
  <text x="76" y="428" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">resources created before the policy was applied, until those</text>
  <text x="76" y="442" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">resources are changed. No managed identity needed.</text>
  <rect x="450" y="360" width="366" height="96" rx="5" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.2"/>
  <text x="466" y="380" font-family="DM Mono, Consolas, monospace" font-size="10.5" font-weight="700" fill="#3D9970">modify</text>
  <text x="466" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Inherit a tag from the resource group</text>
  <text x="466" y="414" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Evaluates before the resource provider sees the request. On</text>
  <text x="466" y="428" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">resources that already exist it changes nothing &#8212; it marks them</text>
  <text x="466" y="442" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">non-compliant. A remediation task with an identity does the work.</text>
  <text x="60" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5A6260">Neither runs continuously. Tag a resource group today and yesterday's resources stay untagged until something touches them or you remediate.</text>
  <rect x="44" y="510" width="772" height="200" rx="7" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="60" y="532" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">3 &#183; Billing plane &#8212; Cost Management tag inheritance, which never touches the resource</text>
  <text x="60" y="550" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The only mechanism actually called inheritance. It solves the cost-allocation problem and leaves the governance one exactly where it was.</text>
  <rect x="60" y="564" width="232" height="60" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="176" y="588" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322" text-anchor="middle">Billing profile, subscription</text>
  <text x="176" y="604" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322" text-anchor="middle">and resource group tags</text>
  <line x1="292" y1="594" x2="352" y2="594" stroke="#5B7B9A" stroke-width="1.4"/>
  <polygon points="352,594 344,590 344,598" fill="#5B7B9A"/>
  <text x="322" y="584" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9A7B57" text-anchor="middle">8-24 h</text>
  <rect x="352" y="564" width="232" height="60" rx="5" fill="#FFFFFF" stroke="#3D9970" stroke-width="1.2"/>
  <text x="468" y="588" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322" text-anchor="middle">Child resource</text>
  <text x="468" y="604" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322" text-anchor="middle">usage records</text>
  <rect x="608" y="564" width="208" height="60" rx="5" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="712" y="588" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E24B4A" text-anchor="middle">The resources</text>
  <text x="712" y="604" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E24B4A" text-anchor="middle">themselves: unchanged</text>
  <text x="60" y="648" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Inherited tags are applied to child resource usage records and not the resources themselves. Enabling it rewrites the whole current month, not</text>
  <text x="60" y="664" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">the days after you switched it on. EA billing accounts, MCA billing profiles and MPA with Azure plan subscriptions only.</text>
  <text x="60" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Where both exist the resource tag wins by default. Purchases and resources that do not emit usage at subscription scope get nothing at all.</text>
  <text x="44" y="736" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Design for the plane the question is asked in: cost allocation is answered in plane 3, ownership and automation only ever in plane 1.</text>
</svg>
