<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 726" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the four objects a policy remediation depends on, showing the definition declaring roleDefinitionIds, the assignment carrying exactly one managed identity, the role assignments that the portal grants automatically but the SDK and CLI do not, and the remediation task that is the only way to fix resources that already exist, followed by the two paths a resource can take, automatic remediation after the evaluation delay for new and updated resources and an explicitly created task for existing ones, and the task settings with their defaults and maximums">
  <title>The remediation chain: four objects created at four different times, and the two links that nothing re-checks after the first day</title>
  <rect x="0" y="0" width="860" height="726" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A policy that fixes things depends on four objects. Only the first one is code-reviewed.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Each link is created at a different time by a different mechanism, and a change to the first does not propagate to any of the others.</text>

  <rect x="44" y="78" width="172" height="126" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="58" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">1 &#183; Policy definition</text>
  <text x="58" y="116" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">details.roleDefinitionIds</text>
  <text x="58" y="130" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">Required for both effects.</text>
  <text x="58" y="144" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">Full resource IDs, not role</text>
  <text x="58" y="158" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">names. Prepopulated on</text>
  <text x="58" y="172" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">built-ins.</text>
  <text x="58" y="192" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E24B4A">Edit it later: no regrant.</text>

  <rect x="228" y="78" width="172" height="126" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="242" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">2 &#183; Assignment</text>
  <text x="242" y="116" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">Exactly one managed</text>
  <text x="242" y="130" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">identity, system- or</text>
  <text x="242" y="144" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">user-assigned. It may hold</text>
  <text x="242" y="158" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">many roles.</text>
  <text x="242" y="178" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">Its location does not affect</text>
  <text x="242" y="192" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">how it operates.</text>

  <rect x="412" y="78" width="172" height="126" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="426" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">3 &#183; Role assignments</text>
  <text x="426" y="116" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">The portal grants these</text>
  <text x="426" y="130" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">automatically when the</text>
  <text x="426" y="144" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">assignment starts.</text>
  <text x="426" y="164" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E24B4A">An SDK or pipeline does</text>
  <text x="426" y="178" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E24B4A">not. Grant them by hand</text>
  <text x="426" y="192" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E24B4A">or remediation fails.</text>

  <rect x="596" y="78" width="172" height="126" rx="6" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.4"/>
  <text x="610" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">4 &#183; Remediation task</text>
  <text x="610" y="116" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">The only thing that fixes a</text>
  <text x="610" y="130" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">resource that already</text>
  <text x="610" y="144" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">exists. One policy per task.</text>
  <text x="610" y="164" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">Settings cannot be changed</text>
  <text x="610" y="178" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">after the task begins. Task</text>
  <text x="610" y="192" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260">records are kept 60 days.</text>

  <line x1="216" y1="141" x2="228" y2="141" stroke="#5B7B9A" stroke-width="1.2"/>
  <line x1="400" y1="141" x2="412" y2="141" stroke="#5B7B9A" stroke-width="1.2"/>
  <line x1="584" y1="141" x2="596" y2="141" stroke="#5B7B9A" stroke-width="1.2"/>

  <text x="44" y="228" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The assignment identity performs the deployment. The existence check that decides whether to deploy runs as the requestor, not as the identity.</text>

  <text x="44" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Two paths, and only one of them happens on its own</text>

  <rect x="44" y="276" width="376" height="112" rx="7" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="60" y="298" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">New or updated resource &#8212; automatic</text>
  <text x="60" y="318" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Resource Provider returns a success code, then the effect</text>
  <text x="60" y="332" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">runs after a configurable delay.</text>
  <text x="60" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">evaluationDelay &#8212; default PT10M</text>
  <text x="60" y="368" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">AfterProvisioning, or ISO 8601 from 0 to 360 minutes</text>
  <text x="60" y="382" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Provisioning taking over six hours counts as a failure.</text>

  <rect x="440" y="276" width="376" height="112" rx="7" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="456" y="298" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Resource that already exists &#8212; nothing happens</text>
  <text x="456" y="318" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">During an evaluation cycle the resource is marked</text>
  <text x="456" y="332" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">non-compliant and no action is taken on it.</text>
  <text x="456" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E24B4A">A remediation task must be created, by someone,</text>
  <text x="456" y="366" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E24B4A">for one policy, on purpose.</text>
  <text x="456" y="382" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">modify skips existing resources at evaluation entirely.</text>

  <text x="44" y="422" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Remediation task settings &#8212; defaults, and what they cost at estate scale</text>

  <rect x="44" y="436" width="772" height="132" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="60" y="458" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">resourceCount</text>
  <text x="230" y="458" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">default 500, maximum 50,000 &#8212; the default fixes 1% of a full-sized task</text>
  <text x="60" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">parallelDeployments</text>
  <text x="230" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">default 10, allowed range 1 to 30</text>
  <text x="60" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">tasks in parallel</text>
  <text x="230" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">maximum 100 per policy definition or reference &#8212; so up to 3,000 concurrent deployments</text>
  <text x="60" y="518" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">failureThreshold</text>
  <text x="230" y="518" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">optional, 0 to 100; default 100%, so by default a task keeps going as resources fail</text>
  <text x="60" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">filters</text>
  <text x="230" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">resource location only; unless specified, resources from any region can be remediated</text>
  <text x="60" y="558" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">resourceDiscoveryMode</text>
  <text x="230" y="558" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">ExistingNonCompliant by default; ReEvaluateCompliance triggers a fresh scan first</text>

  <line x1="44" y1="592" x2="816" y2="592" stroke="#E3E1DD" stroke-width="1"/>

  <text x="44" y="614" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E24B4A">The two links nothing re-checks</text>
  <text x="44" y="634" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Changing a policy definition does not automatically update the assignment or the associated managed identity. Add a role to</text>
  <text x="44" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">roleDefinitionIds six months in and the new permission must be granted by hand &#8212; even in the portal, which granted the first set.</text>
  <text x="44" y="670" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A remediation whose target sits outside the assignment scope, or whose template reads a resource outside it, needs manual roles too.</text>
  <text x="44" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Neither case reports as a policy problem. The compliance state stays non-compliant and the deployments simply fail.</text>
  <text x="44" y="708" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sources: remediation task structure, remediate non-compliant resources, deployIfNotExists and modify effects, on Microsoft Learn.</text>
</svg>
