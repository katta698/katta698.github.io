<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 742" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: choosing an Azure Policy effect, showing three questions that narrow the choice — whether the control reads the resource itself or a related resource, whether it should prevent, correct or record, and what happens to resources that already exist — followed by a comparison table of the nine Resource Manager mode effects giving when each acts, whether it needs a managed identity, whether it can fix existing resources and what compliance state existing resources take, and closing notes on append behaving as a deny on conflict, the resource types exempt from denyAction, and manual not being interchangeable">
  <title>Choosing an Azure Policy effect: three questions that narrow it, and the four properties that differ across the nine effects</title>
  <rect x="0" y="0" width="860" height="742" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The effect is one word in the definition and it decides four unrelated things.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Whether the control blocks anything, whether it can repair what already exists, whether it needs an identity, and what its compliance number means.</text>

  <text x="44" y="88" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Three questions, in this order &#8212; the first one eliminates most of the list</text>

  <rect x="44" y="102" width="248" height="118" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="58" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">1 &#183; What does it read?</text>
  <text x="58" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">The resource's own properties, or a</text>
  <text x="58" y="157" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">child or extension resource?</text>
  <text x="58" y="177" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1D2322">Own properties &#8594; audit, deny,</text>
  <text x="58" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1D2322">append, modify</text>
  <text x="58" y="207" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1D2322">Related resource &#8594; the two IfNotExists</text>

  <rect x="306" y="102" width="248" height="118" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="320" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">2 &#183; Prevent, correct or record?</text>
  <text x="320" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">What should happen to a request that</text>
  <text x="320" y="157" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">does not meet the standard?</text>
  <text x="320" y="177" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1D2322">Prevent &#8594; deny, denyAction</text>
  <text x="320" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1D2322">Correct &#8594; modify, append, DINE</text>
  <text x="320" y="207" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1D2322">Record &#8594; audit, auditIfNotExists, manual</text>

  <rect x="568" y="102" width="248" height="118" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="582" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">3 &#183; What about what exists?</text>
  <text x="582" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Every effect here treats new and</text>
  <text x="582" y="157" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">existing resources differently.</text>
  <text x="582" y="177" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">Only modify and DINE can repair one,</text>
  <text x="582" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">and only via a remediation task.</text>
  <text x="582" y="207" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Everything else just marks it.</text>

  <line x1="292" y1="161" x2="306" y2="161" stroke="#5B7B9A" stroke-width="1.2"/>
  <line x1="554" y1="161" x2="568" y2="161" stroke="#5B7B9A" stroke-width="1.2"/>

  <text x="44" y="252" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The nine Resource Manager mode effects, on the four axes that differ</text>

  <line x1="44" y1="266" x2="816" y2="266" stroke="#C9C5BF" stroke-width="1"/>
  <text x="52" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Effect</text>
  <text x="180" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">When it acts</text>
  <text x="440" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Identity</text>
  <text x="520" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Fixes existing</text>
  <text x="632" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">State of an existing bad resource</text>
  <line x1="44" y1="290" x2="816" y2="290" stroke="#C9C5BF" stroke-width="1"/>

  <text x="52" y="308" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">disabled</text>
  <text x="180" y="308" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Checked first &#8212; turns the rule off</text>
  <text x="440" y="308" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="520" y="308" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="632" y="308" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">not evaluated</text>

  <text x="52" y="330" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">append</text>
  <text x="180" y="330" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Before the Resource Provider</text>
  <text x="440" y="330" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="520" y="330" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="632" y="330" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">non-compliant</text>

  <text x="52" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">modify</text>
  <text x="180" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Before the Resource Provider</text>
  <text x="440" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">yes</text>
  <text x="520" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">yes, by task</text>
  <text x="632" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">non-compliant until remediated</text>

  <text x="52" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">deny</text>
  <text x="180" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Before the RP &#8212; request fails 403</text>
  <text x="440" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="520" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="632" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">non-compliant, and it keeps running</text>

  <text x="52" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">audit</text>
  <text x="180" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Last effect checked before the RP</text>
  <text x="440" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="520" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="632" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">non-compliant + activity log entry</text>

  <text x="52" y="418" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">manual</text>
  <text x="180" y="418" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Not evaluated &#8212; a person attests</text>
  <text x="440" y="418" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="520" y="418" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="632" y="418" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">defaultState: Unknown unless set</text>

  <text x="52" y="440" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">auditIfNotExists</text>
  <text x="180" y="440" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">After the RP returns success</text>
  <text x="440" y="440" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="520" y="440" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="632" y="440" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">non-compliant on the parent resource</text>

  <text x="52" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">deployIfNotExists</text>
  <text x="180" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">After the RP, then a set delay</text>
  <text x="440" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">yes</text>
  <text x="520" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">yes, by task</text>
  <text x="632" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">non-compliant, no action taken</text>

  <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">denyAction</text>
  <text x="180" y="484" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Last &#8212; blocks DELETE, returns 403</text>
  <text x="440" y="484" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="520" y="484" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">n/a</text>
  <text x="632" y="484" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Protected</text>

  <line x1="44" y1="498" x2="816" y2="498" stroke="#C9C5BF" stroke-width="1"/>
  <text x="52" y="516" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Read the first two columns together: an effect that acts before the Resource Provider can stop something; one that acts after it can only react.</text>

  <text x="44" y="548" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Microsoft's own interchangeability guidance, which is what a parameterised effect rests on</text>
  <text x="44" y="568" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">audit, deny, and either modify or append are often interchangeable &#183; auditIfNotExists and deployIfNotExists are often interchangeable</text>
  <text x="44" y="584" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">manual isn't interchangeable &#183; disabled is interchangeable with any effect</text>
  <text x="44" y="602" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The pairs are not arbitrary: each pair shares the same details block, so one definition can carry both and the assignment picks.</text>

  <line x1="44" y1="622" x2="816" y2="622" stroke="#E3E1DD" stroke-width="1"/>

  <text x="44" y="644" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E24B4A">Three behaviours that surprise people</text>
  <text x="44" y="664" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">append acts as a deny. If it would override a value in the original request with a different value, it rejects the request outright.</text>
  <text x="44" y="680" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">denyAction has holes by design. Policy assignments, deny assignments, blueprint assignments, deployment stacks, subscriptions and locks are</text>
  <text x="44" y="694" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">exempt to prevent lockout; subscription deletion is not blocked; and deleting a parent still removes a protected child.</text>
  <text x="44" y="712" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">manual reports Unknown by default, and Unknown counts on the compliant side of the percentage. A control nobody attested scores like a pass.</text>
  <text x="44" y="732" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sources: Azure Policy effect basics and the per-effect pages for deny, denyAction, audit, auditIfNotExists, append, modify and manual, on Microsoft Learn.</text>
</svg>
