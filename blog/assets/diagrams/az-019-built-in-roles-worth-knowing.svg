<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 748" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: Azure built-in roles, showing Microsoft's two documented categories of job function roles and privileged administrator roles, a table of the five privileged roles and what each grants including that User Access Administrator and Role Based Access Control Administrator can assign themselves the Owner role, the small real difference between Reader, Contributor and Owner, and the control plane versus data plane pairs for storage and key vault where a management role never implies access to the data">
  <title>Azure built-in roles: the three everyone uses are all privileged, and a management role never reaches the data</title>
  <rect x="0" y="0" width="860" height="748" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Two of the three roles everyone uses are classified by Microsoft as privileged administrator roles.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Contributor is not a middle setting between Reader and Owner. It is full management of everything, minus the ability to grant access.</text>

  <rect x="44" y="80" width="376" height="88" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="58" y="102" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Job function roles</text>
  <text x="58" y="122" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Management of specific Azure resources &#8212; Virtual Machine</text>
  <text x="58" y="136" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Contributor, Storage Blob Data Reader, Key Vault Secrets User.</text>
  <text x="58" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Always start with the most restrictive one.</text>

  <rect x="440" y="80" width="376" height="88" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="454" y="102" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Privileged administrator roles</text>
  <text x="454" y="122" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Manage Azure resources or assign roles to other users.</text>
  <text x="454" y="136" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Five roles, applying to all resource types.</text>
  <text x="454" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E24B4A">Avoid one when a job function role would do.</text>

  <text x="44" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The five privileged roles, as Microsoft documents them</text>

  <line x1="44" y1="212" x2="816" y2="212" stroke="#C9C5BF" stroke-width="1"/>
  <text x="52" y="228" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Role</text>
  <text x="290" y="228" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Manage resources</text>
  <text x="424" y="228" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Assign roles</text>
  <text x="536" y="228" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Can make itself Owner</text>
  <line x1="44" y1="236" x2="816" y2="236" stroke="#C9C5BF" stroke-width="1"/>

  <text x="52" y="254" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Owner</text>
  <text x="290" y="254" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">full access, all resources</text>
  <text x="424" y="254" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">yes</text>
  <text x="536" y="254" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">already is</text>

  <text x="52" y="276" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Contributor</text>
  <text x="290" y="276" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">full access, all resources</text>
  <text x="424" y="276" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">no</text>
  <text x="536" y="276" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no &#8212; this is the whole difference</text>

  <text x="52" y="298" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">User Access Administrator</text>
  <text x="290" y="298" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="424" y="298" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">yes</text>
  <text x="536" y="298" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">yes &#8212; itself or others</text>

  <text x="52" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Role Based Access Control Admin</text>
  <text x="290" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">no</text>
  <text x="424" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">yes</text>
  <text x="536" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">yes, unless constrained by a condition</text>

  <text x="52" y="342" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Reservations Administrator</text>
  <text x="290" y="342" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">reservations only</text>
  <text x="424" y="342" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">for reservations</text>
  <text x="536" y="342" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">within reservations</text>
  <line x1="44" y1="356" x2="816" y2="356" stroke="#C9C5BF" stroke-width="1"/>

  <text x="52" y="376" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Granting the right to assign roles is granting Owner with one extra step. That is the documented behaviour, not a loophole.</text>

  <text x="44" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">What actually separates the three general roles</text>

  <rect x="44" y="424" width="240" height="76" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="58" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Reader</text>
  <text x="58" y="465" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1D2322">Actions: */read</text>
  <text x="58" y="484" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Control plane only. No data, no changes.</text>

  <rect x="308" y="424" width="240" height="76" rx="6" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.4"/>
  <text x="322" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Contributor</text>
  <text x="322" y="465" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1D2322">Actions: *</text>
  <text x="322" y="480" font-family="Consolas, Menlo, monospace" font-size="9" fill="#E24B4A">NotActions: Microsoft.Authorization/*</text>
  <text x="322" y="493" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Write and Delete, plus elevateAccess.</text>

  <rect x="572" y="424" width="244" height="76" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="586" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Owner</text>
  <text x="586" y="465" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1D2322">Actions: *  &#183;  NotActions: none</text>
  <text x="586" y="484" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Recommended maximum: 3 per subscription.</text>

  <text x="44" y="524" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">A wildcard in Actions includes actions defined in the future, as Azure adds new resource types. Contributor grows with the platform.</text>

  <text x="44" y="558" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Management is not access &#8212; the pairs that have to be granted separately</text>

  <rect x="44" y="572" width="772" height="112" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.4"/>
  <text x="60" y="594" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Storage Account Contributor</text>
  <text x="330" y="594" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">manage storage accounts, but not access to the data in them</text>
  <text x="60" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Storage Blob Data Reader / Contributor / Owner</text>
  <text x="330" y="612" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">the blobs themselves &#8212; separate DataActions, granted separately</text>

  <line x1="60" y1="624" x2="800" y2="624" stroke="#E3E1DD" stroke-width="1"/>

  <text x="60" y="644" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Key Vault Contributor</text>
  <text x="330" y="644" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">manage key vaults; does not allow access to secrets, keys or certificates</text>
  <text x="60" y="662" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Key Vault Secrets User / Secrets Officer / Administrator</text>
  <text x="330" y="662" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">read or manage the contents &#8212; data plane roles</text>
  <text x="60" y="678" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">Only works for key vaults that use the Azure RBAC permission model. On a vault still using access policies, the assignment does nothing.</text>

  <text x="44" y="708" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The same shape appears service by service: a management role that cannot read, and a data role that must be granted on purpose. Assigning the</text>
  <text x="44" y="724" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">first and expecting the second is the most common access ticket in Azure, and the error is invisible until somebody's application returns 403.</text>

  <text x="44" y="744" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sources: Azure built-in roles for General, Security and Storage; steps to assign a role; RBAC best practices; role definitions, on Microsoft Learn.</text>
</svg>
