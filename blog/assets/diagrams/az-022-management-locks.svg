<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" role="img" aria-label="Azure management locks: lock types, control plane boundary, inheritance and the ScopeLocked error">
  <defs>
    <style>
      .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .hdr  { font-size: 13px; font-weight: 700; fill: #1f2933; }
      .lbl  { font-size: 12px; fill: #1f2933; }
      .sm   { font-size: 11px; fill: #52606d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1f2933; }
      .ok   { fill: #1b6e3c; }
      .no   { fill: #a4262c; }
      .box  { fill: #ffffff; stroke: #c3cbd5; stroke-width: 1.2; }
      .band { fill: #f5f7fa; stroke: #dbe1e8; stroke-width: 1; }
      .amber{ fill: #fdf6e3; stroke: #e0c068; stroke-width: 1.2; }
      .arrow{ stroke: #7b8794; stroke-width: 1.4; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <!-- Row 1: the two lock types -->
  <text class="t hdr" x="24" y="28">The two lock types</text>

  <rect class="box" x="24" y="40" width="390" height="128" rx="6"/>
  <text class="t hdr" x="40" y="62">CanNotDelete</text>
  <text class="t sm"  x="40" y="80">portal: &#8220;Delete&#8221;</text>
  <text class="t lbl ok"  x="40" y="104">read      &#10003; permitted</text>
  <text class="t lbl ok"  x="40" y="124">write     &#10003; permitted</text>
  <text class="t lbl no"  x="40" y="144">delete    &#10007; blocked</text>

  <rect class="box" x="446" y="40" width="390" height="128" rx="6"/>
  <text class="t hdr" x="462" y="62">ReadOnly</text>
  <text class="t sm"  x="462" y="80">portal: &#8220;Read-only&#8221;</text>
  <text class="t lbl ok"  x="462" y="104">read      &#10003; permitted</text>
  <text class="t lbl no"  x="462" y="124">write     &#10007; blocked</text>
  <text class="t lbl no"  x="462" y="144">delete    &#10007; blocked</text>

  <!-- Row 2: control plane boundary -->
  <text class="t hdr" x="24" y="204">A lock sits on the control plane only</text>

  <rect class="band" x="24" y="216" width="812" height="118" rx="6"/>

  <rect class="box" x="40" y="236" width="150" height="46" rx="5"/>
  <text class="t lbl" x="60" y="256">caller</text>
  <text class="t sm"  x="60" y="272">CLI, portal, Terraform</text>

  <line class="arrow" x1="192" y1="248" x2="286" y2="248" marker-end="url(#a)"/>
  <text class="t sm" x="200" y="240">control plane</text>

  <rect class="amber" x="288" y="228" width="176" height="62" rx="5"/>
  <text class="t lbl" x="304" y="250">management.azure.com</text>
  <text class="t sm"  x="304" y="268">LOCK EVALUATED HERE</text>

  <line class="arrow" x1="466" y1="258" x2="560" y2="258" marker-end="url(#a)"/>
  <rect class="box" x="562" y="236" width="256" height="46" rx="5"/>
  <text class="t lbl" x="578" y="256">the resource</text>
  <text class="t sm"  x="578" y="272">created, changed, deleted</text>

  <line class="arrow" x1="192" y1="308" x2="560" y2="308" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text class="t sm" x="222" y="302">data plane &#8212; myaccount.blob.core.windows.net</text>
  <text class="t sm no" x="222" y="324">never reaches the lock: blob, queue, table and file data are not protected</text>

  <!-- Row 3: inheritance -->
  <text class="t hdr" x="24" y="372">Inheritance runs downward, most restrictive wins</text>

  <rect class="box" x="24" y="384" width="390" height="150" rx="6"/>
  <rect class="box" x="44" y="402" width="350" height="34" rx="4"/>
  <text class="t lbl" x="58" y="424">subscription</text>
  <rect class="box" x="64" y="444" width="310" height="34" rx="4"/>
  <text class="t lbl" x="78" y="466">resource group  &#8212;  lock applied here</text>
  <rect class="box" x="84" y="486" width="270" height="34" rx="4"/>
  <text class="t lbl" x="98" y="508">resource  &#8212;  inherits the lock</text>
  <line class="arrow" x1="52" y1="436" x2="52" y2="460" marker-end="url(#a)"/>
  <line class="arrow" x1="72" y1="478" x2="72" y2="502" marker-end="url(#a)"/>

  <text class="t sm" x="24" y="556">Management groups cannot hold a lock. Resources added later inherit it too.</text>
  <text class="t sm" x="24" y="574">Extension resources inherit the lock of the resource they attach to.</text>

  <!-- Row 3 right: the error -->
  <rect class="amber" x="446" y="384" width="390" height="150" rx="6"/>
  <text class="t hdr" x="462" y="406">The error names the LOCKED scope</text>
  <text class="t sm"  x="462" y="426">delete the resource, with the lock on its group:</text>
  <text class="t mono" x="462" y="450">(ScopeLocked) The scope</text>
  <text class="t mono" x="462" y="468">&#8230;/resourceGroups/rg-example</text>
  <text class="t mono" x="462" y="486">cannot perform delete operation</text>
  <text class="t sm"  x="462" y="510">The request addressed the resource. The message</text>
  <text class="t sm"  x="462" y="526">names the parent &#8212; so the resource shows no lock.</text>

  <text class="t sm" x="446" y="556">ReadOnly refuses listKeys as a <tspan font-weight="700">write</tspan>.</text>
  <text class="t sm" x="446" y="574">Resource Manager classifies by HTTP verb; it is a POST.</text>
</svg>
