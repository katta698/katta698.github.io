<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: ARM template structure, showing the nine top-level elements and which three are required, the schema URI that differs for each deployment scope, the order in which Resource Manager resolves parameters then variables then resources then outputs and what each stage can see, the template limits of 256 parameters, 256 variables, 800 resources and 64 outputs, and the rule that a securestring output is neither shown in deployment history nor retrievable from another template">
  <title>An ARM template is evaluated in stages, and most of its rules are consequences of what each stage can see</title>
  <rect x="0" y="0" width="860" height="740" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Three sections are required. The rest of the rules follow from the order things resolve in.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Parameters are resolved before the deployment starts, which is why half the errors in this file type are the same error.</text>

  <text x="44" y="88" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The nine top-level elements</text>

  <rect x="44" y="102" width="376" height="150" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="58" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Required</text>
  <text x="58" y="146" font-family="Consolas, Menlo, monospace" font-size="9.5" font-weight="700" fill="#1D2322">$schema</text>
  <text x="180" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">which language version, and which scope</text>
  <text x="58" y="168" font-family="Consolas, Menlo, monospace" font-size="9.5" font-weight="700" fill="#1D2322">contentVersion</text>
  <text x="180" y="168" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">any value you like; a note to your future self</text>
  <text x="58" y="190" font-family="Consolas, Menlo, monospace" font-size="9.5" font-weight="700" fill="#1D2322">resources</text>
  <text x="180" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">what is deployed or updated</text>
  <text x="58" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">A template with only these three is valid. Every other</text>
  <text x="58" y="230" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">section exists to keep the resources section readable.</text>

  <rect x="440" y="102" width="376" height="150" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="454" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Optional</text>
  <text x="454" y="144" font-family="Consolas, Menlo, monospace" font-size="9" fill="#1D2322">parameters</text>
  <text x="580" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">values supplied at deployment</text>
  <text x="454" y="162" font-family="Consolas, Menlo, monospace" font-size="9" fill="#1D2322">variables</text>
  <text x="580" y="162" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">expressions named once</text>
  <text x="454" y="180" font-family="Consolas, Menlo, monospace" font-size="9" fill="#1D2322">outputs</text>
  <text x="580" y="180" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">values returned afterwards</text>
  <text x="454" y="198" font-family="Consolas, Menlo, monospace" font-size="9" fill="#1D2322">functions</text>
  <text x="580" y="198" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">user-defined, heavily restricted</text>
  <text x="454" y="216" font-family="Consolas, Menlo, monospace" font-size="9" fill="#1D2322">definitions</text>
  <text x="580" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">types, languageVersion 2.0 only</text>
  <text x="454" y="234" font-family="Consolas, Menlo, monospace" font-size="9" fill="#1D2322">languageVersion, apiProfile</text>
  <text x="580" y="234" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">opt-ins</text>

  <text x="44" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The order of resolution, and what each stage is allowed to see</text>

  <rect x="44" y="300" width="172" height="76" rx="5" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="130" y="322" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">1 &#183; parameters</text>
  <text x="130" y="340" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">Resolved before any</text>
  <text x="130" y="353" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">deployment operation runs.</text>
  <text x="130" y="368" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E24B4A" text-anchor="middle">Sees only other parameters.</text>

  <rect x="240" y="300" width="172" height="76" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="326" y="322" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">2 &#183; variables</text>
  <text x="326" y="340" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">Named expressions built</text>
  <text x="326" y="353" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">from parameters.</text>

  <rect x="436" y="300" width="172" height="76" rx="5" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="522" y="322" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">3 &#183; resources</text>
  <text x="522" y="340" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">Deployed in dependency</text>
  <text x="522" y="353" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">order, otherwise in parallel.</text>

  <rect x="632" y="300" width="184" height="76" rx="5" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.4"/>
  <text x="724" y="322" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322" text-anchor="middle">4 &#183; outputs</text>
  <text x="724" y="340" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">The only stage that can read</text>
  <text x="724" y="353" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">the runtime state of what</text>
  <text x="724" y="366" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5A6260" text-anchor="middle">was just deployed.</text>

  <line x1="216" y1="338" x2="240" y2="338" stroke="#5B7B9A" stroke-width="1.2"/>
  <line x1="412" y1="338" x2="436" y2="338" stroke="#5B7B9A" stroke-width="1.2"/>
  <line x1="608" y1="338" x2="632" y2="338" stroke="#5B7B9A" stroke-width="1.2"/>

  <text x="44" y="400" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Three documented rules, one cause: a default value may chain from another parameter, may not reference a variable, and may not call</text>
  <text x="44" y="415" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">reference() or any list() function &#8212; those read runtime state, which does not exist yet when parameters are being resolved.</text>

  <text x="44" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The schema URI is where the deployment scope from post #24 physically appears</text>

  <rect x="44" y="462" width="772" height="86" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="60" y="482" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Resource group</text>
  <text x="230" y="482" font-family="Consolas, Menlo, monospace" font-size="8.5" fill="#5A6260">2019-04-01/deploymentTemplate.json#</text>
  <text x="60" y="502" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Subscription</text>
  <text x="230" y="502" font-family="Consolas, Menlo, monospace" font-size="8.5" fill="#5A6260">2018-05-01/subscriptionDeploymentTemplate.json#</text>
  <text x="60" y="522" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Management group</text>
  <text x="230" y="522" font-family="Consolas, Menlo, monospace" font-size="8.5" fill="#5A6260">2019-08-01/managementGroupDeploymentTemplate.json#</text>
  <text x="60" y="542" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Tenant</text>
  <text x="230" y="542" font-family="Consolas, Menlo, monospace" font-size="8.5" fill="#5A6260">2019-08-01/tenantDeploymentTemplate.json#</text>

  <text x="44" y="580" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The budgets, and the one that is smallest for a reason</text>
  <text x="44" y="600" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">256 parameters &#183; 256 variables &#183; 800 resources &#183; 64 outputs. Objects as parameters are the documented way to stay under the first.</text>
  <text x="44" y="618" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">64 outputs is the tightest, and a template that approaches it is usually returning things a caller could look up for itself.</text>

  <line x1="44" y1="640" x2="816" y2="640" stroke="#E3E1DD" stroke-width="1"/>

  <text x="44" y="662" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E24B4A">A secure value is protected on the way in and unusable on the way out</text>
  <text x="44" y="682" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A securestring parameter is not saved to deployment history and is not logged. A securestring output is not displayed in the</text>
  <text x="44" y="698" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">deployment history and cannot be retrieved from another template &#8212; so it cannot carry a secret between templates.</text>
  <text x="44" y="716" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The documented answer is to store the secret in Key Vault and reference it from the parameter file instead.</text>

  <text x="44" y="736" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sources: ARM template structure and syntax, parameters in templates, outputs in templates, and Azure subscription and service limits, on Microsoft Learn.</text>
</svg>
