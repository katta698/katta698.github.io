<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 748" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: managed identity on Azure VMs, App Service and Functions, and AKS, comparing the token endpoint, required header, API version, user-assigned identity parameter and scope format for each host, the security boundary on a VM where all code can request tokens for any identity on it, the silent fallback to the system-assigned identity when no identity parameter is supplied on App Service, and the way AKS uses OIDC federation rather than an instance metadata endpoint">
  <title>One feature, three front doors — and code that works on a VM fails on App Service over a single letter</title>
  <rect x="0" y="0" width="860" height="748" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">One feature name. Three front doors. Almost nothing in common.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The endpoint, the header, the API version, the parameter name and the scope format all differ by host. Use the SDK and none of it matters.</text>

  <line x1="44" y1="80" x2="816" y2="80" stroke="#C9C5BF" stroke-width="1"/>
  <text x="200" y="98" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Virtual machines</text>
  <text x="404" y="98" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">App Service &#183; Functions</text>
  <text x="640" y="98" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">AKS</text>
  <line x1="44" y1="108" x2="816" y2="108" stroke="#E3E1DD" stroke-width="1"/>

  <text x="52" y="128" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">Endpoint</text>
  <text x="200" y="128" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">169.254.169.254</text>
  <text x="200" y="140" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A6260">the shared IMDS address</text>
  <text x="404" y="128" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">$IDENTITY_ENDPOINT</text>
  <text x="404" y="140" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A6260">a local URL, per app</text>
  <text x="640" y="128" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#E24B4A">none</text>
  <text x="640" y="140" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A6260">a token file, then OIDC exchange</text>

  <text x="52" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">Proves it is local</text>
  <text x="200" y="164" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">Metadata: true</text>
  <text x="404" y="164" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">X-IDENTITY-HEADER</text>
  <text x="404" y="176" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A6260">the platform rotates the value</text>
  <text x="640" y="164" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">AZURE_FEDERATED_</text>
  <text x="640" y="175" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">TOKEN_FILE</text>

  <text x="52" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">API version</text>
  <text x="200" y="200" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">2018-02-01</text>
  <text x="404" y="200" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">2019-08-01</text>
  <text x="640" y="200" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A6260">n/a &#8212; Entra v2 endpoint</text>

  <text x="52" y="224" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">Naming a user-</text>
  <text x="52" y="235" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">assigned identity</text>
  <text x="200" y="224" font-family="Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#E24B4A">msi_res_id</text>
  <text x="200" y="236" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A6260">or client_id, object_id</text>
  <text x="404" y="224" font-family="Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#E24B4A">mi_res_id</text>
  <text x="404" y="236" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A6260">one letter apart, same job</text>
  <text x="640" y="224" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">client-id</text>
  <text x="640" y="236" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A6260">a service account annotation</text>

  <text x="52" y="260" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">Scope format</text>
  <text x="200" y="260" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">resource=https://x/</text>
  <text x="404" y="260" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">resource=https://x</text>
  <text x="640" y="260" font-family="Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#E24B4A">https://x/.default</text>
  <line x1="44" y1="274" x2="816" y2="274" stroke="#C9C5BF" stroke-width="1"/>

  <text x="52" y="294" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">A raw resource URI &#8220;can fail because workload identity uses the Microsoft Entra v2 token endpoint rather than the IMDS resource flow&#8221;.</text>

  <rect x="44" y="314" width="376" height="162" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="58" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The security boundary, stated outright</text>
  <text x="58" y="356" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">&#8220;The security boundary of managed identities for Azure</text>
  <text x="58" y="369" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">resources is the resource where the identity is used.</text>
  <text x="58" y="382" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">All code/scripts running on a virtual machine can</text>
  <text x="58" y="395" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">request and retrieve tokens for any managed</text>
  <text x="58" y="408" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">identities available on it.&#8221;</text>
  <text x="58" y="430" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Any code. Not your code &#8212; any code. Post #35 said the</text>
  <text x="58" y="443" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">privilege travels with whoever can run on the resource;</text>
  <text x="58" y="456" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">this is the sentence that makes it literal.</text>
  <text x="58" y="470" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Attach two identities and every process holds both.</text>

  <rect x="440" y="314" width="376" height="162" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="454" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The failure that returns 200 OK</text>
  <text x="454" y="356" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">On App Service, if you ask for a token and name no</text>
  <text x="454" y="369" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">identity:</text>
  <text x="454" y="391" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">&#8220;the token service tries to get a token for a system-</text>
  <text x="454" y="404" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">assigned identity, which might or might not exist.&#8221;</text>
  <text x="454" y="426" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">So the app silently authenticates as the wrong principal</text>
  <text x="454" y="439" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">and fails later at the target, as an authorization error</text>
  <text x="454" y="452" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">on a resource you did grant &#8212; to the other identity.</text>
  <text x="454" y="470" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">On a VM the same omission is an error. Not here.</text>

  <text x="44" y="506" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">And on AKS the identity is the same &#8212; the way in is not</text>

  <rect x="44" y="520" width="376" height="152" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="58" y="542" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">The cluster issues the token</text>
  <text x="58" y="562" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">&#8220;The AKS cluster acts as the token issuer. Microsoft</text>
  <text x="58" y="575" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Entra ID uses OIDC to discover public signing keys and</text>
  <text x="58" y="588" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">verify the authenticity of the service account token</text>
  <text x="58" y="601" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">before exchanging it for a Microsoft Entra token.&#8221;</text>
  <text x="58" y="623" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Kubernetes mints, Entra trusts, then swaps. There is no</text>
  <text x="58" y="636" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">metadata endpoint to call &#8212; which is why post #37 is</text>
  <text x="58" y="649" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">about federation rather than about managed identity.</text>
  <text x="58" y="666" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Maximum 20 federated identity credentials per identity.</text>

  <rect x="440" y="520" width="376" height="152" rx="6" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.4"/>
  <text x="454" y="542" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Two lines that decide whether it works</text>
  <text x="454" y="562" font-family="Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#1D2322">azure.workload.identity/use: &#8220;true&#8221;</text>
  <text x="454" y="576" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Required on the pod spec. Without it the webhook</text>
  <text x="454" y="589" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">injects nothing and &#8220;the pods fail after they&#8217;re restarted&#8221;</text>
  <text x="454" y="602" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">&#8212; so it works until the first restart.</text>
  <text x="454" y="624" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9A7B57">Read the token path from the environment variable.</text>
  <text x="454" y="637" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">&#8220;Don&#8217;t hard-code a path &#8230; The mount path is an</text>
  <text x="454" y="650" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">implementation detail of the webhook and can change.&#8221;</text>
  <text x="454" y="666" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Kubernetes refreshes it in place; re-read it each time.</text>

  <text x="44" y="704" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The Azure Identity libraries read all of this for you. Every difference above is a reason to use the SDK rather than call the endpoint by hand.</text>

  <text x="44" y="738" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sources: Use managed identities on a virtual machine, Managed identities in Azure App Service, and Microsoft Entra Workload ID on AKS, on Microsoft Learn.</text>
</svg>
