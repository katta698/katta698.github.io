<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 744" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: workload identity federation in Microsoft Entra ID, showing the six-step token exchange from external identity provider to Entra access token, the three fields issuer subject and audience that must match the incoming token case-sensitively with no wildcards, the failure mode where a wrong subject creates successfully and the exchange then fails without an error, and the fact that anyone who can add a secret to an app registration can add a federated identity credential that never expires">
  <title>A federated identity credential grants access like a secret, never expires like a secret, and appears in no report of expiring secrets</title>
  <rect x="0" y="0" width="860" height="744" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A credential with no secret in it &#8212; and no expiry date to put in a calendar.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">You stop rotating secrets by trusting someone else&#8217;s issuer instead. That is a smaller attack surface and a different one.</text>

  <text x="44" y="88" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The exchange, and the only step Azure actually controls</text>

  <line x1="44" y1="102" x2="816" y2="102" stroke="#C9C5BF" stroke-width="1"/>
  <text x="52" y="122" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">1</text>
  <text x="76" y="122" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The external workload &#8212; a GitHub Actions run, a pod, a job in AWS &#8212; asks its own IdP for a token.</text>
  <text x="52" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">2</text>
  <text x="76" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The external IdP issues it. Azure is not involved and cannot be.</text>
  <text x="52" y="166" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">3</text>
  <text x="76" y="166" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The workload sends that token to the Microsoft identity platform and asks for an access token.</text>
  <text x="52" y="188" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">4</text>
  <text x="76" y="188" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E24B4A">Entra checks the trust relationship and validates the token against the issuer&#8217;s OIDC URL.</text>
  <text x="76" y="201" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">This is the whole of your control. Everything before it belongs to the other provider.</text>
  <text x="52" y="223" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">5</text>
  <text x="76" y="223" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">If the checks pass, Entra issues an access token.</text>
  <text x="52" y="245" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">6</text>
  <text x="76" y="245" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The workload uses it against Entra-protected resources, exactly as a managed identity would.</text>
  <line x1="44" y1="260" x2="816" y2="260" stroke="#C9C5BF" stroke-width="1"/>

  <rect x="44" y="282" width="376" height="176" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="58" y="304" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Three fields, and no room to be approximate</text>
  <text x="58" y="324" font-family="Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#1D2322">issuer</text>
  <text x="130" y="324" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">the external IdP&#8217;s URL. Leading or</text>
  <text x="130" y="336" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">trailing whitespace blocks the exchange.</text>
  <text x="58" y="356" font-family="Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#1D2322">subject</text>
  <text x="130" y="356" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">who the workload is. &#8220;No fixed format,</text>
  <text x="130" y="368" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">as each IdP uses their own.&#8221;</text>
  <text x="58" y="388" font-family="Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#1D2322">audience</text>
  <text x="130" y="388" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">exactly one. Recommended value</text>
  <text x="130" y="400" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">api://AzureADTokenExchange</text>
  <text x="58" y="422" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">All three &#8220;must case-sensitively match&#8221; the claims in</text>
  <text x="58" y="434" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">the incoming token. &#8220;Wildcard characters aren&#8217;t</text>
  <text x="58" y="446" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">supported in any federated identity credential value.&#8221;</text>

  <rect x="440" y="282" width="376" height="176" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="454" y="304" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The third silent failure in three posts</text>
  <text x="454" y="326" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Get the subject wrong and the credential &#8220;is created</text>
  <text x="454" y="338" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">successfully without error. The error does not become</text>
  <text x="454" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">apparent until the token exchange fails.&#8221;</text>
  <text x="454" y="372" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">&#8220;You won&#8217;t get an error, the exchange fails without</text>
  <text x="454" y="384" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">error.&#8221;</text>
  <text x="454" y="406" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">#35 a cache that cannot be flushed. #36 a token for the</text>
  <text x="454" y="418" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">wrong identity. #37 a credential that saves and never</text>
  <text x="454" y="430" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">works. Workload identity fails quietly by default.</text>
  <text x="454" y="448" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Propagation adds a second one: AADSTS70021.</text>

  <text x="44" y="490" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Who can create one, and what it costs you to have it</text>

  <rect x="44" y="504" width="376" height="164" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="58" y="526" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">The audit gap</text>
  <text x="58" y="546" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">&#8220;Anyone with permissions to create an app registration</text>
  <text x="58" y="558" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">and add a secret or certificate can add a federated</text>
  <text x="58" y="570" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">identity credential to an app.&#8221;</text>
  <text x="58" y="592" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Same people, same blade &#8212; but no expiry, so it never</text>
  <text x="58" y="604" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">appears in a &#8220;secrets expiring soon&#8221; report, and no</text>
  <text x="58" y="616" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">rotation date to make anyone look at it again.</text>
  <text x="58" y="638" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">They also &#8220;don&#8217;t consume the Microsoft Entra tenant</text>
  <text x="58" y="650" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">service principal object quota&#8221;. Nothing counts them.</text>
  <text x="58" y="664" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9A7B57">An Azure Policy deny is the documented brake.</text>

  <rect x="440" y="504" width="376" height="164" rx="6" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.4"/>
  <text x="454" y="526" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">The numbers that shape a design</text>
  <text x="454" y="546" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1D2322">20</text>
  <text x="478" y="546" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">per application or user-assigned managed identity</text>
  <text x="454" y="564" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1D2322">100</text>
  <text x="478" y="564" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">signing keys stored from the IdP&#8217;s OIDC endpoint &#8212;</text>
  <text x="478" y="576" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">past that &#8220;you may experience errors&#8221;</text>
  <text x="454" y="594" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1D2322">600</text>
  <text x="478" y="594" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">characters each for issuer, subject and audience</text>
  <text x="454" y="612" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1D2322">RS256</text>
  <text x="496" y="612" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">the only tested signing algorithm</text>
  <text x="454" y="634" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9A7B57">Create them serially. Concurrent writes under one</text>
  <text x="454" y="646" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9A7B57">identity return 409 &#8212; which broke Terraform pipelines</text>
  <text x="454" y="658" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9A7B57">before azurerm 3.40.0.</text>

  <text x="44" y="700" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">And one refusal worth knowing: &#8220;Microsoft Entra ID issued tokens may not be used for federated identity flows.&#8221; Entra will not federate with itself.</text>

  <text x="44" y="734" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sources: Workload identity federation, and Workload identity federation considerations, on Microsoft Learn.</text>
</svg>
