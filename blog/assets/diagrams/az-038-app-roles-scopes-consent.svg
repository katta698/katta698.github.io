<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 690" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: app roles, scopes and consent in Microsoft Entra ID, contrasting the identical permission name Files.Read.All granted as a delegated permission where the app can read only what the signed-in user can read, against the same name granted as an application permission where the app can read any file in the tenant, the rules that follow about who may consent and whether consent can be dynamic, and two documented cases where a role silently does or does not appear in a token">
  <title>Files.Read.All means two entirely different things depending on whether a user is present</title>
  <rect x="0" y="0" width="860" height="690" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The same permission name. One user&#8217;s files, or every file in the tenant.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Nothing in the string tells you which. The difference is whether a signed-in user is present, and it is the whole of the blast radius.</text>

  <rect x="44" y="80" width="376" height="140" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="58" y="102" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Delegated &#8212; on behalf of a user</text>
  <text x="58" y="122" font-family="Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#1D2322">Files.Read.All</text>
  <text x="58" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5B7B9A">&#8220;The application is only able to read files that the</text>
  <text x="58" y="157" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5B7B9A">user can personally access.&#8221;</text>
  <text x="58" y="179" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Two authorisations, not one: &#8220;both the client and the</text>
  <text x="58" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">user must be authorized separately&#8221;. The user&#8217;s own</text>
  <text x="58" y="205" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">access is the ceiling, whatever the scope says.</text>

  <rect x="440" y="80" width="376" height="140" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="454" y="102" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Application &#8212; no user at all</text>
  <text x="454" y="122" font-family="Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#1D2322">Files.Read.All</text>
  <text x="454" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">&#8220;able to read any file in the tenant using Microsoft</text>
  <text x="454" y="157" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">Graph.&#8221;</text>
  <text x="454" y="179" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">One authorisation. &#8220;The application is able to access</text>
  <text x="454" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">any data that the permission is associated with.&#8221;</text>
  <text x="454" y="205" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">There is no ceiling. There is no user to be one.</text>

  <text x="44" y="252" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Everything else about them follows from that one difference</text>

  <line x1="44" y1="266" x2="816" y2="266" stroke="#C9C5BF" stroke-width="1"/>
  <text x="240" y="284" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1D2322">Delegated</text>
  <text x="530" y="284" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1D2322">Application</text>
  <line x1="44" y1="292" x2="816" y2="292" stroke="#E3E1DD" stroke-width="1"/>

  <text x="52" y="312" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">Also called</text>
  <text x="240" y="312" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">scopes, OAuth2 permission scopes</text>
  <text x="530" y="312" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">app roles, app-only permissions</text>

  <text x="52" y="336" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">Who may consent</text>
  <text x="240" y="336" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">users for their own data; admins for all</text>
  <text x="530" y="336" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">only admin can consent</text>

  <text x="52" y="360" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">Consent method</text>
  <text x="240" y="360" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">static, or dynamic at sign-in</text>
  <text x="530" y="360" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">&#8220;Static ONLY&#8221; &#8212; declared up front</text>

  <text x="52" y="384" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">What consent leaves</text>
  <text x="240" y="384" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">oAuth2PermissionGrant</text>
  <text x="530" y="384" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1D2322">appRoleAssignment</text>

  <text x="52" y="408" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5A6260">Typical caller</text>
  <text x="240" y="408" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">web, mobile, single-page app</text>
  <text x="530" y="408" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">web, daemon, background service</text>
  <line x1="44" y1="422" x2="816" y2="422" stroke="#C9C5BF" stroke-width="1"/>

  <text x="44" y="452" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">And two places a role is in the token when you think it is not, or the reverse</text>

  <rect x="44" y="466" width="376" height="152" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="58" y="488" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Disabling a role does not revoke it</text>
  <text x="58" y="508" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Set an app role to Disabled and &#8220;it becomes inactive</text>
  <text x="58" y="521" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">and no longer assignable&#8221;. But:</text>
  <text x="58" y="543" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">&#8220;the current app role assignments to users, groups</text>
  <text x="58" y="556" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">and applications will remain, and the app role will</text>
  <text x="58" y="569" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">continue to pass in the token(s).&#8221;</text>
  <text x="58" y="591" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Disabling is a brake on new grants, not on existing</text>
  <text x="58" y="604" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">ones. Remove the assignment to remove the claim.</text>

  <rect x="440" y="466" width="376" height="152" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="454" y="488" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">A group of service principals emits nothing</text>
  <text x="454" y="508" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">&#8220;Currently, if you add a service principal to a group,</text>
  <text x="454" y="521" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">and then assign an app role to that group, Microsoft</text>
  <text x="454" y="534" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">Entra ID doesn&#8217;t add the roles claim to tokens it</text>
  <text x="454" y="547" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">issues.&#8221;</text>
  <text x="454" y="569" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">The pattern of posts #19 and #32 &#8212; grant to the group,</text>
  <text x="454" y="582" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">not the principal &#8212; fails here without error. Assign the</text>
  <text x="454" y="595" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">role to the service principal directly. Third time groups</text>
  <text x="454" y="608" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">have turned out to be the wrong tool for workloads.</text>

  <text x="44" y="656" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Consent is not the only door: Entra built-in roles, Azure RBAC, Exchange RBAC and Teams resource-specific consent all grant access too.</text>

  <text x="44" y="682" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sources: Overview of permissions and consent, and Add app roles and get them from a token, on Microsoft Learn.</text>
</svg>
