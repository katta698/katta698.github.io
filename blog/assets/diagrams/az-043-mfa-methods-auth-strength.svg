<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 802" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: multifactor authentication methods and authentication strengths in Microsoft Entra, showing which method combinations satisfy the multifactor, passwordless and phishing-resistant built-in strengths, which common methods satisfy none of them, the fact that an authentication strength does not restrict initial authentication, and that the authentication methods policies combine permissively so a method must be disabled everywhere to be off">
  <title>Require MFA says almost nothing. Authentication strength says which methods count.</title>
  <rect x="0" y="0" width="860" height="802" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">&#8220;Require MFA&#8221; says almost nothing. Authentication strength says which methods count.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Same grant control, three built-in answers &#8212; and a set of methods that satisfy none of them, including one whose name contains MFA.</text>

  <text x="44" y="88" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">What each built-in strength accepts</text>

  <line x1="44" y1="102" x2="816" y2="102" stroke="#C9C5BF" stroke-width="1"/>
  <text x="52" y="120" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#5A6260">METHOD COMBINATION</text>
  <text x="490" y="120" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#5A6260">MFA</text>
  <text x="590" y="120" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#5A6260">PASSWORDLESS</text>
  <text x="730" y="120" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#5A6260">PHISH-RESISTANT</text>

  <text x="52" y="142" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">FIDO2 security key</text>
  <text x="490" y="142" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="590" y="142" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="730" y="142" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>

  <text x="52" y="162" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Windows Hello for Business, or platform credential</text>
  <text x="490" y="162" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="590" y="162" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="730" y="162" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>

  <text x="52" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Certificate-based authentication (multifactor)</text>
  <text x="490" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="590" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="730" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>

  <text x="52" y="202" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Microsoft Authenticator (phone sign-in)</text>
  <text x="490" y="202" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="590" y="202" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="730" y="202" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9A7B57">no</text>

  <text x="52" y="222" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Temporary Access Pass</text>
  <text x="490" y="222" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="590" y="222" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9A7B57">no</text>
  <text x="730" y="222" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9A7B57">no</text>

  <text x="52" y="242" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Password + something the user has (SMS, voice, push, OATH)</text>
  <text x="490" y="242" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5B7B9A">yes</text>
  <text x="590" y="242" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9A7B57">no</text>
  <text x="730" y="242" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9A7B57">no</text>
  <line x1="44" y1="258" x2="816" y2="258" stroke="#C9C5BF" stroke-width="1"/>

  <rect x="44" y="280" width="376" height="128" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.4"/>
  <text x="58" y="302" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Satisfies nothing &#8212; not even MFA strength</text>
  <text x="58" y="324" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">SMS sign-in</text>
  <text x="170" y="324" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">as a primary method &#8212; a text as a</text>
  <text x="170" y="336" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">second factor is a different thing</text>
  <text x="58" y="356" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">QR code</text>
  <text x="58" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">Certificate-based auth (single-factor)</text>
  <text x="58" y="392" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#E24B4A">Password &#183; federated single-factor</text>

  <rect x="440" y="280" width="376" height="128" rx="6" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="454" y="302" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Phishing-resistant, per Microsoft</text>
  <text x="454" y="324" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Windows Hello for Business &#183; Platform Credential for</text>
  <text x="454" y="336" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">macOS &#183; synced passkeys &#183; FIDO2 security keys &#183;</text>
  <text x="454" y="348" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">passkeys in Microsoft Authenticator &#183; CBA</text>
  <text x="454" y="370" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5B7B9A">The defining property: &#8220;methods that require an</text>
  <text x="454" y="382" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5B7B9A">interaction between the authentication method and</text>
  <text x="454" y="394" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5B7B9A">the sign-in surface.&#8221;</text>

  <text x="44" y="438" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#E24B4A">A strength does not stop the password being typed</text>
  <text x="44" y="460" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8220;Conditional Access policies are evaluated only after the initial authentication. As a result, an authentication strength doesn&#8217;t</text>
  <text x="44" y="476" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">restrict a user&#8217;s initial authentication.&#8221; Under phishing-resistant strength, &#8220;a user can still enter a password but must sign in by</text>
  <text x="44" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">using a phishing-resistant method &#8230; before they can continue.&#8221; The credential you were removing is still accepted first.</text>

  <text x="44" y="524" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Two compositions that surprise</text>

  <line x1="44" y1="538" x2="816" y2="538" stroke="#C9C5BF" stroke-width="1"/>
  <text x="52" y="558" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Strength + sign-in frequency</text>
  <text x="300" y="558" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">&#8220;users can satisfy both requirements at two different times&#8221; &#8212; a passkey</text>
  <text x="300" y="572" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">24 hours ago plus today&#8217;s device unlock clears a one-hour policy</text>

  <text x="52" y="596" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Signed in with a password first</text>
  <text x="300" y="596" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">if the strength needs Windows Hello, &#8220;the user isn&#8217;t prompted&#8221; &#8212; they must</text>
  <text x="300" y="610" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">restart the session and pick Sign-in options themselves</text>
  <line x1="44" y1="626" x2="816" y2="626" stroke="#C9C5BF" stroke-width="1"/>

  <text x="44" y="652" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">And the policies combine permissively, like everything else in this phase</text>
  <text x="44" y="674" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Three policies can enable a method: Authentication methods, legacy MFA, legacy SSPR. &#8220;A user who is enabled for an</text>
  <text x="44" y="690" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#E24B4A">authentication method in any policy can register and use that method. To prevent users from using a method, it must be</text>
  <text x="44" y="706" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#E24B4A">disabled in all policies.&#8221;</text>
  <text x="44" y="726" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">So enabling voice for one group and finding non-members using voice is not a bug &#8212; they are enabled elsewhere.</text>

  <text x="44" y="756" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9A7B57">The deadline has passed: &#8220;Beginning September 30, 2025, authentication methods can&#8217;t be managed in these legacy MFA and SSPR</text>
  <text x="44" y="770" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9A7B57">policies.&#8221; Security questions are the exception and still live only in the legacy SSPR policy.</text>

  <text x="44" y="794" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Sources: Microsoft Entra authentication overview, Conditional Access authentication strengths, and Manage authentication methods, on Microsoft Learn.</text>
</svg>
