<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 832" style="width:100%;max-width:860px;" role="img" aria-label="Azure Network Security Group evaluation order reversing by direction, the rule properties, the default rules, and what sits outside the group's control">
  <title>Azure Network Security Group rules and evaluation order: the order reverses between inbound and outbound, so an allow is an AND across both groups and a deny is an OR</title>
  <rect x="0" y="0" width="860" height="832" fill="#F8F7F5"/>

  <text x="44" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1D2322">The order reverses with direction: allow is an AND across both NSGs, deny is an OR</text>

  <!-- Band 1: the reversal -->
  <rect x="24" y="46" width="812" height="176" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="46" width="4" height="176" fill="#E24B4A"/>
  <text x="44" y="68" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#E24B4A">EVALUATION ORDER &#8212; AND PROCESSING STOPS AT THE FIRST MATCH</text>

  <text x="44" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">INBOUND</text>
  <rect x="120" y="80" width="150" height="26" fill="#F1F3F5" stroke="#C7CFD6" stroke-width="1"/>
  <text x="134" y="97" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Subnet NSG</text>
  <text x="280" y="97" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>
  <rect x="300" y="80" width="150" height="26" fill="#F1F3F5" stroke="#C7CFD6" stroke-width="1"/>
  <text x="314" y="97" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">NIC NSG</text>
  <text x="470" y="97" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">&#8594; the VM</text>
  <text x="560" y="97" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">BOTH must allow</text>

  <text x="44" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">OUTBOUND</text>
  <rect x="120" y="122" width="150" height="26" fill="#F1F3F5" stroke="#C7CFD6" stroke-width="1"/>
  <text x="134" y="139" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">NIC NSG</text>
  <text x="280" y="139" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>
  <rect x="300" y="122" width="150" height="26" fill="#F1F3F5" stroke="#C7CFD6" stroke-width="1"/>
  <text x="314" y="139" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Subnet NSG</text>
  <text x="470" y="139" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">&#8594; out</text>
  <text x="560" y="139" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">EITHER can deny</text>

  <text x="44" y="170" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Because the first group that matches ends it, a rule in the second group is never consulted. An allow</text>
  <text x="44" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">added to the NIC does nothing if the subnet already denied the traffic.</text>
  <text x="44" y="206" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">Both orders apply to intra-subnet traffic too. Microsoft advises attaching at one level, not both.</text>

  <!-- Band 2: rule properties -->
  <rect x="24" y="238" width="400" height="212" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="238" width="4" height="212" fill="#5B7B9A"/>
  <text x="44" y="260" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5B7B9A">WHAT A RULE IS</text>
  <text x="44" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Name &#8212; up to 80 characters</text>
  <text x="44" y="300" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1D2322">Priority &#8212; 100 to 4096, lower goes first</text>
  <text x="44" y="318" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Source / destination &#8212; Any, an IP, a CIDR</text>
  <text x="44" y="332" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">block, a service tag, or an ASG</text>
  <text x="44" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Protocol &#8212; TCP, UDP, ICMP, ESP, AH, Any</text>
  <text x="44" y="368" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Direction &#8212; picks which order above applies</text>
  <text x="44" y="386" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Port range &#8212; 80, or 10000-10005, or both</text>
  <text x="44" y="404" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Action &#8212; Allow or Deny</text>
  <text x="44" y="428" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Matches on the five-tuple. No two rules may</text>
  <text x="44" y="442" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">share a priority and direction.</text>

  <!-- Band 3: defaults -->
  <rect x="436" y="238" width="400" height="212" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="436" y="238" width="4" height="212" fill="#9A7B57"/>
  <text x="456" y="260" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#9A7B57">THE FLOOR: SIX DEFAULT RULES</text>

  <text x="456" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">Inbound</text>
  <text x="456" y="300" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">65000  AllowVNetInBound</text>
  <text x="456" y="314" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">65001  AllowAzureLoadBalancerInBound</text>
  <text x="456" y="328" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">65500  DenyAllInbound</text>

  <text x="456" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">Outbound</text>
  <text x="456" y="370" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">65000  AllowVnetOutBound</text>
  <text x="456" y="384" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">65001  AllowInternetOutBound</text>
  <text x="456" y="398" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">65500  DenyAllOutBound</text>

  <text x="456" y="422" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Cannot be removed, only overridden. Your</text>
  <text x="456" y="436" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">band ends at 4096, so you always outrank them.</text>

  <!-- Band 4: outside the NSG -->
  <rect x="24" y="466" width="812" height="164" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="466" width="4" height="164" fill="#E24B4A"/>
  <text x="44" y="488" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#E24B4A">THE NSG IS A LAYER, NOT THE BOUNDARY</text>

  <text x="44" y="510" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Above it &#8212; security admin rules from Virtual Network Manager, evaluated first:</text>
  <text x="44" y="528" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Allow &#8212; continues on to NSG evaluation</text>
  <text x="44" y="542" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">Always allow / Deny &#8212; terminate evaluation; no NSG rule is ever reached</text>

  <text x="44" y="568" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Below it &#8212; platform traffic your rules do not see:</text>
  <text x="44" y="586" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">DHCP, DNS, IMDS and health monitoring over 168.63.129.16 and 169.254.169.254 are not subject</text>
  <text x="44" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">to configured NSGs unless named via AzurePlatformDNS, AzurePlatformIMDS, AzurePlatformLKM.</text>
  <text x="44" y="620" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Windows KMS licensing leaves over port 1688. Outbound port 25 is a subscription-level block.</text>

  <!-- Band 5: stateful -->
  <rect x="24" y="646" width="812" height="96" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="646" width="4" height="96" fill="#5B7B9A"/>
  <text x="44" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5B7B9A">STATEFUL BY FLOW RECORD</text>
  <text x="44" y="690" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A flow record is created per connection, so return traffic needs no rule in the opposite direction.</text>
  <text x="44" y="710" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Rules apply only to new connections: remove the rule allowing an active SSH session and that</text>
  <text x="44" y="724" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">session stays connected, while the next attempt is blocked.</text>

  <!-- Band 6: diagnosis -->
  <text x="44" y="770" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#1D2322">WHICH RULE DECIDED IT</text>
  <text x="44" y="792" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Read effective security rules for the aggregate, then IP flow verify, which names the responsible rule.</text>
  <text x="44" y="812" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The NSG blade shows neither. NSG flow logs retire on September 30, 2027; use virtual network flow logs.</text>
</svg>
