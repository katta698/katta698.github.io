<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 836" style="width:100%;max-width:860px;" role="img" aria-label="Azure public IP addresses: the Basic versus Standard SKU comparison, what static and dynamic actually mean, the three properties fixed at creation, and what the Basic retirement means">
  <title>Azure public IP addresses: one immutable SKU field that decides allocation, security posture, zone behaviour and what the address can attach to</title>
  <rect x="0" y="0" width="860" height="836" fill="#F8F7F5"/>

  <text x="44" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1D2322">One field decides allocation, security, zones and attachment &#8212; and it is fixed at creation</text>

  <!-- Band 1: the comparison -->
  <rect x="24" y="46" width="812" height="212" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="46" width="4" height="212" fill="#5B7B9A"/>
  <text x="44" y="68" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5B7B9A">STANDARD VERSUS BASIC</text>

  <text x="340" y="88" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">STANDARD</text>
  <text x="610" y="88" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">BASIC</text>

  <text x="44" y="110" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">Security</text>
  <text x="340" y="110" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">Secure by default &#8212; CLOSED</text>
  <text x="610" y="110" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">Open by default</text>
  <text x="340" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">an NSG is required to allow traffic</text>
  <text x="610" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">NSG optional</text>

  <text x="44" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Allocation</text>
  <text x="340" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Static only</text>
  <text x="610" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">IPv4 either; IPv6 dynamic</text>

  <text x="44" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Availability zones</text>
  <text x="340" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Non-zonal, zonal or zone-redundant</text>
  <text x="610" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Not supported</text>

  <text x="44" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Routing preference, global tier</text>
  <text x="340" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Supported (neither on v2)</text>
  <text x="610" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Not supported</text>

  <text x="44" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Standard LB / NAT GW / Firewall</text>
  <text x="340" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Supported</text>
  <text x="610" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Not supported</text>

  <text x="44" y="224" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9A7B57">Idle timeout</text>
  <text x="340" y="224" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9A7B57">IDENTICAL ON BOTH &#8212; inbound adjustable 4 to 30 minutes,</text>
  <text x="340" y="238" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9A7B57">default 4 minutes; outbound fixed at 4 minutes</text>
  <text x="44" y="252" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">A connection dying at four minutes is not a SKU problem.</text>

  <!-- Band 2: static vs dynamic -->
  <rect x="24" y="274" width="400" height="140" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="274" width="4" height="140" fill="#5A6260"/>
  <text x="44" y="296" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5A6260">DYNAMIC</text>
  <text x="44" y="318" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Not given at creation. Assigned when you</text>
  <text x="44" y="332" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">associate it with a resource.</text>
  <text x="44" y="354" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">Released when you STOP or delete &#8212;</text>
  <text x="44" y="368" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">not merely &#8220;changes occasionally&#8221;.</text>
  <text x="44" y="394" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Fine only when nothing has written the</text>
  <text x="44" y="408" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">address down anywhere.</text>

  <rect x="436" y="274" width="400" height="140" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="436" y="274" width="4" height="140" fill="#5A6260"/>
  <text x="456" y="296" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5A6260">STATIC</text>
  <text x="456" y="318" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Assigned at creation. Survives a stop.</text>
  <text x="456" y="340" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">Released on DELETE and cannot be</text>
  <text x="456" y="354" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">recovered &#8212; not &#8220;yours forever&#8221;.</text>
  <text x="456" y="376" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">You cannot choose the address; Azure</text>
  <text x="456" y="390" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">assigns from a regional pool.</text>
  <text x="456" y="408" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Needed by firewall rules, A records, TLS certs.</text>

  <!-- Band 3: fixed at creation -->
  <rect x="24" y="430" width="812" height="96" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="430" width="4" height="96" fill="#E24B4A"/>
  <text x="44" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#E24B4A">FIXED AT CREATION &#8212; THERE IS NO EDIT</text>
  <text x="44" y="474" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; The SKU. Changing it means detach, recreate, reattach.</text>
  <text x="44" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; The availability zone. Once created, a public IP cannot change its zone.</text>
  <text x="44" y="510" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; The domain name label scope &#8212; the mitigation for dangling DNS names.</text>

  <!-- Band 4: the zone relabelling -->
  <rect x="24" y="542" width="812" height="84" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="542" width="4" height="84" fill="#9A7B57"/>
  <text x="44" y="564" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#9A7B57">THE SAME DISPLAY, OPPOSITE MEANINGS</text>
  <text x="44" y="586" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A blank zone field on a STANDARD IP now means zone-redundant: formerly non-zonal Standard IPs</text>
  <text x="44" y="600" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">are now zone-redundant wherever zones exist, so &#8220;zones 1 2 3&#8221; and no zones are equivalent.</text>
  <text x="44" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">The same blank field on a BASIC IP means exactly non-zonal. The SKU decides which.</text>

  <!-- Band 5: the retirement -->
  <rect x="24" y="642" width="812" height="138" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="642" width="4" height="138" fill="#E24B4A"/>
  <text x="44" y="664" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#E24B4A">THE RETIREMENT, AND WHY IT IS NOT A SHUTDOWN</text>
  <text x="44" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Basic SKU public IPs were retired on 30 September 2025 and remain operational. Continuing to use</text>
  <text x="44" y="700" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">them means accepting that the service is unsupported and not covered by SLA guarantees.</text>
  <text x="44" y="722" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The upgrade is not like-for-like: open-by-default becomes closed-by-default, so the NSG rules must</text>
  <text x="44" y="736" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">exist before cutover. Microsoft&#8217;s own steps include a migration plan for planned downtime.</text>
  <text x="44" y="758" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">SKUs cannot be mixed, so a Basic IP fronting a Basic load balancer drags the balancer with it.</text>
  <text x="44" y="772" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Uniform scale set per-instance IPs are not resources at all and cannot be upgraded.</text>

  <!-- Band 6: the v2 trap -->
  <text x="44" y="812" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#1D2322">AND THE TRAP NEXT TO THE OBVIOUS ANSWER</text>
  <text x="44" y="832" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Standard v2 works only with the Standard v2 NAT Gateway and nothing else. It is a separate product line, not a successor.</text>
</svg>
