<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 856" style="width:100%;max-width:860px;" role="img" aria-label="Azure NAT Gateway and SNAT port exhaustion: the port arithmetic, why the inventory is per-destination, the timers that govern reuse, the outbound precedence ladder, and the constraints">
  <title>Azure NAT Gateway and SNAT port exhaustion: a million ports, but the binding limit is fifty thousand concurrent connections per public IP to a single destination</title>
  <rect x="0" y="0" width="860" height="856" fill="#F8F7F5"/>

  <text x="44" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1D2322">A million ports &#8212; but the limit that bites is 50,000 per IP to one destination</text>

  <!-- Band 1: the arithmetic -->
  <rect x="24" y="46" width="812" height="112" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="46" width="4" height="112" fill="#5B7B9A"/>
  <text x="44" y="68" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5B7B9A">THE ARITHMETIC</text>
  <text x="44" y="92" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Each public IP attached to a NAT gateway provides</text>
  <text x="430" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">64,512 SNAT ports</text>
  <text x="44" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Up to</text>
  <text x="430" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">16 public IP addresses</text>
  <text x="44" y="134" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">16 &#215; 64,512 = 1,032,192</text>
  <text x="430" y="134" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212; which is the &#8220;more than 1 million&#8221; figure</text>
  <text x="44" y="152" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">No preallocation per instance: the inventory is available on demand to the whole subnet.</text>

  <!-- Band 2: why it is not a free pool -->
  <rect x="24" y="174" width="812" height="146" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="174" width="4" height="146" fill="#E24B4A"/>
  <text x="44" y="196" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#E24B4A">WHY THAT IS NOT A POOL YOU CAN SPEND FREELY</text>
  <text x="44" y="220" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The SAME port can serve DIFFERENT destinations at once.</text>
  <text x="44" y="238" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">DIFFERENT ports are required for the SAME destination &#8212; so the inventory is per-destination.</text>

  <rect x="44" y="252" width="380" height="30" fill="#FBE9E8" stroke="#E8B4B2" stroke-width="1"/>
  <text x="56" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">50,000 concurrent per IP, per destination</text>

  <rect x="436" y="252" width="380" height="30" fill="#F1F3F5" stroke="#C7CFD6" stroke-width="1"/>
  <text x="448" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">2 million active flows per gateway, on the 5-tuple</text>

  <text x="44" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">The remedy is to add public IP addresses, not machines. Scaling out VMs changes nothing.</text>
  <text x="44" y="316" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Past 2 million flows the data path&#8217;s availability declines and new connections fail. TCP and UDP are separate inventories.</text>

  <!-- Band 3: timers -->
  <rect x="24" y="336" width="812" height="150" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="336" width="4" height="150" fill="#9A7B57"/>
  <text x="44" y="358" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#9A7B57">THE TIMERS, WHICH DECIDE HOW FAST PORTS COME BACK</text>

  <text x="44" y="380" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">TCP idle timeout</text>
  <text x="300" y="380" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">4 minutes default, configurable to 120 minutes</text>
  <text x="44" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">UDP idle timeout</text>
  <text x="300" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">4 minutes, not configurable</text>
  <text x="44" y="412" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Reuse after TCP FIN</text>
  <text x="300" y="412" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">65 seconds hold-down</text>
  <text x="44" y="428" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Reuse after TCP RST</text>
  <text x="300" y="428" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">16 seconds &#8212; a reset frees the port four times faster</text>
  <text x="44" y="444" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">TCP half open / UDP close</text>
  <text x="300" y="444" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">30 seconds / 65 seconds</text>

  <text x="44" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">The gateway holds the port for the whole idle window, so RAISING the timeout worsens exhaustion.</text>
  <text x="44" y="480" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Use keepalives instead &#8212; invisible to the application. UDP keepalives must be set on both sides. Timer values may change.</text>

  <!-- Band 4: precedence -->
  <rect x="24" y="502" width="812" height="130" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="502" width="4" height="130" fill="#1D2322"/>
  <text x="44" y="524" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#1D2322">OUTBOUND PRECEDENCE &#8212; HIGHEST FIRST</text>
  <text x="44" y="548" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">1   UDR to a virtual appliance or virtual network gateway</text>
  <text x="44" y="566" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">2   NAT gateway</text>
  <text x="44" y="584" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">3   Instance-level public IP on the VM</text>
  <text x="44" y="602" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">4   Load balancer outbound rules</text>
  <text x="44" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">5   Default system route to the internet</text>
  <text x="430" y="566" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">Attaching one silently takes egress away</text>
  <text x="430" y="580" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">from instance IPs, load balancers and</text>
  <text x="430" y="594" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">Azure Firewall &#8212; for NEW flows only.</text>
  <text x="430" y="616" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">A 0.0.0.0/0 UDR still beats it.</text>

  <!-- Band 5: constraints -->
  <rect x="24" y="648" width="812" height="162" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="648" width="4" height="162" fill="#5A6260"/>
  <text x="44" y="670" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5A6260">CONSTRAINTS THAT DECIDE THE DESIGN BEFORE THE NUMBERS DO</text>
  <text x="44" y="692" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">&#183; One per subnet. Cannot span virtual networks. Not allowed in a gateway subnet.</text>
  <text x="44" y="708" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">&#183; No Basic SKU resources anywhere in the subnet &#8212; one leftover Basic IP blocks the whole subnet.</text>
  <text x="44" y="724" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">&#183; No public IPs using Internet routing preference, and none with DDoS protection enabled.</text>
  <text x="44" y="740" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E24B4A">&#183; IP fragmentation is not available &#8212; the same gap default outbound access had.</text>
  <text x="44" y="756" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">&#183; Not supported in a secured virtual WAN hub.</text>
  <text x="44" y="772" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">&#183; Standard is zonal and cannot be upgraded to StandardV2; StandardV2 needs StandardV2 public IPs,</text>
  <text x="56" y="786" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">so zone redundancy means a re-IP. The zone cannot be changed after deployment.</text>
  <text x="44" y="804" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">&#183; Existing flows are not preserved when a VM live-migrates &#8212; a platform action you do not schedule.</text>

  <!-- footer -->
  <text x="44" y="840" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Throughput: Standard 50 Gbps split 25 out / 25 in, 5 million PPS. StandardV2 100 Gbps, 10 million PPS.</text>
</svg>
