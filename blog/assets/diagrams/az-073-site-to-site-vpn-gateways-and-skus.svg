<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 892" style="width:100%;max-width:860px;" role="img" aria-label="Sizing an Azure site-to-site VPN gateway: the two throughput tables Microsoft publishes, the top two SKUs being identical per tunnel, the cipher outranking the SKU, limits that step rather than scale, and the migration deadline that has passed">
  <title>Azure site-to-site VPN gateway SKUs: the aggregate benchmark is not a tunnel's throughput, the cipher outranks four SKU tiers, and the non-AZ deprecation date has already passed</title>
  <rect x="0" y="0" width="860" height="892" fill="#F8F7F5"/>

  <text x="44" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1D2322">Two throughput tables, two inversions, and one deadline already behind us</text>

  <!-- Band 1: two tables -->
  <rect x="24" y="46" width="812" height="112" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="46" width="4" height="112" fill="#E24B4A"/>
  <text x="44" y="68" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#E24B4A">MICROSOFT PUBLISHES TWO THROUGHPUT TABLES. THEY MEASURE DIFFERENT THINGS.</text>
  <text x="44" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Aggregate benchmark</text>
  <text x="212" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">tested by maximizing a combination of S2S and P2S connections.</text>
  <text x="212" y="104" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">A single S2S or P2S connection can have much lower throughput.</text>
  <text x="44" y="126" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Observed per tunnel</text>
  <text x="212" y="126" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">measured between gateways INSIDE Azure across regions, 100 connections,</text>
  <text x="212" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">using iPerf and CTSTraffic. An upper bound for a real link, not a forecast.</text>
  <text x="44" y="152" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Neither is promised: no benchmark is guaranteed, given internet conditions and application behaviour.</text>

  <!-- Band 2: top two SKUs identical -->
  <rect x="24" y="174" width="812" height="118" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="174" width="4" height="118" fill="#5B7B9A"/>
  <text x="44" y="196" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5B7B9A">THE TOP TWO SKUS ARE IDENTICAL ON A SINGLE TUNNEL</text>
  <text x="44" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">SKU</text>
  <text x="220" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">AGGREGATE</text>
  <text x="400" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">PER TUNNEL</text>
  <text x="580" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">PACKETS/SEC</text>
  <text x="44" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">VpnGw4AZ (Gen2)</text>
  <text x="220" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">5 Gbps</text>
  <text x="400" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">2.3 Gbps</text>
  <text x="580" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">220,000</text>
  <text x="44" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">VpnGw5AZ (Gen2)</text>
  <text x="220" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10 Gbps</text>
  <text x="400" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">2.3 Gbps</text>
  <text x="580" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">220,000</text>
  <text x="44" y="276" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Doubling the benchmark buys nothing on one tunnel. 10 Gbps presumes ~4.35 tunnels running flat out.</text>
  <text x="44" y="288" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">What the extra money does buy: P2S IKEv2 5,000 &#8594; 10,000, and supported VMs 4,400 &#8594; 9,000.</text>

  <!-- Band 3: cipher outranks SKU -->
  <rect x="24" y="308" width="812" height="126" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="308" width="4" height="126" fill="#9A7B57"/>
  <text x="44" y="330" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#9A7B57">THE CIPHER OUTRANKS FOUR SKU TIERS</text>
  <text x="44" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Best: GCMAES256 for encryption AND integrity &#183; Average: AES256 + SHA256 &#183; Lowest: DES3 + SHA256</text>
  <text x="44" y="374" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">VpnGw1 (Gen1, smallest paid) with GCMAES256</text>
  <text x="440" y="374" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">650 Mbps</text>
  <text x="580" y="374" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">62,000 pps</text>
  <text x="44" y="392" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">VpnGw5 (Gen2, largest) with DES3 &#38; SHA256</text>
  <text x="440" y="392" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">140 Mbps</text>
  <text x="580" y="392" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">13,000 pps</text>
  <text x="44" y="414" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">The bottom SKU on a modern cipher beats the top SKU on a legacy one by 4.64&#215; throughput, 4.77&#215; pps.</text>
  <text x="44" y="428" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Custom IPsec/IKE policy is available on every SKU except Basic. A slow tunnel is more likely mis-negotiated than under-sized.</text>

  <!-- Band 4: limits that step -->
  <rect x="24" y="450" width="812" height="162" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="450" width="4" height="162" fill="#1D2322"/>
  <text x="44" y="472" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#1D2322">LIMITS THAT STEP RATHER THAN SCALE &#8212; AND TWO INVERSIONS</text>
  <text x="44" y="494" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">S2S tunnels</text>
  <text x="180" y="494" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10 (Basic) &#183; 30 (Gw1AZ, Gw2AZ, Gw3AZ) &#183; 100 (Gw4AZ, Gw5AZ) &#183; then Virtual WAN</text>
  <text x="44" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">P2S SSTP</text>
  <text x="180" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">128 on EVERY SKU, including VpnGw5AZ. It does not scale at all.</text>
  <text x="44" y="530" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">P2S IKEv2/OpenVPN</text>
  <text x="180" y="530" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">unsupported (Basic) &#8594; 250 &#8594; 500 &#8594; 1,000 &#8594; 5,000 &#8594; 10,000. Limits ADD, not share.</text>
  <text x="44" y="556" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">Supported VMs invert twice &#8212; the column does not rise monotonically:</text>
  <text x="44" y="574" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Gen1 VpnGw3AZ 1.25 Gbps / 5,000 VMs</text>
  <text x="400" y="574" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">&#8594;</text>
  <text x="424" y="574" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Gen2 VpnGw3AZ 2.5 Gbps / 3,300 VMs</text>
  <text x="44" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Gen2 VpnGw4 (non-AZ) 5,300 VMs</text>
  <text x="400" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">&#8594;</text>
  <text x="424" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Gen2 VpnGw4AZ 4,400 VMs, same throughput</text>
  <text x="44" y="608" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Numerous P2S connections can negatively impact S2S connections. All tunnels share the gateway bandwidth.</text>

  <!-- Band 5: migration -->
  <rect x="24" y="628" width="812" height="186" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="628" width="4" height="186" fill="#5A6260"/>
  <text x="44" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5A6260">THE NON-AZ DEADLINE HAS PASSED &#8212; AND THE FAILURE MODE IS A FREEZE</text>
  <text x="44" y="672" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">1 Nov 2025</text>
  <text x="180" y="672" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">no new non-AZ VpnGw1&#8211;5 gateways could be created</text>
  <text x="44" y="690" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Sep 2025 &#8211; Sep 2026</text>
  <text x="180" y="690" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">manual migration period for existing non-AZ gateways</text>
  <text x="44" y="708" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">after Sep 2026</text>
  <text x="180" y="708" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">old SKUs scheduled for deprecation &#8212; this is now in the past</text>
  <text x="44" y="732" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Documented consequence: gateways not supported by an availability zone NO LONGER ALLOW</text>
  <text x="44" y="746" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">CONFIGURATION CHANGES. Any management operation returns an error. Expected behaviour.</text>
  <text x="44" y="760" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Tunnels keep carrying traffic. What you lose is the ability to change anything. It will look like a bug.</text>
  <text x="44" y="782" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">The check:</text>
  <text x="140" y="782" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">if the SKU name ends in AZ, nothing to do. If not, migrate &#8212; same-family has no expected</text>
  <text x="140" y="796" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">downtime, cross-family may, and AZ SKU prices were REDUCED. Staying put costs more and is frozen.</text>
  <text x="44" y="810" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Legacy Standard and High Performance SKUs are a separate track and excluded from this article.</text>

  <!-- footer -->
  <text x="44" y="840" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Generation 2 is not a migration you schedule: Standard-IP gateways upgrade automatically around end of Mar 2027. Gen1 has no announced retirement date.</text>
  <text x="44" y="854" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Basic is NOT retiring, still needs a Standard public IP, has no portal, no IPv6, no RADIUS, no BGP, and is one tunnel only when policy-based.</text>
  <text x="44" y="868" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">For a policy-based peer, use a ROUTE-BASED gateway with PolicyBasedTrafficSelectors &#8212; not a policy-based gateway.</text>
  <text x="44" y="882" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Active-active costs the same as active-passive.</text>
</svg>
