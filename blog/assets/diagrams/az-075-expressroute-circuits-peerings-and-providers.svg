<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 948" style="width:100%;max-width:860px;" role="img" aria-label="Azure ExpressRoute circuits, peerings and providers: the circuit and its service key, the two peerings and their trust zones, the prefix limits and their inversion, the two state machines, and the irreversible procurement choices">
  <title>ExpressRoute circuits: a three-party arrangement with two independent state machines, one of which reports Enabled before anything works, and a billing model that cannot be reversed</title>
  <rect x="0" y="0" width="860" height="948" fill="#F8F7F5"/>

  <text x="44" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1D2322">A circuit is a three-party arrangement, not a resource &#8212; and some choices are one-way doors</text>

  <!-- Band 1: the circuit -->
  <rect x="24" y="46" width="812" height="114" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="46" width="4" height="114" fill="#5B7B9A"/>
  <text x="44" y="68" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5B7B9A">THE CIRCUIT</text>
  <text x="44" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A logical connection from on-premises to Microsoft cloud services THROUGH a connectivity provider.</text>
  <text x="44" y="110" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Service key (s-key)</text>
  <text x="212" y="110" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">a GUID, the only information exchanged between the three parties</text>
  <text x="212" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">&#8212; and explicitly NOT a secret for security purposes. Share it.</text>
  <text x="44" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Bandwidth is FIXED and SHARED across all peerings. 50 Mbps &#8594; 10 Gbps via a provider.</text>
  <text x="44" y="158" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Two connections to two Microsoft Enterprise edge routers; dual BGP sessions are required, not optional.</text>

  <!-- Band 2: two peerings -->
  <rect x="24" y="176" width="812" height="130" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="176" width="4" height="130" fill="#1D2322"/>
  <text x="44" y="198" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#1D2322">TWO PEERINGS, IN TWO TRUST ZONES</text>
  <text x="44" y="220" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">Azure private</text>
  <text x="180" y="220" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">VMs and cloud services in a VNet, on their PRIVATE IPs. Any valid IP in your</text>
  <text x="180" y="234" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">WAN. Described as a trusted extension of your core network.</text>
  <text x="180" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">Recommended landing: the CORE NETWORK.</text>
  <text x="44" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">Microsoft</text>
  <text x="180" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Microsoft 365, Azure PaaS, PSTN. Requires PUBLIC IPs owned by you or your</text>
  <text x="180" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">provider, registered to you in routing registries.</text>
  <text x="180" y="298" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">Recommended landing: the DMZ.</text>

  <!-- Band 3: prefix limits -->
  <rect x="24" y="322" width="812" height="156" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="322" width="4" height="156" fill="#9A7B57"/>
  <text x="44" y="344" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#9A7B57">PREFIX LIMITS PER PEERING &#8212; AND THE ORDER REVERSES FOR IPv6</text>
  <text x="300" y="366" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">PRIVATE PEERING</text>
  <text x="560" y="366" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">MICROSOFT PEERING</text>
  <text x="44" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Max IPv4 prefixes</text>
  <text x="300" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">4,000 &#8212; 10,000 with Premium</text>
  <text x="560" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">200</text>
  <text x="44" y="406" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Max IPv6 prefixes</text>
  <text x="300" y="406" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">100</text>
  <text x="560" y="406" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">200 &#8212; MORE than private</text>
  <text x="44" y="426" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The documented Premium uplift is stated for IPv4 only. An IPv6-heavy plan designs against 100.</text>
  <rect x="44" y="438" width="772" height="34" fill="#FBEBEA" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Exceeding a limit TERMINATES the session &#8212; it does not ignore the surplus. And cross-advertising</text>
  <text x="56" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Microsoft peering routes into private peering puts Microsoft&#8217;s MONTHLY prefix updates in your path.</text>

  <!-- Band 4: two state machines -->
  <rect x="24" y="494" width="812" height="178" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="494" width="4" height="178" fill="#E24B4A"/>
  <text x="44" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#E24B4A">TWO STATE MACHINES, BELONGING TO TWO ORGANISATIONS</text>
  <text x="44" y="538" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">STAGE</text>
  <text x="300" y="538" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">ServiceProviderProvisioningState</text>
  <text x="640" y="538" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">Status</text>
  <text x="44" y="558" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">At creation</text>
  <text x="300" y="558" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">NotProvisioned</text>
  <text x="640" y="558" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Enabled</text>
  <text x="44" y="576" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">During provisioning</text>
  <text x="300" y="576" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Provisioning</text>
  <text x="640" y="576" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Enabled</text>
  <text x="44" y="594" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">After provisioning</text>
  <text x="300" y="594" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">Provisioned</text>
  <text x="640" y="594" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Enabled</text>
  <text x="44" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">During DEprovisioning</text>
  <text x="300" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">NotProvisioned</text>
  <text x="640" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Enabled</text>
  <text x="44" y="634" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Row 1 and row 4 are IDENTICAL. The state pair cannot tell you which direction you are moving.</text>
  <text x="44" y="648" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Status is Enabled at EVERY stage, including the two where no traffic can flow. Alert on transitions.</text>
  <text x="44" y="666" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Provider state must reach Provisioned before peering can be configured.</text>

  <!-- Band 5: ownership and one-way doors -->
  <rect x="24" y="688" width="812" height="190" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="688" width="4" height="190" fill="#5A6260"/>
  <text x="44" y="710" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5A6260">WHO OWNS WHAT &#8212; AND WHAT CANNOT BE UNDONE</text>
  <text x="44" y="732" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">The order fixes</text>
  <text x="196" y="732" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">partner &#183; peering location &#183; bandwidth &#183; billing model &#183; Standard or Premium</text>
  <text x="44" y="754" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">Allowed later</text>
  <text x="196" y="754" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Standard &#8594; Premium &#183; Premium &#8594; Standard &#183; Metered &#8594; Unlimited</text>
  <text x="196" y="768" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Local &#8594; Standard/Premium (CLI or PowerShell, billing type UNLIMITED)</text>
  <text x="44" y="790" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">UNSUPPORTED</text>
  <text x="196" y="790" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Unlimited &#8594; Metered. The billing model is a ONE-WAY DOOR &#8212; and leaving</text>
  <text x="196" y="804" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Local requires unlimited, so the two constraints compound.</text>
  <text x="44" y="826" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Routing ownership</text>
  <text x="196" y="826" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">a LAYER 3 provider handles routing. With LAYER 2, you are responsible for</text>
  <text x="196" y="840" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">configuring and managing it &#8212; permanently, and a circuit is not portable.</text>
  <text x="44" y="862" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Teardown</text>
  <text x="196" y="862" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">the PROVIDER must deprovision first, and billing runs until you delete in Azure.</text>
  <text x="196" y="874" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">You cannot stop the meter on your own. Book provider lead time into any savings date.</text>

  <!-- footer -->
  <text x="44" y="904" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Microsoft peering schedule risk: advertised prefixes must reach &#8220;configured&#8221;. &#8220;validation needed&#8221; means the BGP session is not enabled;</text>
  <text x="44" y="918" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">&#8220;manual validation&#8221; means a support ticket with evidence of IP ownership and ASN. Audit RIR and IRR records at order time &#8212; stale data is the usual cause.</text>
  <text x="44" y="932" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Both peerings: ExpressRoute ASN 12076, a VLAN ID, a /30 per path (optional /126 for IPv6), optional MD5. Use a separate proxy or edge from your internet path.</text>
  <text x="44" y="946" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">When evaluating Premium, count VIRTUAL NETWORKS not routes: the link limit is 10 per circuit against 4,000 IPv4 prefixes.</text>
</svg>
