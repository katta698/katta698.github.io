<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 952" style="width:100%;max-width:860px;" role="img" aria-label="ExpressRoute Direct, FastPath and Global Reach: what each one removes, the port sizes and tagging choice on Direct, FastPath's gateway requirement and Direct-only feature matrix, its silent fallback behaviour, and Global Reach's on-premises to on-premises role">
  <title>Three ExpressRoute capabilities that remove three different things: a provider, a hop and a destination &#8212; and most of FastPath requires ExpressRoute Direct underneath it</title>
  <rect x="0" y="0" width="860" height="952" fill="#F8F7F5"/>

  <text x="44" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1D2322">Three removals, not three upgrades &#8212; and only one of them adds bandwidth</text>

  <!-- Band 1: what each removes -->
  <rect x="24" y="46" width="812" height="104" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="46" width="4" height="104" fill="#E24B4A"/>
  <text x="44" y="68" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#E24B4A">WHAT EACH ONE REMOVES</text>
  <text x="44" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Direct</text>
  <text x="156" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">the PROVIDER from the middle &#8212; you own the ports</text>
  <text x="580" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">adds bandwidth: YES</text>
  <text x="44" y="110" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">FastPath</text>
  <text x="156" y="110" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">the GATEWAY from the data path (not from the architecture)</text>
  <text x="580" y="110" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">adds bandwidth: no</text>
  <text x="44" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Global Reach</text>
  <text x="156" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">the AZURE DESTINATION &#8212; it carries on-prem to on-prem</text>
  <text x="580" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">adds bandwidth: no</text>
  <text x="44" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">They are not independent. The dependency runs one way: most of FastPath requires Direct underneath it.</text>

  <!-- Band 2: Direct -->
  <rect x="24" y="166" width="812" height="186" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="166" width="4" height="186" fill="#5B7B9A"/>
  <text x="44" y="188" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5B7B9A">EXPRESSROUTE DIRECT &#8212; YOU BECOME THE PROVIDER</text>
  <text x="44" y="208" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Dual 400 / 100 / 10 Gbps, active-active. Requires FULL MANAGEMENT OF ALL LAYERS.</text>
  <text x="44" y="230" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">PORT PAIR</text>
  <text x="200" y="230" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">CIRCUIT SKUs YOU CAN COMBINE ON IT</text>
  <text x="44" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10 Gbps</text>
  <text x="200" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">1 &#183; 2 &#183; 5 &#183; 10 Gbps</text>
  <text x="44" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">100 Gbps</text>
  <text x="200" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">5 &#183; 10 &#183; 40 &#183; 100 Gbps</text>
  <text x="44" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">400 Gbps</text>
  <text x="200" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">5 &#183; 10 &#183; 40 &#183; 100 &#183; 200 &#183; 400 Gbps &#8212; 40&#215; a provider&#8217;s 10 Gbps ceiling</text>
  <text x="44" y="306" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">No LACP, no MLAG. &#8220;Dual 100 Gbps&#8221; is TWO paths via BGP, not a 200 Gbps bonded pipe.</text>
  <text x="44" y="326" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">QinQ</text>
  <text x="120" y="326" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">isolated routing domain PER CIRCUIT &#183; C-Tag need not be unique &#183; S-Tag fixed at creation</text>
  <text x="44" y="344" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">Dot1Q</text>
  <text x="120" y="344" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">one VLAN per PORT PAIR &#183; C-Tag must be unique across every circuit and peering</text>

  <!-- Band 3: FastPath requirement + matrix -->
  <rect x="24" y="368" width="812" height="174" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="368" width="4" height="174" fill="#1D2322"/>
  <text x="44" y="390" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#1D2322">FASTPATH &#8212; BYPASSES THE GATEWAY, STILL REQUIRES IT</text>
  <text x="44" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">To bypass the gateway you must first buy a TOP-TIER gateway: Ultra Performance, ErGw3AZ,</text>
  <text x="44" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">ErGwScale &#8805;10 scale units, or VWAN ER Gateway &#8805;5 scale units. Never a cost reduction.</text>
  <text x="44" y="440" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The gateway is still needed to exchange routes &#8212; FastPath moves the data path, not the architecture.</text>
  <text x="520" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">DIRECT</text>
  <text x="640" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">PROVIDER</text>
  <text x="44" y="480" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">FastPath to hub VNet (IPv4)</text>
  <text x="520" y="480" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">yes</text>
  <text x="640" y="480" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">yes</text>
  <text x="44" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">IPv6 &#183; VNet peering &#183; UDRs &#183; Private Link &#183; Virtual WAN</text>
  <text x="520" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">yes</text>
  <text x="640" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">NO</text>
  <text x="44" y="520" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">On a provider circuit, FastPath does exactly ONE thing. Everything else is a procurement decision.</text>
  <text x="44" y="536" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Private Link is limited GA: enrollment required, 4&#8211;6 weeks after approval, named regions, four service categories.</text>

  <!-- Band 4: silent fallback -->
  <rect x="24" y="558" width="812" height="208" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="558" width="4" height="208" fill="#9A7B57"/>
  <text x="44" y="580" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#9A7B57">FASTPATH FAILS BY DEGRADING, SILENTLY</text>
  <text x="400" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">IN THE HUB</text>
  <text x="580" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5A6260">IN A SPOKE</text>
  <text x="44" y="618" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Internal load balancer &#183; Azure Firewall &#183; DNS Private Resolver</text>
  <text x="400" y="618" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">works</text>
  <text x="580" y="618" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">via gateway</text>
  <text x="44" y="636" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Azure PaaS services &#183; cross-region resources</text>
  <text x="400" y="636" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212;</text>
  <text x="580" y="636" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">via gateway</text>
  <text x="44" y="656" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Every row DEGRADES rather than fails. You never get an outage &#8212; and never get an alert.</text>
  <text x="44" y="678" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">IP address limits</text>
  <text x="200" y="678" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">200,000 on 100/400 Gbps Direct &#183; 100,000 on 10 Gbps Direct &#183; 25,000 on provider</text>
  <text x="200" y="692" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">At the same 10 Gbps, Direct carries 4&#215; the FastPath capacity of a provider circuit.</text>
  <rect x="44" y="702" width="772" height="34" fill="#FBEBEA" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="718" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">On Direct the IP limit is CUMULATIVE AT THE PORT. Business units sharing a port pair share one</text>
  <text x="56" y="732" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">budget &#8212; one unit&#8217;s growth consumes another&#8217;s headroom. Alert on APPROACHING the threshold.</text>
  <text x="44" y="756" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1D2322">Only TWO FastPath rules break connectivity outright: two peered hubs on one circuit need Allow Gateway Transit FALSE, and a spoke peered to</text>
  <text x="44" y="766" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1D2322">two hubs may use only ONE hub gateway as remote gateway.</text>

  <!-- Band 5: Global Reach -->
  <rect x="24" y="782" width="812" height="118" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <rect x="24" y="782" width="4" height="118" fill="#5A6260"/>
  <text x="44" y="804" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.8" fill="#5A6260">GLOBAL REACH &#8212; AZURE IS NOT THE DESTINATION</text>
  <text x="44" y="824" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Two offices, two circuits. Both reach Azure. Neither can reach the other &#8212; 10.0.1.0/24 can send to</text>
  <text x="44" y="838" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10.0.3.0/24 and 10.0.4.0/24 but NOT to 10.0.2.0/24. Same non-transitivity as VNet peering.</text>
  <text x="44" y="858" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">Global Reach links the circuits, making that one case transitive. The purchase is WAN transit.</text>
  <text x="44" y="878" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">Premium is required ONLY across different geopolitical regions &#8212; a domestic link needs Standard.</text>
  <text x="44" y="894" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Availability is a 25-COUNTRY list, not a region list. South Africa is Johannesburg only. Off the list, no SKU helps.</text>

  <!-- footer -->
  <text x="44" y="922" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Direct keeps Local, Standard and Premium SKUs and the same enterprise-grade SLA. Ports are physical inventory: if none are free at your location, you raise a ticket.</text>
  <text x="44" y="936" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Billing nuance against #75: Direct PORTS can be upgraded or downgraded between metered and unlimited, while a CIRCUIT cannot go unlimited back to metered.</text>
  <text x="44" y="950" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">One real saving in the whole post: Private Link pricing does not apply to traffic sent over FastPath.</text>
</svg>
