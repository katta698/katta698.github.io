<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1304" style="width:100%;max-width:860px;" role="img" aria-label="Azure Firewall SKUs, rules and policy hierarchy: three SKUs separated by capability, and four sorting keys of which priority is the third">
  <title>Azure Firewall &#8212; SKUs separated by capability, a three-level hierarchy, and the four sorting keys that decide evaluation order</title>
  <rect x="0" y="0" width="860" height="1304" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">Azure Firewall: SKUs, rules and policy hierarchy</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">Deny by default, and every rule is terminating &#8212; so the order of evaluation is the policy, not a</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">performance detail. Two identical rule sets enforce different things in a different sequence.</text>

  <!-- Band 1: SKUs -->
  <text x="44" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Three SKUs, separated by capability rather than capacity</text>

  <rect x="44" y="122" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Capability</text>
  <text x="332" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Basic</text>
  <text x="508" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Standard</text>
  <text x="668" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Premium</text>

  <rect x="44" y="148" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Autoscale ceiling</text>
  <text x="332" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">250 Mbps</text>
  <text x="508" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">30 Gbps</text>
  <text x="668" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">100 Gbps</text>

  <rect x="44" y="170" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Fat flow support (a single flow)</text>
  <text x="332" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">N/A</text>
  <text x="508" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">1 Gbps</text>
  <text x="668" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">10 Gbps</text>

  <rect x="44" y="192" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Threat intelligence filtering</text>
  <text x="332" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Alert only &#8212; cannot deny</text>
  <text x="508" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Alert and Deny</text>
  <text x="668" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Alert and Deny</text>

  <rect x="44" y="214" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Network-level FQDN filtering (all ports)</text>
  <text x="332" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Not supported</text>
  <text x="508" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Supported</text>
  <text x="668" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Supported</text>

  <rect x="44" y="236" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">DNS proxy and custom DNS</text>
  <text x="332" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Azure DNS only</text>
  <text x="508" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Supported</text>
  <text x="668" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Supported</text>

  <rect x="44" y="258" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Web categories</text>
  <text x="332" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Not supported</text>
  <text x="508" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">FQDN-based</text>
  <text x="668" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Full-URL based</text>

  <rect x="44" y="280" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">TLS inspection &#183; IDPS &#183; URL filtering</text>
  <text x="332" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212;</text>
  <text x="508" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212;</text>
  <text x="668" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Premium only</text>

  <rect x="44" y="302" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="317" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Deploy with no public IP in forced tunnel mode</text>
  <text x="332" y="317" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Not supported</text>
  <text x="508" y="317" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Supported</text>
  <text x="668" y="317" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Supported</text>

  <!-- Band 2: aggregate vs single flow -->
  <rect x="44" y="340" width="772" height="74" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="60" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#9A7B57">The advertised figure is an aggregate &#8212; the fourth time this series has met this</text>
  <text x="60" y="379" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Standard: 30 Gbps aggregate, 1 Gbps for a single fat flow &#8212; a factor of 30. Premium: 100 Gbps aggregate,</text>
  <text x="60" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10 Gbps single flow &#8212; a factor of 10. A backup job or a replication stream is one flow and gets the small</text>
  <text x="60" y="409" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">number. Same shape as #73 per-tunnel, #76 per-flow, and #81's 50 Gbps hub against 1.5 Gbps per flow.</text>

  <!-- Band 3: hierarchy -->
  <text x="44" y="448" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The hierarchy: three levels, and only two of them carry a priority</text>

  <rect x="44" y="460" width="772" height="40" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="477" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">1. Rule collection group &#8212; first unit processed, has a priority</text>
  <text x="60" y="493" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Three defaults exist: DNAT at 100, Network at 200, Application at 300. Cannot be deleted or reprioritised.</text>

  <rect x="44" y="504" width="772" height="40" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="521" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">2. Rule collection &#8212; second unit processed, has a priority, and owns the ACTION</text>
  <text x="60" y="537" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Allow or deny is set here, not per rule, and applies to every rule inside. Mixed intent needs two collections.</text>

  <rect x="44" y="548" width="772" height="40" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="565" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">3. Rule &#8212; third unit processed, NO priority at all</text>
  <text x="60" y="581" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Evaluated &#8220;in a top-down approach&#8221; in the order written. Priority values run 100 (highest) to 65,000 (lowest).</text>

  <!-- Band 4: the four sort keys -->
  <text x="44" y="622" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The actual evaluation order has four keys, and the one you set is third</text>

  <rect x="44" y="634" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="651" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Key</text>
  <text x="112" y="651" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Sorts by</text>
  <text x="560" y="651" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Can you change it?</text>

  <rect x="44" y="660" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="675" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">1</text>
  <text x="112" y="675" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Rule TYPE &#8212; DNAT, then Network, then Application</text>
  <text x="560" y="675" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">No &#8212; overrides everything below</text>

  <rect x="44" y="682" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="697" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">2</text>
  <text x="112" y="697" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Parent policy before child policy, within a type pass</text>
  <text x="560" y="697" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No &#8212; inherited groups win the tie</text>

  <rect x="44" y="704" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="719" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">3</text>
  <text x="112" y="719" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Rule collection group priority</text>
  <text x="560" y="719" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="726" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="741" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">4</text>
  <text x="112" y="741" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Rule collection priority</text>
  <text x="560" y="741" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="748" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="763" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">5</text>
  <text x="112" y="763" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Rule order within a collection, top-down</text>
  <text x="560" y="763" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes, by reordering only</text>

  <rect x="44" y="782" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="802" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">&#8220;The parent always takes precedence&#8221; is a tie-break, not an override</text>
  <text x="60" y="821" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The firewall iterates all rule collection groups three times, once per rule type. In Microsoft's own worked</text>
  <text x="60" y="836" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">example a CHILD DNAT collection at group priority 650 / collection priority 3000 runs at step 3, ahead of a</text>
  <text x="60" y="851" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">PARENT network collection at group 200 / collection 800 at step 4. A child needing to pre-empt a parent</text>
  <text x="60" y="866" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">network rule does not need a better priority &#8212; it needs a DNAT rule.</text>

  <!-- Band 5: consequences -->
  <text x="44" y="906" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">What terminating rules plus fixed type ordering actually cost you</text>

  <rect x="44" y="918" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="938" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Microsoft's Example 1: one network rule disables the whole L7 layer</text>
  <text x="60" y="957" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A network rule allowing TCP ports 80,443 from * to * makes a Deny application rule for google.com</text>
  <text x="60" y="972" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">unreachable &#8212; &#8220;the connection is allowed&#8230; rule processing stops here.&#8221; It is not overridden; it is never</text>
  <text x="60" y="987" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">reached. Every FQDN rule, web category and URL filter becomes dead code on those two ports.</text>
  <text x="60" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Application rules run only if no network rule matched AND the protocol is HTTP, HTTPS or MSSQL.</text>

  <rect x="44" y="1016" width="772" height="88" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1036" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Matching ignores the destination IP, and inbound has no L7 at all</text>
  <text x="60" y="1055" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">HTTP matches on the Host header, HTTPS on SNI only. The firewall &#8220;ignores the packet's destination IP</text>
  <text x="60" y="1070" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">address&#8221; and uses the DNS-resolved address from the Host header; a port mismatch drops the traffic.</text>
  <text x="60" y="1085" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Application rules are never applied inbound &#8212; inbound is DNAT plus network rules, so filtering inbound</text>
  <text x="60" y="1100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">HTTP/S needs a Web Application Firewall. A DNAT match exempts traffic from all further network rules.</text>

  <rect x="44" y="1114" width="772" height="74" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1134" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">A deny-all &#8220;processed last&#8221; is only last among YOUR rules</text>
  <text x="60" y="1153" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The built-in infrastructure rule collection &#8212; Platform Image Repository, managed disk status storage, Azure</text>
  <text x="60" y="1168" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">diagnostics and logging &#8212; runs after application rules and before the final deny-all, so your terminator</text>
  <text x="60" y="1183" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;always processes before the infrastructure rule collection.&#8221;</text>

  <rect x="44" y="1198" width="772" height="56" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1218" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Stateful in your favour, strict about your edits</text>
  <text x="60" y="1237" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Return traffic on an established TCP or UDP connection is allowed even when an explicit deny exists in the</text>
  <text x="60" y="1252" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">reverse direction &#8212; but changing a rule to deny allowed traffic &#8220;drops any relevant existing sessions.&#8221;</text>

  <text x="44" y="1276" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Full order: threat intelligence &#8594; DNAT &#8594; network &#8594; application &#8594; infrastructure collection &#8594; deny.</text>
  <text x="44" y="1292" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">IDPS sits beside that pipeline in Alert mode, or immediately after it in Alert and Deny mode.</text>
</svg>
