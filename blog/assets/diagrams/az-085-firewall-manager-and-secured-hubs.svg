<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1282" style="width:100%;max-width:860px;" role="img" aria-label="Azure Firewall Manager and secured hubs: one global policy, two architectures that are not tiers of each other, and an inheritance model with one ratchet and one gap">
  <title>Azure Firewall Manager and secured hubs &#8212; one global policy, two architectures, and the inheritance rules that decide what a central team can actually guarantee</title>
  <rect x="0" y="0" width="860" height="1282" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">Firewall Manager and secured hubs</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">A firewall policy is a global resource used across many firewall instances, across regions and</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">subscriptions. Classic rules protect virtual networks only, so they cannot reach a Virtual WAN hub.</text>

  <!-- Band 1: the two architectures -->
  <text x="44" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Two architectures &#8212; not sizes of the same thing</text>

  <rect x="44" y="122" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Capability</text>
  <text x="352" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Hub virtual network</text>
  <text x="604" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Secured virtual hub</text>

  <rect x="44" y="148" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Underlying resource</text>
  <text x="352" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Virtual network</text>
  <text x="604" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Virtual WAN Hub</text>

  <rect x="44" y="170" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">VPN gateway ceiling</text>
  <text x="352" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10 Gbps &#183; 30 S2S connections</text>
  <text x="604" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">20 Gbps &#183; 1000 S2S connections</text>

  <rect x="44" y="192" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Central route management</text>
  <text x="352" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Customer-managed UDRs</text>
  <text x="604" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Supported using BGP</text>

  <rect x="44" y="214" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Automated SDWAN branch connectivity</text>
  <text x="352" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Not supported</text>
  <text x="604" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Supported</text>

  <rect x="44" y="236" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Multiple security providers</text>
  <text x="352" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Manual forced tunnelling</text>
  <text x="604" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Exactly two, roles fixed</text>

  <rect x="44" y="258" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">WAF on Application Gateway</text>
  <text x="352" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">In the virtual network</text>
  <text x="604" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Only in the spoke network</text>

  <rect x="44" y="280" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Network Virtual Appliance</text>
  <text x="352" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">In the virtual network</text>
  <text x="604" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Only in the spoke network</text>

  <text x="44" y="324" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Those last two rows decide the architecture on their own: #77 and #83 assumed the shared appliance lives</text>
  <text x="44" y="339" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">in the hub. In a secured virtual hub it cannot &#8212; so the thing every spoke depends on is itself a spoke.</text>

  <!-- Band 2: inheritance -->
  <text x="44" y="374" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Policy inheritance: what a central team can and cannot guarantee</text>

  <rect x="44" y="386" width="772" height="56" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="406" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">Inherited collections always win, and parent edits land immediately</text>
  <text x="60" y="425" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Inherited network collections are &#8220;always prioritized over&#8221; the child's; same for application collections.</text>
  <text x="60" y="440" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Any change to the parent is &#8220;automatically applied down&#8221; to every associated child policy.</text>

  <rect x="44" y="452" width="772" height="56" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="472" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">NAT collections are not inherited at all &#8212; which explains #84</text>
  <text x="60" y="491" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;NAT rule collections are not inherited, as they are specific to individual firewalls.&#8221; So there is no parent</text>
  <text x="60" y="506" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">DNAT rule to be overridden: the DNAT pass only ever contains local rules. Not a bug &#8212; a consequence.</text>

  <rect x="44" y="518" width="376" height="92" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="58" y="538" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">Threat intel MODE &#8212; a one-way ratchet</text>
  <text x="58" y="557" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A child may override it only &#8220;with a stricter</text>
  <text x="58" y="572" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">mode &#8212; you cannot disable it.&#8221; Alert only can</text>
  <text x="58" y="587" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">become Alert and deny, never the reverse.</text>
  <text x="58" y="604" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">This is already safe.</text>

  <rect x="440" y="518" width="376" height="92" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="454" y="538" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E24B4A">Threat intel ALLOWLIST &#8212; appendable</text>
  <text x="454" y="557" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;The child policy can append additional IP</text>
  <text x="454" y="572" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">addresses to this list.&#8221; Same effect as loosening</text>
  <text x="454" y="587" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">the mode, logged as an operational exception.</text>
  <text x="454" y="604" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">This is the thing to review.</text>

  <text x="44" y="634" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Parent and child must reside in the same region &#8212; though the policy itself can govern firewalls anywhere.</text>

  <!-- Band 3: policy tiers -->
  <text x="44" y="668" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Policy tiers do not map symmetrically onto firewall SKUs</text>

  <rect x="44" y="680" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="697" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Policy type</text>
  <text x="240" y="697" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Adds</text>
  <text x="612" y="697" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Runs on firewall SKU</text>

  <rect x="44" y="706" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="721" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Basic policy</text>
  <text x="240" y="721" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">NAT/network/application rules, IP Groups, threat intel alerts</text>
  <text x="612" y="721" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Basic only</text>

  <rect x="44" y="728" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="743" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Standard policy</text>
  <text x="240" y="743" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Custom DNS, DNS proxy, web categories, threat intel</text>
  <text x="612" y="743" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Standard or Premium</text>

  <rect x="44" y="750" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="765" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Premium policy</text>
  <text x="240" y="765" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">TLS inspection, URL filtering, IDPS</text>
  <text x="612" y="765" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Premium only</text>

  <text x="44" y="792" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A Standard policy travels upward to a Premium firewall. A Basic policy travels nowhere &#8212; so a baseline</text>
  <text x="44" y="807" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">written as a Basic policy cannot follow the firewall you upgrade. Billing starts at the SECOND association.</text>

  <!-- Band 4: known issues that change designs -->
  <text x="44" y="842" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Three known issues that change designs rather than inconvenience operators</text>

  <rect x="44" y="854" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="874" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">The central route manager overwrites your routes &#8212; &#8220;causing downtime&#8221;</text>
  <text x="60" y="893" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;You shouldn't use Azure Firewall Manager to manage your settings in deployments configured with custom</text>
  <text x="60" y="908" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">or static routes.&#8221; Mitigation: use the Virtual WAN page instead. Static routes are the documented pattern</text>
  <text x="60" y="923" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">for sending spoke traffic to an appliance &#8212; so the deployments most wanting this are told not to use it.</text>

  <rect x="44" y="938" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="958" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">A partner provider takes your Microsoft 365 traffic with it</text>
  <text x="60" y="977" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Microsoft 365 and Azure Public PaaS traffic splitting isn't currently supported. As such, selecting a partner</text>
  <text x="60" y="992" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">provider for V2I or B2I also sends all Azure Public PaaS and Microsoft 365 traffic via the partner service.&#8221;</text>
  <text x="60" y="1007" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Mitigation column: &#8220;Investigating traffic splitting at the hub.&#8221; Acknowledged and unresolved.</text>

  <rect x="44" y="1022" width="772" height="58" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="1042" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Bulk-adding public IP addresses puts the firewall into a failed state</text>
  <text x="60" y="1061" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Mitigation: &#8220;add 10 at a time.&#8221; A failed firewall is an outage on the device every spoke routes through, and</text>
  <text x="60" y="1076" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">one large template deployment &#8212; the natural way to build a big SNAT pool for #77 &#8212; is the shape that fails.</text>

  <!-- Band 5: the rest -->
  <rect x="44" y="1096" width="772" height="106" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1116" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">And four more constraints worth knowing before you build</text>
  <text x="60" y="1135" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; Inter-hub AND branch-to-branch filtering each require routing intent &#8212; documented twice as &#8220;the only&#8221;</text>
  <text x="60" y="1150" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">  configuration that enables it, and per #82 that change to the defaultRouteTable is irreversible.</text>
  <text x="60" y="1167" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; All secured hubs sharing one Virtual WAN must sit in the same resource group.</text>
  <text x="60" y="1183" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; DDoS Protection &#8220;isn't integrated with vWANs&#8221; &#8212; the route in is a customer-provided public IP, in preview.</text>
  <text x="60" y="1198" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; Firewall policy supports neither Activity logs nor rule descriptions in an ARM export.</text>

  <text x="44" y="1232" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Policy high availability is the right way round: the ARM metadata fails over to a paired region and the policy</text>
  <text x="44" y="1247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">cannot be modified during that window, but &#8220;the Azure Firewall instances linked to the Firewall Policy continue</text>
  <text x="44" y="1262" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">to operate.&#8221; You lose the ability to change policy, not the policy itself.</text>
</svg>
