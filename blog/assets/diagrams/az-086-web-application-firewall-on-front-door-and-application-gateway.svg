<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1266" style="width:100%;max-width:860px;" role="img" aria-label="Azure WAF on Front Door versus Application Gateway: two rule set families, two action sets, two ways to resolve overlapping policies, and one shared terminating-rule trap">
  <title>Azure Web Application Firewall on Front Door and Application Gateway &#8212; what actually differs between the two platforms</title>
  <rect x="0" y="0" width="860" height="1266" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">WAF on Front Door and Application Gateway</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">One product name, four host services, and features &#8220;customized for each specific service&#8221; &#8212; so the name</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">describes almost nothing about the protection actually in place.</text>

  <!-- Band 1: platform comparison -->
  <text x="44" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Global versus regional is the least decision-relevant difference</text>

  <rect x="44" y="122" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Capability</text>
  <text x="312" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">WAF on Front Door</text>
  <text x="588" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">WAF on Application Gateway</text>

  <rect x="44" y="148" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Reach</text>
  <text x="312" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Global &#8212; every edge location</text>
  <text x="588" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Regional &#8212; the gateway's region</text>

  <rect x="44" y="170" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Managed rule family</text>
  <text x="312" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Default Rule Set &#183; Bot Manager 1.1</text>
  <text x="588" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">OWASP CRS 3.2 &#183; 3.1 &#183; 3.0</text>

  <rect x="44" y="192" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">What the lower option loses</text>
  <text x="312" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Standard: custom rules ONLY</text>
  <text x="588" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">WAF_v1: no policy support</text>

  <rect x="44" y="214" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Actions</text>
  <text x="312" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Allow &#183; Block &#183; Log &#183; Redirect &#183; Score</text>
  <text x="588" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Block &#183; Log &#183; Score (Allow = bots only)</text>

  <rect x="44" y="236" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Policy scopes</text>
  <text x="312" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Profile / domain / route</text>
  <text x="588" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Global / per-site / per-URI</text>

  <rect x="44" y="258" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Policies per application</text>
  <text x="312" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">One at a time</text>
  <text x="588" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Multiple &#8212; per listener or path rule</text>

  <rect x="44" y="280" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Rate limiting</text>
  <text x="312" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">1 or 5 minute window; Premium: ASN, JA4</text>
  <text x="588" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Not on this platform's overview</text>

  <text x="44" y="322" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Different rule set families on different version schemes, so exclusions and tuning do not port. Moving an app</text>
  <text x="44" y="337" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">between the two platforms is a WAF rewrite, not a migration.</text>

  <!-- Band 2: the shared trap -->
  <text x="44" y="372" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The shared trap: custom rules run first, and they terminate</text>

  <rect x="44" y="384" width="772" height="106" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">A custom Allow rule switches off the entire managed rule set behind it</text>
  <text x="60" y="423" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Custom rules are always applied before rules in the Default Rule Set are evaluated. If a request matches a</text>
  <text x="60" y="438" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">custom rule&#8230; no other custom rules or the rules in the Default Rule Set are processed.&#8221; And on Allow: &#8220;No</text>
  <text x="60" y="453" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">further lower priority rules can block this request.&#8221;</text>
  <text x="60" y="472" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">So an Allow for a partner IP range or a monitoring path also exempts that traffic from SQL injection, XSS,</text>
  <text x="60" y="487" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">remote command execution and every other DRS category. No error, no conflict, no sign in the portal.</text>

  <rect x="44" y="500" width="772" height="40" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="60" y="518" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9A7B57">Identical in shape to #84's Example 1, one layer up the stack</text>
  <text x="60" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">In a terminating rule set, a broad Allow at the layer that runs first is not an exception &#8212; it is a gap.</text>

  <rect x="44" y="550" width="772" height="40" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="568" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">The one thing an Allow cannot defeat</text>
  <text x="60" y="584" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The HTTP DDoS ruleset &#8220;is evaluated before custom rules, and custom rules configured with the Allow action</text>

  <text x="60" y="604" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">don't bypass it.&#8221; On Application Gateway, Allow does not apply to the CRS at all &#8212; the safer design.</text>

  <!-- Band 3: anomaly scoring -->
  <text x="44" y="640" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Anomaly scoring: a rule match is usually not a block</text>

  <rect x="44" y="652" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="669" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Severity</text>
  <text x="188" y="669" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Contributes</text>
  <text x="330" y="669" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">One match alone</text>
  <text x="588" y="669" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Two matches</text>

  <rect x="44" y="678" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="693" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Critical</text>
  <text x="188" y="693" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">5</text>
  <text x="330" y="693" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">BLOCKS &#8212; reaches the threshold</text>
  <text x="588" y="693" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Blocks</text>

  <rect x="44" y="700" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="715" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Error</text>
  <text x="188" y="715" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">4</text>
  <text x="330" y="715" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Does not block</text>
  <text x="588" y="715" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Blocks (8)</text>

  <rect x="44" y="722" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="737" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Warning</text>
  <text x="188" y="737" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">3</text>
  <text x="330" y="737" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Does not block</text>
  <text x="588" y="737" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">BLOCKS (6) &#8212; neither rule alone would</text>

  <rect x="44" y="744" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="759" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Notice</text>
  <text x="188" y="759" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">2</text>
  <text x="330" y="759" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Does not block</text>
  <text x="588" y="759" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Does not block (4)</text>

  <rect x="44" y="776" width="772" height="58" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="796" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">So a log line is not a block, and a false positive may have no single culprit</text>
  <text x="60" y="815" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Every rule hit logs the action value Matched; Blocked appears only once the total reaches 5 in prevention</text>
  <text x="60" y="830" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">mode, or Detected in detection mode. Counting Matched as &#8220;attacks blocked&#8221; overstates what the WAF did.</text>

  <!-- Band 4: policy precedence contradiction -->
  <text x="44" y="868" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Overlapping policies: the same vendor, two adjacent products, opposite answers</text>

  <rect x="44" y="880" width="376" height="92" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="58" y="900" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">Front Door WAF &#8212; most specific wins</text>
  <text x="58" y="919" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Route-level &#8594; domain-level &#8594; profile-level.</text>
  <text x="58" y="934" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A route policy REPLACES the profile baseline</text>
  <text x="58" y="949" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">for its requests &#8212; a replacement, not a union.</text>
  <text x="58" y="966" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">So the baseline is a default, not a floor.</text>

  <rect x="440" y="880" width="376" height="92" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="454" y="900" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">Azure Firewall policy (#85) &#8212; parent wins</text>
  <text x="454" y="919" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Parent rule collection groups &#8220;always take</text>
  <text x="454" y="934" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">precedence regardless of the priority of a child</text>
  <text x="454" y="949" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">policy.&#8221; Broadest wins.</text>
  <text x="454" y="966" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">A central baseline cannot be overridden.</text>

  <text x="44" y="996" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Neither model is wrong &#8212; they solve different problems. But the mental model does not carry across, and the</text>
  <text x="44" y="1011" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">failure is quiet in one direction: a Front Door profile baseline is displaceable by any route-level policy.</text>

  <!-- Band 5: modes and bots -->
  <rect x="44" y="1032" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="1052" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Detection mode is the recommended first deployment, and it blocks nothing</text>
  <text x="60" y="1071" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Run a newly deployed WAF in detection mode for a short period&#8230; before transitioning to prevention mode.&#8221;</text>
  <text x="60" y="1086" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Sound advice with an obvious failure mode: the short period becomes permanent. A WAF in detection mode</text>
  <text x="60" y="1101" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">satisfies the diagram, feeds the dashboards and stops nothing. The transition is its own dated change.</text>

  <rect x="44" y="1118" width="772" height="74" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1138" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Bot defaults differ between the platforms</text>
  <text x="60" y="1157" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Front Door: bad blocked, good allowed, unknown logged. Application Gateway adds one clause &#8212; it also</text>
  <text x="60" y="1172" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;blocks unknown search engine crawlers&#8221; by default, and verification is by publisher IP range, so a legitimate</text>
  <text x="60" y="1187" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">but unlisted crawler is indistinguishable from a bot that falsified its identity.</text>

  <text x="44" y="1222" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Prevention mode on Application Gateway returns a 403 unauthorized access exception and closes the connection.</text>
  <text x="44" y="1237" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">On Application Gateway, CRS 3.2 or later selects the new WAF engine &#8212; and &#8220;new features are available only on</text>
  <text x="44" y="1252" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">the new WAF engine&#8221;, so staying on 3.1 to dodge false positives also opts out of everything future.</text>
</svg>
