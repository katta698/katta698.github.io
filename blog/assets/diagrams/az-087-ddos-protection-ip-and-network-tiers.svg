<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1290" style="width:100%;max-width:860px;" role="img" aria-label="Azure DDoS Protection: three tiers rather than two, four differences between the paid pair, and an unsupported list that hits earlier recommendations in this series">
  <title>Azure DDoS Protection &#8212; three tiers, the four rows that separate the paid pair, and what the threshold behaviour costs you</title>
  <rect x="0" y="0" width="860" height="1290" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">DDoS Protection: IP and Network tiers</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">Layer 3 and 4 only &#8212; &#8220;for web applications protection at layer 7, you need to add protection at the</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">application layer using a WAF offering&#8221;, which is #86. A volumetric flood is this product; an HTTP flood is not.</text>

  <!-- Band 1: three tiers -->
  <text x="44" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">There are three tiers, and the portal offers two</text>

  <rect x="44" y="122" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Tier</text>
  <text x="236" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Cost</text>
  <text x="404" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Scope</text>
  <text x="628" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Learned profile + telemetry</text>

  <rect x="44" y="148" width="772" height="40" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">Infrastructure protection</text>
  <text x="56" y="181" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">already on, not optional</text>
  <text x="236" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">No additional cost</text>
  <text x="404" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Every Azure service with a public</text>
  <text x="404" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">IPv4/IPv6, incl. PaaS like Azure DNS</text>
  <text x="628" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">No &#8212; &#8220;common network-</text>
  <text x="628" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">layer attacks&#8221; only</text>

  <rect x="44" y="188" width="772" height="30" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">DDoS IP Protection</text>
  <text x="236" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">$199 / month per IP</text>
  <text x="404" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">One public IP resource</text>
  <text x="628" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="218" width="772" height="30" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="237" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">DDoS Network Protection</text>
  <text x="236" y="237" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Per 100 protected IPs</text>
  <text x="404" y="237" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A whole virtual network</text>
  <text x="628" y="237" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <!-- Band 2: the four differences -->
  <text x="44" y="278" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">13 rows identical; only 4 differ, and all 4 favour Network Protection</text>

  <rect x="44" y="290" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="307" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Feature</text>
  <text x="440" y="307" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">IP Protection</text>
  <text x="640" y="307" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Network Protection</text>

  <rect x="44" y="316" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="331" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Public IP Basic tier protection</text>
  <text x="440" y="331" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">No</text>
  <text x="640" y="331" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="338" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="353" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">DDoS rapid response support</text>
  <text x="440" y="353" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Not available</text>
  <text x="640" y="353" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="360" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="375" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Cost protection</text>
  <text x="440" y="375" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Not available</text>
  <text x="640" y="375" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="382" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="397" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">WAF discount</text>
  <text x="440" y="397" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Not available</text>
  <text x="640" y="397" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <text x="44" y="424" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">IP Protection &#8220;contains the same core engineering features as DDoS Network Protection, but will differ in the</text>
  <text x="44" y="439" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">following value-added services&#8221;. One engine, two packagings &#8212; not a capability ladder.</text>

  <!-- Band 3: the threshold -->
  <text x="44" y="474" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The mechanical detail that decides the tier, and is not in the comparison table</text>

  <rect x="44" y="486" width="772" height="92" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="506" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">A small attack is not mitigated &#8212; it is absorbed, and billed</text>
  <text x="60" y="525" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Three auto-tuned policies (TCP SYN, TCP, UDP) are applied per public IP, with thresholds &#8220;auto-configured via</text>
  <text x="60" y="540" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">machine learning-based network traffic profiling&#8221;. And: &#8220;DDoS mitigation occurs for an IP address under</text>
  <text x="60" y="555" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">attack only when the policy threshold is exceeded.&#8221; The busier your app, the wider that window &#8212; attack</text>
  <text x="60" y="570" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">traffic inside it is served by your infrastructure, scales it out, and lands on your bill.</text>

  <rect x="44" y="588" width="772" height="40" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="606" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">Which is why cost protection is the row that matters</text>
  <text x="60" y="622" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Network Protection credits the scale-out back. IP Protection does not. Both mitigate large attacks identically.</text>

  <!-- Band 4: the economics -->
  <text x="44" y="662" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The economics, including the discount that links #86 and #87</text>

  <rect x="44" y="674" width="772" height="92" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="694" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">Network Protection makes Application Gateway WAF cost the non-WAF price</text>
  <text x="60" y="713" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Without it, an Application Gateway WAF_v2 is $0.558 per gateway-hour. With it, the same resource is charged</text>
  <text x="60" y="728" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;the standard Application Gateway price of $0.31 per gateway-hour&#8221;. That is $0.248 per gateway-hour, and at</text>
  <text x="60" y="743" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">730 hours per month, $181.04 per gateway per month. It applies to both the WAF and WAF_v2 SKUs.</text>
  <text x="60" y="760" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Note: specified for Application Gateway &#8212; the regional WAF. Nothing extends it to Front Door.</text>

  <rect x="44" y="776" width="772" height="74" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="796" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Two different pricing axes, so the crossover is a division</text>
  <text x="60" y="815" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">IP Protection is a unit price: $199 per protected public IP per month. Network Protection is a block price that</text>
  <text x="60" y="830" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;includes protection for 100 public IP resources&#8221;. At $199 each, 100 addresses would be $19,900 per month &#8212;</text>
  <text x="60" y="845" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">the figure one Network Protection charge has to beat, so the crossover sits far below 100 IPs.</text>

  <rect x="44" y="860" width="772" height="40" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="60" y="878" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9A7B57">One figure not stated here, deliberately</text>
  <text x="60" y="894" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The pricing page rendered Network Protection's charge as &#8220;$-&#8221;. Divide that number by 199 for the crossover.</text>

  <!-- Band 5: the unsupported list -->
  <text x="44" y="934" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The unsupported list keeps landing on this series&#8217; own recommendations</text>

  <rect x="44" y="946" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="963" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Not supported by either paid tier</text>
  <text x="560" y="963" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Collides with</text>

  <rect x="44" y="972" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="987" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Azure Virtual WAN</text>
  <text x="560" y="987" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">#81, #82, #85 (same gap, other side)</text>

  <rect x="44" y="994" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="1009" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">A public IP attached to a NAT Gateway</text>
  <text x="560" y="1009" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">#83 &#8212; which recommended exactly that</text>

  <rect x="44" y="1016" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1031" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Adaptive tuning on a VPN / virtual network gateway</text>
  <text x="560" y="1031" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">#73, #74 &#8212; covered, but generic policy</text>

  <rect x="44" y="1038" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1053" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Public IP prefix on a load balancer frontend &#8212; Network SKU only</text>
  <text x="560" y="1053" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">#83 &#8212; a 5th Network-only capability</text>

  <rect x="44" y="1060" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1075" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Multitenant PaaS &#183; API Management outside VNet integration</text>
  <text x="560" y="1075" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">deployment mode decides coverage</text>

  <rect x="44" y="1082" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1097" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Classic / RDFE virtual machines</text>
  <text x="560" y="1097" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">legacy deployments only</text>

  <text x="44" y="1126" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">So an inventory claiming &#8220;every public IP is protected&#8221; is not achievable as stated. Make each exception a</text>
  <text x="44" y="1141" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">documented decision rather than something an audit discovers.</text>

  <rect x="44" y="1158" width="772" height="58" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1178" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">And one line that is really about architecture, not DDoS</text>
  <text x="60" y="1197" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Scenarios in which a single VM is running behind a public IP is supported, but not recommended.&#8221; Mitigation</text>
  <text x="60" y="1212" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">buys time for something that can scale out; it does not make one machine survive.</text>

  <text x="44" y="1246" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Telemetry is the other thing you are buying: reports in five-minute increments during an attack, a summary after</text>
  <text x="44" y="1261" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">it ends, and flow logs streamable to Microsoft Sentinel or an offline SIEM. On infrastructure protection, none of</text>
  <text x="44" y="1276" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">that exists &#8212; so a degraded service and an attack look identical after the fact.</text>
</svg>
