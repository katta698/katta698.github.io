<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1298" style="width:100%;max-width:860px;" role="img" aria-label="Azure DNS public zones: a three-party arrangement, an occupied zone apex, alias records as a lifecycle coupling, and a limits table with one row shaped unlike the others">
  <title>Azure DNS public zones &#8212; why ownership is never checked, why the apex forbids a CNAME, and what alias records actually buy</title>
  <rect x="0" y="0" width="860" height="1298" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">Azure DNS public zones</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8220;Azure DNS provides an authoritative DNS service. It doesn&#8217;t provide a public recursive DNS service.&#8221; And</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8220;Azure DNS isn&#8217;t the domain registrar.&#8221; Hosting a domain here is one third of an arrangement.</text>

  <!-- Band 1: the three parties + ownership -->
  <rect x="44" y="94" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Ownership is never checked at zone creation</text>
  <text x="60" y="133" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;You do not have to own a domain name to create a DNS zone with that domain name in Azure DNS. However,</text>
  <text x="60" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">you do need to own the domain to configure the Azure DNS name servers&#8230; with the domain name registrar.&#8221;</text>
  <text x="60" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A zone for a domain you do not control is a healthy resource that answers no real queries.</text>

  <!-- Band 2: duplicates -->
  <rect x="44" y="182" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="202" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Two teams can hold the same zone, and only one is real</text>
  <text x="60" y="221" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Names are unique only within a resource group; &#8220;the same zone name can be reused in a different resource</text>
  <text x="60" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">group or a different Azure subscription&#8230; each instance is assigned different name server addresses. Only</text>
  <text x="60" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">one set of addresses can be configured with the registrar.&#8221; The registrar&#8217;s NS list is the only source of truth.</text>

  <!-- Band 3: the apex -->
  <text x="44" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The zone apex is already occupied, and that forbids a CNAME there</text>

  <rect x="44" y="300" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="317" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">At the apex (@)</text>
  <text x="300" y="317" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">NS record set</text>
  <text x="588" y="317" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">SOA record set</text>

  <rect x="44" y="326" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="341" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Created / deleted</text>
  <text x="300" y="341" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Automatically, with the zone</text>
  <text x="588" y="341" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Automatically, with the zone</text>

  <rect x="44" y="348" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="363" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">You may change</text>
  <text x="300" y="363" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Add name servers &#183; TTL &#183; metadata</text>
  <text x="588" y="363" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Every property except host</text>

  <rect x="44" y="370" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="385" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">You may not</text>
  <text x="300" y="385" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Remove Azure&#8217;s own name servers</text>
  <text x="588" y="385" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">host &#8212; it is preconfigured</text>

  <text x="44" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">So no CNAME can live at the apex &#8212; &#8220;these constraints arise from the DNS standards and aren&#8217;t limitations of</text>
  <text x="44" y="427" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Azure DNS.&#8221; The restriction is apex-only: child-zone delegation NS sets are yours &#8220;without constraint&#8221;.</text>

  <rect x="44" y="442" width="772" height="40" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E24B4A">And the SOA serial does not move on its own</text>
  <text x="60" y="476" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;The zone serial number&#8230; isn&#8217;t updated automatically when changes are made to the records in the zone.&#8221;</text>

  <!-- Band 4: alias records -->
  <text x="44" y="516" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Alias records: the apex answer, and a lifecycle coupling</text>

  <rect x="44" y="528" width="376" height="104" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="58" y="548" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">What it solves at the apex</text>
  <text x="58" y="567" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Unlike CNAME records, alias records are</text>
  <text x="58" y="582" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">created at the zone apex.&#8221; So a naked domain</text>
  <text x="58" y="597" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">can finally point at Traffic Manager, CDN or</text>
  <text x="58" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Front Door &#8212; all of which need a CNAME.</text>
  <text x="58" y="628" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A, AAAA and CNAME sets. 50 per resource.</text>

  <rect x="440" y="528" width="376" height="104" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="454" y="548" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E24B4A">The reason to use it everywhere</text>
  <text x="454" y="567" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Delete the target and the alias &#8220;becomes an</text>
  <text x="454" y="582" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">empty record set&#8221; rather than dangling. That</text>
  <text x="454" y="597" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">avoids &#8220;directing the users to another</text>
  <text x="454" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">application that has been assigned the old</text>
  <text x="454" y="628" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">public IP address.&#8221; Targets must be Standard SKU.</text>

  <text x="44" y="656" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Needs Microsoft.Network registered in BOTH subscriptions when zone and target differ. For new Traffic</text>
  <text x="44" y="671" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Manager setups Microsoft now prefers Traffic Manager Linked Records &#8212; no intermediate CNAME hop.</text>

  <!-- Band 5: limits -->
  <text x="44" y="708" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Default limits &#8212; and the one row shaped unlike the others</text>

  <rect x="44" y="720" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="737" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Resource</text>
  <text x="440" y="737" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Limit</text>
  <text x="600" y="737" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Raisable via support?</text>

  <rect x="44" y="746" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="761" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Public DNS zones per subscription</text>
  <text x="440" y="761" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">250</text>
  <text x="600" y="761" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="768" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="783" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Record sets per public DNS zone</text>
  <text x="440" y="783" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10,000</text>
  <text x="600" y="783" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="790" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="805" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Records per record set</text>
  <text x="440" y="805" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">20</text>
  <text x="600" y="805" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <rect x="44" y="812" width="772" height="22" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="827" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">TXT records per record set</text>
  <text x="440" y="827" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">400 &#8212; twenty times the general limit</text>
  <text x="600" y="827" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">No footnote at all</text>

  <rect x="44" y="834" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="849" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Alias records for a single Azure resource</text>
  <text x="440" y="849" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">50</text>
  <text x="600" y="849" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>

  <text x="44" y="876" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Multiplied out: 200,000 records in one zone, and 2,500,000 record sets in one subscription, before asking for</text>
  <text x="44" y="891" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">an increase. TTL is set on the record set, not the record, anywhere from 1 to 2,147,483,647 seconds.</text>

  <rect x="44" y="906" width="772" height="58" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="60" y="926" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9A7B57">The TXT ceiling that bites sooner</text>
  <text x="60" y="945" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A single string may be up to 255 characters, and a TXT record set is capped at 4,096 characters &#8220;across all</text>
  <text x="60" y="960" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">records combined&#8221; &#8212; just over sixteen full-length strings for the whole set, not per record.</text>

  <!-- Band 6: concurrency + governance -->
  <text x="44" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Two defaults worth changing deliberately</text>

  <rect x="44" y="1012" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="1032" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">At the REST layer, the concurrency default is the unsafe one</text>
  <text x="60" y="1051" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No etag header &#8594; &#8220;PUT always succeeds (no Etag checks)&#8221;, overwriting a change made seconds earlier.</text>
  <text x="60" y="1066" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">If-match &#8594; only if it exists and matches. If-none-match * &#8594; only if it does not exist. Azure DNS PowerShell</text>
  <text x="60" y="1081" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">checks by default unless you pass -Overwrite; REST and templates do not. The loser&#8217;s change vanishes silently.</text>
  <text x="60" y="1096" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">If two pipelines can write one zone, the protection has to be asked for.</text>

  <rect x="44" y="1112" width="772" height="74" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1132" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Cost attribution stops at the zone boundary</text>
  <text x="60" y="1151" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Resource Manager tags work on zones but not on record sets. Metadata is the record set alternative, but</text>
  <text x="60" y="1166" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;can&#8217;t be used to provide a filtered view of your Azure bill&#8221; and &#8220;can&#8217;t be specified in an Azure Resource</text>
  <text x="60" y="1181" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Manager policy&#8221;. One zone is simpler to delegate and impossible to attribute per application.</text>

  <text x="44" y="1216" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Each delegation has two copies of the NS records: one in the parent pointing at the child, one at the child&#8217;s own</text>
  <text x="44" y="1231" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">apex. You write the parent copy; Azure writes the child&#8217;s. SPF must be a TXT record &#8212; the SPF record type is</text>
  <text x="44" y="1246" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">deprecated and unsupported, and importing a zone file converts it. Wildcards work for every type except NS</text>
  <text x="44" y="1261" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">and SOA. And REST wants each TXT string separately while portal, PowerShell and CLI want one string per</text>
  <text x="44" y="1276" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">record and split it for you &#8212; so round-tripping a TXT value between interfaces reshapes the payload.</text>
</svg>
