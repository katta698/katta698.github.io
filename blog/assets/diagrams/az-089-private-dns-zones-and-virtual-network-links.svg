<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1304" style="width:100%;max-width:860px;" role="img" aria-label="Azure private DNS zones and virtual network links: a global zone scoped by links, one registration zone per network, and what autoregistration does not cover">
  <title>Private DNS zones and virtual network links &#8212; the registration and resolution matrix, what autoregistration misses, and limits that invert the public ones</title>
  <rect x="0" y="0" width="860" height="1304" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">Private DNS zones and virtual network links</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">Public and private zones are the same product with the registrar removed. No registrar means no delegation,</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">so access is a link &#8212; and every other difference follows from that.</text>

  <!-- Band 1: scope -->
  <rect x="44" y="94" width="376" height="86" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="58" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">A link is the whole access-control model</text>
  <text x="58" y="133" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Linked virtual networks have full access and</text>
  <text x="58" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">can resolve all DNS records published in the</text>
  <text x="58" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">private zone.&#8221; No partial link, no per-record</text>
  <text x="58" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">scoping. All of it, or none of it.</text>

  <rect x="440" y="94" width="376" height="86" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="454" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">The zone is global; only answers are scoped</text>
  <text x="454" y="133" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Stored as &#8220;a global resource&#8221;, so it &#8220;isn&#8217;t</text>
  <text x="454" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">dependent on a single virtual network or</text>
  <text x="454" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">region&#8221;, survives a regional interruption, and</text>
  <text x="454" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">supports CRUD by API during a region failure.</text>

  <text x="44" y="204" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Record types: A, AAAA, CNAME, MX, PTR, SOA, SRV, TXT &#8212; shorter than public. No CAA, and no NS, so a</text>
  <text x="44" y="219" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">private zone cannot delegate a child: there is no hierarchy to delegate into.</text>

  <!-- Band 2: the matrix -->
  <text x="44" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The matrix that decides the design</text>

  <rect x="44" y="264" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="281" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5"></text>
  <text x="300" y="281" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Registration link (autoregistration on)</text>
  <text x="608" y="281" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Resolution link (off)</text>

  <rect x="44" y="290" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">How many per zone</text>
  <text x="300" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Many &#8212; capped at 100</text>
  <text x="608" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Many &#8212; 1000 links total</text>

  <rect x="44" y="312" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="56" y="327" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">How many per virtual network</text>
  <text x="300" y="327" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">EXACTLY ONE</text>
  <text x="608" y="327" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Many &#8212; up to 1000 zones</text>

  <rect x="44" y="334" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="349" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">What it does</text>
  <text x="300" y="349" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">An A record per VM, retroactively too</text>
  <text x="608" y="349" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Query only &#8212; no records</text>

  <rect x="44" y="356" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">What it can read</text>
  <text x="300" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">All records in the zone</text>
  <text x="608" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">All records in the zone</text>

  <text x="44" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">So a virtual network has one DNS identity and many DNS views. Every obvious design &#8212; a zone per app, per</text>
  <text x="44" y="413" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">environment, per team, all auto-populated from shared infrastructure &#8212; runs into that single 1.</text>

  <!-- Band 3: what autoregistration misses -->
  <text x="44" y="446" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Autoregistration is narrower than the name suggests</text>

  <rect x="44" y="458" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Virtual machines, primary NIC, no PTR</text>
  <text x="60" y="497" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; &#8220;Autoregistration works only for virtual machines. For all other resources like internal load balancers, you</text>
  <text x="60" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">  can create DNS records manually&#8221; &#8212; so #83&#8217;s internal load balancer gets no record at all.</text>
  <text x="60" y="529" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; &#8220;DNS records are created automatically only for the primary virtual machine NIC&#8221; &#8212; #83&#8217;s dual-NIC NVAs</text>
  <text x="60" y="541" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">  get one record, and the data-path interface is yours to name. And no reverse DNS PTR records.</text>

  <rect x="44" y="558" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="578" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">And a stopped machine loses its name, not just its service</text>
  <text x="60" y="597" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;When a virtual machine gets deleted OR STOPPED, the autoregistered DNS records&#8230; are removed from the</text>
  <text x="60" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">private DNS zone.&#8221; The overview omits the second word. Clients get NXDOMAIN rather than a refused</text>
  <text x="60" y="627" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">connection &#8212; and name failures retry very differently from connection failures.</text>

  <rect x="44" y="644" width="772" height="40" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="662" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Deleting a virtual network cascades into every zone it touched</text>
  <text x="60" y="678" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;All the virtual network links and autoregistered DNS records&#8230; in different private DNS zones&#8221; are deleted.</text>

  <!-- Band 4: limits vs public -->
  <text x="44" y="718" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Limits invert the public ones in both directions</text>

  <rect x="44" y="730" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="747" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Resource</text>
  <text x="508" y="747" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Private</text>
  <text x="656" y="747" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Public (#88)</text>

  <rect x="44" y="756" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="771" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Zones per subscription</text>
  <text x="508" y="771" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">1000</text>
  <text x="656" y="771" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">250</text>

  <rect x="44" y="778" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="793" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Record sets per zone</text>
  <text x="508" y="793" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">25,000</text>
  <text x="656" y="793" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">10,000</text>

  <rect x="44" y="800" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="815" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Virtual network links per zone</text>
  <text x="508" y="815" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">1000</text>
  <text x="656" y="815" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212;</text>

  <rect x="44" y="822" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="837" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Links WITH autoregistration, per zone</text>
  <text x="508" y="837" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">100 &#8212; ten times fewer</text>
  <text x="656" y="837" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212;</text>

  <rect x="44" y="844" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="859" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Zones a VNet can link to, with autoregistration</text>
  <text x="508" y="859" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">1  (vs 1000 without)</text>
  <text x="656" y="859" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212;</text>

  <rect x="44" y="866" width="772" height="22" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="881" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Record set writes per minute, per zone</text>
  <text x="508" y="881" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">60</text>
  <text x="656" y="881" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">200 &#8212; 3x more</text>

  <rect x="44" y="888" width="772" height="22" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="903" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Raisable via Azure Support?</text>
  <text x="508" y="903" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">No footnote on ANY row</text>
  <text x="656" y="903" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Footnote on four rows</text>

  <text x="44" y="930" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Those two facts sit badly together for one workload: a zone sized for 500,000 records accepts 60 record set</text>
  <text x="44" y="945" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">writes a minute. If private DNS is a service registry written by automation, the write rate is the constraint.</text>

  <!-- Band 5: the client-side throttle -->
  <rect x="44" y="964" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="984" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">The resolver throttles the machine, not the zone</text>
  <text x="60" y="1003" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Number of DNS queries a virtual machine can send to Azure DNS resolver, per second: 1000.&#8221; And</text>
  <text x="60" y="1018" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Maximum number of DNS queries queued (pending response) per virtual machine: 200.&#8221; Nothing to do with</text>
  <text x="60" y="1033" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">zones or links &#8212; it applies to any name. An app that resolves per request rather than caching reaches these</text>
  <text x="60" y="1048" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">without doing anything unusual, and exceeding the queue presents as app latency, not a DNS error.</text>

  <!-- Band 6: split-horizon and reverse -->
  <rect x="44" y="1070" width="772" height="74" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="60" y="1090" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9A7B57">Split-horizon: two zones, one name, and no registrar to contradict it</text>
  <text x="60" y="1109" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">#88&#8217;s safeguard was the registrar&#8217;s name server list. A private zone has none, so a private zone whose name</text>
  <text x="60" y="1124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">collides with something real shadows it for every linked network, silently. Don&#8217;t use .local either &#8212; &#8220;not all</text>
  <text x="60" y="1139" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">operating systems support this domain.&#8221;</text>

  <rect x="44" y="1158" width="772" height="74" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1178" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Reverse DNS works, but autoregistration does not create it</text>
  <text x="60" y="1197" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The platform answers reverse lookups for private space in a linked network; autoregistration writes no PTR</text>
  <text x="60" y="1212" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">records. With autoregistration on, the answer is doubled: &#8220;two FQDNs&#8221;, one with the internal.cloudapp.net</text>
  <text x="60" y="1227" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">suffix and one with the private zone suffix. Only one of them is the name you chose.</text>

  <text x="44" y="1262" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">One more worth knowing: cross-virtual-network resolution needs no peering &#8212; &#8220;no explicit dependency such that</text>
  <text x="44" y="1277" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">the virtual networks are peered.&#8221; So names resolve across unpeered networks where no route exists, and every</text>
  <text x="44" y="1292" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">linked network learns every other&#8217;s private addressing. Linking is a disclosure decision, not just a reach one.</text>
</svg>
