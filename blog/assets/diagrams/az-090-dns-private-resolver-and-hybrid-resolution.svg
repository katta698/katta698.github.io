<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1310" style="width:100%;max-width:860px;" role="img" aria-label="Azure DNS Private Resolver: a nine-step resolution order whose second step bypasses the rest, wildcard rule behaviour, and a documented resolution loop">
  <title>DNS Private Resolver and hybrid resolution &#8212; the resolution order, the wildcard that is not a catch-all, and the loop two correct settings build</title>
  <rect x="0" y="0" width="860" height="1310" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">DNS Private Resolver and hybrid resolution</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">A managed replacement for forwarder VMs: &#8220;without the need to deploy, manage, or patch custom DNS</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">servers.&#8221; Hybrid resolution still requires ExpressRoute or a VPN &#8212; the resolver answers, it does not connect.</text>

  <!-- Band 1: resolution order -->
  <text x="44" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The nine-step resolution order &#8212; and the step that skips the rest</text>

  <rect x="44" y="122" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Step</text>
  <text x="112" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">What happens</text>
  <text x="596" y="139" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Consequence</text>

  <rect x="44" y="148" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">1</text>
  <text x="112" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A client in a virtual network issues a DNS query</text>
  <text x="596" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212;</text>

  <rect x="44" y="170" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="56" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">2</text>
  <text x="112" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Custom DNS servers specified on the VNet &#8594; forwarded there</text>
  <text x="596" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">ALL OF THE BELOW IS SKIPPED</text>

  <rect x="44" y="192" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">3</text>
  <text x="112" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Azure-provided DNS + linked private zones &#8594; zones consulted</text>
  <text x="596" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">#89&#8217;s links apply here</text>

  <rect x="44" y="214" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">4</text>
  <text x="112" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No zone match &#8594; ruleset virtual network links consulted</text>
  <text x="596" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">This post&#8217;s rulesets apply here</text>

  <rect x="44" y="236" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">5</text>
  <text x="112" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No ruleset links &#8594; Azure DNS resolves</text>
  <text x="596" y="251" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8212;</text>

  <rect x="44" y="258" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">6&#8211;8</text>
  <text x="112" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Rules evaluated; a suffix match forwards; longest match wins</text>
  <text x="596" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Most specific namespace wins</text>

  <rect x="44" y="280" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">9</text>
  <text x="112" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No match &#8594; no forwarding occurs, Azure DNS resolves</text>
  <text x="596" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Fails open to Azure DNS</text>

  <rect x="44" y="314" width="772" height="56" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E24B4A">So a correct-looking estate can have both layers switched off</text>
  <text x="60" y="353" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A VNet with custom DNS set consults neither its linked private zones nor any linked ruleset. Both resources</text>
  <text x="60" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">show the link; neither is reached. The fix is to point custom DNS at the resolver&#8217;s inbound endpoint.</text>

  <!-- Band 2: endpoints -->
  <text x="44" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Two endpoint types, and ten dedicated subnets at the ceiling</text>

  <rect x="44" y="416" width="376" height="104" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="58" y="436" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">Inbound &#8212; ingresses to Azure</text>
  <text x="58" y="455" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Takes an IP from the VNet&#8217;s own address space.</text>
  <text x="58" y="470" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">This is the address an on-premises conditional</text>
  <text x="58" y="485" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">forwarder points at &#8212; and that forwarder must</text>
  <text x="58" y="500" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">have network connectivity to the VNet.</text>
  <text x="58" y="515" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Dynamic = the 5th address, and may change.</text>

  <rect x="440" y="416" width="376" height="104" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="454" y="436" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">Outbound &#8212; egresses from Azure</text>
  <text x="454" y="455" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Conditional forwarding to on-premises, other</text>
  <text x="454" y="470" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">clouds, or external DNS servers. Associated</text>
  <text x="454" y="485" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">with a subnet but given NO IP address of its</text>
  <text x="454" y="500" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">own &#8212; nothing to record or firewall.</text>
  <text x="454" y="515" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Rulesets attach here.</text>

  <text x="44" y="544" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Both need a subnet delegated only to Microsoft.Network/dnsResolvers with no other service in it, endpoints</text>
  <text x="44" y="559" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">cannot share subnets, and a subnet must be between /28 and /24. With 5 inbound + 5 outbound per resolver,</text>
  <text x="44" y="574" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">a fully built resolver consumes 10 dedicated subnets. Most deployments need two.</text>

  <!-- Band 3: rules -->
  <text x="44" y="610" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Forwarding rules: longest match wins, and the wildcard is a single dot</text>

  <rect x="44" y="622" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="639" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Rule</text>
  <text x="188" y="639" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Domain name (dot-terminated)</text>
  <text x="472" y="639" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Destination</text>
  <text x="640" y="639" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">For secure.store.azure.contoso.com</text>

  <rect x="44" y="648" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="663" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Contoso</text>
  <text x="188" y="663" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">contoso.com.</text>
  <text x="472" y="663" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10.100.0.2:53</text>
  <text x="640" y="663" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">matches, but loses</text>

  <rect x="44" y="670" width="772" height="22" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="56" y="685" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">AzurePrivate</text>
  <text x="188" y="685" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">azure.contoso.com.</text>
  <text x="472" y="685" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10.10.0.4:53</text>
  <text x="640" y="685" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5B7B9A">WINS &#8212; longer prefix</text>

  <rect x="44" y="692" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="707" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Wildcard</text>
  <text x="188" y="707" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">.   (zero labels)</text>
  <text x="472" y="707" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">10.100.0.2:53</text>
  <text x="640" y="707" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">matches, but loses</text>

  <text x="44" y="734" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Names carry zero labels (wildcard) or between 1 and 34. The overview page calls the tie-break &#8220;longest suffix&#8221;;</text>
  <text x="44" y="749" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">the endpoints page calls it &#8220;longest prefix match&#8221;. Same mechanism, two words, two Microsoft pages.</text>

  <rect x="44" y="764" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="784" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">A wildcard rule is not a catch-all, and its target must know the public internet</text>
  <text x="60" y="803" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The two-label names windows.net, azure.com, azure.net and windowsazure.us are &#8220;reserved for Azure</text>
  <text x="60" y="818" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">services&#8221; and ignored by wildcard rules. And, in Microsoft&#8217;s own bold: &#8220;ensure that the target DNS service can</text>
  <text x="60" y="833" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">resolve public DNS names. Some Azure services have dependencies on public name resolution.&#8221;</text>

  <rect x="44" y="852" width="772" height="40" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="870" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Six destinations per rule &#8212; ordered failover, not load balancing</text>
  <text x="60" y="886" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;The first IP address that is entered is used unless it doesn&#8217;t respond&#8221;, with exponential backoff deciding that.</text>

  <!-- Band 4: the loop -->
  <rect x="44" y="912" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="932" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Two recommended settings, combined, build a DNS resolution loop</text>
  <text x="60" y="951" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;If a rule is present in the ruleset that has as its destination a private resolver inbound endpoint, don&#8217;t link the</text>
  <text x="60" y="966" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">ruleset to the VNet where the inbound endpoint is provisioned.&#8221; Queries in that VNet are forwarded back to it.</text>
  <text x="60" y="984" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">The principle: &#8220;Ruleset links are intended to enable VNets that can&#8217;t properly resolve a DNS name.&#8221; The hub can.</text>

  <rect x="44" y="1012" width="772" height="40" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1030" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">And Azure&#8217;s own resolver is a forbidden destination</text>
  <text x="60" y="1046" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">168.63.129.16 is rejected: &#8220;Exception while making add request for rule&#8221; &#8212; third appearance in this series.</text>

  <!-- Band 5: limits and exclusions -->
  <text x="44" y="1086" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Limits, and what the resolver will not work with</text>

  <rect x="44" y="1098" width="376" height="104" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="58" y="1118" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Limits</text>
  <text x="58" y="1137" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">15 resolvers per subscription &#183; 5 inbound and 5</text>
  <text x="58" y="1152" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">outbound endpoints each &#183; 1000 rules and 500</text>
  <text x="58" y="1167" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">VNet links per ruleset &#183; 6 targets per rule &#183;</text>
  <text x="58" y="1182" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">10,000 QPS per endpoint = 50,000 per resolver</text>
  <text x="58" y="1197" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">The portal may enforce lower &#8212; use PowerShell.</text>

  <rect x="440" y="1098" width="376" height="104" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="454" y="1118" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E24B4A">Not supported &#8212; each lands on an earlier post</text>
  <text x="454" y="1137" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; ExpressRoute FastPath (#76 &#8212; which also had</text>
  <text x="454" y="1152" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">  no flow logs)</text>
  <text x="454" y="1167" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; IPv6-enabled subnets &#183; VNets with encryption</text>
  <text x="454" y="1182" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; Azure Lighthouse &#183; cross-tenant ruleset links</text>
  <text x="454" y="1197" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Three of these are choices made long before DNS.</text>

  <text x="44" y="1232" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Unlike #89&#8217;s private zone, which is a global resource linkable across regions, the resolver is pinned: one virtual</text>
  <text x="44" y="1247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">network, same region, and no two resolvers may share a network. Rulesets inherit it &#8212; 500 links, same region.</text>
  <text x="44" y="1262" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Cross-subscription linking is allowed if the resource group sits in the resolver&#8217;s region. And at teardown, delete</text>
  <text x="44" y="1277" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">the ruleset and its virtual network links before the outbound endpoint &#8212; three levels, innermost first.</text>
  <text x="44" y="1296" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Peering is irrelevant to resolution: linked VNets use the ruleset &#8220;whether or not&#8221; they peer with the ruleset VNet.</text>
</svg>
