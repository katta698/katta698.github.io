<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1292" style="width:100%;max-width:860px;" role="img" aria-label="What a private endpoint actually changes: it adds a private path, does not close the public one, is exempt from NSGs by default, and injects a slash 32 route that beats the default route">
  <title>Private endpoints &#8212; what they are, what they change, and the three things they quietly do not</title>
  <rect x="0" y="0" width="860" height="1292" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">Private endpoints: what they actually change</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8220;A private endpoint is a network interface that uses a private IP address from your virtual network.&#8221; Read-only,</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">dynamically assigned, and &#8220;remains unchanged for the entire lifecycle&#8221; &#8212; you don&#8217;t pick it, it won&#8217;t move.</text>

  <!-- Band 1: is / changes / does not -->
  <rect x="44" y="94" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="111" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5"></text>
  <text x="188" y="111" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">The actual behaviour</text>

  <rect x="44" y="120" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="135" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">What it changes</text>
  <text x="188" y="135" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Reachability &#8212; same VNet, regionally and globally peered VNets, on-premises over VPN or ExpressRoute</text>

  <rect x="44" y="142" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="56" y="157" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">What it does NOT</text>
  <text x="188" y="157" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">&#8220;don&#8217;t necessarily restrict public network access to it&#8221; &#8212; closing that door is a separate action</text>

  <rect x="44" y="164" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="179" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Direction</text>
  <text x="188" y="179" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">One way. The provider &#8220;can&#8217;t originate traffic&#8221;, so an outbound deny rule is a no-op, not hardening</text>

  <rect x="44" y="186" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="201" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Scope</text>
  <text x="188" y="201" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">ONE subresource per endpoint. Storage: blob, table, queue, file, web, dfs &#8212; each with a secondary</text>

  <rect x="44" y="208" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="223" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Placement</text>
  <text x="188" y="223" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Same region AND subscription as the VNet &#8212; but the target service may sit in another region</text>

  <!-- Band 2: the NSG default -->
  <text x="44" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The default that catches people: your NSG does not apply</text>

  <rect x="44" y="270" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Network policies are DISABLED by default on a subnet</text>
  <text x="60" y="309" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;To use network policies like user-defined routes and network security group support, network policy support</text>
  <text x="60" y="324" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">must be enabled for the subnet.&#8221; Until then the subnet&#8217;s NSG is not consulted for private endpoints at all.</text>
  <text x="60" y="342" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">But &#8220;for other resources in the subnet, access is controlled based on security rules in the NSG&#8221; &#8212; so one</text>
  <text x="60" y="354" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">subnet and one NSG give two behaviours: the VM is filtered, the private endpoint beside it is not.</text>

  <rect x="44" y="370" width="772" height="56" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="60" y="390" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9A7B57">Four values, and the CLI can only express two of them</text>
  <text x="60" y="409" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Disabled &#183; NetworkSecurityGroupEnabled &#183; RouteTableEnabled &#183; Enabled. &#8220;The Azure CLI only supports the</text>
  <text x="60" y="421" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">values true or false&#8221; and cannot enable them selectively. PowerShell and ARM can. Third such split in four posts.</text>

  <!-- Band 3: the /32 route -->
  <text x="44" y="456" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The route nobody wrote, which beats the route you did</text>

  <rect x="44" y="468" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">A private endpoint propagates a /32 &#8212; and longest prefix match does the rest</text>
  <text x="60" y="507" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;the /32 default route sends traffic directly to the private endpoint in accordance with the longest prefix match</text>
  <text x="60" y="522" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">algorithm.&#8221; And: &#8220;a user-defined routes default route (0.0.0.0/0) won&#8217;t override private endpoint routes.&#8221;</text>
  <text x="60" y="540" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">So #79&#8217;s forced tunnelling has a hole shaped exactly like your private endpoints &#8212; and nothing in the route</text>
  <text x="60" y="552" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">table looks wrong, because the winning route was never written by anyone.</text>

  <rect x="44" y="568" width="376" height="74" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="58" y="588" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">To redirect it, two things are needed</text>
  <text x="58" y="607" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">1. Route-table network policies enabled on the</text>
  <text x="58" y="619" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">   subnet hosting the private endpoint.</text>
  <text x="58" y="634" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">2. A prefix at least as specific as the VNet range.</text>

  <rect x="440" y="568" width="376" height="74" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="454" y="588" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">And through an appliance, SNAT it</text>
  <text x="454" y="607" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Due to the variable nature of the private endpoint</text>
  <text x="454" y="619" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">data-plane&#8221; &#8212; the #83 symmetry problem again.</text>
  <text x="454" y="634" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The disableSnatOnPL tag removes the need.</text>

  <!-- Band 4: undebuggable -->
  <text x="44" y="676" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Both normal ways to debug a network path are unavailable here</text>

  <rect x="44" y="688" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="705" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Normal diagnostic</text>
  <text x="400" y="705" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">On a private endpoint</text>

  <rect x="44" y="714" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="729" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Effective routes and security rules on the NIC</text>
  <text x="400" y="729" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">&#8220;won&#8217;t be displayed&#8230; in the Azure portal&#8221;</text>

  <rect x="44" y="736" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="751" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">NSG flow logs</text>
  <text x="400" y="751" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">&#8220;unavailable for inbound traffic destined for a private endpoint&#8221;</text>

  <rect x="44" y="758" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="773" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Source port filtering in an NSG rule</text>
  <text x="400" y="773" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Accepted, then &#8220;interpreted as *&#8221; &#8212; silently widened</text>

  <!-- Band 5: the multiplication -->
  <text x="44" y="808" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The NSG rule budget is a multiplication, capped at 250 K</text>

  <rect x="44" y="820" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="837" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Sources</text>
  <text x="188" y="837" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">&#215; Destinations</text>
  <text x="340" y="837" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">&#215; Port ranges</text>
  <text x="508" y="837" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">= Product</text>
  <text x="660" y="837" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Verdict</text>

  <rect x="44" y="846" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="861" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">50</text>
  <text x="188" y="861" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">50</text>
  <text x="340" y="861" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">50</text>
  <text x="508" y="861" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">125 K</text>
  <text x="660" y="861" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Valid</text>

  <rect x="44" y="868" width="772" height="22" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="883" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">50</text>
  <text x="188" y="883" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">50</text>
  <text x="340" y="883" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">100</text>
  <text x="508" y="883" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">250,000</text>
  <text x="660" y="883" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">Valid &#8212; exactly at the cap</text>

  <rect x="44" y="890" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="56" y="905" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">100</text>
  <text x="188" y="905" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">100</text>
  <text x="340" y="905" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">100</text>
  <text x="508" y="905" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">1,000,000</text>
  <text x="660" y="905" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">INVALID &#8212; rejected</text>

  <text x="44" y="932" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Rejected at configuration time, which is the better failure. The ASG ceiling is worse: above 50 members,</text>
  <text x="44" y="947" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">&#8220;connection failures may occur&#8221; &#8212; a runtime symptom, not a refused configuration.</text>

  <!-- Band 6: limits -->
  <text x="44" y="982" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Limits &#8212; and the one that binds in a hub-and-spoke estate</text>

  <rect x="44" y="994" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1009" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Private endpoints per virtual network</text>
  <text x="560" y="1009" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">1000</text>

  <rect x="44" y="1016" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="56" y="1031" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Private endpoints across PEERED virtual networks</text>
  <text x="560" y="1031" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">4000 &#8212; only four VNets&#8217; worth</text>

  <rect x="44" y="1038" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1053" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Private endpoints per subscription</text>
  <text x="560" y="1053" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">64000 &#8212; unreachable in a peered design</text>

  <rect x="44" y="1060" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1075" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Private IP addresses on one private endpoint NIC</text>
  <text x="560" y="1075" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">500</text>

  <rect x="44" y="1082" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1097" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Per storage account &#183; per key vault</text>
  <text x="560" y="1097" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">200 &#183; 64</text>

  <rect x="44" y="1104" width="772" height="22" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="1119" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Private DNS zone groups per private endpoint</text>
  <text x="560" y="1119" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">1 &#8212; a design constraint, not a quota</text>

  <!-- Band 7: exclusions -->
  <rect x="44" y="1140" width="772" height="74" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="1160" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">Exclusions worth checking before you design around them</text>
  <text x="60" y="1179" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; Static IP unsupported for AKS, Application Gateway, HD Insight, Recovery Services vaults, third-party PLS.</text>
  <text x="60" y="1194" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#183; NSG support unavailable in West India, Australia Central 2, South Africa West, Brazil Southeast &#8212; and in ALL</text>
  <text x="60" y="1209" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">  Government and ALL China regions, precisely where filtering is a compliance requirement.</text>

  <text x="44" y="1244" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">So the three things to check are not the endpoints themselves: the service&#8217;s public network access setting, the</text>
  <text x="44" y="1259" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">subnet&#8217;s privateEndpointNetworkPolicies value, and whether any route more specific than the VNet range exists</text>
  <text x="44" y="1274" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">to pull that traffic back through a firewall. An estate can have every endpoint it planned and none of the three.</text>
</svg>
