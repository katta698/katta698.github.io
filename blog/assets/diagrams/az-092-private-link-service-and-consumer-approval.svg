<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1278" style="width:100%;max-width:860px;" role="img" aria-label="Azure Private Link service and consumer approval: visibility versus auto-approval, destination-side NAT hiding the consumer, and TCP Proxy v2 as an all-or-nothing escape hatch">
  <title>Private Link service and consumer approval &#8212; two lists, one translation nobody sees through, and a protocol that fails in both directions</title>
  <rect x="0" y="0" width="860" height="1278" fill="#F8F7F5"/>

  <text x="44" y="42" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2322">Private Link service and consumer approval</text>
  <text x="44" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">The provider side of #91. Your own service behind a Standard Load Balancer, published so consumers reach it</text>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">privately. The access model is two arrays of subscription IDs &#8212; and they are easy to conflate.</text>

  <!-- Band 1: visibility vs auto-approval -->
  <rect x="44" y="94" width="772" height="56" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Visibility is exposure; auto-approval is approval</text>
  <text x="60" y="133" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Visibility controls the exposure settings whereas auto-approval controls the approval settings&#8230; Auto-approval</text>
  <text x="60" y="145" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">is a subset of the visibility array.&#8221;</text>

  <rect x="44" y="162" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="179" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Consumer&#8217;s subscription is&#8230;</text>
  <text x="372" y="179" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Can request?</text>
  <text x="508" y="179" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">What happens</text>

  <rect x="44" y="188" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="203" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Outside the visibility setting</text>
  <text x="372" y="203" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No</text>
  <text x="508" y="203" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No exposure &#8212; nothing to request</text>

  <rect x="44" y="210" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="225" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">In visibility, NOT in auto-approval</text>
  <text x="372" y="225" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>
  <text x="508" y="225" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Pending &#8212; you must approve by hand</text>

  <rect x="44" y="232" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="56" y="247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">In the auto-approval array</text>
  <text x="372" y="247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes</text>
  <text x="508" y="247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">Connected. No decision, no notification.</text>

  <text x="44" y="274" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The two settings fail differently. Too-broad visibility produces requests &#8212; noise, but each still needs a decision.</text>
  <text x="44" y="289" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Too-broad auto-approval produces connections. The failure is silent in exactly one direction. Both cap at 100.</text>

  <!-- Band 2: the three visibility settings -->
  <text x="44" y="322" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The three visibility settings &#8212; read the options, not the labels</text>

  <rect x="44" y="334" width="772" height="22" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="349" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Role-based access control only (MOST restrictive)</text>
  <text x="460" y="349" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">&#8230; yet permits cross-tenant, via RBAC</text>

  <rect x="44" y="356" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Restricted by subscription</text>
  <text x="460" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A trusted list &#8212; up to 100 subscriptions</text>

  <rect x="44" y="378" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="393" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Anyone with your alias (LEAST restrictive)</text>
  <text x="460" y="393" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A bearer string, shared offline, no expiry</text>

  <text x="44" y="420" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The alias is Prefix.GUID.region.azure.privatelinkservice &#8212; the prefix cannot be changed after creation, and the</text>
  <text x="44" y="435" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Azure-appended suffix tells every consumer which region you deployed in.</text>

  <!-- Band 3: NAT -->
  <text x="44" y="468" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">The provider cannot see who is calling &#8212; by design</text>

  <rect x="44" y="480" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">Every consumer arrives as one of your own addresses</text>
  <text x="60" y="519" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;Private Link service performs destination side NAT-ing&#8230; ensures that there&#8217;s no IP conflict between source</text>
  <text x="60" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">(consumer side) and destination (service provider) address space&#8230; the NAT IP address displays as source IP</text>
  <text x="60" y="549" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">for all packets received by your service.&#8221; Rate limits, allow lists and audit have nothing to key on.</text>

  <rect x="44" y="566" width="772" height="56" fill="#FFFFFF" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="586" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B7B9A">This is the third shape of the same SNAT trade</text>
  <text x="60" y="605" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">#79: damage &#8212; it hid the source the perimeter existed to read. #83: a prerequisite &#8212; it made return traffic</text>
  <text x="60" y="617" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">symmetric. Here: the feature &#8212; without it, two customers with overlapping ranges could not both connect.</text>

  <rect x="44" y="634" width="772" height="56" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="60" y="654" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D2322">The only durable identity on the wire is the LinkID</text>
  <text x="60" y="673" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">TCP Proxy v2 carries the real source AND the private endpoint LinkID &#8212; 4 octets, little endian, matching</text>
  <text x="60" y="685" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">linkIdentifier on the connection. Source IP alone is a shared NAT address: reading only that gains nothing.</text>

  <!-- Band 4: proxy protocol sharp edges -->
  <text x="44" y="722" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">TCP Proxy v2 is all-or-nothing, in both directions</text>

  <rect x="44" y="734" width="772" height="26" fill="#1D2322"/>
  <text x="56" y="751" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Setting on the Private Link service</text>
  <text x="400" y="751" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Backend parses the header?</text>
  <text x="648" y="751" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#F8F7F5">Result</text>

  <rect x="44" y="760" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="775" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Enabled</text>
  <text x="400" y="775" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No</text>
  <text x="648" y="775" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">&#8220;The request will fail&#8221;</text>

  <rect x="44" y="782" width="772" height="22" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="56" y="797" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Disabled</text>
  <text x="400" y="797" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Yes &#8212; expects it</text>
  <text x="648" y="797" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#E24B4A">&#8220;The request will fail&#8221;</text>

  <rect x="44" y="814" width="772" height="88" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="834" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E24B4A">And the setting is per-service while the effect is per-load-balancer</text>
  <text x="60" y="853" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">&#8220;TCP Proxy v2 configuration on a Private Link service activates for ALL load balancers and their backend VMs.</text>
  <text x="60" y="868" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">If TCP Proxy v2 is configured on one PLS, configure it on other PLS resources if they are sharing the same</text>
  <text x="60" y="883" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">load balancer or backend pool, otherwise health probes will fail.&#8221; Up to 8 services share one balancer, so the</text>
  <text x="60" y="898" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">failure surfaces on the seven nobody touched. Probes carry the header too, with no client information in it.</text>

  <!-- Band 5: limits -->
  <text x="44" y="936" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D2322">Limits and constraints</text>

  <rect x="44" y="948" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="963" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Private link services per subscription &#183; per Standard Load Balancer</text>
  <text x="560" y="963" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">800 &#183; 8  (= 100 full balancers)</text>

  <rect x="44" y="970" width="772" height="22" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="985" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">NAT IP configurations per service &#8212; the port and scale budget</text>
  <text x="560" y="985" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">8 max, 1 enforced minimum</text>

  <rect x="44" y="992" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1007" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Private endpoints on the same private link service</text>
  <text x="560" y="1007" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">1000  (= 8000 per balancer)</text>

  <rect x="44" y="1014" width="772" height="22" fill="#FFFFFF" stroke="#D8D5D0" stroke-width="1"/>
  <text x="56" y="1029" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Subscriptions in the visibility setting &#183; in auto-approval</text>
  <text x="560" y="1029" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">100 &#183; 100</text>

  <rect x="44" y="1036" width="772" height="22" fill="#FFFFFF" stroke="#9A7B57" stroke-width="1.5"/>
  <text x="56" y="1051" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1D2322">Idle timeout &#8212; beat it with TCP keepalives</text>
  <text x="560" y="1051" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9A7B57">300 seconds (~5 minutes)</text>

  <rect x="44" y="1072" width="772" height="74" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="60" y="1092" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E24B4A">Load balancer requirements exclude a common configuration</text>
  <text x="60" y="1111" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Standard only, not Basic &#8212; expected. But also: &#8220;Supported only on Standard Load Balancer where backend pool</text>
  <text x="60" y="1126" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">is configured by NIC. Not supported&#8230; where backend pool is configured by IP address.&#8221; Discovered when</text>
  <text x="60" y="1141" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">creating the service, not when designing the pool. IPv4 only, TCP and UDP only.</text>

  <text x="44" y="1176" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">One approval reaches further than one network: a single service is reachable from private endpoints in different</text>
  <text x="44" y="1191" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">virtual networks, subscriptions and Entra tenants &#8212; and from each consumer&#8217;s peered networks and on-premises</text>
  <text x="44" y="1206" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">over VPN or ExpressRoute. The provider keeps per-endpoint approve, reject and delete after the fact.</text>
  <text x="44" y="1227" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The service cannot be deleted while any connection exists, so retirement is an explicit disconnection of</text>
  <text x="44" y="1242" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">customers. And a Direct Connect preview removes the load balancer requirement the whole design starts from.</text>
</svg>
