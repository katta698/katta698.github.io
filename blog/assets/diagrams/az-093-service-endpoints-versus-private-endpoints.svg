<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 736" style="width:100%;max-width:860px;" role="img" aria-label="Service endpoints change the source address; private endpoints change the destination. Four bands: the two paths, the two-step activation and its ordering trap, and the service-side ceilings that produced standard service endpoints.">
  <title>Service endpoints versus private endpoints: which end of the packet each one edits</title>
  <rect x="0" y="0" width="860" height="736" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Two features, opposite ends of the packet</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A service endpoint rewrites the source address and adds a route. A private endpoint puts the destination inside your network.</text>

  <!-- Band 1: service endpoint -->
  <rect x="36" y="66" width="788" height="128" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="128" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; SERVICE ENDPOINT &#8212; the source changes, the destination does not</text>

  <rect x="56" y="98" width="128" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">VM in subnet-1</text>
  <text x="68" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">10.0.1.4</text>

  <text x="196" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>
  <rect x="214" y="98" width="178" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="226" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Public DNS &#8212; unchanged</text>
  <text x="226" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">still returns the service's public IP</text>

  <text x="404" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>
  <rect x="422" y="98" width="212" height="40" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="434" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">System route, nextHopType =</text>
  <text x="434" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B7B9A">VirtualNetworkServiceEndpoint</text>

  <text x="646" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>
  <rect x="664" y="98" width="144" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="676" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Service sees source</text>
  <text x="676" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">10.0.1.4, not a public IP</text>

  <text x="56" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The route overrides any BGP or user-defined route for the matching prefix, so it is also a hole in forced tunnelling.</text>
  <text x="56" y="175" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">Nothing wrote it into your route table. Existing firewall rules on Azure public IPs stop matching the moment it is enabled.</text>

  <!-- Band 2: private endpoint -->
  <rect x="36" y="206" width="788" height="110" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="206" width="4" height="110" fill="#9A7B57"/>
  <text x="52" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">2 &#183; PRIVATE ENDPOINT &#8212; the destination changes, the source does not</text>

  <rect x="56" y="238" width="128" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Same VM</text>
  <text x="68" y="269" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">10.0.1.4</text>

  <text x="196" y="253" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>
  <rect x="214" y="238" width="178" height="40" fill="#F2EFEA" stroke="#9A7B57"/>
  <text x="226" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Private DNS answers</text>
  <text x="226" y="269" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9A7B57">10.0.2.9 &#8212; inside the network</text>

  <text x="404" y="253" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>
  <rect x="422" y="238" width="212" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="434" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Read-only NIC in the subnet,</text>
  <text x="434" y="269" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">reached by an injected /32 route</text>

  <text x="646" y="253" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>
  <rect x="664" y="238" width="144" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="676" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Reachable from</text>
  <text x="676" y="269" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">on-premises too</text>

  <text x="56" y="298" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A service endpoint stays publicly routable; a private endpoint is a private IP in the virtual network's own address space.</text>

  <!-- Band 3: activation order -->
  <rect x="36" y="328" width="788" height="134" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="328" width="4" height="134" fill="#E24B4A"/>
  <text x="52" y="348" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">3 &#183; TWO STEPS, TWO SIDES &#8212; and the order decides whether there is an outage</text>

  <rect x="56" y="360" width="340" height="52" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="377" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Network side: turn the endpoint on for the subnet</text>
  <text x="68" y="392" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Needs joinViaServiceEndpoint/action on the subnet.</text>
  <text x="68" y="406" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">On its own this grants no restriction at all.</text>

  <rect x="464" y="360" width="344" height="52" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="476" y="377" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Service side: write the virtual network ACL</text>
  <text x="476" y="392" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Normally rejected before the endpoint exists.</text>
  <text x="476" y="406" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B7B9A">IgnoreMissingVnetServiceEndpoint = True makes it legal.</text>

  <text x="412" y="390" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">+</text>

  <text x="56" y="430" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Network side first: the source address changes while the service still allowlists public IPs, so traffic is refused in the gap.</text>
  <text x="56" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">That flag exists on Azure SQL and Cosmos DB only. Open TCP connections close during the switch either way.</text>

  <!-- Band 4: ceilings -->
  <rect x="36" y="474" width="788" height="238" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="474" width="4" height="238" fill="#5B7B9A"/>
  <text x="52" y="494" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">4 &#183; THE CEILING IS ON THE SERVICE, NOT THE NETWORK</text>

  <text x="56" y="514" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">No limit on service endpoints per virtual network, and no charge. Every binding limit sits on the service being secured:</text>

  <text x="56" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Virtual network rules</text>
  <text x="196" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Storage 200 &#183; Key Vault 200 &#183; SQL 128 &#183; Synapse 128 &#183; Event Hubs 128 &#183; Service Bus 128 &#183; Cosmos DB 64</text>
  <text x="56" y="556" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Per service, per VNet</text>
  <text x="196" y="556" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">up to 500 different subscriptions and regions with active virtual network rules</text>
  <text x="56" y="574" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Spread</text>
  <text x="196" y="574" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">200 &#247; 64 = 3.125 &#8212; the same subnet list hits Cosmos DB's ceiling three times sooner than Storage's</text>

  <rect x="56" y="592" width="752" height="56" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="68" y="609" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Standard service endpoint: replace the per-subnet ACL entry with one public IP used as a network identifier</text>
  <text x="68" y="624" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Reusable across subnets, VNets and subscriptions in one tenant and region. Authorised by a network security perimeter.</text>
  <text x="68" y="639" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Every endpoint in a subnet must share the identifier or the operation fails; changing it resets active flows. Not free.</text>

  <text x="56" y="670" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Exfiltration: a service endpoint authorises a subnet to reach a service, not a resource. Service endpoint policies narrow it</text>
  <text x="56" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">to named accounts &#8212; Azure Storage only, allow-only, no centralized logging, and they upgrade the endpoint's scope from</text>
  <text x="56" y="702" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">regional to global, denying classic and Managed Storage Accounts by default. 100 policies &#215; 200 resources = 20,000 named.</text>
</svg>
