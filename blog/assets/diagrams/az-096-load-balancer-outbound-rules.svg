<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 748" style="width:100%;max-width:860px;" role="img" aria-label="Load Balancer outbound rules in four bands: the fixed 64,000 port budget per public IP, the default allocation table and its 1,024 cap, what an outbound rule lets you change, and the five-method ranking the documentation publishes.">
  <title>A fixed budget, a default that divides it badly, and a feature rated third by the people who built it</title>
  <rect x="0" y="0" width="860" height="748" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Outbound rules: the failure is division, not configuration</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A fixed port budget is split statically across instances before anyone knows how the traffic will actually distribute.</text>

  <!-- Band 1: the budget -->
  <rect x="36" y="66" width="788" height="92" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="92" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; THE BUDGET, PER PUBLIC IP</text>

  <rect x="56" y="98" width="188" height="36" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="121" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">65,535 ports on the address</text>

  <text x="254" y="121" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8594;</text>

  <rect x="276" y="98" width="212" height="36" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="288" y="121" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B7B9A">64,000 eligible for SNAT</text>

  <text x="498" y="121" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">less</text>

  <rect x="534" y="98" width="274" height="36" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="546" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">8 ports per inbound rule sharing the frontend</text>
  <text x="546" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">and allocations are only ever multiples of 8</text>

  <text x="56" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Every extra frontend IP adds another 64,000 &#8212; but see the cap below before planning around that.</text>

  <!-- Band 2: default allocation -->
  <rect x="36" y="170" width="788" height="186" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="170" width="4" height="186" fill="#E24B4A"/>
  <text x="52" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">2 &#183; THE DEFAULT SPLIT &#8212; DOCUMENTED AS UNFIT FOR PRODUCTION</text>

  <text x="56" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Pool size</text>
  <text x="196" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">1&#8211;50</text>
  <text x="286" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">51&#8211;100</text>
  <text x="386" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">101&#8211;200</text>
  <text x="486" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">201&#8211;400</text>
  <text x="586" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">401&#8211;800</text>
  <text x="686" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">801&#8211;1,000</text>

  <text x="56" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Ports each</text>
  <text x="196" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">1,024</text>
  <text x="286" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">512</text>
  <text x="386" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">256</text>
  <text x="486" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">128</text>
  <text x="586" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">64</text>
  <text x="686" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">32</text>

  <text x="56" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Top to bottom the per-instance allocation falls by a factor of 32. At 1,000 instances that is 32 concurrent flows per destination.</text>

  <rect x="56" y="270" width="752" height="48" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="288" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#E24B4A">The cap is the trap: MIN(ports-for-pool-size &#215; frontend IPs, 1024)</text>
  <text x="68" y="304" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">At 100 instances: one frontend gives 512, a second gives 1,024 &#8212; and a third adds nothing at all.</text>

  <text x="56" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Exhaustion is per instance. One backend can be completely unable to connect out while the load balancer reports ports free.</text>

  <!-- Band 3: what the rule changes -->
  <rect x="36" y="368" width="788" height="150" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="368" width="4" height="150" fill="#9A7B57"/>
  <text x="52" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">3 &#183; WHAT AN OUTBOUND RULE LETS YOU SET</text>

  <rect x="56" y="400" width="368" height="76" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="419" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Which backends use which public addresses</text>
  <text x="68" y="435" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Ports per instance, or max backend instances</text>
  <text x="68" y="451" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Protocol: TCP, UDP or All &#8212; never ICMP</text>
  <text x="68" y="467" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Idle timeout 4&#8211;120 min, and TCP reset on timeout</text>

  <rect x="440" y="400" width="368" height="76" fill="#F2EFEA" stroke="#9A7B57"/>
  <text x="452" y="419" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Allocation = frontend IPs &#215; 64K &#247; backend instances</text>
  <text x="452" y="435" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Oversubscription is rejected at configuration time:</text>
  <text x="452" y="451" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9A7B57">7 instances &#215; 10,000 ports = 70,000 &gt; 64,000 &#8212; refused</text>
  <text x="452" y="467" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Scale sets should allocate by max instances, not per instance.</text>

  <text x="56" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">Reusing an inbound address needs disableOutboundSnat first &#8212; and between the two changes there is no egress at all.</text>

  <!-- Band 4: the ranking -->
  <rect x="36" y="530" width="788" height="172" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="530" width="4" height="172" fill="#5B7B9A"/>
  <text x="52" y="550" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">4 &#183; THE RANKING MICROSOFT PUBLISHES</text>

  <text x="56" y="572" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">1</text>
  <text x="80" y="572" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">NAT Gateway on the subnet</text>
  <text x="340" y="572" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">dynamic, explicit</text>
  <text x="520" y="572" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5B7B9A">Best</text>

  <text x="56" y="590" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">2</text>
  <text x="80" y="590" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Public IP on the virtual machine</text>
  <text x="340" y="590" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">static, explicit</text>
  <text x="520" y="590" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">OK</text>

  <text x="56" y="608" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">3</text>
  <text x="80" y="608" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#9A7B57">Load balancer frontends via outbound rules</text>
  <text x="340" y="608" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9A7B57">static, explicit</text>
  <text x="520" y="608" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9A7B57">OK &#8212; &#8220;yes, but not at scale&#8221;</text>

  <text x="56" y="626" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">4</text>
  <text x="80" y="626" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Load balancer frontends without outbound rules</text>
  <text x="340" y="626" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">static, implicit</text>
  <text x="520" y="626" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Worst</text>

  <text x="56" y="644" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">5</text>
  <text x="80" y="644" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Default outbound access</text>
  <text x="340" y="644" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">implicit</text>
  <text x="520" y="644" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Worst</text>

  <text x="56" y="670" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The difference between OK and Best is one word in the allocation column: static versus dynamic.</text>
  <text x="56" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">NAT Gateway also takes precedence over all of these for new connections, so adding one retires your rule&#8217;s role.</text>

  <text x="44" y="726" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Cheapest fix: spend no ports. Private Link keeps Azure PaaS traffic off the internet, and connection reuse multiplies what you have.</text>
  <text x="44" y="741" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Since 31 March 2026, subnets in new virtual networks default to defaultOutboundAccess = false. Existing networks are unchanged.</text>
</svg>
