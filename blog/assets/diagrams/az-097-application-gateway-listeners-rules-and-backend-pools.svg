<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" style="width:100%;max-width:860px;" role="img" aria-label="Application Gateway in four bands: the listener, rule, backend setting and backend pool chain; the two different evaluation-order mechanisms on v1 and v2; what each object controls and its limits; and the backend pool's freedom to live outside the virtual network.">
  <title>Four objects, one chain, and an evaluation order that changes mechanism between SKUs</title>
  <rect x="0" y="0" width="860" height="740" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Application Gateway: the chain, not the object</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Each link is simple. A break anywhere presents at the end, which is why the object you inspect usually looks correct.</text>

  <!-- Band 1: the chain -->
  <rect x="36" y="66" width="788" height="104" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="104" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; FOUR OBJECTS, IN ORDER</text>

  <rect x="56" y="98" width="172" height="44" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="68" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Listener</text>
  <text x="68" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">IP + port + protocol + host</text>

  <text x="236" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="256" y="98" width="172" height="44" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="268" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Routing rule</text>
  <text x="268" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">one listener, one rule</text>

  <text x="436" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="456" y="98" width="172" height="44" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="468" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Backend setting</text>
  <text x="468" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">port, protocol, timeout, host</text>

  <text x="636" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="656" y="98" width="152" height="44" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="668" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Backend pool</text>
  <text x="668" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">the candidate targets</text>

  <text x="56" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">A custom probe hangs off the backend setting &#8212; and does not run at all unless that setting is wired to a listener.</text>

  <!-- Band 2: evaluation order -->
  <rect x="36" y="182" width="788" height="140" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="182" width="4" height="140" fill="#E24B4A"/>
  <text x="52" y="202" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">2 &#183; WHICH LISTENER WINS &#8212; A DIFFERENT MECHANISM ON EACH SKU</text>

  <rect x="56" y="214" width="368" height="76" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="233" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">v1 &#8212; position in the rule list, plus listener type</text>
  <text x="68" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">A basic listener first accepts ANY request on that IP and port</text>
  <text x="68" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8594; every multi-site listener below it is never consulted</text>
  <text x="68" y="282" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Remedy: multi-site rules first, basic rule last</text>

  <rect x="440" y="214" width="368" height="76" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="452" y="233" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">v2 &#8212; an explicit priority integer on each rule</text>
  <text x="452" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">1 = highest &#183; 20000 = lowest &#183; must be unique per rule</text>
  <text x="452" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B7B9A">Give wildcard and basic listeners the LARGER number</text>
  <text x="452" y="282" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">so site-specific listeners are evaluated first</text>

  <text x="56" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A v1 config read top to bottom tells you the answer. A v2 config read the same way tells you nothing &#8212; read the priorities.</text>

  <!-- Band 3: what each holds -->
  <rect x="36" y="334" width="788" height="196" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="334" width="4" height="196" fill="#9A7B57"/>
  <text x="52" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">3 &#183; WHAT EACH OBJECT CARRIES, AND WHERE IT STOPS</text>

  <text x="56" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Listeners</text>
  <text x="196" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">200 exist, but only 100 may route traffic &#183; 5 host names each &#183; exactly 1 URL map</text>

  <text x="56" y="396" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Rules</text>
  <text x="196" y="396" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">400 total &#183; up to 100 path-based rules inside one URL map</text>

  <text x="56" y="416" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Backend settings</text>
  <text x="196" y="416" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">100 &#183; request timeout default 20s &#183; private 86,400s vs external 240s</text>

  <text x="56" y="436" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Backend pools</text>
  <text x="196" y="436" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">100 pools &#215; 1,200 targets = 120,000 addressable targets</text>

  <text x="56" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Listener ports</text>
  <text x="196" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">V2: 1&#8211;64999 (not 22 with Private Link, not 53) &#183; V1: 1&#8211;65502 (not 3389)</text>

  <rect x="56" y="470" width="752" height="46" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="488" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#E24B4A">HTTP/2 is offered to clients over TLS only. The connection to the backend is ALWAYS HTTP/1.1.</text>
  <text x="68" y="505" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A cleartext h2c upgrade is refused with 403. Connection draining applies at 30s even when left disabled.</text>

  <!-- Band 4: the backend pool difference -->
  <rect x="36" y="542" width="788" height="150" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="542" width="4" height="150" fill="#5B7B9A"/>
  <text x="52" y="562" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">4 &#183; THE BACKEND POOL IS NOT CONFINED TO YOUR NETWORK</text>

  <rect x="56" y="574" width="368" height="72" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="593" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">A pool member may be</text>
  <text x="68" y="610" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">NICs &#183; scale sets &#183; public or internal IPs</text>
  <text x="68" y="626" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">FQDNs or short names &#183; App Service, Container Apps</text>
  <text x="68" y="640" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Not tied to an availability set.</text>

  <rect x="440" y="574" width="368" height="72" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="452" y="593" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5B7B9A">&#8220;across clusters, across datacenters, or outside Azure&#8221;</text>
  <text x="452" y="610" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8212; as long as there is IP connectivity</text>
  <text x="452" y="626" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Internal IPs need peering or a VPN gateway;</text>
  <text x="452" y="640" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">on-premises needs ExpressRoute or VPN tunnels.</text>

  <text x="56" y="670" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">The layer 4 load balancer cannot do this: there, a rule cannot span two virtual networks at all.</text>
  <text x="56" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Scale set members report unhealthy until their instances are upgraded &#8212; which looks like a probe or rule fault.</text>

  <text x="44" y="718" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Everything client-side is modern and configurable. Everything backend-side is HTTP/1.1 to a list of addresses.</text>
  <text x="44" y="733" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">It is a translation layer, and the translation only runs in one direction.</text>
</svg>
