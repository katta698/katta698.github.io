<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 752" style="width:100%;max-width:860px;" role="img" aria-label="Application Gateway v2 scaling in four bands: the capacity unit as a maximum of three parameters, what one instance is worth under each, the scaling controls and their timing, and zone redundancy versus zonal deployment.">
  <title>A billing unit that is a maximum, an instance worth 10 or 225 of them, and an SLA with a condition attached</title>
  <rect x="0" y="0" width="860" height="752" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Application Gateway v2: sizing a unit you cannot see directly</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">v1 retired 28 April 2026. v2 is the only SKU, and it bills on a measure that is a maximum rather than a total.</text>

  <!-- Band 1: the capacity unit -->
  <rect x="36" y="66" width="788" height="116" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="116" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; ONE CAPACITY UNIT = THE HIGHEST OF THREE, NOT THE SUM</text>

  <rect x="56" y="98" width="238" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="115" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">2,500 persistent connections</text>
  <text x="68" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">idle keep-alives count</text>

  <rect x="310" y="98" width="238" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="322" y="115" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">1 GB per hour = 2.22 Mbps</text>
  <text x="322" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">throughput</text>

  <rect x="564" y="98" width="244" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="576" y="115" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">1 compute unit</text>
  <text x="576" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">~50 conn/sec on Standard_v2</text>

  <text x="56" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">The parameter with the highest utilization sets the number. The other two contribute nothing to the bill.</text>
  <text x="56" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Documented example: max(17.38 CU, 10.96 &#247; 2.22, 123.08k &#247; 2500) = 49.232 &#8212; connections won outright.</text>

  <!-- Band 2: what an instance is worth -->
  <rect x="36" y="194" width="788" height="130" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="194" width="4" height="130" fill="#9A7B57"/>
  <text x="52" y="214" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">2 &#183; ONE INSTANCE IS WORTH 10 CAPACITY UNITS &#8212; OR ABOUT 225</text>

  <text x="56" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Per Standard_v2 instance</text>
  <text x="256" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#247; per capacity unit</text>
  <text x="470" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">= capacity units</text>

  <text x="56" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">25,000 connections</text>
  <text x="256" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">2,500</text>
  <text x="470" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">10</text>

  <text x="56" y="274" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">10 compute units</text>
  <text x="256" y="274" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">1</text>
  <text x="470" y="274" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">10</text>

  <text x="56" y="292" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">500 Mbps throughput</text>
  <text x="256" y="292" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">2.22 Mbps</text>
  <text x="470" y="292" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#9A7B57">about 225</text>

  <text x="56" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Roughly 22&#215; more capacity for the same hourly fixed cost, decided only by the shape of the traffic.</text>

  <!-- Band 3: controls and timing -->
  <rect x="36" y="336" width="788" height="188" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="336" width="4" height="188" fill="#E24B4A"/>
  <text x="52" y="356" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">3 &#183; THE CONTROLS DO NOT QUITE DO WHAT THEY ARE CALLED</text>

  <rect x="56" y="368" width="368" height="76" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="387" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Minimum instance count &#8212; a spend commitment</text>
  <text x="68" y="404" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Range 0&#8211;100 &#183; reserves 10 capacity units per instance</text>
  <text x="68" y="420" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Billed whether consumed or not. Zero reserves nothing</text>
  <text x="68" y="436" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">and is still highly available.</text>

  <rect x="440" y="368" width="368" height="76" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="452" y="387" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Maximum instance count &#8212; a cap that may not apply</text>
  <text x="452" y="404" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Range to 125 &#183; defaults to 10 when left unset</text>
  <text x="452" y="420" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Lowering it takes effect only after a scale-in &#8212; and</text>
  <text x="452" y="436" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">sustained load is what prevents a scale-in.</text>

  <text x="56" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">A new instance takes 3&#8211;5 minutes. Instances scale out in groups, and the group grows as the instance count grows &#8212;</text>
  <text x="56" y="482" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">so the cold-start case is the slowest case. Scale-in drains connections for 5 minutes, then closes them.</text>
  <text x="56" y="504" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Fixed cost does not move with instance count. A partial hour bills as a whole one.</text>

  <!-- Band 4: zones -->
  <rect x="36" y="536" width="788" height="168" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="536" width="4" height="168" fill="#5B7B9A"/>
  <text x="52" y="556" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">4 &#183; ZONE-REDUNDANT AND ZONAL ARE OPPOSITES, NOT A SPECTRUM</text>

  <rect x="56" y="568" width="368" height="80" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="68" y="587" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5B7B9A">Zone-redundant &#8212; the portal default</text>
  <text x="68" y="604" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Instances across two or more zones</text>
  <text x="68" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Microsoft detects the failure and fails over</text>
  <text x="68" y="636" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Interruptions of a few seconds</text>

  <rect x="440" y="568" width="368" height="80" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="452" y="587" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#E24B4A">Zonal &#8212; every instance in one chosen zone</text>
  <text x="452" y="604" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">&#8220;doesn&#8217;t provide resiliency to an AZ outage&#8221;</text>
  <text x="452" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">You own detection, failover and failback</text>
  <text x="452" y="636" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Unavailable until the zone recovers</text>

  <text x="56" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1D2322">Zone support cannot be disabled. Converting zone-redundant to zonal means building a new gateway.</text>
  <text x="56" y="684" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">SLA eligibility: the gateway must be zone redundant OR configured to use autoscale. Manual plus zonal qualifies for neither.</text>

  <text x="44" y="724" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Every gateway always runs at least two instances, even when the portal displays one.</text>
  <text x="44" y="739" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Upgrades and zone failures both create temporary instances &#8212; the subnet needs free addresses for them.</text>
</svg>
