<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 756" style="width:100%;max-width:860px;" role="img" aria-label="Azure Front Door in four bands: the ordered request pipeline, route matching that rejects rather than falls back, the cache and its 8 MB chunking, and the rules engine's ordering and early exit.">
  <title>Nine stages, two of which decide the outcome before your configuration is consulted</title>
  <rect x="0" y="0" width="860" height="756" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Front Door: a CDN that load balances, not a load balancer that caches</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Classic retires 31 March 2027 and already refuses new profiles, new domains and managed certificates.</text>

  <!-- Band 1: pipeline -->
  <rect x="36" y="66" width="788" height="134" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="134" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; THE PIPELINE, IN ORDER</text>

  <text x="56" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">1 DNS returns a PoP unicast IP</text>
  <text x="312" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">4 TLS handshake</text>
  <text x="560" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9A7B57">7 Evaluate rule sets, in order</text>

  <text x="56" y="126" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">2 Client connects to that IP</text>
  <text x="312" y="126" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">5 Evaluate WAF &#8212; a hit ends it</text>
  <text x="560" y="126" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">8 Check the cache</text>

  <text x="56" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">3 Match profile by Host header</text>
  <text x="312" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">6 Match a route &#8212; or 404</text>
  <text x="560" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">9 Select origin, forward</text>

  <rect x="56" y="158" width="752" height="30" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="177" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">The PoP is picked during DNS resolution &#8212; from the resolver&#8217;s location when the user&#8217;s is unknown. Nothing later can correct it.</text>

  <!-- Band 2: route matching -->
  <rect x="36" y="212" width="788" height="148" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="212" width="4" height="148" fill="#E24B4A"/>
  <text x="52" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">2 &#183; ROUTE MATCHING REJECTS; IT DOES NOT FALL BACK</text>

  <rect x="56" y="244" width="368" height="64" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="263" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Host: exact match only</text>
  <text x="68" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Anything else &#8594; 404 Bad Request</text>
  <text x="68" y="297" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Custom domains must be registered first</text>

  <rect x="440" y="244" width="368" height="64" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="452" y="263" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Path: exact, then wildcard, then 404</text>
  <text x="452" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A wildcard is valid only at the end, after a slash</text>
  <text x="452" y="297" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">/path and /path/ are different routes</text>

  <text x="56" y="328" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">Without a catch-all /* on a host, every path you did not enumerate returns 404 &#8212; on a host that is otherwise correct.</text>
  <text x="56" y="346" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Patterns are case insensitive, so /FOO and /foo are duplicates and are rejected at configuration time.</text>

  <!-- Band 3: cache -->
  <rect x="36" y="372" width="788" height="180" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="372" width="4" height="180" fill="#9A7B57"/>
  <text x="52" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">3 &#183; THE CACHE, AND THE NUMBER IT IS BUILT AROUND</text>

  <text x="56" y="414" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Cacheable</text>
  <text x="196" y="414" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">GET only. Everything else is proxied.</text>

  <text x="56" y="432" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Large files</text>
  <text x="196" y="432" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Fetched in 8 MB chunks, next chunk prefetched. No cap on file size.</text>

  <text x="56" y="450" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Expiry order</text>
  <text x="196" y="450" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">s-maxage &#8594; max-age &#8594; Expires &#183; ceiling 366 days</text>

  <text x="56" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">No Cache-Control</text>
  <text x="196" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">A random duration between one and three days, per object</text>

  <text x="56" y="486" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Validator</text>
  <text x="196" y="486" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Last-Modified only &#8212; etag is not supported, so ETag-only origins never get a 304</text>

  <rect x="56" y="500" width="752" height="40" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="518" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Above 8 MB the origin must return consistent Last-Modified timestamps, or you get partial downloads or 5XX.</text>
  <text x="68" y="533" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Azure Storage is named as possibly inconsistent across replicas. Chunked Transfer Encoding over 8 MB is unsupported.</text>

  <!-- Band 4: rules engine -->
  <rect x="36" y="564" width="788" height="144" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="564" width="4" height="144" fill="#5B7B9A"/>
  <text x="52" y="584" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">4 &#183; THE RULES ENGINE RUNS BEFORE THE CACHE LOOKUP</text>

  <rect x="56" y="596" width="368" height="64" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="615" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Shape of a rule</text>
  <text x="68" y="632" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Up to 10 match conditions, combined with AND only</text>
  <text x="68" y="649" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Up to 5 actions &#183; regex in conditions, variables in actions</text>

  <rect x="440" y="596" width="368" height="64" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="452" y="615" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5B7B9A">What it can override</text>
  <text x="452" y="632" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The origin group the route selected</text>
  <text x="452" y="649" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Cache key, cache behaviour, headers, URL, redirects</text>

  <text x="56" y="682" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">&#8220;Stop evaluating remaining rules&#8221; halts every remaining rule SET for that route &#8212; not just the rest of the current one.</text>
  <text x="56" y="698" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">So a shared security-header rule set placed last may never run.</text>

  <text x="44" y="732" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Limits: 10 endpoints per profile on Standard, 25 on Premium &#183; 200 origins per profile binds far before 200 groups &#215; 50 origins.</text>
  <text x="44" y="747" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">75 Gbps &#183; 100,000 requests/sec &#183; 1,000,000 WebSockets &#183; edge actions get 16 KB of code and 10 ms to run.</text>
</svg>
