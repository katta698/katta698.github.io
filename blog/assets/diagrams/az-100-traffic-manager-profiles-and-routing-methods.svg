<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 744" style="width:100%;max-width:860px;" role="img" aria-label="Azure Traffic Manager in four bands: the DNS resolution path it is consulted in once, the six routing methods and what each keys on, the probe settings and failover timing, and the two behaviours that undermine the health story.">
  <title>A DNS answer, given once, cached by machines you do not own</title>
  <rect x="0" y="0" width="860" height="744" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Traffic Manager: it answers a question and leaves</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Not a proxy, not a gateway. It never sees the traffic &#8212; which is why it costs almost nothing and cannot move a live connection.</text>

  <!-- Band 1: resolution path -->
  <rect x="36" y="66" width="788" height="110" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="110" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; CONSULTED ONCE, PER LOOKUP</text>

  <rect x="56" y="98" width="150" height="38" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Client</text>
  <text x="68" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">asks its resolver</text>

  <text x="216" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="234" y="98" width="178" height="38" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="246" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Recursive DNS service</text>
  <text x="246" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">follows the CNAME chain</text>

  <text x="422" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="440" y="98" width="188" height="38" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="452" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B7B9A">trafficmanager.net servers</text>
  <text x="452" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">state + health + routing method</text>

  <text x="638" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="656" y="98" width="152" height="38" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="668" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Client &#8594; endpoint</text>
  <text x="668" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">directly, forever after</text>

  <text x="56" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">Failover is not a redirection, it is an expiry: detection time + DNS TTL + however long existing connections live.</text>
  <text x="56" y="171" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">TTL is configurable from 0 to 2,147,483,647 seconds &#8212; the one dial that genuinely sets failover speed.</text>

  <!-- Band 2: six methods -->
  <rect x="36" y="188" width="788" height="184" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="188" width="4" height="184" fill="#9A7B57"/>
  <text x="52" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">2 &#183; SIX METHODS, AND WHAT EACH ONE ACTUALLY READS</text>

  <text x="56" y="230" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Priority</text>
  <text x="186" y="230" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">integer 1&#8211;1000, lower wins &#183; values cannot be shared</text>

  <text x="56" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Weighted</text>
  <text x="186" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">integer 1&#8211;1000, default 1 &#183; random per query, skewed by DNS caching</text>

  <text x="56" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Performance</text>
  <text x="186" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Internet Latency Table, keyed on the RESOLVER&#8217;s address &#8212; not the user&#8217;s</text>

  <text x="56" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Geographic</text>
  <text x="186" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">World / Grouping / Country / State &#8212; State only in AU, CA, USA</text>

  <text x="56" y="310" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">MultiValue</text>
  <text x="186" y="310" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">all healthy endpoints &#183; External IPv4/IPv6 only &#183; default 2 returned</text>

  <text x="56" y="330" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Subnet</text>
  <text x="186" y="330" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">non-overlapping ranges &#183; an endpoint with no range is the fallback</text>

  <rect x="56" y="342" width="752" height="20" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Three of the six key on the recursive resolver&#8217;s IP. With centralised corporate DNS, everyone gets one answer.</text>

  <!-- Band 3: probes -->
  <rect x="36" y="384" width="788" height="156" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="384" width="4" height="156" fill="#5B7B9A"/>
  <text x="52" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">3 &#183; THE PROBE, AND HOW LONG FAILOVER REALLY TAKES</text>

  <text x="56" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Interval</text>
  <text x="206" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">30 s normal, or 10 s fast &#183; default 30 s</text>

  <text x="56" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Tolerated failures</text>
  <text x="206" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">0 to 9 &#183; default 3 &#183; 0 means one failure is enough</text>

  <text x="56" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Timeout</text>
  <text x="206" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">5&#8211;10 s at a 30 s interval &#183; 5&#8211;9 s at a 10 s interval</text>

  <rect x="56" y="480" width="752" height="46" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Documented timeline: Degraded only after the FOURTH consecutive failure &#8212; 30 &#215; 4 = 120 seconds of probing.</text>
  <text x="68" y="514" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Then the TTL has to expire, then existing connections have to end. Fast probing shortens only the first term.</text>

  <!-- Band 4: the two holes -->
  <rect x="36" y="552" width="788" height="148" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="552" width="4" height="148" fill="#E24B4A"/>
  <text x="52" y="572" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">4 &#183; TWO BEHAVIOURS THAT UNDERMINE THE HEALTH STORY</text>

  <rect x="56" y="584" width="368" height="72" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="603" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#E24B4A">All degraded is answered as all online</text>
  <text x="68" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A firewall blocking probes degrades everything at once</text>
  <text x="68" y="636" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8594; traffic keeps flowing, and failover silently cannot happen</text>
  <text x="68" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Check the profile reads Online, not Degraded.</text>

  <rect x="440" y="584" width="368" height="72" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="452" y="603" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#E24B4A">Geographic routing has no failover</text>
  <text x="452" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A region maps to exactly one endpoint, by design</text>
  <text x="452" y="636" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8594; returned whether it is healthy or not</text>
  <text x="452" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Use Nested endpoints with two or more children.</text>

  <text x="56" y="678" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Also: HTTPS monitoring checks only that a certificate is PRESENT, never that it is valid. An expired cert passes.</text>
  <text x="56" y="693" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Allow the AzureTrafficManager service tag, the same pattern as AzureLoadBalancer for probe reachability.</text>

  <text x="44" y="726" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Limits: 200 profiles per subscription &#215; 200 endpoints per profile. One routing method per profile; combine by nesting.</text>
</svg>
