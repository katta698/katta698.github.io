<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 768" style="width:100%;max-width:860px;" role="img" aria-label="Choosing between the Azure balancing services in four bands: the two axes Microsoft sorts them by, pass-through versus terminating and what the backend sees, the decision tree reduced to its paths, and when to layer two services against what must never be chained.">
  <title>Two questions sort four services; the third question is whether you need two of them</title>
  <rect x="0" y="0" width="860" height="768" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Four balancing services, two questions, one habit worth unlearning</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Assess each service in the workload separately. Microsoft&#8217;s own guidance is that a good setup often uses more than one.</text>

  <!-- Band 1: the two axes -->
  <rect x="36" y="66" width="788" height="166" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="166" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; THE TWO AXES AZURE ACTUALLY SORTS THEM BY</text>

  <text x="300" y="106" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5A6260">HTTP(S) &#8212; Layer 7</text>
  <text x="572" y="106" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5A6260">NON-HTTP(S) &#8212; Layer 4 or DNS</text>

  <text x="56" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5A6260">GLOBAL</text>
  <rect x="290" y="116" width="264" height="48" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="302" y="134" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B7B9A">Azure Front Door</text>
  <text x="302" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">application delivery network, caching, WAF</text>

  <rect x="562" y="116" width="246" height="48" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="574" y="134" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Traffic Manager &#183; Load Balancer (Global)</text>
  <text x="574" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">DNS only &#183; static anycast IP, client IP kept</text>

  <text x="56" y="192" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5A6260">REGIONAL</text>
  <rect x="290" y="172" width="264" height="48" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="302" y="190" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Application Gateway &#183; API Management</text>
  <text x="302" y="206" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">also TCP/TLS &#183; APIs only, optional feature</text>

  <rect x="562" y="172" width="246" height="48" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="574" y="190" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Load Balancer (Regional)</text>
  <text x="574" y="206" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">all TCP and UDP &#183; millions of flows</text>

  <text x="56" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">across regions,</text>
  <text x="56" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">clouds, on-prem</text>
  <text x="56" y="214" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">inside one VNet</text>

  <!-- Band 2: pass-through vs terminating -->
  <rect x="36" y="244" width="788" height="156" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="244" width="4" height="156" fill="#9A7B57"/>
  <text x="52" y="264" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">2 &#183; PASS-THROUGH OR TERMINATING &#8212; WHAT THE BACKEND SEES</text>

  <rect x="56" y="276" width="368" height="90" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Load Balancer &#8212; pass-through</text>
  <text x="68" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Client connects straight to the chosen backend</text>
  <text x="68" y="328" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Original packet IP survives to your code</text>
  <text x="68" y="344" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Direct server return &#183; microsecond latency</text>
  <text x="68" y="360" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">TCP and UDP. No TLS, no paths, no inspection.</text>

  <rect x="440" y="276" width="368" height="90" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="452" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Application Gateway &#8212; terminating</text>
  <text x="452" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Two connections: client&#8594;gateway, gateway&#8594;backend</text>
  <text x="452" y="328" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Certificates and TLS live in one place</text>
  <text x="452" y="344" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">One frontend IP serves L7 and L4 &#183; 125 instances</text>
  <text x="452" y="360" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">WAF v2 does NOT inspect TLS or TCP listeners.</text>

  <text x="56" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Traffic Manager is neither: it answers DNS and never sees a packet. Front Door terminates, at an edge you do not choose.</text>

  <!-- Band 3: the decision tree -->
  <rect x="36" y="412" width="788" height="176" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="412" width="4" height="176" fill="#5B7B9A"/>
  <text x="52" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">3 &#183; THE DECISION TREE, REDUCED TO ITS PATHS</text>

  <text x="56" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Not a web app</text>
  <text x="266" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Load Balancer &#8212; or Application Gateway if you want TLS terminated for it</text>

  <text x="56" y="474" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Web, internal only</text>
  <text x="266" y="474" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Load Balancer</text>

  <text x="56" y="494" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Web, public, one region</text>
  <text x="266" y="494" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Application Gateway</text>

  <text x="56" y="514" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Web, public, global</text>
  <text x="266" y="514" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Azure Front Door &#8212; alone when acceleration is the point</text>

  <text x="56" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8230; plus per-request L7 work</text>
  <text x="266" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Front Door AND Application Gateway &#183; APIs only: AND API Management</text>

  <text x="56" y="554" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8230; IaaS VMs or AKS</text>
  <text x="266" y="554" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Front Door AND Load Balancer, or the AGIC ingress controller</text>

  <rect x="56" y="564" width="752" height="18" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="577" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Fronting multi-region backends with a regional service adds a regional single point of failure, and a round trip through it.</text>

  <!-- Band 4: layering -->
  <rect x="36" y="600" width="788" height="134" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="600" width="4" height="134" fill="#E24B4A"/>
  <text x="52" y="620" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">4 &#183; WHEN TO STACK TWO, AND WHAT NEVER CHAINS</text>

  <rect x="56" y="632" width="368" height="82" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Application Gateway behind Front Door, when:</text>
  <text x="68" y="666" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">path-based routing is needed inside the VNet too</text>
  <text x="68" y="681" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">connection draining is needed &#8212; Front Door has none</text>
  <text x="68" y="696" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">TLS should end before the VNet</text>
  <text x="68" y="711" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">affinity is needed per server, not just per region</text>

  <rect x="440" y="632" width="368" height="82" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="452" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#E24B4A">Never chained</text>
  <text x="452" y="666" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Front Door behind Front Door &#8212; same edge POP</text>
  <text x="452" y="681" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Front Door with Azure CDN &#8212; same edge network</text>
  <text x="452" y="696" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Two CDNs &#8212; the second one sees the first as the client</text>
  <text x="452" y="711" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">An origin that load balances = one Front Door origin</text>

  <text x="44" y="752" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">And the one worth knowing: a lookup for a Front Door origin lands on Front Door&#8217;s own Traffic Manager endpoint. The DNS tier is</text>
  <text x="44" y="764" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">always there &#8212; the only question is whether it is yours to configure, and therefore yours to get wrong.</text>
</svg>
