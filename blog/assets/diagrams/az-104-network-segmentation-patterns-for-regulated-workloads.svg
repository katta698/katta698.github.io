<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 796" style="width:100%;max-width:860px;" role="img" aria-label="Network segmentation for regulated workloads in four bands: the three enforcement layers and who holds the pen at each, the evaluation order and which actions terminate it, the network security perimeter for PaaS resources outside the virtual network, and the honest list of what cannot be segmented.">
  <title>Segmentation is a question of who holds the pen, and three layers answer it differently</title>
  <rect x="0" y="0" width="860" height="796" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Three layers, three owners, and a list of things none of them reach</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">For a regulated workload the question is not &#8220;is it segmented&#8221; but &#8220;who can undo it, and can you prove they did not&#8221;.</text>

  <!-- Band 1: three layers -->
  <rect x="36" y="66" width="788" height="178" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="178" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; WHO HOLDS THE PEN AT EACH LAYER</text>

  <rect x="56" y="98" width="244" height="86" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="68" y="117" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5B7B9A">Security admin rules</text>
  <text x="68" y="134" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Central governance team</text>
  <text x="68" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Applied at the VIRTUAL NETWORK</text>
  <text x="68" y="166" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Priority 1&#8211;4,096 &#183; no team can edit</text>
  <text x="68" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Allow &#183; Always Allow &#183; Deny</text>

  <rect x="310" y="98" width="244" height="86" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="322" y="117" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Network security groups</text>
  <text x="322" y="134" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Individual application teams</text>
  <text x="322" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Applied at SUBNET and NIC</text>
  <text x="322" y="166" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Priority 100&#8211;4096 &#183; stateful</text>
  <text x="322" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Allow &#183; Deny only</text>

  <rect x="564" y="98" width="244" height="86" fill="#F2EFEA" stroke="#9A7B57"/>
  <text x="576" y="117" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#9A7B57">Network security perimeter</text>
  <text x="576" y="134" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Platform / security team</text>
  <text x="576" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">PaaS OUTSIDE the virtual network</text>
  <text x="576" y="166" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Deny-by-default in enforced mode</text>
  <text x="576" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Inbound IP / sub / tag &#183; outbound FQDN</text>

  <text x="56" y="206" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">An NSG is the only layer whose owner can also remove it. That is the whole argument for the other two.</text>
  <text x="56" y="224" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">NSG defaults you inherit: AllowVNetInBound 65000, AllowAzureLoadBalancerInBound 65001, DenyAllInbound 65500.</text>
  <text x="56" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">So every virtual network is flat by default &#8212; VNet-to-VNet is permitted until somebody writes a rule.</text>

  <!-- Band 2: evaluation order -->
  <rect x="36" y="256" width="788" height="152" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="256" width="4" height="152" fill="#E24B4A"/>
  <text x="52" y="276" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">2 &#183; THE ORDER, AND WHICH ACTIONS END IT</text>

  <rect x="56" y="288" width="168" height="40" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="68" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B7B9A">Security admin rule</text>
  <text x="68" y="321" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">evaluated FIRST</text>

  <text x="232" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="250" y="288" width="168" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="262" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">NSG rules</text>
  <text x="262" y="321" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">only if the action was Allow</text>

  <text x="426" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="444" y="288" width="168" height="40" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="456" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Resource</text>
  <text x="456" y="321" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">five-tuple, stateful flow record</text>

  <text x="56" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Allow &#8212; continues to the NSG, so a team can still refuse it. The only action that delegates.</text>
  <text x="56" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Always Allow &#8212; terminates evaluation. Goes straight to the resource, bypassing every NSG.</text>
  <text x="56" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Deny &#8212; terminates evaluation. Nothing downstream can re-admit the traffic.</text>
  <text x="56" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Exceptions are priority, not scope: deny SSH everywhere at 100, allow it for one network group at 10.</text>

  <!-- Band 3: the perimeter -->
  <rect x="36" y="420" width="788" height="158" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="420" width="4" height="158" fill="#9A7B57"/>
  <text x="52" y="440" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">3 &#183; THE LAYER FOR EVERYTHING THAT HAS NO SUBNET</text>

  <text x="56" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Transition mode</text>
  <text x="206" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">The DEFAULT. Learns access patterns. Enforces nothing.</text>

  <text x="56" y="480" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Enforced mode</text>
  <text x="206" y="480" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Denies all public traffic; intra-perimeter and private endpoints still flow</text>

  <text x="56" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Scale</text>
  <text x="206" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">100 perimeters &#183; 200 profiles each &#183; 200 inbound + 200 outbound rule elements</text>

  <text x="56" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Evidence</text>
  <text x="206" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Access logs for audit &#8212; workspace must sit in the same perimeter</text>

  <rect x="56" y="528" width="752" height="40" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="546" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">A perimeter left in the default mode is a reporting tool, not a control. Nothing tells you it is not enforcing.</text>
  <text x="68" y="561" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Also: SAS tokens are rejected on intra-perimeter and subscription-based inbound rules. Plan the auth method first.</text>

  <!-- Band 4: what cannot be segmented -->
  <rect x="36" y="590" width="788" height="152" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="590" width="4" height="152" fill="#E24B4A"/>
  <text x="52" y="610" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">4 &#183; WHAT NONE OF THE THREE LAYERS REACHES</text>

  <text x="56" y="632" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Exempt VNets</text>
  <text x="216" y="632" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">SQL Managed Instance &#183; Databricks &#8212; security admin rules skip the whole VNet</text>

  <text x="56" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Exempt subnets</text>
  <text x="216" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">App Gateway &#183; Bastion &#183; Firewall &#183; Route Server &#183; VPN &#183; vWAN &#183; ExpressRoute</text>

  <text x="56" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Private endpoints</text>
  <text x="216" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Security admin rules do not currently apply to them</text>

  <text x="56" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Platform traffic</text>
  <text x="216" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">168.63.129.16 and 169.254.169.254 bypass NSGs unless you use the platform tags</text>

  <text x="56" y="704" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">&#8230; and those tags</text>
  <text x="216" y="704" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">AzurePlatformDNS / IMDS / LKM are NOT supported by security admin rules</text>

  <text x="56" y="728" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Every one of these is a sentence in a design document, not a gap to hide. An auditor will ask about exactly these.</text>

  <text x="44" y="764" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">One more: rules reach new resources on an eventual consistency model, so a VM is briefly unprotected after it appears.</text>
  <text x="44" y="780" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">And one security admin configuration per region &#8212; stack rule collections inside it, not configurations beside it.</text>
</svg>
