<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 776" style="width:100%;max-width:860px;" role="img" aria-label="Azure Bastion in four bands: the four SKUs and what each buys, the capacity arithmetic per instance, the three connection methods and what each costs you in audit coverage, and the decisions that cannot be changed after deployment.">
  <title>Four SKUs, and the two choices you cannot take back after deployment</title>
  <rect x="0" y="0" width="860" height="776" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Bastion: pick the SKU for the audit trail, not the session count</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Billing starts the moment it is deployed, whether anyone connects or not. Downgrading means delete and recreate.</text>

  <!-- Band 1: the SKUs -->
  <rect x="36" y="66" width="788" height="188" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="188" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; FOUR SKUS, AND THE LINE EACH ONE CROSSES</text>

  <text x="56" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5A6260">Developer</text>
  <text x="196" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Free, shared infrastructure, no subnet, no public IP. ONE VM at a time.</text>
  <text x="196" y="123" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">No peering, no concurrency. Documented as unsuitable for production.</text>

  <text x="56" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5A6260">Basic</text>
  <text x="196" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Dedicated host, 2 fixed instances, peering. Portal connections only.</text>
  <text x="196" y="161" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">No native client, no shareable links, no custom port, no file transfer.</text>

  <text x="56" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5A6260">Standard</text>
  <text x="196" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Host scaling 2&#8211;50. Native client, shareable links, IP-Connect, custom ports.</text>
  <text x="196" y="199" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Also: RDP to Linux, SSH to Windows, and disabling clipboard in the browser.</text>

  <text x="56" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#9A7B57">Premium</text>
  <text x="196" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9A7B57">Everything in Standard, plus SESSION RECORDING and private-only deployment.</text>
  <text x="196" y="237" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Microsoft&#8217;s own note: the gap to Standard is marginal; Premium is the recommendation.</text>

  <!-- Band 2: capacity arithmetic -->
  <rect x="36" y="266" width="788" height="150" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="266" width="4" height="150" fill="#5B7B9A"/>
  <text x="52" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">2 &#183; CAPACITY IS ONE NUMBER TIMES THE INSTANCE COUNT</text>

  <text x="56" y="308" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Per instance</text>
  <text x="226" y="308" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">20 RDP + 40 SSH &#8212; identical on Basic, Standard and Premium</text>

  <text x="56" y="328" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Basic (2 fixed)</text>
  <text x="226" y="328" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">2 &#215; 20 = 40 RDP &#183; 2 &#215; 40 = 80 SSH</text>

  <text x="56" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Standard / Premium</text>
  <text x="226" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">50 &#215; 20 = 1,000 RDP &#183; 50 &#215; 40 = 2,000 SSH at full scale</text>

  <text x="56" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Developer</text>
  <text x="226" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">1 session. Not a small number &#8212; a different product.</text>

  <rect x="56" y="380" width="752" height="26" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="397" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">A /27 subnet still works if it predates 2 November 2021 &#8212; but it caps your scale units. /26 is the floor for scaling.</text>

  <!-- Band 3: connection methods -->
  <rect x="36" y="428" width="788" height="186" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="428" width="4" height="186" fill="#9A7B57"/>
  <text x="52" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">3 &#183; THREE WAYS IN &#8212; AND WHAT EACH COSTS IN AUDIT COVERAGE</text>

  <rect x="56" y="460" width="244" height="92" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="479" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D2322">Portal, HTML5</text>
  <text x="68" y="496" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">All four SKUs</text>
  <text x="68" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Entra sign-in to the portal first</text>
  <text x="68" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Recording works &#183; commands logged</text>
  <text x="68" y="544" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Clipboard can be disabled (Standard+)</text>

  <rect x="310" y="460" width="244" height="92" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="322" y="479" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#E24B4A">Native client (az CLI)</text>
  <text x="322" y="496" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Standard and Premium</text>
  <text x="322" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">File upload and download</text>
  <text x="322" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">NO session recording</text>
  <text x="322" y="544" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">NO command logging &#183; no Vision</text>

  <rect x="564" y="460" width="244" height="92" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="576" y="479" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#E24B4A">Shareable link</text>
  <text x="576" y="496" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Standard and Premium</text>
  <text x="576" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">No Azure identity at all</text>
  <text x="576" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Set an expiry &#183; 500 per Bastion</text>
  <text x="576" y="544" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Read is the default IAM access</text>

  <text x="56" y="574" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">The native client is the gap that matters: you buy Premium for the audit trail, then connect in a way it cannot see.</text>
  <text x="56" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A shareable link carries no credentials &#8212; the admin sends those separately, by whatever channel they choose.</text>
  <text x="56" y="608" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A link whose VM was deleted stays in the list and simply fails. Keep it, or delete it; it is your audit record either way.</text>

  <!-- Band 4: irreversible -->
  <rect x="36" y="626" width="788" height="118" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="626" width="4" height="118" fill="#E24B4A"/>
  <text x="52" y="646" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">4 &#183; DECIDE THESE BEFORE YOU DEPLOY</text>

  <text x="56" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Availability zones</text>
  <text x="226" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Set at deployment and cannot be changed afterwards. Preview, twelve regions.</text>

  <text x="56" y="688" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">IPv6 dual stack</text>
  <text x="226" y="688" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Configured at creation. An IPv4-only Bastion cannot be converted.</text>

  <text x="56" y="708" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">SKU direction</text>
  <text x="226" y="708" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Upgrades take about 10 minutes. Downgrade = delete and recreate.</text>

  <text x="56" y="728" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Subnet size</text>
  <text x="226" y="728" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">/26 minimum, named AzureBastionSubnet, nothing else in it.</text>

  <text x="44" y="764" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">IPv6 reaches Bastion only &#8212; the hop from Bastion to the VM is IPv4 regardless, and private-only rules IPv6 out entirely.</text>
</svg>
