<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 780" style="width:100%;max-width:860px;" role="img" aria-label="Just-in-time VM access in four bands: the request lifecycle and what it rewrites, the defaults that make it weaker than it sounds, the identity half in Privileged Identity Management, and the cases where it does not apply at all.">
  <title>Just-in-time opens a port, not a permission &#8212; and the two doors have different keys</title>
  <rect x="0" y="0" width="860" height="780" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2322">Just-in-time closes a port. It does not reduce a standing permission.</text>
  <text x="44" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Network JIT lives in Defender for Servers Plan 2. Identity JIT lives in PIM. Doing one and calling it least privilege is the mistake.</text>

  <!-- Band 1: lifecycle -->
  <rect x="36" y="66" width="788" height="166" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="66" width="4" height="166" fill="#5B7B9A"/>
  <text x="52" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5B7B9A">1 &#183; THE LIFECYCLE, AND WHAT IT REWRITES</text>

  <rect x="56" y="98" width="166" height="44" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Enable on the VM</text>
  <text x="68" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">deny-all rules written</text>

  <text x="230" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="248" y="98" width="166" height="44" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="260" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">User requests access</text>
  <text x="260" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">RBAC checked on the VM</text>

  <text x="422" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="440" y="98" width="166" height="44" fill="#F2EFEA" stroke="#5B7B9A"/>
  <text x="452" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B7B9A">Allow rule added</text>
  <text x="452" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">that port, that source, that long</text>

  <text x="614" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6260">&#8594;</text>

  <rect x="632" y="98" width="176" height="44" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="644" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Window expires</text>
  <text x="644" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">NSGs restored to prior state</text>

  <text x="56" y="164" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#E24B4A">Established connections are NOT interrupted when the window closes. Expiry ends new access, not the session in progress.</text>
  <text x="56" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Pre-existing rules on the same port keep priority over JIT&#8217;s deny-all. JIT only wins where nothing was configured.</text>
  <text x="56" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Behind Azure Firewall you also get the DNAT port mapping back &#8212; the port you connect to is not the port on the VM.</text>
  <text x="56" y="218" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Recommended ports: 22 SSH &#183; 3389 RDP &#183; 5985 and 5986 WinRM.</text>

  <!-- Band 2: the defaults -->
  <rect x="36" y="244" width="788" height="134" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="244" width="4" height="134" fill="#E24B4A"/>
  <text x="52" y="264" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">2 &#183; THE ONE-CLICK DEFAULTS ARE WEAKER THAN THE FEATURE</text>

  <text x="56" y="286" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Windows</text>
  <text x="206" y="286" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">RDP 3389 &#183; max access 3 hours &#183; allowed source IPs: Any</text>

  <text x="56" y="306" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Linux</text>
  <text x="206" y="306" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">SSH 22 &#183; max access 3 hours &#183; allowed source IPs: Any</text>

  <rect x="56" y="318" width="752" height="48" fill="#F2EFEA" stroke="#E24B4A"/>
  <text x="68" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">&#8220;Any&#8221; means the port opens to the internet for three hours. That is still far better than always-open &#8212; and it is not</text>
  <text x="68" y="351" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">what anyone describes to an auditor. Set the source to the requester&#8217;s address, and the window to the task.</text>

  <!-- Band 3: the identity half -->
  <rect x="36" y="390" width="788" height="192" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="390" width="4" height="192" fill="#9A7B57"/>
  <text x="52" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9A7B57">3 &#183; THE OTHER DOOR: PIM FOR AZURE RESOURCE ROLES</text>

  <text x="56" y="432" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Activation window</text>
  <text x="226" y="432" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">1 to 24 hours, set per role per resource</text>

  <text x="56" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Assignment types</text>
  <text x="226" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Eligible (activate to use) or Active (already held)</text>

  <text x="56" y="472" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Gates on activation</text>
  <text x="226" y="472" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">MFA &#183; Conditional Access context &#183; justification &#183; ticket &#183; approval</text>

  <text x="56" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Approvers</text>
  <text x="226" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">None by default; at least one required; two recommended</text>

  <text x="56" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Not inherited</text>
  <text x="226" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Subscription-level settings do NOT flow down to resource groups</text>

  <rect x="56" y="524" width="752" height="48" fill="#F2EFEA" stroke="#C9C4BC"/>
  <text x="68" y="542" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Two honest limits. A ticket number is an information-only field &#8212; nothing validates it against any system.</text>
  <text x="68" y="557" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">And once a role is activated, the user may switch device, browser or location and keep using it for the window.</text>

  <!-- Band 4: where it does not apply -->
  <rect x="36" y="600" width="788" height="134" fill="#FFFFFF" stroke="#D8D4CE"/>
  <rect x="36" y="600" width="4" height="134" fill="#E24B4A"/>
  <text x="52" y="620" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#E24B4A">4 &#183; WHERE JIT SIMPLY DOES NOT APPLY</text>

  <text x="56" y="642" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Firewall Manager</text>
  <text x="226" y="642" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E24B4A">Unsupported. And the firewall must use Rules (Classic), not policies.</text>

  <text x="56" y="662" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Classic VMs</text>
  <text x="226" y="662" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Resource Manager deployments only</text>

  <text x="56" y="682" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">No NSG, no firewall</text>
  <text x="226" y="682" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Listed as Unsupported &#8212; JIT needs something to write a rule into</text>

  <text x="56" y="702" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Plan 1 subscriptions</text>
  <text x="226" y="702" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Plan 2 only &#183; and Plan 2 cannot be enabled per resource, only disabled</text>

  <text x="56" y="722" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Naming</text>
  <text x="226" y="722" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Policy name plus VM name must stay under 56 characters</text>

  <text x="44" y="758" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Audit evidence is the VM&#8217;s Activity Log, downloadable as CSV, plus a seven-day count of approved requests on the dashboard.</text>
</svg>
