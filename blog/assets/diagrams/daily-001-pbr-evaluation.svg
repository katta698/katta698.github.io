<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Transit Gateway policy table evaluation order diagram">
  <title>How a transit gateway evaluates a packet on an attachment associated with a policy table: system-managed entries are checked first, then customer entries in ascending rule number order, and any packet matching nothing is dropped by implicit deny.</title>
  <rect width="1000" height="780" fill="#F8F7F5"/>
  <defs>
    <marker id="pbr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>
  <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#pbr-arrow)" fill="none">
    <line x1="500" y1="106" x2="500" y2="148"/>
    <line x1="500" y1="216" x2="500" y2="258"/>
    <line x1="500" y1="320" x2="500" y2="362"/>
    <line x1="500" y1="424" x2="500" y2="466"/>
    <line x1="500" y1="534" x2="500" y2="576"/>
    <line x1="500" y1="628" x2="500" y2="670"/>
    <path d="M 300 181 L 160 181 L 160 256"/>
    <path d="M 700 499 L 718 499"/>
    <path d="M 160 320 L 160 697 L 296 697"/>
  </g>
  <g fill="#0f1111" font-size="14" font-family="'Segoe UI',Arial,sans-serif">
    <rect x="300" y="52" width="400" height="54" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="84" text-anchor="middle">Packet arrives on a transit gateway attachment</text>

    <rect x="300" y="148" width="400" height="68" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="176" text-anchor="middle">Is the attachment associated</text>
    <text x="500" y="196" text-anchor="middle">with a policy table?</text>

    <rect x="40" y="256" width="240" height="64" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="160" y="282" text-anchor="middle" font-size="13">Standard destination-based</text>
    <text x="160" y="300" text-anchor="middle" font-size="13">lookup on the route table</text>

    <rect x="300" y="258" width="400" height="62" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="283" text-anchor="middle" font-size="13">System-managed entries (rule number *)</text>
    <text x="500" y="303" text-anchor="middle" font-size="13">are evaluated first and are read-only</text>

    <rect x="300" y="362" width="400" height="62" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="387" text-anchor="middle" font-size="13">Customer entries, ascending rule number</text>
    <text x="500" y="407" text-anchor="middle" font-size="13">Match on source, destination, protocol, ports</text>

    <rect x="300" y="466" width="400" height="68" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="494" text-anchor="middle">Did any entry match?</text>
    <text x="500" y="514" text-anchor="middle" font-size="13">First match wins, evaluation stops</text>

    <rect x="718" y="466" width="252" height="68" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="844" y="494" text-anchor="middle" font-size="13" fill="#cc0c39" font-weight="700">Implicit deny</text>
    <text x="844" y="514" text-anchor="middle" font-size="13" fill="#cc0c39">the packet is dropped</text>

    <rect x="300" y="576" width="400" height="52" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="607" text-anchor="middle">Target route table selected</text>

    <rect x="296" y="670" width="408" height="54" rx="4" fill="#f6f9f4" stroke="#1d8102"/>
    <text x="500" y="694" text-anchor="middle" font-size="13">Destination-based lookup in that route table</text>
    <text x="500" y="712" text-anchor="middle" font-size="13">Forward to the target attachment</text>
  </g>
  <g font-size="12" fill="#6c757d" font-family="'Segoe UI',Arial,sans-serif">
    <text x="188" y="174">No</text>
    <text x="512" y="240">Yes</text>
    <text x="512" y="558">Yes</text>
    <text x="706" y="490">No</text>
  </g>
</svg>
