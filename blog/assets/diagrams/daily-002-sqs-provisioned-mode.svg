<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Standard mode versus provisioned mode scaling for Lambda SQS event source mappings">
  <title>Comparison of Lambda SQS event source mapping scaling. Standard mode starts at five concurrent invocations, adds up to 300 per minute and stops at 1,250. Provisioned mode holds a minimum of 2 to 200 event pollers, adds up to 1,000 concurrency per minute, and now reaches 10,000 pollers or 100,000 concurrent invocations. One event poller provides 1 MB per second of throughput, 10 concurrent invocations, or 10 SQS polling calls per second.</title>
  <rect width="1000" height="640" fill="#F8F7F5"/>

  <text x="500" y="32" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0f1111">Two ways an SQS event source mapping scales</text>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="52" width="440" height="404" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="40" y="52" width="440" height="44" rx="4" fill="#f2f2f0" stroke="#e5e5e5"/>
    <text x="260" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">Standard mode (default)</text>

    <text x="64" y="134" font-size="13" fill="#3d3d3d">Starts at 5 concurrent invocations</text>
    <text x="64" y="178" font-size="13" fill="#3d3d3d">Adds up to 300 concurrent invokes / minute</text>
    <text x="64" y="222" font-size="13" fill="#0f1111" font-weight="700">Ceiling: 1,250 concurrent invokes</text>
    <text x="64" y="266" font-size="13" fill="#3d3d3d">Scales back to 5, as low as 2 when idle</text>
    <text x="64" y="310" font-size="13" fill="#1d8102">No provisioning charge</text>
    <text x="64" y="354" font-size="13" fill="#3d3d3d">Works with Maximum concurrency</text>
    <text x="64" y="398" font-size="13" fill="#3d3d3d">Lambda manages everything</text>
    <text x="64" y="430" font-size="12" fill="#6c757d">Best when latency is not contractual</text>

    <rect x="520" y="52" width="440" height="404" rx="4" fill="#ffffff" stroke="#C4A484" stroke-width="1.6"/>
    <rect x="520" y="52" width="440" height="44" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="740" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">Provisioned mode</text>

    <text x="544" y="134" font-size="13" fill="#3d3d3d">Holds MinimumPollers: 2 to 200 (default 2)</text>
    <text x="544" y="178" font-size="13" fill="#3d3d3d">Adds up to 1,000 concurrency / minute</text>
    <text x="544" y="222" font-size="13" fill="#0f1111" font-weight="700">Ceiling: 100,000 concurrent invokes</text>
    <text x="544" y="244" font-size="12" fill="#6c757d">MaximumPollers raised 2,000 to 10,000 on 3 Aug 2026</text>
    <text x="544" y="288" font-size="13" fill="#cc0c39">Billed per EPU-hour, minimum always held</text>
    <text x="544" y="332" font-size="13" fill="#cc0c39" font-weight="700">Cannot combine with Maximum concurrency</text>
    <text x="544" y="376" font-size="13" fill="#3d3d3d">You own the floor and the ceiling</text>
    <text x="544" y="430" font-size="12" fill="#6c757d">Best when cold-start latency has an SLA</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="486" width="920" height="118" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">One event poller provides, whichever limit it reaches first</text>

    <rect x="72" y="530" width="270" height="54" rx="4" fill="#f6f9f4" stroke="#1d8102"/>
    <text x="207" y="553" text-anchor="middle" font-size="13" fill="#0f1111">up to 1 MB/second</text>
    <text x="207" y="571" text-anchor="middle" font-size="12" fill="#6c757d">of throughput</text>

    <rect x="365" y="530" width="270" height="54" rx="4" fill="#f6f9f4" stroke="#1d8102"/>
    <text x="500" y="553" text-anchor="middle" font-size="13" fill="#0f1111">up to 10 concurrent</text>
    <text x="500" y="571" text-anchor="middle" font-size="12" fill="#6c757d">invocations</text>

    <rect x="658" y="530" width="270" height="54" rx="4" fill="#f6f9f4" stroke="#1d8102"/>
    <text x="793" y="553" text-anchor="middle" font-size="13" fill="#0f1111">up to 10 SQS polling</text>
    <text x="793" y="571" text-anchor="middle" font-size="12" fill="#6c757d">API calls per second</text>
  </g>
</svg>
