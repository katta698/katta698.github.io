<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="RFC 9151 listener policy versus fixed backend connection policy, and the strictness ladder of RFC 9151 policies">
  <title>An RFC 9151 policy applies to the listener, where you choose one of seven policies. Backend connections to targets always use the INTEROP4 policy regardless of that choice, and targets that only support TLS 1.0 or 1.1 will fail. The lower ladder shows the seven policies ordered from broadest interoperability to strictest compliance.</title>
  <rect width="1000" height="600" fill="#F8F7F5"/>

  <defs>
    <marker id="r9-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">One policy choice, two different connections</text>

    <rect x="40" y="72" width="180" height="76" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="130" y="104" text-anchor="middle" font-size="13" fill="#0f1111">Clients</text>
    <text x="130" y="126" text-anchor="middle" font-size="12" fill="#6c757d">browsers, partners, devices</text>

    <rect x="300" y="60" width="400" height="176" rx="4" fill="#ffffff" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Application or Network Load Balancer</text>

    <rect x="320" y="98" width="360" height="52" rx="4" fill="#f6f9f4" stroke="#1d8102"/>
    <text x="500" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Listener policy</text>
    <text x="500" y="138" text-anchor="middle" font-size="12" fill="#6c757d">you choose one of seven</text>

    <rect x="320" y="162" width="360" height="58" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">Backend connection policy</text>
    <text x="500" y="202" text-anchor="middle" font-size="12" fill="#cc0c39">always INTEROP4-FIPS, not your choice</text>

    <rect x="780" y="72" width="180" height="76" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="870" y="104" text-anchor="middle" font-size="13" fill="#0f1111">Targets</text>
    <text x="870" y="126" text-anchor="middle" font-size="12" fill="#6c757d">EC2, ECS, EKS, Lambda</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#r9-arrow)" fill="none">
      <line x1="220" y1="110" x2="296" y2="110"/>
      <line x1="700" y1="190" x2="776" y2="140"/>
    </g>

    <text x="870" y="176" text-anchor="middle" font-size="12" fill="#cc0c39" font-weight="700">TLS 1.0 / 1.1 targets fail</text>
    <text x="500" y="262" text-anchor="middle" font-size="12" fill="#6c757d">AWS does not guarantee RFC 9151 compliance on egress, including to targets and external services</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">The seven policies, broadest to strictest</text>
    <text x="500" y="334" text-anchor="middle" font-size="12" fill="#6c757d">Start at the left. Move right as clients prove they can negotiate strict RFC 9151.</text>

    <rect x="50" y="356" width="140" height="88" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="120" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">INTEROP4</text>
    <text x="120" y="400" text-anchor="middle" font-size="11" fill="#6c757d">AWS recommends</text>
    <text x="120" y="416" text-anchor="middle" font-size="11" fill="#6c757d">starting here</text>
    <text x="120" y="434" text-anchor="middle" font-size="11" fill="#1d8102">broadest</text>

    <rect x="202" y="356" width="140" height="88" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="272" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">INTEROP3</text>
    <text x="272" y="402" text-anchor="middle" font-size="11" fill="#6c757d">adds SHA-1</text>
    <text x="272" y="418" text-anchor="middle" font-size="11" fill="#6c757d">ECDHE ciphers</text>

    <rect x="354" y="356" width="140" height="88" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="424" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">INTEROP2</text>
    <text x="424" y="402" text-anchor="middle" font-size="11" fill="#6c757d">10 ciphers</text>
    <text x="424" y="418" text-anchor="middle" font-size="11" fill="#6c757d">adds CBC</text>

    <rect x="506" y="356" width="140" height="88" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="576" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">INTEROP1</text>
    <text x="576" y="402" text-anchor="middle" font-size="11" fill="#6c757d">6 ciphers</text>
    <text x="576" y="418" text-anchor="middle" font-size="11" fill="#6c757d">GCM only</text>

    <rect x="658" y="356" width="140" height="88" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="728" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">1-2 strict</text>
    <text x="728" y="402" text-anchor="middle" font-size="11" fill="#6c757d">3 ciphers</text>
    <text x="728" y="418" text-anchor="middle" font-size="11" fill="#6c757d">TLS 1.2 and 1.3</text>

    <rect x="810" y="356" width="140" height="88" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="880" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">1-3 strict</text>
    <text x="880" y="402" text-anchor="middle" font-size="11" fill="#6c757d">1 cipher</text>
    <text x="880" y="418" text-anchor="middle" font-size="11" fill="#6c757d">TLS 1.3 only</text>

    <g stroke="#C4A484" stroke-width="1.6" marker-end="url(#r9-arrow)" fill="none">
      <line x1="190" y1="400" x2="198" y2="400"/>
      <line x1="342" y1="400" x2="350" y2="400"/>
      <line x1="494" y1="400" x2="502" y2="400"/>
      <line x1="646" y1="400" x2="654" y2="400"/>
      <line x1="798" y1="400" x2="806" y2="400"/>
    </g>

    <rect x="50" y="470" width="900" height="86" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="496" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">A seventh policy sits outside the ladder</text>
    <text x="500" y="518" text-anchor="middle" font-size="12" fill="#3d3d3d">Ext0 adds AES256-GCM-SHA384, a non-ECDHE cipher with no forward secrecy</text>
    <text x="500" y="538" text-anchor="middle" font-size="12" fill="#6c757d">Use it only for a legacy client that cannot do ephemeral key exchange</text>
  </g>
</svg>
