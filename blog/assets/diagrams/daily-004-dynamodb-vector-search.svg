<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="How a DynamoDB vector index is built and queried, with the two behaviours that most often cause bugs">
  <title>A DynamoDB table stores embeddings alongside ordinary attributes. A vector index fixes the dimension count and distance function at creation time. The SearchVectors API returns up to 100 results ranked by similarity. Two behaviours cause most bugs: filter conditions accept exact-match values only, and for Cosine and Euclidean a lower score means more similar.</title>
  <rect width="1000" height="620" fill="#F8F7F5"/>

  <defs>
    <marker id="ddb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Vectors live in the table, not in a separate store</text>

    <rect x="40" y="58" width="270" height="150" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="175" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">DynamoDB table</text>
    <text x="64" y="110" font-size="12" fill="#3d3d3d">productId       (partition key)</text>
    <text x="64" y="132" font-size="12" fill="#3d3d3d">title, price, category</text>
    <text x="64" y="154" font-size="12" fill="#3d3d3d">inStock</text>
    <text x="64" y="180" font-size="12" fill="#1d8102">descriptionEmbedding</text>
    <text x="64" y="197" font-size="11" fill="#6c757d">an ordinary attribute</text>

    <rect x="365" y="58" width="270" height="150" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Vector index</text>
    <text x="389" y="110" font-size="12" fill="#3d3d3d">dimensions: up to 4096</text>
    <text x="389" y="132" font-size="12" fill="#3d3d3d">distance: Cosine, Euclidean</text>
    <text x="389" y="149" font-size="12" fill="#3d3d3d">or Dot product</text>
    <text x="389" y="173" font-size="12" fill="#3d3d3d">filterable attributes</text>
    <text x="389" y="197" font-size="11" fill="#cc0c39">all fixed at creation time</text>

    <rect x="690" y="58" width="270" height="150" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="825" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">SearchVectors</text>
    <text x="714" y="110" font-size="12" fill="#3d3d3d">query vector</text>
    <text x="714" y="132" font-size="12" fill="#3d3d3d">number of results, max 100</text>
    <text x="714" y="154" font-size="12" fill="#3d3d3d">optional filter conditions</text>
    <text x="714" y="180" font-size="12" fill="#3d3d3d">returns ranked matches</text>
    <text x="714" y="197" font-size="11" fill="#6c757d">single-digit ms, 99%+ recall</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#ddb-arrow)" fill="none">
      <line x1="310" y1="133" x2="361" y2="133"/>
      <line x1="635" y1="133" x2="686" y2="133"/>
    </g>
    <text x="335" y="124" text-anchor="middle" font-size="11" fill="#6c757d">index</text>
    <text x="660" y="124" text-anchor="middle" font-size="11" fill="#6c757d">query</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">The two behaviours that cause most of the bugs</text>

    <rect x="40" y="278" width="440" height="150" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="260" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Lower score means more similar</text>
    <text x="64" y="332" font-size="12" fill="#3d3d3d">For Cosine and Euclidean, 0 means identical.</text>
    <text x="64" y="354" font-size="12" fill="#3d3d3d">These are distances, not similarities.</text>
    <text x="64" y="384" font-size="12" fill="#cc0c39">if (score &gt; 0.8) keep      wrong direction</text>
    <text x="64" y="406" font-size="12" fill="#1d8102">if (score &lt; 0.2) keep      correct</text>

    <rect x="520" y="278" width="440" height="150" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="740" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Filters are exact-match only</text>
    <text x="544" y="332" font-size="12" fill="#3d3d3d">No BETWEEN. No BEGINS_WITH. No ranges.</text>
    <text x="544" y="354" font-size="12" fill="#3d3d3d">Equality on a filterable attribute, or nothing.</text>
    <text x="544" y="384" font-size="12" fill="#cc0c39">price BETWEEN 10 AND 50      unsupported</text>
    <text x="544" y="406" font-size="12" fill="#1d8102">category = "outdoor"         supported</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="454" width="920" height="132" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Consequences worth designing around</text>
    <text x="64" y="508" font-size="12" fill="#3d3d3d">Bucket continuous values you need to filter on. Store a priceBand of "10-50" so equality can do the work a range would.</text>
    <text x="64" y="532" font-size="12" fill="#3d3d3d">Match the distance function to the one your embedding model was trained with, or recall degrades quietly.</text>
    <text x="64" y="556" font-size="12" fill="#3d3d3d">Choose filterable attributes up front. They are part of the index definition, not part of the query.</text>
    <text x="64" y="578" font-size="12" fill="#6c757d">A partition key on the index is optional, but recommended once the dataset is large.</text>
  </g>
</svg>
