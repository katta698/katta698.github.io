<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="How ECS fractional GPU scheduling works, contrasted with container-level GPU sharing, and the GPU memory available at each fraction">
  <title>Fractional GPU on ECS is not container-level time-slicing of one GPU. G6f instances are provisioned with a hardware partition of an NVIDIA L4, and ECS schedules a task onto an instance whose fraction matches the task definition. The lower panel shows GPU memory per fraction: 3 GB at one-eighth, 6 GB at one-quarter, and 12 GB at one-half, against the memory a model actually needs.</title>
  <rect width="1000" height="620" fill="#F8F7F5"/>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">The fraction belongs to the instance, not to the container</text>

    <rect x="40" y="54" width="440" height="196" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="260" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">What this is not</text>
    <text x="260" y="102" text-anchor="middle" font-size="12" fill="#3d3d3d">Container-level sharing of one whole GPU</text>

    <rect x="72" y="120" width="376" height="46" rx="3" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="260" y="141" text-anchor="middle" font-size="12" fill="#0f1111">one full NVIDIA L4, 24 GB</text>
    <text x="260" y="158" text-anchor="middle" font-size="11" fill="#6c757d">time-sliced between containers</text>

    <text x="122" y="192" text-anchor="middle" font-size="11" fill="#6c757d">task</text>
    <text x="214" y="192" text-anchor="middle" font-size="11" fill="#6c757d">task</text>
    <text x="306" y="192" text-anchor="middle" font-size="11" fill="#6c757d">task</text>
    <text x="398" y="192" text-anchor="middle" font-size="11" fill="#6c757d">task</text>
    <text x="260" y="220" text-anchor="middle" font-size="12" fill="#cc0c39">no memory isolation, noisy neighbours</text>
    <text x="260" y="238" text-anchor="middle" font-size="11" fill="#6c757d">this is the old manual Share GPUs approach</text>

    <rect x="520" y="54" width="440" height="196" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="740" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">What it is</text>
    <text x="740" y="102" text-anchor="middle" font-size="12" fill="#3d3d3d">Instances arrive already partitioned</text>

    <rect x="552" y="120" width="86" height="46" rx="3" fill="#ffffff" stroke="#C4A484" stroke-width="1.4"/>
    <text x="595" y="140" text-anchor="middle" font-size="11" fill="#0f1111">g6f.large</text>
    <text x="595" y="157" text-anchor="middle" font-size="11" fill="#6c757d">0.125</text>

    <rect x="646" y="120" width="86" height="46" rx="3" fill="#ffffff" stroke="#C4A484" stroke-width="1.4"/>
    <text x="689" y="140" text-anchor="middle" font-size="11" fill="#0f1111">g6f.2xlarge</text>
    <text x="689" y="157" text-anchor="middle" font-size="11" fill="#6c757d">0.25</text>

    <rect x="740" y="120" width="86" height="46" rx="3" fill="#ffffff" stroke="#C4A484" stroke-width="1.4"/>
    <text x="783" y="140" text-anchor="middle" font-size="11" fill="#0f1111">g6f.4xlarge</text>
    <text x="783" y="157" text-anchor="middle" font-size="11" fill="#6c757d">0.5</text>

    <rect x="834" y="120" width="94" height="46" rx="3" fill="#ffffff" stroke="#C4A484" stroke-width="1.4"/>
    <text x="881" y="140" text-anchor="middle" font-size="11" fill="#0f1111">gr6f.4xlarge</text>
    <text x="881" y="157" text-anchor="middle" font-size="11" fill="#6c757d">0.5</text>

    <text x="740" y="192" text-anchor="middle" font-size="12" fill="#0f1111">task definition asks for GPU 0.125, 0.25 or 0.5</text>
    <text x="740" y="212" text-anchor="middle" font-size="12" fill="#0f1111">ECS places it on an instance that has that fraction</text>
    <text x="740" y="238" text-anchor="middle" font-size="11" fill="#1d8102">dedicated GPU memory per instance</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">GPU memory is the real constraint</text>
    <text x="500" y="314" text-anchor="middle" font-size="12" fill="#6c757d">A fraction of the compute comes with a fraction of the 24 GB</text>

    <rect x="60" y="336" width="120" height="40" rx="3" fill="#fff8f0" stroke="#C4A484"/>
    <text x="120" y="361" text-anchor="middle" font-size="12" fill="#0f1111">0.125 = 3 GB</text>

    <rect x="60" y="386" width="220" height="40" rx="3" fill="#fff8f0" stroke="#C4A484"/>
    <text x="170" y="411" text-anchor="middle" font-size="12" fill="#0f1111">0.25 = 6 GB</text>

    <rect x="60" y="436" width="420" height="40" rx="3" fill="#fff8f0" stroke="#C4A484"/>
    <text x="270" y="461" text-anchor="middle" font-size="12" fill="#0f1111">0.5 = 12 GB</text>

    <rect x="60" y="486" width="820" height="40" rx="3" fill="#f2f2f0" stroke="#e5e5e5"/>
    <text x="470" y="511" text-anchor="middle" font-size="12" fill="#6c757d">full L4 = 24 GB, on g6 rather than g6f</text>

    <text x="60" y="562" font-size="12" fill="#3d3d3d">Weights are only part of it. KV cache, activations and the CUDA context all consume the same budget,</text>
    <text x="60" y="582" font-size="12" fill="#3d3d3d">so a model whose weights just fit will not run. Measure on the fraction you intend to buy.</text>
    <text x="60" y="604" font-size="11" fill="#6c757d">Rough guide at fp16: roughly 2 GB of weights per billion parameters, before any runtime overhead.</text>
  </g>
</svg>
