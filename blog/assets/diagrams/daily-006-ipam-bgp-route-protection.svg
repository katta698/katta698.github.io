<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="The three layers of IPAM BGP route protection and the tier each requires, with the four silent failure states it detects">
  <title>IPAM BGP route protection is built from three layers. Route discovery works on the Free Tier. Route protection findings and delegated RPKI both require the Advanced Tier. The lower panel shows the four states that fail silently without it: no ROA, a permissive ROA, an expired ROA, and an undetected route overlap.</title>
  <rect width="1000" height="660" fill="#F8F7F5"/>

  <defs>
    <marker id="ipam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Three layers, and the tier each one needs</text>

    <rect x="40" y="56" width="290" height="132" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="185" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">1. Route discovery</text>
    <text x="64" y="106" font-size="12" fill="#3d3d3d">Every BYOIP route across</text>
    <text x="64" y="124" font-size="12" fill="#3d3d3d">accounts and Regions</text>
    <text x="64" y="146" font-size="12" fill="#6c757d">prefix, ASN, advertisement</text>
    <text x="64" y="163" font-size="12" fill="#6c757d">status, RPKI validity</text>
    <rect x="64" y="172" width="120" height="0" fill="none"/>
    <text x="185" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#1d8102">Free Tier</text>

    <rect x="355" y="56" width="290" height="132" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">2. Protection findings</text>
    <text x="379" y="106" font-size="12" fill="#3d3d3d">Routes evaluated against</text>
    <text x="379" y="124" font-size="12" fill="#3d3d3d">published ROA data</text>
    <text x="379" y="146" font-size="12" fill="#6c757d">missing, conflicting and</text>
    <text x="379" y="163" font-size="12" fill="#6c757d">permissive ROAs, overlaps</text>
    <text x="500" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">Advanced Tier only</text>

    <rect x="670" y="56" width="290" height="132" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="815" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">3. Delegated RPKI</text>
    <text x="694" y="106" font-size="12" fill="#3d3d3d">AWS creates and renews</text>
    <text x="694" y="124" font-size="12" fill="#3d3d3d">your ROAs</text>
    <text x="694" y="146" font-size="12" fill="#6c757d">one-time setup with your</text>
    <text x="694" y="163" font-size="12" fill="#6c757d">RIR, then no manual work</text>
    <text x="815" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">Advanced Tier only</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#ipam-arrow)" fill="none">
      <line x1="330" y1="122" x2="351" y2="122"/>
      <line x1="645" y1="122" x2="666" y2="122"/>
    </g>

    <text x="500" y="214" text-anchor="middle" font-size="12" fill="#6c757d">Each works independently. Start at monitoring, add delegation later without disrupting existing routes.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">What it detects, all of which fail silently today</text>

    <rect x="40" y="278" width="440" height="122" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="64" y="304" font-size="13" font-weight="700" fill="#cc0c39">No ROA at all</text>
    <text x="64" y="328" font-size="12" fill="#3d3d3d">RPKI status is Unknown. Any ASN can announce</text>
    <text x="64" y="346" font-size="12" fill="#3d3d3d">your prefix and validating networks have no</text>
    <text x="64" y="364" font-size="12" fill="#3d3d3d">basis to reject it.</text>
    <text x="64" y="388" font-size="12" fill="#6c757d">Traffic keeps flowing. Nothing looks wrong.</text>

    <rect x="520" y="278" width="440" height="122" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="544" y="304" font-size="13" font-weight="700" fill="#cc0c39">Permissive ROA</text>
    <text x="544" y="328" font-size="12" fill="#3d3d3d">Max-length longer than the prefix, so</text>
    <text x="544" y="346" font-size="12" fill="#3d3d3d">more-specific announcements are valid too.</text>
    <text x="544" y="364" font-size="12" fill="#3d3d3d">Compromised ASN credentials split your traffic.</text>
    <text x="544" y="388" font-size="12" fill="#6c757d">Useful for traffic engineering. Weaker defence.</text>

    <rect x="40" y="414" width="440" height="122" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="64" y="440" font-size="13" font-weight="700" fill="#cc0c39">Expired ROA</text>
    <text x="64" y="464" font-size="12" fill="#3d3d3d">Valid becomes Unknown silently on expiry.</text>
    <text x="64" y="482" font-size="12" fill="#3d3d3d">The prefix stops being protected, and nothing</text>
    <text x="64" y="500" font-size="12" fill="#3d3d3d">in your own systems changes.</text>
    <text x="64" y="524" font-size="12" fill="#6c757d">Alarm on the RoaExpiration CloudWatch metric.</text>

    <rect x="520" y="414" width="440" height="122" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="544" y="440" font-size="13" font-weight="700" fill="#cc0c39">Undetected route overlap</text>
    <text x="544" y="464" font-size="12" fill="#3d3d3d">A third party announces your prefix or a</text>
    <text x="544" y="482" font-size="12" fill="#3d3d3d">more-specific one. Traffic diverts to them.</text>
    <text x="544" y="500" font-size="12" fill="#3d3d3d">You learn from customer reports.</text>
    <text x="544" y="524" font-size="12" fill="#6c757d">Hours to days, per AWS.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="558" width="920" height="76" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="584" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Strict versus permissive is the single setting that matters most</text>
    <text x="500" y="606" text-anchor="middle" font-size="12" fill="#3d3d3d">Strict: max-length equals the prefix length, so any more-specific announcement is RPKI-invalid. AWS recommends this default.</text>
    <text x="500" y="624" text-anchor="middle" font-size="12" fill="#6c757d">Permissive: max-length is longer, so sub-prefix announcements from the authorised ASN stay valid.</text>
  </g>
</svg>
