<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="The four EC2 status check types and the deployment trap that comes with the new application check">
  <title>EC2 now has four status check types. System, instance and attached EBS are managed by AWS and always on. Application status checks are opt-in and monitor an HTTP or HTTPS endpoint every 60 seconds from a managed network interface inside your VPC. Because Auto Scaling replaces instances whose application reports impaired, a deployment that stops the application will trigger replacement unless the check is suppressed, excluded from aggregation, or disassociated first.</title>
  <rect width="1000" height="700" fill="#F8F7F5"/>

  <defs>
    <marker id="asc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Four status check types. Three are automatic. One is not.</text>

    <rect x="40" y="52" width="215" height="118" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="147" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">System</text>
    <text x="147" y="100" text-anchor="middle" font-size="12" fill="#3d3d3d">The AWS host underneath</text>
    <text x="147" y="120" text-anchor="middle" font-size="12" fill="#6c757d">power, network, hardware</text>
    <text x="147" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1d8102">always on</text>

    <rect x="268" y="52" width="215" height="118" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="375" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Instance</text>
    <text x="375" y="100" text-anchor="middle" font-size="12" fill="#3d3d3d">The OS answers an ARP</text>
    <text x="375" y="120" text-anchor="middle" font-size="12" fill="#6c757d">kernel, memory, filesystem</text>
    <text x="375" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1d8102">always on</text>

    <rect x="496" y="52" width="215" height="118" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="603" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Attached EBS</text>
    <text x="603" y="100" text-anchor="middle" font-size="12" fill="#3d3d3d">Volumes complete I/O</text>
    <text x="603" y="120" text-anchor="middle" font-size="12" fill="#6c757d">Nitro instances only</text>
    <text x="603" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1d8102">always on</text>

    <rect x="724" y="52" width="236" height="118" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="842" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Application</text>
    <text x="842" y="100" text-anchor="middle" font-size="12" fill="#3d3d3d">Your endpoint returns 200</text>
    <text x="842" y="120" text-anchor="middle" font-size="12" fill="#6c757d">HTTP or HTTPS, every 60s</text>
    <text x="842" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">opt-in, and new</text>

    <text x="500" y="192" text-anchor="middle" font-size="12" fill="#6c757d">The first three answer "is the box alive?". Only the fourth answers "is the software working?"</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">How the check reaches your instance</text>

    <rect x="60" y="256" width="230" height="84" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="175" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">EC2 status check service</text>
    <text x="175" y="304" text-anchor="middle" font-size="12" fill="#6c757d">same Availability Zone</text>
    <text x="175" y="324" text-anchor="middle" font-size="12" fill="#6c757d">never the public internet</text>

    <rect x="385" y="256" width="230" height="84" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Managed ENI in your VPC</text>
    <text x="500" y="304" text-anchor="middle" font-size="12" fill="#6c757d">one per subnet and</text>
    <text x="500" y="322" text-anchor="middle" font-size="12" fill="#6c757d">security group combination</text>

    <rect x="710" y="256" width="230" height="84" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="825" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Your instance</text>
    <text x="825" y="304" text-anchor="middle" font-size="12" fill="#6c757d">security group must allow</text>
    <text x="825" y="322" text-anchor="middle" font-size="12" fill="#6c757d">the check port inbound</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#asc-arrow)" fill="none">
      <line x1="290" y1="298" x2="381" y2="298"/>
      <line x1="615" y1="298" x2="706" y2="298"/>
    </g>

    <text x="500" y="364" text-anchor="middle" font-size="12" fill="#cc0c39">Billing follows the ENI, not the fleet: $0.01 per managed ENI per hour, per Availability Zone</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="396" width="920" height="284" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The trap: your next deployment looks exactly like an outage</text>
    <text x="500" y="448" text-anchor="middle" font-size="12" fill="#3d3d3d">Auto Scaling replaces any instance whose application reports impaired. It needs no configuration to do this &#8212;</text>
    <text x="500" y="468" text-anchor="middle" font-size="12" fill="#3d3d3d">associating the check is enough. Stop the application to deploy, and the group terminates the instance mid-deploy.</text>

    <rect x="72" y="490" width="278" height="166" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="211" y="516" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">Suppress</text>
    <text x="96" y="542" font-size="12" fill="#3d3d3d">For a known maintenance</text>
    <text x="96" y="560" font-size="12" fill="#3d3d3d">window with a duration.</text>
    <text x="96" y="586" font-size="12" fill="#6c757d">Status reports suppressed;</text>
    <text x="96" y="604" font-size="12" fill="#6c757d">Auto Scaling stands down.</text>
    <text x="96" y="632" font-size="11" fill="#0f1111">Drive it from deploy hooks.</text>

    <rect x="361" y="490" width="278" height="166" rx="4" fill="#ffffff" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="516" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Exclude</text>
    <text x="385" y="542" font-size="12" fill="#3d3d3d">Keeps evaluating and</text>
    <text x="385" y="560" font-size="12" fill="#3d3d3d">reporting, but does not</text>
    <text x="385" y="578" font-size="12" fill="#3d3d3d">count toward the total.</text>
    <text x="385" y="604" font-size="12" fill="#6c757d">Telemetry without risk.</text>
    <text x="385" y="632" font-size="11" fill="#0f1111">Use it to test a new check.</text>

    <rect x="650" y="490" width="278" height="166" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="789" y="516" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Disassociate</text>
    <text x="674" y="542" font-size="12" fill="#3d3d3d">For indefinite removal.</text>
    <text x="674" y="568" font-size="12" fill="#6c757d">Status becomes</text>
    <text x="674" y="586" font-size="12" fill="#6c757d">not-applicable.</text>
    <text x="674" y="614" font-size="11" fill="#0f1111">If you associated by tag,</text>
    <text x="674" y="632" font-size="11" fill="#0f1111">remove the tag.</text>
  </g>
</svg>
