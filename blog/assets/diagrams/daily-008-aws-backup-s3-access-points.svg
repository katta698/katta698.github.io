<svg viewBox="0 0 1000 690" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="How a backup access point gives read-only access to S3 backup data without a restore, and the lifecycle protection it places on the recovery point">
  <title>A backup access point provisions an S3 access point that routes standard read calls at a recovery point, so backup data can be read without a restore. While any access point is active, AWS Backup pauses lifecycle transitions and blocks deletion of that recovery point. Access points never expire on their own, and deleting the underlying S3 access point directly leaves the protection in place.</title>
  <rect width="1000" height="690" fill="#F8F7F5"/>

  <defs>
    <marker id="bap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Reading a backup without restoring it</text>

    <rect x="40" y="56" width="200" height="96" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="140" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Recovery point</text>
    <text x="140" y="106" text-anchor="middle" font-size="12" fill="#6c757d">snapshot or continuous</text>
    <text x="140" y="126" text-anchor="middle" font-size="12" fill="#6c757d">standard or air-gapped vault</text>

    <rect x="292" y="56" width="200" height="96" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="392" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Backup access point</text>
    <text x="392" y="106" text-anchor="middle" font-size="12" fill="#6c757d">CreateBackupAccessPoint</text>
    <text x="392" y="126" text-anchor="middle" font-size="12" fill="#6c757d">AWS Backup resource</text>

    <rect x="544" y="56" width="200" height="96" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="644" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">S3 access point</text>
    <text x="644" y="106" text-anchor="middle" font-size="12" fill="#6c757d">provisioned for you</text>
    <text x="644" y="126" text-anchor="middle" font-size="12" fill="#6c757d">alias or ARN</text>

    <rect x="796" y="56" width="164" height="96" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="878" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Your tools</text>
    <text x="878" y="106" text-anchor="middle" font-size="12" fill="#6c757d">GetObject</text>
    <text x="878" y="126" text-anchor="middle" font-size="12" fill="#6c757d">ListObjectsV2</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#bap-arrow)" fill="none">
      <line x1="240" y1="104" x2="288" y2="104"/>
      <line x1="492" y1="104" x2="540" y2="104"/>
      <line x1="744" y1="104" x2="792" y2="104"/>
    </g>

    <text x="500" y="180" text-anchor="middle" font-size="12" fill="#3d3d3d">Read-only. Every write, and also GetObjectAcl, GetObjectRetention and GetObjectLegalHold, are unsupported.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="208" width="920" height="150" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">The capability worth knowing about</text>
    <text x="500" y="264" text-anchor="middle" font-size="12" fill="#3d3d3d">For a continuous recovery point you pass AccessPointInTime to pick the point-in-time view.</text>
    <text x="500" y="288" text-anchor="middle" font-size="12" fill="#0f1111" font-weight="700">While the access point exists, that view stays readable even after the timestamp falls outside the 35-day window.</text>
    <text x="500" y="316" text-anchor="middle" font-size="12" fill="#6c757d">An investigation opened on day 30 does not lose its evidence on day 36.</text>
    <text x="500" y="340" text-anchor="middle" font-size="12" fill="#6c757d">The timestamp must be inside the window at creation time, not later.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="386" width="920" height="284" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The trap: an access point pins the recovery point in place</text>
    <text x="500" y="440" text-anchor="middle" font-size="12" fill="#3d3d3d">While any access point is active, lifecycle transitions are paused and DeleteRecoveryPoint fails.</text>
    <text x="500" y="460" text-anchor="middle" font-size="12" fill="#3d3d3d">That is deliberate: it stops data vanishing while something is reading it. It is also easy to leave behind.</text>

    <rect x="72" y="484" width="278" height="164" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="211" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Nothing reaps them</text>
    <text x="96" y="536" font-size="12" fill="#3d3d3d">There is no delete-after-days</text>
    <text x="96" y="554" font-size="12" fill="#3d3d3d">setting. Access points must be</text>
    <text x="96" y="572" font-size="12" fill="#3d3d3d">deleted by hand.</text>
    <text x="96" y="600" font-size="12" fill="#cc0c39">Forget one and retention stops</text>
    <text x="96" y="618" font-size="12" fill="#cc0c39">being enforced on that backup.</text>

    <rect x="361" y="484" width="278" height="164" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Cleaning up the wrong way</text>
    <text x="385" y="536" font-size="12" fill="#3d3d3d">Delete the S3 access point via</text>
    <text x="385" y="554" font-size="12" fill="#3d3d3d">S3 and the backup access point</text>
    <text x="385" y="572" font-size="12" fill="#3d3d3d">goes EXPIRED.</text>
    <text x="385" y="600" font-size="12" fill="#cc0c39">The lifecycle hold stays until</text>
    <text x="385" y="618" font-size="12" fill="#cc0c39">you delete the orphan too.</text>

    <rect x="650" y="484" width="278" height="164" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="789" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">Doing it right</text>
    <text x="674" y="536" font-size="12" fill="#3d3d3d">Always use</text>
    <text x="674" y="554" font-size="12" fill="#3d3d3d">DeleteBackupAccessPoint.</text>
    <text x="674" y="582" font-size="12" fill="#6c757d">Audit with</text>
    <text x="674" y="600" font-size="12" fill="#6c757d">list-backup-access-points,</text>
    <text x="674" y="618" font-size="12" fill="#6c757d">including FAILED and EXPIRED.</text>
  </g>
</svg>
