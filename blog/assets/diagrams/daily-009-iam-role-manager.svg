<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="How IAM role manager creates roles from AWS managed role templates once an administrator enables it, why the Lambda template grants PowerUserAccess, and which controls govern it">
  <title>An administrator enables role manager once in IAM account settings. After that, supported service consoles call AcquireRole against an AWS managed role template instead of prompting anyone to author a role. The Lambda template attaches the PowerUserAccess managed policy, because the permissions a function needs cannot be known in advance. PowerUserAccess is written as a NotAction allow, so it permits every action except the IAM, Organizations and account namespaces, including services AWS has not launched yet. Roles created this way record their origin in the SourceRoleTemplate field, which is the field to audit on.</title>
  <rect width="1000" height="780" fill="#F8F7F5"/>

  <defs>
    <marker id="rm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Who actually writes the role</text>

    <rect x="40" y="56" width="200" height="100" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="140" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Administrator</text>
    <text x="140" y="104" text-anchor="middle" font-size="12" fill="#6c757d">IAM &#8594; Account settings</text>
    <text x="140" y="122" text-anchor="middle" font-size="12" fill="#6c757d">role manager &#8594; Enable</text>
    <text x="140" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">once, per account</text>

    <rect x="292" y="56" width="200" height="100" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="392" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Builder, later</text>
    <text x="392" y="104" text-anchor="middle" font-size="12" fill="#6c757d">creates a Lambda function</text>
    <text x="392" y="122" text-anchor="middle" font-size="12" fill="#6c757d">in a supported console</text>
    <text x="392" y="144" text-anchor="middle" font-size="12" fill="#6c757d">is not asked about roles</text>

    <rect x="544" y="56" width="200" height="100" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="644" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">AcquireRole</text>
    <text x="644" y="104" text-anchor="middle" font-size="12" fill="#6c757d">TemplateArn, minor version</text>
    <text x="644" y="122" text-anchor="middle" font-size="12" fill="#6c757d">ReplacementValues, max 30</text>
    <text x="644" y="144" text-anchor="middle" font-size="12" fill="#6c757d">called for you</text>

    <rect x="796" y="56" width="164" height="100" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="878" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Role exists</text>
    <text x="878" y="104" text-anchor="middle" font-size="12" fill="#6c757d">trust policy, policies,</text>
    <text x="878" y="122" text-anchor="middle" font-size="12" fill="#6c757d">boundary, tags, session</text>
    <text x="878" y="144" text-anchor="middle" font-size="12" fill="#6c757d">all from the template</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#rm-arrow)" fill="none">
      <line x1="240" y1="104" x2="288" y2="104"/>
      <line x1="492" y1="104" x2="540" y2="104"/>
      <line x1="744" y1="104" x2="792" y2="104"/>
    </g>

    <text x="500" y="184" text-anchor="middle" font-size="12" fill="#3d3d3d">The enable decision and the role creation are separated in time, and made by different people.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="212" width="920" height="176" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The trap: PowerUserAccess is written as NotAction, not as a list of allowed services</text>
    <text x="500" y="266" text-anchor="middle" font-size="12" fill="#3d3d3d">A Lambda function&#8217;s permissions cannot be known in advance, so the template attaches PowerUserAccess.</text>

    <rect x="150" y="286" width="700" height="84" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="176" y="310" font-size="12" font-family="Consolas,Monaco,monospace" fill="#0f1111">&#8220;Effect&#8221;: &#8220;Allow&#8221;,</text>
    <text x="176" y="330" font-size="12" font-family="Consolas,Monaco,monospace" fill="#0f1111">&#8220;NotAction&#8221;: [ &#8220;iam:*&#8221;, &#8220;organizations:*&#8221;, &#8220;account:*&#8221; ],</text>
    <text x="176" y="350" font-size="12" font-family="Consolas,Monaco,monospace" fill="#0f1111">&#8220;Resource&#8221;: &#8220;*&#8221;</text>

    <text x="500" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">Deny three namespaces, allow the rest &#8212; including every service AWS launches in future.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="416" width="920" height="336" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">The four controls that actually govern this</text>

    <rect x="72" y="464" width="200" height="128" rx="4" fill="#f6f9f4" stroke="#e5e5e5"/>
    <text x="172" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Before enabling</text>
    <text x="96" y="512" font-size="12" fill="#3d3d3d">An SCP controls whether</text>
    <text x="96" y="530" font-size="12" fill="#3d3d3d">member accounts may</text>
    <text x="96" y="548" font-size="12" fill="#3d3d3d">enable or use role</text>
    <text x="96" y="566" font-size="12" fill="#3d3d3d">manager at all.</text>
    <text x="96" y="584" font-size="12" font-weight="700" fill="#1d8102">Decide org-wide first.</text>

    <rect x="288" y="464" width="200" height="128" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="388" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Finding them</text>
    <text x="312" y="512" font-size="12" fill="#3d3d3d">SourceRoleTemplate is</text>
    <text x="312" y="530" font-size="12" fill="#3d3d3d">returned by GetRole and</text>
    <text x="312" y="548" font-size="12" fill="#3d3d3d">ListRoles, and only for</text>
    <text x="312" y="566" font-size="12" fill="#3d3d3d">AcquireRole-made roles.</text>
    <text x="312" y="584" font-size="12" font-weight="700" fill="#1d8102">Audit on that field.</text>

    <rect x="504" y="464" width="200" height="128" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="604" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Narrowing them</text>
    <text x="528" y="512" font-size="12" fill="#3d3d3d">Access Analyzer unused</text>
    <text x="528" y="530" font-size="12" fill="#3d3d3d">access analysis is free</text>
    <text x="528" y="548" font-size="12" fill="#3d3d3d">for 90 days once you</text>
    <text x="528" y="566" font-size="12" fill="#3d3d3d">disable role manager.</text>
    <text x="528" y="584" font-size="12" font-weight="700" fill="#1d8102">Use the whole window.</text>

    <rect x="720" y="464" width="208" height="128" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="824" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Taking one over</text>
    <text x="744" y="512" font-size="12" fill="#3d3d3d">Editing a role removes</text>
    <text x="744" y="530" font-size="12" fill="#3d3d3d">it from role manager&#8217;s</text>
    <text x="744" y="548" font-size="12" fill="#3d3d3d">control. It becomes a</text>
    <text x="744" y="566" font-size="12" fill="#3d3d3d">normal customer role.</text>
    <text x="744" y="584" font-size="12" font-weight="700" fill="#1d8102">One-way, by design.</text>

    <rect x="72" y="612" width="856" height="118" rx="4" fill="#f8f7f5" stroke="#e5e5e5"/>
    <text x="500" y="638" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">What disabling does and does not do</text>
    <text x="500" y="664" text-anchor="middle" font-size="12" fill="#3d3d3d">Disabling role manager stops new roles being created for you. It changes nothing already running:</text>
    <text x="500" y="684" text-anchor="middle" font-size="12" fill="#3d3d3d">resources keep the roles they have, and those roles stay in the account until you change them.</text>
    <text x="500" y="710" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">So turning it off is not remediation. The broad roles remain until you go and narrow them.</text>
  </g>
</svg>
