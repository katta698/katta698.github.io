<svg viewBox="0 0 1000 830" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="The four configurable EKS control plane parameters, and why shortening the Horizontal Pod Autoscaler sync period can make autoscaling slower rather than faster">
  <title>Amazon EKS now exposes four control plane parameters across the scheduler, controller manager and API server. Three are ordinary tuning knobs. The fourth, the Horizontal Pod Autoscaler sync period, requires the paid Provisioned Control Plane mode, and shortening it from fifteen seconds to ten reduces the number of HorizontalPodAutoscaler objects the control plane can reconcile on schedule by roughly one third. EKS does not validate the new period against the number of objects already in the cluster, and if the controller cannot work through them all, some are not reconciled on time. No alarm and no Kubernetes event is emitted, and the symptom is autoscaling that responds more slowly than before the change.</title>
  <rect width="1000" height="830" fill="#F8F7F5"/>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Four parameters, three components, one that costs money</text>

    <rect x="40" y="52" width="920" height="184" rx="4" fill="#ffffff" stroke="#e5e5e5"/>

    <text x="60"  y="78" font-size="12" font-weight="700" fill="#6c757d">COMPONENT</text>
    <text x="250" y="78" font-size="12" font-weight="700" fill="#6c757d">PARAMETER</text>
    <text x="600" y="78" font-size="12" font-weight="700" fill="#6c757d">RANGE</text>
    <text x="760" y="78" font-size="12" font-weight="700" fill="#6c757d">DEFAULT</text>
    <text x="880" y="78" font-size="12" font-weight="700" fill="#6c757d">NEEDS PCP</text>
    <line x1="56" y1="88" x2="944" y2="88" stroke="#e5e5e5" stroke-width="1"/>

    <text x="60"  y="112" font-size="12" fill="#0f1111">kube-scheduler</text>
    <text x="250" y="112" font-size="12" fill="#3d3d3d">nodeResourcesFit.scoringStrategy</text>
    <text x="600" y="112" font-size="12" fill="#3d3d3d">Least / MostAllocated</text>
    <text x="760" y="112" font-size="12" fill="#3d3d3d">LeastAllocated</text>
    <text x="898" y="112" font-size="12" fill="#1d8102">no</text>

    <text x="60"  y="142" font-size="12" fill="#0f1111">kube-apiserver</text>
    <text x="250" y="142" font-size="12" fill="#3d3d3d">eventTtl</text>
    <text x="600" y="142" font-size="12" fill="#3d3d3d">10m to 60m</text>
    <text x="760" y="142" font-size="12" fill="#3d3d3d">60m</text>
    <text x="898" y="142" font-size="12" fill="#1d8102">no</text>

    <text x="60"  y="172" font-size="12" fill="#0f1111">kube-apiserver</text>
    <text x="250" y="172" font-size="12" fill="#3d3d3d">serviceNodePortRange</text>
    <text x="600" y="172" font-size="12" fill="#3d3d3d">10260 to 32767</text>
    <text x="760" y="172" font-size="12" fill="#3d3d3d">30000-32767</text>
    <text x="898" y="172" font-size="12" fill="#1d8102">no</text>

    <rect x="56" y="186" width="888" height="34" rx="3" fill="#fdf2f2"/>
    <text x="60"  y="208" font-size="12" font-weight="700" fill="#0f1111">controller-manager</text>
    <text x="250" y="208" font-size="12" font-weight="700" fill="#3d3d3d">horizontalPodAutoscalerSyncPeriod</text>
    <text x="600" y="208" font-size="12" font-weight="700" fill="#3d3d3d">10s to 15s</text>
    <text x="760" y="208" font-size="12" font-weight="700" fill="#3d3d3d">15s</text>
    <text x="898" y="208" font-size="12" font-weight="700" fill="#cc0c39">YES</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="260" width="920" height="240" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The trap: the knob meant to speed up autoscaling can slow it down</text>

    <rect x="72" y="308" width="272" height="118" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="208" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">What you intend</text>
    <text x="96" y="358" font-size="12" fill="#3d3d3d">Evaluate scaling decisions</text>
    <text x="96" y="376" font-size="12" fill="#3d3d3d">every 10s instead of 15s,</text>
    <text x="96" y="394" font-size="12" fill="#3d3d3d">so workloads scale sooner</text>
    <text x="96" y="412" font-size="12" fill="#3d3d3d">after load increases.</text>

    <rect x="364" y="308" width="272" height="118" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">What it costs</text>
    <text x="388" y="358" font-size="12" fill="#3d3d3d">The controller has less time</text>
    <text x="388" y="376" font-size="12" fill="#3d3d3d">to work the same queue, so</text>
    <text x="388" y="394" font-size="12" fill="#3d3d3d">supported HPA object count</text>
    <text x="388" y="412" font-size="12" font-weight="700" fill="#cc0c39">falls by roughly one third.</text>

    <rect x="656" y="308" width="272" height="118" rx="4" fill="#ffffff" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="792" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">How you find out</text>
    <text x="680" y="358" font-size="12" fill="#3d3d3d">You do not. EKS does not</text>
    <text x="680" y="376" font-size="12" fill="#3d3d3d">validate the period against</text>
    <text x="680" y="394" font-size="12" fill="#3d3d3d">your object count. No alarm,</text>
    <text x="680" y="412" font-size="12" fill="#3d3d3d">no Kubernetes event.</text>

    <rect x="72" y="440" width="856" height="46" rx="4" fill="#ffffff" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">Objects that miss their turn are not reconciled on schedule. The symptom is autoscaling that responds</text>
    <text x="500" y="478" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">more slowly than before &#8212; the exact opposite of the change you made. Count first: kubectl get hpa -A</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="524" width="920" height="286" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">The lever that actually helps is the one you do not set</text>

    <text x="500" y="578" text-anchor="middle" font-size="12" fill="#3d3d3d">Two things govern HPA responsiveness. Only one of them is the parameter being offered.</text>

    <rect x="72" y="596" width="416" height="130" rx="4" fill="#f6f9f4" stroke="#e5e5e5"/>
    <text x="280" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">Sync concurrency &#8212; comes with the tier</text>
    <text x="96" y="644" font-size="12" fill="#3d3d3d">How many HPA objects reconcile in parallel.</text>
    <text x="96" y="662" font-size="12" fill="#3d3d3d">Upstream Kubernetes default is 5.</text>
    <text x="96" y="686" font-size="12" fill="#0f1111">XL 50    2XL 100    4XL 200    8XL 200</text>
    <text x="96" y="710" font-size="12" font-weight="700" fill="#1d8102">Already 10x upstream at the smallest tier.</text>

    <rect x="512" y="596" width="416" height="130" rx="4" fill="#fdf2f2" stroke="#e5e5e5"/>
    <text x="720" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Sync period &#8212; the knob you can turn</text>
    <text x="536" y="644" font-size="12" fill="#3d3d3d">How often each object is evaluated.</text>
    <text x="536" y="662" font-size="12" fill="#3d3d3d">Adjustable across a 5-second span, 15s to 10s.</text>
    <text x="536" y="686" font-size="12" fill="#3d3d3d">Trades queue capacity for frequency.</text>
    <text x="536" y="710" font-size="12" font-weight="700" fill="#cc0c39">Reach for it last, not first.</text>

    <rect x="72" y="742" width="856" height="52" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="764" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">One-way door: while this parameter is set to anything other than 15s, the cluster cannot leave</text>
    <text x="500" y="784" text-anchor="middle" font-size="12" fill="#3d3d3d">Provisioned mode. Reset it to the default first, then change the scaling tier back to standard.</text>
  </g>
</svg>
