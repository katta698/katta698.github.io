<svg viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="How the enhanced S3 access denied message is built, why an implicit deny can never name a policy, and the three limits that decide whether you get an ARN at all">
  <title>Amazon S3 access denied errors now carry the policy type that denied the request, and for explicit denials the ARN of the specific policy. An implicit denial names a policy type but never an ARN, because no such policy exists: the request failed because nothing allowed it. The ARN is issued for service control policies, resource control policies, identity-based policies, session policies and permissions boundaries, but not for resource-based policies, which on S3 means bucket policies. When more than one policy type denies a request, AWS names only one of them, so fixing the named policy can simply reveal the next. Cross-account requests from outside the organization return a generic message with no detail at all.</title>
  <rect width="1000" height="850" fill="#F8F7F5"/>

  <defs>
    <marker id="ad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">The anatomy of the message</text>

    <rect x="40" y="52" width="920" height="86" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="64" y="82" font-size="12" font-family="Consolas,Monaco,monospace" fill="#0f1111">User &#123;user-arn&#125; is not authorized to perform &#123;action&#125; on &#171;&#123;resource-arn&#125;&#187; because &#123;context&#125;</text>
    <line x1="700" y1="92" x2="828" y2="92" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="764" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">everything new is here</text>
    <text x="64" y="130" font-size="12" fill="#6c757d">The first three fields have always been present. The context field is what changed.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">Two denials, two different messages</text>

    <rect x="40" y="190" width="440" height="164" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="260" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Explicit deny &#8212; a Deny statement matched</text>
    <rect x="64" y="230" width="392" height="52" rx="3" fill="#ffffff"/>
    <text x="76" y="250" font-size="11" font-family="Consolas,Monaco,monospace" fill="#0f1111">with an explicit deny in a &#123;type&#125; policy:</text>
    <text x="76" y="268" font-size="11" font-family="Consolas,Monaco,monospace" fill="#0f1111">arn:aws:iam::123456789012:policy/HRAccess</text>
    <text x="64" y="304" font-size="12" fill="#3d3d3d">A policy exists and can be named. You are</text>
    <text x="64" y="322" font-size="12" fill="#3d3d3d">taken to the exact document to edit.</text>
    <text x="64" y="344" font-size="12" font-weight="700" fill="#0f1111">The ARN is not guaranteed. See below.</text>

    <rect x="520" y="190" width="440" height="164" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="740" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Implicit deny &#8212; nothing allowed it</text>
    <rect x="544" y="230" width="392" height="52" rx="3" fill="#ffffff"/>
    <text x="556" y="250" font-size="11" font-family="Consolas,Monaco,monospace" fill="#0f1111">because no &#123;type&#125; policy allows the</text>
    <text x="556" y="268" font-size="11" font-family="Consolas,Monaco,monospace" fill="#0f1111">s3:GetObject action</text>
    <text x="544" y="304" font-size="12" fill="#3d3d3d">You get the policy type. You never get an</text>
    <text x="544" y="322" font-size="12" fill="#3d3d3d">ARN, and no future release can add one.</text>
    <text x="544" y="344" font-size="12" font-weight="700" fill="#cc0c39">There is no policy. That is the denial.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="378" width="920" height="130" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">Which policy types can return an ARN</text>

    <text x="120" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">Service control</text>
    <text x="300" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">Resource control</text>
    <text x="480" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">Identity-based</text>
    <text x="650" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">Session</text>
    <text x="850" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">Permissions boundary</text>

    <line x1="64" y1="452" x2="936" y2="452" stroke="#e5e5e5" stroke-width="1"/>
    <text x="500" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">Not on the list: resource-based policies &#8212; which on Amazon S3 means the bucket policy.</text>
    <text x="500" y="496" text-anchor="middle" font-size="12" fill="#3d3d3d">The type most likely to deny an S3 request is the one type that is never named by ARN.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="532" width="920" height="296" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="560" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The trap: one message names one cause, and there may be several</text>

    <rect x="72" y="580" width="272" height="150" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="208" y="604" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Only one type is named</text>
    <text x="96" y="628" font-size="12" fill="#3d3d3d">If several policy types deny</text>
    <text x="96" y="646" font-size="12" fill="#3d3d3d">the same request, AWS puts</text>
    <text x="96" y="664" font-size="12" fill="#3d3d3d">only one of them in the</text>
    <text x="96" y="682" font-size="12" fill="#3d3d3d">message.</text>
    <text x="96" y="708" font-size="12" font-weight="700" fill="#cc0c39">Fix it and the next appears.</text>

    <rect x="364" y="580" width="272" height="150" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="604" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">The count is withheld</text>
    <text x="388" y="628" font-size="12" fill="#3d3d3d">If several policies of the</text>
    <text x="388" y="646" font-size="12" fill="#3d3d3d">same type deny it, the</text>
    <text x="388" y="664" font-size="12" fill="#3d3d3d">message does not say how</text>
    <text x="388" y="682" font-size="12" fill="#3d3d3d">many were evaluated.</text>
    <text x="388" y="708" font-size="12" font-weight="700" fill="#cc0c39">One ARN is not all of them.</text>

    <rect x="656" y="580" width="272" height="150" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="792" y="604" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Outside the org, nothing</text>
    <text x="680" y="628" font-size="12" fill="#3d3d3d">Detail is returned only for</text>
    <text x="680" y="646" font-size="12" fill="#3d3d3d">same-account or same-org</text>
    <text x="680" y="664" font-size="12" fill="#3d3d3d">requests. Cross-account from</text>
    <text x="680" y="682" font-size="12" fill="#3d3d3d">outside returns the generic</text>
    <text x="680" y="700" font-size="12" fill="#3d3d3d">Access Denied.</text>
    <text x="680" y="722" font-size="12" font-weight="700" fill="#1d8102">Deliberate: no leakage.</text>

    <rect x="72" y="746" width="856" height="62" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="770" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">The detail is also written to AWS CloudTrail, which is the part worth building on.</text>
    <text x="500" y="792" text-anchor="middle" font-size="12" fill="#3d3d3d">A caller sees one denial once. CloudTrail lets you count them across the estate and find the policy</text>
  </g>
</svg>
