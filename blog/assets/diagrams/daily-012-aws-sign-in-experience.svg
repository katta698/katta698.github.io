<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="The new AWS sign-in flow starts from an email address rather than a choice between root and IAM user, and the group it actually breaks is browser automation">
  <title>The redesigned AWS sign-in page replaces the up-front choice between root user and IAM user with a single email field, and determines the appropriate sign-in flow from the address entered. Human users keep the same credentials and need do nothing. The group affected is browser automation driving the console, because the page it was written against no longer has the same shape, and AWS's guidance is to use supported programmatic access instead of automating the interface.</title>
  <rect width="1000" height="540" fill="#F8F7F5"/>

  <defs>
    <marker id="si-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">The entry point moved, not the credentials</text>

    <rect x="40" y="56" width="430" height="150" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="255" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#6c757d">Before</text>
    <text x="64" y="110" font-size="12" fill="#3d3d3d">You choose first: Root user or IAM user.</text>
    <text x="64" y="132" font-size="12" fill="#3d3d3d">An IAM user needs the account ID or alias,</text>
    <text x="64" y="154" font-size="12" fill="#3d3d3d">then user name, then password.</text>
    <text x="64" y="182" font-size="12" fill="#6c757d">The page shape is stable and scriptable.</text>

    <rect x="530" y="56" width="430" height="150" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="745" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">After</text>
    <text x="554" y="110" font-size="12" fill="#3d3d3d">You enter an email address.</text>
    <text x="554" y="132" font-size="12" fill="#3d3d3d">AWS determines the sign-in flow from it.</text>
    <text x="554" y="154" font-size="12" fill="#3d3d3d">Eligible accounts may use Google, GitHub,</text>
    <text x="554" y="176" font-size="12" fill="#3d3d3d">Apple or Amazon.com as the provider.</text>
    <text x="554" y="198" font-size="12" font-weight="700" fill="#0f1111">Same credentials. Different first screen.</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#si-arrow)" fill="none">
      <line x1="472" y1="130" x2="526" y2="130"/>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="230" width="920" height="118" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="500" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">Who has to do something: almost nobody</text>

    <text x="120" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">Root and IAM users</text>
    <text x="120" y="308" text-anchor="middle" font-size="12" fill="#3d3d3d">same credentials</text>
    <text x="120" y="328" text-anchor="middle" font-size="12" fill="#6c757d">nothing to do</text>

    <text x="380" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">IAM Identity Center</text>
    <text x="380" y="308" text-anchor="middle" font-size="12" fill="#3d3d3d">your access portal</text>
    <text x="380" y="328" text-anchor="middle" font-size="12" fill="#6c757d">unchanged</text>

    <text x="640" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">Federated sign-in</text>
    <text x="640" y="308" text-anchor="middle" font-size="12" fill="#3d3d3d">your existing process</text>
    <text x="640" y="328" text-anchor="middle" font-size="12" fill="#6c757d">unchanged</text>

    <text x="880" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">Browser automation</text>
    <text x="880" y="308" text-anchor="middle" font-size="12" fill="#3d3d3d">drives the page itself</text>
    <text x="880" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">review it</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="372" width="920" height="148" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The only thing that breaks is the thing nobody counted as a user</text>
    <text x="500" y="424" text-anchor="middle" font-size="12" fill="#3d3d3d">A script that types into the old sign-in page is not a user AWS can notify, and it fails on the day</text>
    <text x="500" y="444" text-anchor="middle" font-size="12" fill="#3d3d3d">the page changes shape &#8212; not with an error you can read, but as a login that no longer completes.</text>
    <text x="500" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">AWS&#8217;s guidance is not to make the automation work. It is to stop automating the interface</text>
    <text x="500" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">and use supported programmatic access instead.</text>
  </g>
</svg>
