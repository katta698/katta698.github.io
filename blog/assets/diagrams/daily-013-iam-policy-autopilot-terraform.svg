<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Policy Autopilot generates the deployment policy from a Terraform plan, which is a different policy from the runtime policy a workload needs">
  <title>IAM Policy Autopilot now reads Terraform plan files and produces a policy scoped to the CRUD functions of the resources in that plan. That is the policy the deploying principal needs, and it is not the policy the workload needs at runtime. A deployment's permissions are knowable because a deployment is a declaration; a workload's often are not, because a workload responds to input. That asymmetry is why plan-file support is possible at all, and it is also why this does nothing about an over-broad execution role.</title>
  <rect width="1000" height="440" fill="#F8F7F5"/>
  <defs>
    <marker id="pa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Two policies, one word</text>

    <rect x="40" y="56" width="440" height="176" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="260" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1d8102">Deployment policy &#8212; now generated</text>

    <rect x="66" y="100" width="150" height="52" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="141" y="122" text-anchor="middle" font-size="12" fill="#0f1111">Terraform plan</text>
    <text x="141" y="140" text-anchor="middle" font-size="11" fill="#6c757d">a declaration</text>

    <rect x="304" y="100" width="150" height="52" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.4"/>
    <text x="379" y="122" text-anchor="middle" font-size="12" fill="#0f1111">Scoped policy</text>
    <text x="379" y="140" text-anchor="middle" font-size="11" fill="#6c757d">specific ARNs</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#pa-arrow)" fill="none">
      <line x1="220" y1="126" x2="300" y2="126"/>
    </g>
    <text x="260" y="118" text-anchor="middle" font-size="11" fill="#1d8102">deterministic</text>

    <text x="66" y="178" font-size="12" fill="#3d3d3d">Held by the pipeline principal.</text>
    <text x="66" y="198" font-size="12" fill="#3d3d3d">Lives for the duration of an apply.</text>
    <text x="66" y="220" font-size="12" font-weight="700" fill="#1d8102">Knowable, because it is declared.</text>

    <rect x="520" y="56" width="440" height="176" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="740" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">Runtime policy &#8212; untouched by this</text>

    <rect x="546" y="100" width="150" height="52" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="621" y="122" text-anchor="middle" font-size="12" fill="#0f1111">Whatever happens</text>
    <text x="621" y="140" text-anchor="middle" font-size="11" fill="#cc0c39">at execution time</text>

    <rect x="784" y="100" width="150" height="52" rx="4" fill="#ffffff" stroke="#cc0c39" stroke-width="1.4"/>
    <text x="859" y="122" text-anchor="middle" font-size="12" fill="#0f1111">Execution role</text>
    <text x="859" y="140" text-anchor="middle" font-size="11" fill="#cc0c39">often broad</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#pa-arrow)" fill="none">
      <line x1="700" y1="126" x2="780" y2="126"/>
    </g>
    <text x="740" y="118" text-anchor="middle" font-size="11" fill="#cc0c39">not in any plan</text>

    <text x="546" y="178" font-size="12" fill="#3d3d3d">Which bucket on which message.</text>
    <text x="546" y="198" font-size="12" fill="#3d3d3d">Which secret on the failure path.</text>
    <text x="546" y="220" font-size="12" font-weight="700" fill="#cc0c39">Not knowable in advance.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="252" width="920" height="80" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="500" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">The asymmetry is the reason the feature exists</text>
    <text x="500" y="302" text-anchor="middle" font-size="12" fill="#3d3d3d">A deployment&#8217;s permissions can be derived because a deployment <tspan font-weight="700">is</tspan> a declaration of what it will make.</text>
    <text x="500" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">A workload&#8217;s cannot, because a workload responds to input &#8212; which is why broad defaults exist.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="348" width="920" height="76" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">Two things this does not do</text>
    <text x="500" y="398" text-anchor="middle" font-size="12" fill="#3d3d3d">It does not narrow an execution role. A plan cannot see runtime behaviour, and no version will.</text>
    <text x="500" y="416" text-anchor="middle" font-size="12" fill="#3d3d3d">It does not judge what you deploy. A narrow pipeline can still create a public bucket.</text>
  </g>
</svg>
