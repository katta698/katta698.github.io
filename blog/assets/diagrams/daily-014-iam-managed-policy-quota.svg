<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="The managed policy quota doubled for roles only: users stayed at ten, groups cannot be raised at all, and session policies still cap at ten managed policy ARNs">
  <title>The managed policies per role quota moved from ten to twenty by default, and can be raised to twenty-five through Service Quotas. Nothing else moved. Managed policies per user stay at a default of ten with a maximum of twenty, and managed policies per group stay at ten with a maximum of ten, which means groups cannot be raised at all. Session policies remain capped at ten managed policy ARNs, with the JSON document and all ARN characters combined limited to 2,048. So the relief applies to one principal type, and a role assumed with session policies still meets the old limit.</title>
  <rect width="1000" height="460" fill="#F8F7F5"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">One number moved. Three did not.</text>

    <rect x="40" y="54" width="920" height="150" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="200" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#6c757d">ATTACHED TO</text>
    <text x="480" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#6c757d">DEFAULT</text>
    <text x="700" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#6c757d">MAXIMUM</text>
    <text x="880" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#6c757d">CHANGED?</text>
    <line x1="64" y1="92" x2="936" y2="92" stroke="#e5e5e5"/>

    <rect x="64" y="100" width="872" height="30" rx="3" fill="#f6f9f4"/>
    <text x="200" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Role</text>
    <text x="480" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">20</text>
    <text x="700" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">25</text>
    <text x="880" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">was 10</text>

    <text x="200" y="152" text-anchor="middle" font-size="13" fill="#0f1111">User</text>
    <text x="480" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">10</text>
    <text x="700" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">20</text>
    <text x="880" y="152" text-anchor="middle" font-size="12" fill="#6c757d">no</text>

    <text x="200" y="182" text-anchor="middle" font-size="13" fill="#0f1111">Group</text>
    <text x="480" y="182" text-anchor="middle" font-size="13" fill="#3d3d3d">10</text>
    <text x="700" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">10</text>
    <text x="880" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">cannot be raised</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="226" width="920" height="98" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">The role you assume with session policies still meets the old ceiling</text>
    <text x="500" y="278" text-anchor="middle" font-size="12" fill="#3d3d3d">&#8220;You can pass a maximum of 10 managed policy ARNs when you create a session.&#8221;</text>
    <text x="500" y="298" text-anchor="middle" font-size="12" fill="#3d3d3d">And the JSON document plus all passed ARN characters combined cannot exceed 2,048.</text>
    <text x="500" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">Twenty on the role does not become twenty in the session.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="40" y="344" width="440" height="100" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="260" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">What did not get bigger</text>
    <text x="66" y="394" font-size="12" fill="#3d3d3d">Each managed policy: 6,144 characters.</text>
    <text x="66" y="414" font-size="12" fill="#3d3d3d">Role inline policy total: 10,240 characters.</text>
    <text x="66" y="434" font-size="12" font-weight="700" fill="#0f1111">More documents, same size each.</text>

    <rect x="520" y="344" width="440" height="100" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="740" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">What the old limit was doing</text>
    <text x="546" y="394" font-size="12" fill="#3d3d3d">Ten forced consolidation. It ended</text>
    <text x="546" y="414" font-size="12" fill="#3d3d3d">arguments and kept roles legible.</text>
    <text x="546" y="434" font-size="12" font-weight="700" fill="#cc0c39">Twenty removes the forcing function.</text>
  </g>
</svg>
