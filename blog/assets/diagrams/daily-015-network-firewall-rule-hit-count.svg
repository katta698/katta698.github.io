<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Hit counts derive from alert logs, so stateless rules, pass rules and traffic never forwarded to the stateful engine all report zero while being fully live">
  <title>A packet meets the stateless engine first. Only traffic explicitly forwarded reaches the stateful engine, so anything passed or dropped before that point can never appear in a log. Inside the stateful engine only the drop, alert and reject actions send alerts, and hit counts are derived from those alert logs. Pass rules send no alert, so the allow-list reports zero while matching continuously. Stateless rules are not tracked at all. Three different kinds of live rule therefore show a hit count of zero, and only a fourth kind is genuinely dead.</title>
  <rect width="1000" height="560" fill="#F8F7F5"/>
  <defs>
    <marker id="nf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
    <marker id="nf-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0c39"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Where a hit count comes from, and what it never sees</text>

    <rect x="30" y="56" width="130" height="54" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="95" y="80" text-anchor="middle" font-size="12" fill="#0f1111">Packet</text>
    <text x="95" y="98" text-anchor="middle" font-size="11" fill="#6c757d">arrives</text>

    <rect x="200" y="46" width="230" height="126" rx="4" fill="#ffffff" stroke="#6c757d" stroke-width="1.4"/>
    <text x="315" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Stateless engine</text>
    <text x="315" y="92" text-anchor="middle" font-size="11" fill="#3d3d3d">Pass &#183; Drop &#183; Forward to stateful</text>
    <rect x="216" y="106" width="198" height="50" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.2"/>
    <text x="315" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">Blind spot 1</text>
    <text x="315" y="144" text-anchor="middle" font-size="11" fill="#3d3d3d">Stateless rules are not tracked</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#nf-arrow)" fill="none">
      <line x1="164" y1="83" x2="194" y2="83"/>
      <line x1="434" y1="83" x2="464" y2="83"/>
    </g>
    <text x="449" y="72" text-anchor="middle" font-size="10" fill="#6c757d">forward</text>

    <rect x="470" y="46" width="270" height="126" rx="4" fill="#ffffff" stroke="#6c757d" stroke-width="1.4"/>
    <text x="605" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Stateful engine (Suricata)</text>
    <rect x="486" y="82" width="238" height="34" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.2"/>
    <text x="605" y="104" text-anchor="middle" font-size="11" fill="#1d8102">DROP &#183; ALERT &#183; REJECT &#8594; send alert</text>
    <rect x="486" y="122" width="238" height="34" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.2"/>
    <text x="605" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">PASS &#8594; no alert, no count</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#nf-arrow)" fill="none">
      <line x1="744" y1="99" x2="784" y2="99"/>
    </g>

    <rect x="790" y="46" width="180" height="126" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="880" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1111">Alert logs</text>
    <text x="880" y="94" text-anchor="middle" font-size="11" fill="#3d3d3d">CloudWatch Logs &#183; S3</text>
    <rect x="806" y="108" width="148" height="48" rx="4" fill="#ffffff" stroke="#C4A484" stroke-width="1.4"/>
    <text x="880" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1111">Top Rule Hits</text>
    <text x="880" y="146" text-anchor="middle" font-size="10" fill="#6c757d">the counts you see</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="200" y="192" width="230" height="46" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.2"/>
    <text x="315" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">Blind spot 2</text>
    <text x="315" y="228" text-anchor="middle" font-size="11" fill="#3d3d3d">Never forwarded, so never logged</text>
    <g stroke="#cc0c39" stroke-width="1.4" marker-end="url(#nf-arrow-red)" fill="none" stroke-dasharray="4 3">
      <line x1="315" y1="176" x2="315" y2="188"/>
    </g>

    <rect x="470" y="192" width="270" height="46" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.2"/>
    <text x="605" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">Blind spot 3</text>
    <text x="605" y="228" text-anchor="middle" font-size="11" fill="#3d3d3d">The allow-list is invisible to the counter</text>
    <g stroke="#cc0c39" stroke-width="1.4" marker-end="url(#nf-arrow-red)" fill="none" stroke-dasharray="4 3">
      <line x1="605" y1="176" x2="605" y2="188"/>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="266" width="940" height="122" rx="4" fill="#ffffff" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">A hit count of zero has four meanings, and only one of them is &#8220;delete it&#8221;</text>

    <rect x="50" y="306" width="216" height="64" rx="4" fill="#fdf2f2" stroke="#e5e5e5"/>
    <text x="158" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">It is a pass rule</text>
    <text x="158" y="344" text-anchor="middle" font-size="10.5" fill="#3d3d3d">Matching constantly, alerting</text>
    <text x="158" y="360" text-anchor="middle" font-size="10.5" fill="#3d3d3d">never. Deleting it drops traffic.</text>

    <rect x="278" y="306" width="216" height="64" rx="4" fill="#fdf2f2" stroke="#e5e5e5"/>
    <text x="386" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">It is a stateless rule</text>
    <text x="386" y="344" text-anchor="middle" font-size="10.5" fill="#3d3d3d">Not tracked at all, so its</text>
    <text x="386" y="360" text-anchor="middle" font-size="10.5" fill="#3d3d3d">absence looks like inactivity.</text>

    <rect x="506" y="306" width="216" height="64" rx="4" fill="#fdf2f2" stroke="#e5e5e5"/>
    <text x="614" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#cc0c39">It is unreachable</text>
    <text x="614" y="344" text-anchor="middle" font-size="10.5" fill="#3d3d3d">Traffic was handled before the</text>
    <text x="614" y="360" text-anchor="middle" font-size="10.5" fill="#3d3d3d">forward. A gap, not dead weight.</text>

    <rect x="734" y="306" width="216" height="64" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.2"/>
    <text x="842" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#1d8102">It really is dead</text>
    <text x="842" y="344" text-anchor="middle" font-size="10.5" fill="#3d3d3d">The case the feature was built</text>
    <text x="842" y="360" text-anchor="middle" font-size="10.5" fill="#3d3d3d">for &#8212; and one case in four.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="408" width="940" height="126" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">What to do before pruning anything</text>
    <text x="56" y="460" font-size="11.5" fill="#3d3d3d">1.  Confirm alert logging is enabled and durable. Without it there is nothing to count, and the zeros mean nothing at all.</text>
    <text x="56" y="482" font-size="11.5" fill="#3d3d3d">2.  Inventory the ruleset by action first. The share that is pass or stateless is your blind spot, expressed as a number.</text>
    <text x="56" y="504" font-size="11.5" fill="#3d3d3d">3.  Add the alert keyword to pass rules for a bounded window, then remove it. Allow-lists carry the high-volume traffic.</text>
    <text x="56" y="526" font-size="11.5" font-weight="700" fill="#cc0c39">4.  Size the window to your slowest real cycle. A rule that fires quarterly is indistinguishable from a dead one over 30 days.</text>
  </g>
</svg>
