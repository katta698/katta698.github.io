<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="Glue 6.0 upgrades the runtime and adds Iceberg v3, but v3 tables cannot be read by Athena and the new types work only with Spark DataFrames">
  <title>AWS Glue 6.0 raises Spark to 4.1.1, Scala to 2.13.17, Python to 3.13 and Iceberg to 1.11.0 with format version 3 support. The headline capability is narrower than it appears. Iceberg tables written at format version 3 cannot be read by Athena SQL, which returns Cannot read unsupported version 3, and AWS recommends staying on version 2 for cross-engine compatibility. The new v3 data types work only with Spark DataFrames, not with Glue's own DynamicFrames, and not in Visual ETL. Underneath that, the upgrade is a Spark 4 migration: EMRFS is removed, AWS SDK for Java v1 is removed, Scala 2.12 jars must be recompiled, and ANSI mode is on by default so overflows throw instead of returning null.</title>
  <rect width="1000" height="560" fill="#F8F7F5"/>
  <defs>
    <marker id="g6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
    <marker id="g6-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0c39"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Glue 6.0: what the runtime gains, and where the headline feature stops</text>

    <rect x="30" y="52" width="440" height="150" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="250" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#1d8102">The runtime, 5.1 to 6.0</text>
    <text x="56" y="100" font-size="11.5" fill="#3d3d3d">Spark      3.5.6   &#8594;  4.1.1</text>
    <text x="56" y="122" font-size="11.5" fill="#3d3d3d">Scala      2.12.18 &#8594;  2.13.17</text>
    <text x="56" y="144" font-size="11.5" fill="#3d3d3d">Python     3.11    &#8594;  3.13</text>
    <text x="56" y="166" font-size="11.5" fill="#3d3d3d">Iceberg    1.10.0  &#8594;  1.11.0</text>
    <text x="56" y="188" font-size="11.5" fill="#3d3d3d">Java SDK   v1 + v2 &#8594;  v2 only (2.44.6)</text>

    <rect x="500" y="52" width="470" height="150" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="735" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#cc0c39">A Spark 4 migration, not a version bump</text>
    <text x="524" y="100" font-size="11.5" fill="#3d3d3d">EMRFS removed &#8212; S3A is the only S3 filesystem</text>
    <text x="524" y="122" font-size="11.5" fill="#3d3d3d">AWS SDK for Java v1 removed &#8212; com.amazonaws.* is gone</text>
    <text x="524" y="144" font-size="11.5" fill="#3d3d3d">Scala 2.12 jars fail &#8212; recompile every --extra-jars entry</text>
    <text x="524" y="166" font-size="11.5" font-weight="700" fill="#cc0c39">ANSI mode ON &#8212; overflow throws where it used to write NULL</text>
    <text x="524" y="188" font-size="11.5" fill="#6c757d">The last one changes results rather than failing the build.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="222" width="940" height="164" rx="4" fill="#ffffff" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#cc0c39">Iceberg v3: who can write it, and who cannot read it</text>

    <rect x="56" y="262" width="180" height="52" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.2"/>
    <text x="146" y="283" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d8102">Spark DataFrames</text>
    <text x="146" y="301" text-anchor="middle" font-size="11" fill="#3d3d3d">can use the v3 types</text>

    <rect x="56" y="322" width="180" height="52" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.2"/>
    <text x="146" y="343" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cc0c39">DynamicFrames</text>
    <text x="146" y="361" text-anchor="middle" font-size="11" fill="#3d3d3d">cannot &#8212; nor can Visual ETL</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#g6-arrow)" fill="none">
      <line x1="240" y1="288" x2="292" y2="288"/>
    </g>

    <rect x="298" y="262" width="200" height="112" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="398" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1111">Iceberg table</text>
    <text x="398" y="308" text-anchor="middle" font-size="11" fill="#3d3d3d">format-version = 3</text>
    <text x="398" y="332" text-anchor="middle" font-size="11" fill="#6c757d">VARIANT with shredding</text>
    <text x="398" y="350" text-anchor="middle" font-size="11" fill="#6c757d">nanosecond timestamps</text>
    <text x="398" y="366" text-anchor="middle" font-size="11" fill="#6c757d">Geometry and Geography</text>

    <g stroke="#6c757d" stroke-width="1.6" marker-end="url(#g6-arrow)" fill="none">
      <line x1="502" y1="300" x2="554" y2="300"/>
    </g>

    <rect x="560" y="262" width="180" height="52" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.2"/>
    <text x="650" y="283" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d8102">Glue Spark jobs</text>
    <text x="650" y="301" text-anchor="middle" font-size="11" fill="#3d3d3d">read it back fine</text>

    <rect x="560" y="322" width="180" height="52" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="650" y="343" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cc0c39">Athena SQL</text>
    <text x="650" y="361" text-anchor="middle" font-size="11" fill="#cc0c39">Cannot read unsupported version 3</text>

    <rect x="764" y="262" width="182" height="112" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.4"/>
    <text x="855" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cc0c39">AWS's own advice</text>
    <text x="855" y="310" text-anchor="middle" font-size="11" fill="#3d3d3d">Use Iceberg v2 for</text>
    <text x="855" y="328" text-anchor="middle" font-size="11" fill="#3d3d3d">cross-engine compatibility</text>
    <text x="855" y="346" text-anchor="middle" font-size="11" fill="#3d3d3d">with Athena.</text>
    <text x="855" y="366" text-anchor="middle" font-size="10.5" fill="#6c757d">So leave format-version at 2.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="406" width="940" height="126" rx="4" fill="#fff8f0" stroke="#C4A484" stroke-width="1.6"/>
    <text x="500" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">Two more things the announcement does not say</text>
    <rect x="56" y="444" width="430" height="72" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="271" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f1111">Deletion vectors and row lineage</text>
    <text x="271" y="486" text-anchor="middle" font-size="11" fill="#3d3d3d">are not new here. Both have shipped since</text>
    <text x="271" y="504" text-anchor="middle" font-size="11" fill="#3d3d3d">Glue 5.1. If they were your reason, you have them.</text>
    <rect x="514" y="444" width="430" height="72" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="729" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cc0c39">Fine-grained access control</text>
    <text x="729" y="486" text-anchor="middle" font-size="11" fill="#3d3d3d">does not work with VARIANT columns &#8212; the very</text>
    <text x="729" y="504" text-anchor="middle" font-size="11" fill="#3d3d3d">type meant to hold semi-structured data.</text>
  </g>
</svg>
