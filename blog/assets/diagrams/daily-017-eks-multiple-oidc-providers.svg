<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;" role="img" aria-label="EKS now associates up to ten OIDC identity providers per cluster on Kubernetes 1.32 and later, sharing a 12 KB configuration budget, with username and group prefixes deciding whether identities from different providers can collide">
  <title>Amazon EKS now allows up to ten external OIDC identity providers on a single cluster, replacing the previous limit of one. Three constraints sit behind that headline. The feature requires Kubernetes version 1.32 or later, and on earlier versions only one provider can be associated. All provider configurations together must be smaller than 12 KB, which is a single shared budget rather than a per-provider one. IAM authentication cannot be disabled, because it is still required for nodes to join the cluster. When a request arrives, the API server tries each configured authenticator in turn until one accepts the token. The username the accepted token produces is what every RoleBinding and ClusterRoleBinding is written against, so the username prefix decides whether two providers can mint the same Kubernetes identity. If no prefix is set and the username claim is anything other than email, the prefix defaults to the issuer URL followed by a hash character. Setting the prefix to a single hyphen disables prefixing entirely, which is what allows two different providers to produce the same username.</title>
  <rect width="1000" height="640" fill="#F8F7F5"/>
  <defs>
    <marker id="o17-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1111">Ten OIDC providers per cluster &#8212; and the three limits the headline does not carry</text>

    <rect x="30" y="48" width="300" height="112" rx="4" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.6"/>
    <text x="180" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d3b">A version floor</text>
    <text x="50" y="94" font-size="11.5" fill="#3d3d3d">Kubernetes 1.32 or later: up to 10</text>
    <text x="50" y="114" font-size="11.5" fill="#3d3d3d">Earlier than 1.32: exactly 1</text>
    <text x="50" y="138" font-size="11" fill="#6c757d">1.32 left standard support on</text>
    <text x="50" y="153" font-size="11" fill="#6c757d">23 March 2026 &#8212; it is the paid tier</text>

    <rect x="350" y="48" width="300" height="112" rx="4" fill="#ffffff" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="500" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#cc0c39">One shared 12 KB budget</text>
    <text x="370" y="94" font-size="11.5" fill="#3d3d3d">All provider configs combined</text>
    <text x="370" y="114" font-size="11.5" fill="#3d3d3d">must total under 12 KB</text>
    <text x="370" y="138" font-size="11" fill="#6c757d">Not 12 KB each. Ten providers</text>
    <text x="370" y="153" font-size="11" fill="#6c757d">average 1,228.8 bytes apiece.</text>

    <rect x="670" y="48" width="300" height="112" rx="4" fill="#ffffff" stroke="#1d8102" stroke-width="1.6"/>
    <text x="820" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d8102">IAM does not go away</text>
    <text x="690" y="94" font-size="11.5" fill="#3d3d3d">IAM authentication cannot be</text>
    <text x="690" y="114" font-size="11.5" fill="#3d3d3d">disabled &#8212; nodes join with it</text>
    <text x="690" y="138" font-size="11" fill="#6c757d">OIDC is added alongside IAM,</text>
    <text x="690" y="153" font-size="11" fill="#6c757d">never in place of it.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="180" width="940" height="212" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.4"/>
    <text x="500" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">What a request actually meets</text>

    <rect x="52" y="222" width="196" height="42" rx="4" fill="#f7f4ef" stroke="#8a6d3b" stroke-width="1.2"/>
    <text x="150" y="240" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d3d3d">corp-okta</text>
    <text x="150" y="256" text-anchor="middle" font-size="10.5" fill="#6c757d">employees</text>

    <rect x="52" y="278" width="196" height="42" rx="4" fill="#f7f4ef" stroke="#8a6d3b" stroke-width="1.2"/>
    <text x="150" y="296" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d3d3d">partner-entra</text>
    <text x="150" y="312" text-anchor="middle" font-size="10.5" fill="#6c757d">contractors</text>

    <rect x="52" y="334" width="196" height="42" rx="4" fill="#f7f4ef" stroke="#8a6d3b" stroke-width="1.2"/>
    <text x="150" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d3d3d">ci-provider</text>
    <text x="150" y="368" text-anchor="middle" font-size="10.5" fill="#6c757d">pipelines</text>

    <line x1="252" y1="299" x2="336" y2="299" stroke="#6c757d" stroke-width="1.4" marker-end="url(#o17-arrow)"/>

    <rect x="342" y="222" width="288" height="154" rx="4" fill="#f4f7fa" stroke="#31708f" stroke-width="1.6"/>
    <text x="486" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#31708f">EKS control plane</text>
    <text x="362" y="272" font-size="11" fill="#3d3d3d">Authenticators are tried in turn</text>
    <text x="362" y="294" font-size="11" fill="#3d3d3d">until one accepts the token.</text>
    <text x="362" y="322" font-size="11" fill="#6c757d">Issuer must be publicly reachable</text>
    <text x="362" y="340" font-size="11" fill="#6c757d">so the control plane can fetch keys.</text>
    <text x="362" y="362" font-size="11" fill="#6c757d">No self-signed certificates.</text>

    <line x1="634" y1="299" x2="694" y2="299" stroke="#6c757d" stroke-width="1.4" marker-end="url(#o17-arrow)"/>

    <rect x="700" y="222" width="246" height="154" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
    <text x="823" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1111">A Kubernetes username</text>
    <text x="718" y="272" font-size="11" fill="#3d3d3d">This string is what every</text>
    <text x="718" y="290" font-size="11" fill="#3d3d3d">RoleBinding is written against.</text>
    <text x="718" y="318" font-size="11" fill="#6c757d">Which provider issued the token</text>
    <text x="718" y="336" font-size="11" fill="#6c757d">is not recorded anywhere in it,</text>
    <text x="718" y="354" font-size="11" fill="#6c757d">unless a prefix puts it there.</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="30" y="410" width="940" height="204" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.4"/>
    <text x="500" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1111">Prefixes were cosmetic with one provider. With ten they are the boundary.</text>

    <rect x="52" y="450" width="430" height="148" rx="4" fill="#fdf2f2" stroke="#cc0c39" stroke-width="1.6"/>
    <text x="267" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#cc0c39">usernamePrefix set to "-" on both</text>
    <text x="70" y="496" font-size="11" fill="#3d3d3d">corp-okta issues a token for alice</text>
    <text x="70" y="514" font-size="11" fill="#3d3d3d">partner-entra issues a token for alice</text>
    <text x="70" y="540" font-size="11.5" font-weight="700" fill="#cc0c39">Both authenticate as: alice</text>
    <text x="70" y="564" font-size="11" fill="#6c757d">One RoleBinding now grants two people from</text>
    <text x="70" y="580" font-size="11" fill="#6c757d">two different directories the same access.</text>

    <rect x="518" y="450" width="430" height="148" rx="4" fill="#f6f9f4" stroke="#1d8102" stroke-width="1.6"/>
    <text x="733" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#1d8102">A distinct prefix per provider</text>
    <text x="536" y="496" font-size="11" fill="#3d3d3d">corp-okta uses prefix corp:</text>
    <text x="536" y="514" font-size="11" fill="#3d3d3d">partner-entra uses prefix partner:</text>
    <text x="536" y="540" font-size="11.5" font-weight="700" fill="#1d8102">corp:alice and partner:alice</text>
    <text x="536" y="564" font-size="11" fill="#6c757d">Two namespaces that cannot overlap, and a</text>
    <text x="536" y="580" font-size="11" fill="#6c757d">binding that says which directory it trusts.</text>
  </g>
</svg>
