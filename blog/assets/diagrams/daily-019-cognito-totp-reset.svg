<svg viewBox="0 0 860 470" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="An administrator calls AdminDeleteSoftwareToken. The call removes the user's software token registration and their TOTP preference but leaves other registered factors intact, returning an empty HTTP 200. The next sign-in then branches two ways: if MFA is required and no other factor remains, Cognito returns an MFA underscore SETUP challenge and the user re-enrols, a path an AWS WAF CAPTCHA rule can break; if another factor such as SMS is still registered, sign-in falls back to it silently and the account's authentication strength is downgraded.">
  <title>AdminDeleteSoftwareToken: one call, two outcomes, one response code</title>
  <rect width="860" height="470" fill="#F8F7F5"/>

  <text x="44" y="34" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">One call, two outcomes, and the same empty 200 either way</text>
  <text x="44" y="55" font-family="Georgia, serif" font-size="11" fill="#6B6560">What happens at the next sign-in depends on what factors are left, not on anything the API tells you.</text>

  <rect x="44" y="86" width="196" height="82" rx="4" fill="#FFFFFF" stroke="#C4A484" stroke-width="1.5"/>
  <text x="58" y="108" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">Administrator</text>
  <text x="58" y="126" font-family="Georgia, serif" font-size="10" fill="#4A4440">AdminDeleteSoftwareToken</text>
  <text x="58" y="142" font-family="Georgia, serif" font-size="10" fill="#6B6560">UserPoolId + Username</text>
  <text x="58" y="158" font-family="Georgia, serif" font-size="10" fill="#8A6A44">needs an IAM policy grant</text>

  <line x1="240" y1="127" x2="288" y2="127" stroke="#8A8078" stroke-width="1.5"/>
  <polygon points="296,127 284,122 284,132" fill="#8A8078"/>

  <rect x="296" y="80" width="230" height="94" rx="4" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="310" y="102" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">Cognito user pool</text>
  <text x="310" y="120" font-family="Georgia, serif" font-size="10" fill="#4A4440">removes the software token</text>
  <text x="310" y="136" font-family="Georgia, serif" font-size="10" fill="#4A4440">removes the TOTP preference</text>
  <text x="310" y="152" font-family="Georgia, serif" font-size="10" fill="#3D9970">leaves other factors registered</text>
  <text x="310" y="168" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#6B6560">HTTP 200, empty body</text>

  <line x1="526" y1="127" x2="566" y2="127" stroke="#8A8078" stroke-width="1.5"/>
  <line x1="566" y1="127" x2="566" y2="96" stroke="#8A8078" stroke-width="1.5"/>
  <line x1="566" y1="127" x2="566" y2="300" stroke="#8A8078" stroke-width="1.5"/>
  <line x1="566" y1="96" x2="596" y2="96" stroke="#8A8078" stroke-width="1.5"/>
  <polygon points="604,96 592,91 592,101" fill="#8A8078"/>
  <line x1="566" y1="300" x2="596" y2="300" stroke="#8A8078" stroke-width="1.5"/>
  <polygon points="604,300 592,295 592,305" fill="#8A8078"/>

  <text x="574" y="212" font-family="Georgia, serif" font-size="10" fill="#6B6560">next sign-in</text>

  <rect x="604" y="62" width="212" height="112" rx="4" fill="#3D9970" opacity="0.07"/>
  <rect x="604" y="62" width="212" height="112" rx="4" fill="none" stroke="#3D9970" stroke-width="1.5"/>
  <text x="616" y="82" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#2E7355">RECOVERY</text>
  <text x="616" y="100" font-family="Georgia, serif" font-size="10" fill="#1D2322">MFA required, no other factor</text>
  <text x="616" y="118" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322">MFA_SETUP challenge</text>
  <text x="616" y="136" font-family="Georgia, serif" font-size="10" fill="#4A4440">user registers a new device</text>
  <text x="616" y="156" font-family="Georgia, serif" font-size="10" fill="#4A4440">account strength unchanged</text>

  <rect x="604" y="252" width="212" height="112" rx="4" fill="#C4A484" opacity="0.10"/>
  <rect x="604" y="252" width="212" height="112" rx="4" fill="none" stroke="#B8860B" stroke-width="1.5"/>
  <text x="616" y="272" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8A6A44">SILENT DOWNGRADE</text>
  <text x="616" y="290" font-family="Georgia, serif" font-size="10" fill="#1D2322">another factor still registered</text>
  <text x="616" y="308" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322">sign-in falls back to SMS</text>
  <text x="616" y="326" font-family="Georgia, serif" font-size="10" fill="#4A4440">no challenge, no re-enrolment</text>
  <text x="616" y="346" font-family="Georgia, serif" font-size="10" fill="#8A6A44">still reports MFA, weaker factor</text>

  <line x1="710" y1="174" x2="710" y2="200" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="710,208 705,196 715,196" fill="#B8860B"/>
  <rect x="596" y="182" width="228" height="26" rx="3" fill="#F8F7F5"/>
  <text x="604" y="199" font-family="Georgia, serif" font-size="10" fill="#8A6A44">a WAF CAPTCHA rule can break this step</text>

  <line x1="44" y1="392" x2="816" y2="392" stroke="#E2DDD6" stroke-width="1"/>
  <text x="44" y="412" font-family="Georgia, serif" font-size="10.5" fill="#1D2322">Read the user&#8217;s registered factors before calling. The API authorizes on the user pool, not on the user, and cannot tell the two branches apart.</text>
  <text x="44" y="430" font-family="Georgia, serif" font-size="10.5" fill="#1D2322">Exclude the AssociateSoftwareToken and VerifySoftwareToken values of x-amzn-cognito-operation-name from any CAPTCHA action.</text>
  <text x="44" y="448" font-family="Georgia, serif" font-size="10" fill="#8A8078">Secondary replica Regions can reject the operation with OperationNotEnabledException &#8212; point support tooling at the primary Region.</text>
</svg>
