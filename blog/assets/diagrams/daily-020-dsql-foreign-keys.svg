<svg viewBox="0 0 860 566" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Two concurrent Aurora DSQL sessions on a timeline. Session A begins, deletes a row from the products table and commits successfully. Session B begins slightly later, inserts a row into the orders table referencing that product, and fails at commit with error OC000 SQLSTATE 40001 because the foreign key placed an implicit KEY SHARE dependency on the parent row. Below, three panels describe what changes for every write once a foreign key exists: extra reads on all DML against referenced or referencing tables, a widened conflict surface at commit, and cascading deletes running inside the three thousand row transaction limit.">
  <title>How an Aurora DSQL foreign key turns two independent transactions into conflicting ones</title>
  <rect width="860" height="566" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">The conflict a foreign key creates that was not there yesterday</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">No locks are taken. The constraint is verified against the start snapshot, then adjudicated at commit.</text>

  <rect x="44" y="76" width="772" height="150" fill="#FFFFFF" stroke="#E2DDD6" stroke-width="1"/>

  <text x="60" y="98" font-family="Georgia, serif" font-size="10" fill="#8A7A6A">SESSION A &#183; deletes the parent</text>
  <text x="60" y="150" font-family="Georgia, serif" font-size="10" fill="#4A7BA0">SESSION B &#183; inserts the child</text>

  <line x1="180" y1="112" x2="560" y2="112" stroke="#C4A484" stroke-width="2.5"/>
  <circle cx="180" cy="112" r="4.5" fill="#C4A484"/>
  <circle cx="270" cy="112" r="4.5" fill="#C4A484"/>
  <circle cx="560" cy="112" r="6" fill="#3D9970"/>
  <text x="180" y="128" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">BEGIN</text>
  <text x="278" y="105" font-family="Georgia, serif" font-size="10" fill="#8A6A44">DELETE FROM products WHERE product_id = 1</text>
  <text x="560" y="128" font-family="Georgia, serif" font-size="9.5" font-weight="bold" fill="#2E7355" text-anchor="middle">COMMIT ok</text>

  <line x1="230" y1="164" x2="680" y2="164" stroke="#4A90D9" stroke-width="2.5"/>
  <circle cx="230" cy="164" r="4.5" fill="#4A90D9"/>
  <circle cx="330" cy="164" r="4.5" fill="#4A90D9"/>
  <circle cx="680" cy="164" r="6" fill="#B5654A"/>
  <text x="230" y="180" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">BEGIN</text>
  <text x="338" y="157" font-family="Georgia, serif" font-size="10" fill="#3A6F9F">INSERT INTO orders VALUES (100, 1, 5)</text>
  <text x="680" y="180" font-family="Georgia, serif" font-size="9.5" font-weight="bold" fill="#8F4A32" text-anchor="middle">COMMIT fails</text>

  <line x1="560" y1="118" x2="560" y2="158" stroke="#B5654A" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="700" y="150" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">OC000</text>
  <text x="700" y="164" font-family="Georgia, serif" font-size="9.5" fill="#8F4A32">SQLSTATE</text>
  <text x="700" y="177" font-family="Georgia, serif" font-size="9.5" fill="#8F4A32">40001</text>

  <line x1="60" y1="200" x2="800" y2="200" stroke="#E2DDD6" stroke-width="1"/>
  <text x="60" y="216" font-family="Georgia, serif" font-size="10" fill="#6B6560">Session B read the parent at its own start snapshot, where product 1 still existed. The delete landed first, so B is adjudicated out.</text>

  <text x="44" y="256" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1D2322">What changes for every write once the constraint exists</text>

  <rect x="44" y="268" width="248" height="122" fill="#C4A484" opacity="0.10"/>
  <rect x="44" y="268" width="248" height="122" fill="none" stroke="#C4A484" stroke-width="1"/>
  <text x="60" y="290" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8A6A44">1 &#183; Extra reads on all DML</text>
  <text x="60" y="310" font-family="Georgia, serif" font-size="10" fill="#3D3833">Every insert, update and delete on a</text>
  <text x="60" y="325" font-family="Georgia, serif" font-size="10" fill="#3D3833">referenced or referencing table now</text>
  <text x="60" y="340" font-family="Georgia, serif" font-size="10" fill="#3D3833">reads the other table to verify.</text>
  <text x="60" y="362" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">AWS says benchmark before adding</text>
  <text x="60" y="377" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">the constraint.</text>

  <rect x="306" y="268" width="248" height="122" fill="#4A90D9" opacity="0.08"/>
  <rect x="306" y="268" width="248" height="122" fill="none" stroke="#4A90D9" stroke-width="1"/>
  <text x="322" y="290" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3A6F9F">2 &#183; A wider conflict surface</text>
  <text x="322" y="310" font-family="Georgia, serif" font-size="10" fill="#3D3833">Referenced rows get an implicit</text>
  <text x="322" y="325" font-family="Georgia, serif" font-size="10" fill="#3D3833">KEY SHARE. A child insert now</text>
  <text x="322" y="340" font-family="Georgia, serif" font-size="10" fill="#3D3833">conflicts with any delete or key</text>
  <text x="322" y="355" font-family="Georgia, serif" font-size="10" fill="#3D3833">change on the parent.</text>
  <text x="322" y="377" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Non-key updates still do not.</text>

  <rect x="568" y="268" width="248" height="122" fill="#B5654A" opacity="0.09"/>
  <rect x="568" y="268" width="248" height="122" fill="none" stroke="#B5654A" stroke-width="1"/>
  <text x="584" y="290" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">3 &#183; CASCADE meets the row cap</text>
  <text x="584" y="310" font-family="Georgia, serif" font-size="10" fill="#3D3833">A transaction can modify up to</text>
  <text x="584" y="325" font-family="Georgia, serif" font-size="10" fill="#3D3833">3,000 rows. Cascaded deletes are</text>
  <text x="584" y="340" font-family="Georgia, serif" font-size="10" fill="#3D3833">DML in that same transaction.</text>
  <text x="584" y="362" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Test a wide parent before trusting</text>
  <text x="584" y="377" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">ON DELETE CASCADE.</text>

  <rect x="44" y="410" width="772" height="76" fill="#EDE8E2"/>
  <text x="60" y="432" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">The design lever AWS names explicitly</text>
  <text x="60" y="452" font-family="Georgia, serif" font-size="10.5" fill="#3D3833">Key columns are those in a unique, non-partial, non-expression index. A concurrent UPDATE to a non-key column does not conflict.</text>
  <text x="60" y="472" font-family="Georgia, serif" font-size="10.5" fill="#3D3833">So move frequently-changing values off the referenced key, and a hot parent row stops rejecting its own children at commit.</text>

  <line x1="44" y1="512" x2="816" y2="512" stroke="#E2DDD6" stroke-width="1"/>
  <text x="44" y="532" font-family="Georgia, serif" font-size="10.5" fill="#1D2322">Nothing here blocks. OCC turns waiting into failing, so the cost of a constraint is paid in retries rather than in latency.</text>
  <text x="44" y="550" font-family="Georgia, serif" font-size="10" fill="#8A8078">Isolation is fixed at Repeatable Read. Both OC000 and OC001 are safe to retry; retry with exponential backoff and jitter.</text>
</svg>
