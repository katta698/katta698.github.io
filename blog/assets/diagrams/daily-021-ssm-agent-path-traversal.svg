<svg viewBox="0 0 860 470" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of the SSM Agent path traversal. A caller whose IAM policy allows only one SSM document sends a command. The SSM Agent, which runs as root, resolves the destination path in the aws:downloadContent plugin. A traversed path writes a file outside the intended directory, onto a root-owned path, which can lead to code execution. Below, three cards give the affected agent versions 2.0.767.0 through 3.3.4364.0, the fixed version 3.3.4515.0 with no workaround, and the exposure window: automatic agent updates check every two weeks and are off until switched on.">
  <title>How a scoped SendCommand permission reaches a root-owned file through the aws:downloadContent plugin</title>
  <rect width="860" height="470" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">The IAM policy bounded the document, not the file system</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">CVE-2026-81849. The permission looks scoped. The plugin that runs underneath it writes as root.</text>

  <rect x="44" y="80" width="230" height="110" rx="3" fill="#C4A484" opacity="0.14"/>
  <rect x="44" y="80" width="230" height="110" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="60" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8A6A44">Caller with scoped SendCommand</text>
  <text x="60" y="124" font-family="Georgia, serif" font-size="10" fill="#6B6560">The identity policy names one</text>
  <text x="60" y="139" font-family="Georgia, serif" font-size="10" fill="#6B6560">document ARN and one tag set.</text>
  <text x="60" y="163" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#3D2E20">Reads as a privilege boundary.</text>

  <line x1="274" y1="135" x2="294" y2="135" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 294 131 L 300 135 L 294 139 Z" fill="#C9C3BC"/>

  <rect x="300" y="80" width="250" height="110" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="300" y="80" width="250" height="110" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="316" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">SSM Agent, running as root</text>
  <text x="316" y="124" font-family="Georgia, serif" font-size="10" fill="#6B6560">aws:downloadContent resolves the</text>
  <text x="316" y="139" font-family="Georgia, serif" font-size="10" fill="#6B6560">destination path from the request.</text>
  <text x="316" y="163" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">The path is where the check was missing.</text>

  <line x1="550" y1="135" x2="570" y2="135" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 570 131 L 576 135 L 570 139 Z" fill="#C9C3BC"/>

  <rect x="576" y="80" width="240" height="110" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="576" y="80" width="240" height="110" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="592" y="104" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">Write outside the directory</text>
  <text x="592" y="124" font-family="Georgia, serif" font-size="10" fill="#6B6560">A root-owned system file is</text>
  <text x="592" y="139" font-family="Georgia, serif" font-size="10" fill="#6B6560">overwritten.</text>
  <text x="592" y="163" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">Arbitrary code execution follows.</text>

  <rect x="44" y="210" width="772" height="52" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="60" y="232" font-family="Georgia, serif" font-size="10.5" fill="#3D2E20">What the policy actually granted: the right to make the agent act. Every ssm:SendCommand grant is a grant of root on the target instance,</text>
  <text x="60" y="249" font-family="Georgia, serif" font-size="10.5" fill="#3D2E20">bounded only by the correctness of the plugin the document invokes. Document scoping narrows intent, not blast radius.</text>

  <rect x="44" y="300" width="250" height="106" rx="3" fill="none" stroke="#C9C3BC" stroke-width="1.2"/>
  <text x="60" y="324" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">Affected</text>
  <text x="60" y="344" font-family="Georgia, serif" font-size="10" fill="#6B6560">amazon-ssm-agent from</text>
  <text x="60" y="359" font-family="Georgia, serif" font-size="10" fill="#6B6560">2.0.767.0 to 3.3.4364.0.</text>
  <text x="60" y="382" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#3D2E20">Years of releases, not a</text>
  <text x="60" y="396" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#3D2E20">recent regression.</text>

  <rect x="305" y="300" width="250" height="106" rx="3" fill="none" stroke="#C9C3BC" stroke-width="1.2"/>
  <text x="321" y="324" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">Fixed</text>
  <text x="321" y="344" font-family="Georgia, serif" font-size="10" fill="#6B6560">Upgrade to 3.3.4515.0</text>
  <text x="321" y="359" font-family="Georgia, serif" font-size="10" fill="#6B6560">or later.</text>
  <text x="321" y="382" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">No workaround is offered.</text>
  <text x="321" y="396" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8F4A32">Upgrading is the control.</text>

  <rect x="566" y="300" width="250" height="106" rx="3" fill="none" stroke="#C9C3BC" stroke-width="1.2"/>
  <text x="582" y="324" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">Exposure window</text>
  <text x="582" y="344" font-family="Georgia, serif" font-size="10" fill="#6B6560">Auto update is a setting you</text>
  <text x="582" y="359" font-family="Georgia, serif" font-size="10" fill="#6B6560">turn on, and it checks every</text>
  <text x="582" y="374" font-family="Georgia, serif" font-size="10" fill="#6B6560">two weeks.</text>
  <text x="582" y="396" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#3D2E20">On is not the same as today.</text>

  <text x="44" y="440" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">A second bulletin the same day: CVE-2026-81838, a Zip Slip in awsdac 0.10 through 0.23, fixed in 0.24. Same class, different tool.</text>
  <text x="44" y="458" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Path handling in software that runs privileged is where both of them live.</text>
</svg>
