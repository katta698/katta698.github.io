<svg viewBox="0 0 860 462" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of AWS Agent Registry. A record moves from publisher to draft to pending approval to approved, and only then is it discoverable; rejected and deprecated records leave the flow. Two ways in: a publisher submits a record, or organization-wide auto-detection finds agents and MCP servers running on AgentCore Runtime and Gateway across every account and files them as drafts. Two ways out: humans through the AWS APIs and console, and agents and IDEs through a native MCP endpoint, authorised by IAM credentials or JWT from a corporate identity provider. Four record types: MCP, Agent, Skill and Custom, with MCP and agent records validated against their protocol schemas. The closing point is that the approved set is the set an agent can discover, so the approval queue is an allowlist.">
  <title>How a record reaches discovery in AWS Agent Registry, and why the approval queue is an allowlist</title>
  <rect width="860" height="462" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">Only approved records are discoverable</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Which makes the curator's queue the thing that decides what an agent in your organisation can find and use.</text>

  <rect x="44" y="80" width="140" height="66" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="114" y="108" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322" text-anchor="middle">Publisher</text>
  <text x="114" y="126" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">Describes an MCP server,</text>
  <text x="114" y="138" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">agent, skill or resource</text>

  <line x1="184" y1="113" x2="208" y2="113" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 208 109 L 214 113 L 208 117 Z" fill="#C9C3BC"/>

  <rect x="214" y="80" width="140" height="66" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="284" y="108" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322" text-anchor="middle">Draft</text>
  <text x="284" y="126" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">Not discoverable.</text>
  <text x="284" y="138" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">Where auto-detection lands.</text>

  <line x1="354" y1="113" x2="378" y2="113" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 378 109 L 384 113 L 378 117 Z" fill="#C9C3BC"/>

  <rect x="384" y="80" width="150" height="66" rx="3" fill="#C4A484" opacity="0.16"/>
  <rect x="384" y="80" width="150" height="66" rx="3" fill="none" stroke="#C4A484" stroke-width="1.5"/>
  <text x="459" y="108" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8A6A44" text-anchor="middle">Pending approval</text>
  <text x="459" y="126" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">A curator reviews.</text>
  <text x="459" y="138" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">EventBridge fires here.</text>

  <line x1="534" y1="113" x2="558" y2="113" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 558 109 L 564 113 L 558 117 Z" fill="#C9C3BC"/>

  <rect x="564" y="80" width="110" height="66" rx="3" fill="#8A9A5B" opacity="0.16"/>
  <rect x="564" y="80" width="110" height="66" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="619" y="108" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#5F6E38" text-anchor="middle">Approved</text>
  <text x="619" y="128" font-family="Georgia, serif" font-size="9.5" fill="#3D4A22" text-anchor="middle">Discoverable.</text>

  <line x1="674" y1="113" x2="698" y2="113" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 698 109 L 704 113 L 698 117 Z" fill="#C9C3BC"/>

  <rect x="704" y="80" width="112" height="66" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="760" y="108" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322" text-anchor="middle">Consumers</text>
  <text x="760" y="126" font-family="Georgia, serif" font-size="9.5" fill="#6B6560" text-anchor="middle">People and agents</text>

  <text x="459" y="166" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#8F4A32" text-anchor="middle">Rejected and deprecated records leave the flow &#8212; an administrator can remove discoverability at any time.</text>

  <rect x="44" y="186" width="376" height="104" rx="3" fill="none" stroke="#C9C3BC" stroke-width="1.2"/>
  <text x="60" y="208" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">Two ways a record arrives</text>
  <text x="60" y="228" font-family="Georgia, serif" font-size="10" fill="#3D2E20">A publisher writes one and submits it for approval.</text>
  <text x="60" y="248" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Or organisation-wide auto-detection finds agents and MCP</text>
  <text x="60" y="262" font-family="Georgia, serif" font-size="10" fill="#3D2E20">servers already running on AgentCore Runtime and Gateway</text>
  <text x="60" y="276" font-family="Georgia, serif" font-size="10" fill="#3D2E20">across every account, and files them as drafts.</text>

  <rect x="440" y="186" width="376" height="104" rx="3" fill="none" stroke="#C9C3BC" stroke-width="1.2"/>
  <text x="456" y="208" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1D2322">Two ways it is read</text>
  <text x="456" y="228" font-family="Georgia, serif" font-size="10" fill="#3D2E20">People, through the service APIs, the CLI and the SDKs.</text>
  <text x="456" y="248" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Agents and IDEs, through a native MCP endpoint that speaks</text>
  <text x="456" y="262" font-family="Georgia, serif" font-size="10" fill="#3D2E20">the same protocol as the things it catalogues. Authorisation</text>
  <text x="456" y="276" font-family="Georgia, serif" font-size="10" fill="#3D2E20">is IAM credentials or JWT from your identity provider.</text>

  <rect x="44" y="306" width="772" height="44" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="60" y="325" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">Four record types: MCP &#183; Agent &#183; Skill &#183; Custom</text>
  <text x="60" y="341" font-family="Georgia, serif" font-size="10" fill="#6B6560">MCP and agent records are validated against their respective protocol schemas. Custom takes any valid JSON descriptor.</text>

  <rect x="44" y="366" width="772" height="52" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="44" y="366" width="772" height="52" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="386" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">The part that is not documentation hygiene</text>
  <text x="60" y="405" font-family="Georgia, serif" font-size="10" fill="#3D4A22">The approved set is the set an agent can discover and use. That makes the curator's queue an allowlist, and the reviewer a security role.</text>

  <text x="44" y="446" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Generally available in five Regions. Auto-detection covers AgentCore Runtime and Gateway &#8212; agents on Lambda, ECS or a laptop are not in scope.</text>
</svg>
