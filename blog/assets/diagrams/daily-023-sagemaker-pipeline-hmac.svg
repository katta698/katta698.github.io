<svg viewBox="0 0 860 436" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of CVE-2026-83551. The @remote and @step decorators serialise a function and its arguments to S3. The pipeline definition holds the HMAC signing key in cleartext. DescribePipeline, a read permission, returns that definition and therefore the key. An attacker with the key can forge a signed payload that executes in another user's pipeline context in the same account. Below, the fix replaces symmetric HMAC signing with asymmetric ECDSA so the key left in the definition is a harmless public key; and the step most people will miss, which is that upgrading the SDK does not rewrite pipeline definitions that already exist — each one must be re-upserted. Affected versions are SageMaker Python SDK v3 below 3.11.0 and v2 below 2.256.0.">
  <title>How a read permission became a code execution permission in the SageMaker Python SDK, and the remediation step that is easy to miss</title>
  <rect width="860" height="436" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">The signing key was in the thing anyone could read</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">CVE-2026-83551. A symmetric key stored beside the payload it authenticates is not a signature, it is a formality.</text>

  <rect x="44" y="80" width="180" height="80" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="60" y="102" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322">@remote / @step</text>
  <text x="60" y="122" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Your function and its</text>
  <text x="60" y="135" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">arguments are serialised</text>
  <text x="60" y="148" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">and stored in S3.</text>

  <line x1="224" y1="120" x2="242" y2="120" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 242 116 L 248 120 L 242 124 Z" fill="#C9C3BC"/>

  <rect x="248" y="80" width="180" height="80" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="248" y="80" width="180" height="80" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="264" y="102" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8F4A32">Pipeline definition</text>
  <text x="264" y="122" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">Carries the HMAC key</text>
  <text x="264" y="135" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">that signs the payload.</text>
  <text x="264" y="150" font-family="Georgia, serif" font-size="9.5" font-weight="bold" fill="#8F4A32">In cleartext.</text>

  <line x1="428" y1="120" x2="446" y2="120" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 446 116 L 452 120 L 446 124 Z" fill="#C9C3BC"/>

  <rect x="452" y="80" width="180" height="80" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="452" y="80" width="180" height="80" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="468" y="102" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8F4A32">DescribePipeline</text>
  <text x="468" y="122" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">A read permission.</text>
  <text x="468" y="135" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">Returns the definition,</text>
  <text x="468" y="148" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">and therefore the key.</text>

  <line x1="632" y1="120" x2="650" y2="120" stroke="#C9C3BC" stroke-width="1.5"/>
  <path d="M 650 116 L 656 120 L 650 124 Z" fill="#C9C3BC"/>

  <rect x="656" y="80" width="160" height="80" rx="3" fill="#B5654A" opacity="0.16"/>
  <rect x="656" y="80" width="160" height="80" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="672" y="102" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8F4A32">Forged payload</text>
  <text x="672" y="122" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">Signs as you. Runs in</text>
  <text x="672" y="135" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">another user's pipeline</text>
  <text x="672" y="148" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">context, same account.</text>

  <rect x="44" y="190" width="376" height="112" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="44" y="190" width="376" height="112" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="212" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">The fix changes the cryptography</text>
  <text x="60" y="234" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Symmetric HMAC signing is replaced with asymmetric</text>
  <text x="60" y="249" font-family="Georgia, serif" font-size="10" fill="#3D4A22">ECDSA. The key that remains in the definition is then</text>
  <text x="60" y="264" font-family="Georgia, serif" font-size="10" fill="#3D4A22">a public key, and reading it grants nothing.</text>
  <text x="60" y="288" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">This is a design change, not a patched check.</text>

  <rect x="440" y="190" width="376" height="112" rx="3" fill="#B5654A" opacity="0.10"/>
  <rect x="440" y="190" width="376" height="112" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="456" y="212" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">The step that gets missed</text>
  <text x="456" y="234" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Upgrading the SDK does not rewrite pipeline definitions</text>
  <text x="456" y="249" font-family="Georgia, serif" font-size="10" fill="#3D2E20">that already exist. Until each one is re-upserted, the</text>
  <text x="456" y="264" font-family="Georgia, serif" font-size="10" fill="#3D2E20">cleartext symmetric key is still sitting in it.</text>
  <text x="456" y="288" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">pip install is half the remediation.</text>

  <rect x="44" y="322" width="772" height="48" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="60" y="342" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">Affected: SageMaker Python SDK v3 below 3.11.0, and v2 below 2.256.0</text>
  <text x="60" y="360" font-family="Georgia, serif" font-size="10" fill="#6B6560">Interim control while you upgrade: restrict sagemaker:DescribePipeline to trusted users, and give each user a dedicated S3 path.</text>

  <text x="44" y="400" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">The general lesson is not about SageMaker. Any design that stores a symmetric key next to the data it protects has an audience problem, and</text>
  <text x="44" y="416" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">the audience is everyone who can read the container. A read permission over metadata is a write permission over anything the metadata authenticates.</text>
</svg>
