<svg viewBox="0 0 860 452" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of three S3 Object Lock retention mechanisms drawn as timelines. Fixed retention starts its clock at write time and expires on a retain-until-date known in advance. A legal hold protects from write time for an indefinite period, and protection ends the instant the hold is removed. Variable retention places an event hold at write time and protects while the hold is on; when the hold is released, Amazon S3 fixes the retain-until-date at the release time plus the configured duration, so protection begins at release rather than ending. A panel at the bottom records that while the hold is on the retain-until-date is a moving projection computed as the current time plus the duration, that decreasing the duration never moves the date earlier because it ratchets, and that a separately specified retain-until-date acts as a minimum floor with the effective date being the later of the two.">
  <title>Releasing a legal hold ends protection; releasing an event hold starts it</title>
  <rect width="860" height="452" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">Same verb, opposite outcome</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Three ways to hold an object, and where each one starts counting.</text>

  <!-- axis labels -->
  <text x="150" y="88" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">write</text>
  <text x="470" y="88" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">the event</text>
  <text x="742" y="88" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">deletable</text>

  <!-- Fixed retention -->
  <text x="44" y="118" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">Fixed retention</text>
  <rect x="150" y="126" width="300" height="26" rx="3" fill="#5B7B9A" opacity="0.22"/>
  <rect x="150" y="126" width="300" height="26" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="164" y="144" font-family="Georgia, serif" font-size="10" fill="#2E4256">protected &#8212; clock started at write</text>
  <line x1="450" y1="120" x2="450" y2="158" stroke="#5B7B9A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="462" y="144" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">retain-until-date, known in advance</text>

  <!-- Legal hold -->
  <text x="44" y="192" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">Legal hold</text>
  <rect x="150" y="200" width="320" height="26" rx="3" fill="#B5654A" opacity="0.18"/>
  <rect x="150" y="200" width="320" height="26" rx="3" fill="none" stroke="#B5654A" stroke-width="1.2"/>
  <text x="164" y="218" font-family="Georgia, serif" font-size="10" fill="#3D2E20">protected &#8212; indefinitely, no clock at all</text>
  <line x1="470" y1="194" x2="470" y2="232" stroke="#B5654A" stroke-width="1.8"/>
  <text x="482" y="213" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8F4A32">remove the hold &#8594; protection ends here</text>
  <text x="482" y="228" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">nothing follows it</text>

  <!-- Variable retention -->
  <text x="44" y="266" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">Variable retention</text>
  <text x="44" y="281" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#5F6E38">new</text>
  <rect x="150" y="274" width="320" height="26" rx="3" fill="#C4A484" opacity="0.20"/>
  <rect x="150" y="274" width="320" height="26" rx="3" fill="none" stroke="#C4A484" stroke-width="1.2"/>
  <text x="164" y="292" font-family="Georgia, serif" font-size="10" fill="#3D2E20">protected &#8212; while the event hold is on</text>
  <line x1="470" y1="268" x2="470" y2="306" stroke="#8A9A5B" stroke-width="1.8"/>
  <rect x="470" y="274" width="272" height="26" rx="3" fill="#8A9A5B" opacity="0.20"/>
  <rect x="470" y="274" width="272" height="26" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.2"/>
  <text x="484" y="292" font-family="Georgia, serif" font-size="10" fill="#3D4A22">release the hold &#8594; the duration starts</text>
  <line x1="742" y1="268" x2="742" y2="306" stroke="#8A9A5B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="754" y="292" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">fixed at</text>
  <text x="754" y="305" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">release + duration</text>

  <rect x="44" y="338" width="772" height="76" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.2"/>
  <text x="60" y="362" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">Before release, the retain-until-date is a projection rather than a promise</text>
  <text x="60" y="383" font-family="Georgia, serif" font-size="10" fill="#2E4256">&#8226; While the hold is on, S3 computes it as the current time plus the duration, so the date moves forward as time passes.</text>
  <text x="60" y="398" font-family="Georgia, serif" font-size="10" fill="#2E4256">&#8226; It ratchets: decreasing the duration never moves the date earlier. A separately specified retain-until-date acts as a minimum floor.</text>

  <text x="44" y="440" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">Free in every Region including China. Individual objects, a bucket default, or an existing estate through S3 Batch Operations.</text>
</svg>
