<svg viewBox="0 0 860 496" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram showing that an unmanaged EC2 instance is one symptom with many causes. The left panel holds the network family that Systems Manager diagnosed before: security group and HTTPS configuration, DNS and DNS hostname configuration, VPC endpoint configuration, and network ACL configuration. The right panel holds the six categories added on 9 September 2026: IAM roles and permissions, SSM Agent version, instance status checks, operating system configuration, Default Host Management Configuration, and hybrid activation. A panel across the bottom separates findings that come with an Automation remediation runbook from findings that come with written guidance only, and records that operating system issues are diagnosed by analysing the instance console output and cannot be automatically remediated because doing so requires direct access to the operating system that has been lost, and that network ACL findings and unattached VPC endpoint subnets also have no runbook.">
  <title>An unmanaged instance is one symptom sitting on ten categories of cause</title>
  <rect width="860" height="496" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">&#8220;Unmanaged&#8221; is a symptom. These are the causes.</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">An instance Systems Manager cannot manage cannot be patched, reached or inventoried &#8212; and it is missing from the report, not failing in it.</text>

  <!-- previously covered -->
  <rect x="44" y="82" width="376" height="196" rx="3" fill="#C9C3BC" opacity="0.24"/>
  <rect x="44" y="82" width="376" height="196" rx="3" fill="none" stroke="#C9C3BC" stroke-width="1.5"/>
  <text x="60" y="106" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3D2E20">Already diagnosed &#183; the network family</text>

  <text x="60" y="134" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Security groups and HTTPS</text>
  <text x="60" y="149" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">outbound 443; endpoint SGs inbound 443</text>
  <text x="60" y="172" font-family="Georgia, serif" font-size="10" fill="#3D2E20">DNS and DNS hostnames</text>
  <text x="60" y="187" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">enableDnsSupport, enableDnsHostnames</text>
  <text x="60" y="210" font-family="Georgia, serif" font-size="10" fill="#3D2E20">VPC endpoints</text>
  <text x="60" y="225" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">ssm, ssmmessages, ec2messages</text>
  <text x="60" y="248" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Network ACLs</text>
  <text x="60" y="263" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">stateless &#8212; needs 443 out and 1024&#8211;65535 in</text>

  <!-- newly added -->
  <rect x="440" y="82" width="376" height="196" rx="3" fill="#8A9A5B" opacity="0.13"/>
  <rect x="440" y="82" width="376" height="196" rx="3" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="456" y="106" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5F6E38">Added 9 September &#183; six categories</text>

  <text x="456" y="132" font-family="Georgia, serif" font-size="10" fill="#3D4A22">IAM roles and permissions</text>
  <text x="456" y="146" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">no instance profile; missing managed policy</text>
  <text x="456" y="167" font-family="Georgia, serif" font-size="10" fill="#3D4A22">SSM Agent version</text>
  <text x="456" y="181" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">older than the minimum supported</text>
  <text x="456" y="202" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Instance status checks</text>
  <text x="456" y="216" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Operating system configuration</text>
  <text x="456" y="230" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">agent stopped; kernel panic; disk full</text>
  <text x="456" y="251" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Default Host Management Configuration</text>
  <text x="456" y="265" font-family="Georgia, serif" font-size="10" fill="#3D4A22">Hybrid activation</text>

  <!-- remediable vs not -->
  <rect x="44" y="302" width="376" height="118" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="44" y="302" width="376" height="118" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="60" y="326" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">Comes with a runbook</text>
  <text x="60" y="349" font-family="Georgia, serif" font-size="10" fill="#2E4256">Security group updates</text>
  <text x="60" y="366" font-family="Georgia, serif" font-size="10" fill="#2E4256">Enabling VPC DNS attributes</text>
  <text x="60" y="383" font-family="Georgia, serif" font-size="10" fill="#2E4256">Creating missing PrivateLink endpoints</text>
  <text x="60" y="406" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">Billed as Automation runbook executions.</text>

  <rect x="440" y="302" width="376" height="118" rx="3" fill="#B5654A" opacity="0.11"/>
  <rect x="440" y="302" width="376" height="118" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="456" y="326" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">Guidance only</text>
  <text x="456" y="349" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Network ACL findings</text>
  <text x="456" y="366" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Subnet not attached to an existing endpoint</text>
  <text x="456" y="383" font-family="Georgia, serif" font-size="10" fill="#3D2E20">Every operating system finding</text>
  <text x="456" y="406" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#8F4A32">Remediation &#8220;requires direct access to the OS&#8221;.</text>

  <text x="44" y="452" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1D2322">The loop worth noticing</text>
  <text x="44" y="470" font-family="Georgia, serif" font-size="10" fill="#3D2E20">The agent is down because the root volume is full; the full volume is why you cannot use the agent to clear it. Systems Manager reads the instance</text>
  <text x="44" y="485" font-family="Georgia, serif" font-size="10" fill="#3D2E20">console output, so it can now name that situation &#8212; which is not the same as being able to fix it.</text>
</svg>
