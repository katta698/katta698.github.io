<svg viewBox="0 0 860 462" style="width:100%;max-width:860px;" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of what the CloudWatch network health indicator covers on a path crossing a Transit Gateway inter-Region peering connection. A probe originates from a VPC subnet in the local Region, crosses the AWS network to the Transit Gateway peering connection, and continues to a destination in the remote Region. The indicator covers only the segment from the probe source up to the peering connection; the onward segment beyond it is outside what the indicator reports, so a problem there produces the same zero as no problem at all. The indicator is a binary CloudWatch metric in which one hundred means degradation was observed within the AWS controlled path and zero means no degradation was observed, derived by anomaly detection rather than measured directly. A panel lists three caveats: the indicator is delayed by a few hours whenever a monitor or probe is created, added or reactivated; it is not accurate for Direct Connect attachments that use intermediary routing with Cloud WAN; and probes crossing a Transit Gateway inter-Region peering connection can send up to 240 packets per second to each destination.">
  <title>The network health indicator is a derived bit covering one segment of the path</title>
  <rect width="860" height="462" fill="#F8F7F5"/>

  <text x="44" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1D2322">One bit that answers &#8220;is it AWS?&#8221; &#8212; for part of the path</text>
  <text x="44" y="57" font-family="Georgia, serif" font-size="11" fill="#6B6560">Derived by anomaly detection, not measured. And unavailable for hours after you create the monitor.</text>

  <!-- path -->
  <rect x="44" y="88" width="170" height="64" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="58" y="112" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">Probe source</text>
  <text x="58" y="130" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">A VPC subnet, local Region.</text>
  <text x="58" y="144" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">ICMP or TCP, every 30&#8211;60s.</text>

  <text x="223" y="126" font-family="Georgia, serif" font-size="15" fill="#8A6A44">&#8594;</text>

  <rect x="244" y="88" width="180" height="64" rx="3" fill="#EDE8E2" stroke="#C9C3BC" stroke-width="1"/>
  <text x="258" y="112" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#3D2E20">AWS network</text>
  <text x="258" y="130" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Round-trip time and packet</text>
  <text x="258" y="144" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">loss measured along here.</text>

  <text x="433" y="126" font-family="Georgia, serif" font-size="15" fill="#8A6A44">&#8594;</text>

  <rect x="454" y="88" width="180" height="64" rx="3" fill="#C4A484" opacity="0.22"/>
  <rect x="454" y="88" width="180" height="64" rx="3" fill="none" stroke="#C4A484" stroke-width="1.8"/>
  <text x="468" y="112" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#8A6A44">TGW peering connection</text>
  <text x="468" y="130" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">The indicator stops here.</text>
  <text x="468" y="144" font-family="Georgia, serif" font-size="9.5" fill="#3D2E20">Up to 240 pps per destination.</text>

  <text x="643" y="126" font-family="Georgia, serif" font-size="15" fill="#C9C3BC">&#8594;</text>

  <rect x="664" y="88" width="152" height="64" rx="3" fill="none" stroke="#C9C3BC" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="678" y="112" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#6B6560">Remote Region</text>
  <text x="678" y="130" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">Not covered by the</text>
  <text x="678" y="144" font-family="Georgia, serif" font-size="9.5" fill="#6B6560">indicator.</text>

  <!-- coverage bracket -->
  <line x1="44" y1="166" x2="634" y2="166" stroke="#8A9A5B" stroke-width="2"/>
  <line x1="44" y1="162" x2="44" y2="172" stroke="#8A9A5B" stroke-width="2"/>
  <line x1="634" y1="162" x2="634" y2="172" stroke="#8A9A5B" stroke-width="2"/>
  <text x="60" y="186" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#5F6E38">what NHI reports on &#8212; &#8220;the AWS network path up to the Transit Gateway peering connection&#8221;</text>

  <!-- values -->
  <rect x="44" y="206" width="376" height="94" rx="3" fill="#B5654A" opacity="0.11"/>
  <rect x="44" y="206" width="376" height="94" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="60" y="230" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">The two values, read precisely</text>
  <text x="60" y="253" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#8F4A32">100</text>
  <text x="98" y="253" font-family="Georgia, serif" font-size="10" fill="#3D2E20">degradation observed in the AWS path</text>
  <text x="60" y="272" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#3D2E20">0</text>
  <text x="98" y="272" font-family="Georgia, serif" font-size="10" fill="#3D2E20">no degradation <tspan font-style="italic">observed</tspan> &#8212; not &#8220;healthy&#8221;</text>
  <text x="60" y="291" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">A fault past the peering connection also reads 0.</text>

  <rect x="440" y="206" width="376" height="94" rx="3" fill="#5B7B9A" opacity="0.12"/>
  <rect x="440" y="206" width="376" height="94" rx="3" fill="none" stroke="#5B7B9A" stroke-width="1.5"/>
  <text x="456" y="230" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#3F5A73">How it is produced</text>
  <text x="456" y="253" font-family="Georgia, serif" font-size="10" fill="#2E4256">Statistical correlation across AWS sample</text>
  <text x="456" y="267" font-family="Georgia, serif" font-size="10" fill="#2E4256">datasets plus your probes&#8217; loss and latency,</text>
  <text x="456" y="281" font-family="Georgia, serif" font-size="10" fill="#2E4256">collapsed to one bit by anomaly detection.</text>
  <text x="456" y="295" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#6B6560">An inference, and the docs say so.</text>

  <rect x="44" y="324" width="772" height="78" rx="3" fill="none" stroke="#B5654A" stroke-width="1.5"/>
  <text x="60" y="348" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8F4A32">Three caveats worth recording next to the alarm</text>
  <text x="60" y="369" font-family="Georgia, serif" font-size="10" fill="#3D2E20">&#8226; Delayed by a few hours each time you create a monitor, add a probe, or re-activate one &#8212; it cannot be stood up during an incident.</text>
  <text x="60" y="384" font-family="Georgia, serif" font-size="10" fill="#3D2E20">&#8226; &#8220;Not accurate for Direct Connect attachments that use intermediary routing with Cloud WAN.&#8221;</text>
  <text x="60" y="399" font-family="Georgia, serif" font-size="10" fill="#3D2E20">&#8226; Probes across the peering connection send up to 240 packets per second per destination, over a billable inter-Region link.</text>

  <text x="44" y="438" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#6B6560">$0.10 per monitored resource per hour. Three subnets is about $216 a month, before the CloudWatch metrics themselves.</text>
</svg>
