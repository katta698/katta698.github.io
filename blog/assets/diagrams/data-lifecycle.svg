<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" style="width:100%;max-width:860px;" role="img" aria-label="The five stages data moves through, left to right: ingest, store, transform, serve, decide. Governance runs underneath all five rather than sitting between them.">
  <title>The data lifecycle: five stages in a row, with governance underneath</title>
  <rect width="860" height="300" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Georgia, serif" font-size="15" fill="#2B3330">The path a row of data takes</text>
  <text x="44" y="58" font-family="DM Sans, Segoe UI, sans-serif" font-size="10.5" fill="#6E7A75">Five stages, left to right. The sixth is not a step; it sits under all of them.</text>

  <g font-family="DM Sans, Segoe UI, sans-serif">
    <!-- Ingest -->
    <rect x="44" y="84" width="140" height="74" rx="9" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1"/>
    <text x="58" y="106" font-size="12.5" font-weight="600" fill="#2B3330">1 &#183; Ingest</text>
    <text x="58" y="125" font-size="10" fill="#6E7A75">Batch and stream,</text>
    <text x="58" y="139" font-size="10" fill="#6E7A75">out of the source</text>

    <!-- Store -->
    <rect x="200" y="84" width="140" height="74" rx="9" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1"/>
    <text x="214" y="106" font-size="12.5" font-weight="600" fill="#2B3330">2 &#183; Store</text>
    <text x="214" y="125" font-size="10" fill="#6E7A75">Object storage, an</text>
    <text x="214" y="139" font-size="10" fill="#6E7A75">open table format</text>

    <!-- Transform -->
    <rect x="356" y="84" width="140" height="74" rx="9" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1"/>
    <text x="370" y="106" font-size="12.5" font-weight="600" fill="#2B3330">3 &#183; Transform</text>
    <text x="370" y="125" font-size="10" fill="#6E7A75">Join, type, model it</text>
    <text x="370" y="139" font-size="10" fill="#6E7A75">into something true</text>

    <!-- Serve -->
    <rect x="512" y="84" width="140" height="74" rx="9" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1"/>
    <text x="526" y="106" font-size="12.5" font-weight="600" fill="#2B3330">4 &#183; Serve</text>
    <text x="526" y="125" font-size="10" fill="#6E7A75">The engine a query</text>
    <text x="526" y="139" font-size="10" fill="#6E7A75">actually lands on</text>

    <!-- Decide -->
    <rect x="668" y="84" width="148" height="74" rx="9" fill="#FFFFFF" stroke="#C9884B" stroke-width="1.4"/>
    <text x="682" y="106" font-size="12.5" font-weight="600" fill="#2B3330">5 &#183; Decide</text>
    <text x="682" y="125" font-size="10" fill="#6E7A75">A dashboard, a model,</text>
    <text x="682" y="139" font-size="10" fill="#6E7A75">or a decision made</text>

    <!-- flow arrows -->
    <g stroke="#B9B2A4" stroke-width="1.4" fill="none">
      <path d="M184,121 L198,121"/>
      <path d="M340,121 L354,121"/>
      <path d="M496,121 L510,121"/>
      <path d="M652,121 L666,121"/>
    </g>
    <g fill="#B9B2A4">
      <path d="M198,121 L192,118 L192,124 Z"/>
      <path d="M354,121 L348,118 L348,124 Z"/>
      <path d="M510,121 L504,118 L504,124 Z"/>
      <path d="M666,121 L660,118 L660,124 Z"/>
    </g>

    <!-- Govern, underneath all five -->
    <rect x="44" y="190" width="772" height="62" rx="9" fill="#F1EDE4" stroke="#D8D3C8" stroke-width="1"/>
    <text x="58" y="213" font-size="12.5" font-weight="600" fill="#2B3330">6 &#183; Govern</text>
    <text x="58" y="232" font-size="10" fill="#6E7A75">What you have, where it came from, who may see it, and whether it is still correct.</text>
    <text x="58" y="246" font-size="10" fill="#6E7A75">Not a step between two others. A property of all five, or of none of them.</text>

    <!-- ties from each stage down to the govern band -->
    <g stroke="#D8D3C8" stroke-width="1" stroke-dasharray="3 4">
      <path d="M114,158 L114,190"/>
      <path d="M270,158 L270,190"/>
      <path d="M426,158 L426,190"/>
      <path d="M582,158 L582,190"/>
      <path d="M742,158 L742,190"/>
    </g>
  </g>

  <text x="44" y="278" font-family="DM Sans, Segoe UI, sans-serif" font-size="9.5" fill="#8A9289">Stage 5 is the only one a business ever asks for. The other five are why it works.</text>
</svg>
