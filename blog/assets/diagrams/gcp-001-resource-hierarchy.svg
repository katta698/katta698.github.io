<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the Google Cloud resource hierarchy nested inside itself, from organization through folders to project and resources, with what each level is a boundary for and the limit that applies at each one">
  <title>Google Cloud resource hierarchy: organization, folders, project, resource</title>
  <rect x="0" y="0" width="860" height="470" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Four levels, one parent each</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Allow policies attach at any level and flow down. A resource&#8217;s effective policy is the union of its own and its parent&#8217;s.</text>

  <rect x="44" y="76" width="500" height="352" rx="8" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Organization</text>
  <text x="60" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The root. Provisioned from Cloud Identity or Workspace, not by hand.</text>

  <rect x="64" y="126" width="460" height="286" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="80" y="147" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Folders &#8212; optional, up to 10 levels deep</text>
  <text x="80" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A parent holds at most 300 direct child folders. Grouping only.</text>

  <rect x="84" y="176" width="420" height="236" rx="7" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="100" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Project</text>
  <text x="100" y="214" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Where quota is counted and where a billing account is attached.</text>
  <text x="100" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The ID is permanent, globally unique, and never reusable.</text>

  <rect x="104" y="242" width="380" height="152" rx="7" fill="#F4F8FC" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="120" y="264" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Service resources</text>
  <text x="120" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">VM instances, buckets, datasets, clusters. Every one of them</text>
  <text x="120" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">has exactly one parent project.</text>

  <rect x="124" y="312" width="340" height="66" rx="6" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="140" y="333" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Deleting the project deletes all of it</text>
  <text x="140" y="349" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Soft-deleted first, fully deleted after 30 days, and still</text>
  <text x="140" y="364" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">counting against quota for the whole of that window.</text>

  <text x="576" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">What binds at each level</text>

  <rect x="576" y="112" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="590" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Organization</text>
  <text x="590" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">1,000 tag keys</text>
  <text x="590" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">1,000 values per key</text>

  <rect x="576" y="180" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="590" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Folder</text>
  <text x="590" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">10 levels of nesting</text>
  <text x="590" y="230" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">300 direct children</text>

  <rect x="576" y="248" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="590" y="268" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Project</text>
  <text x="590" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Quota counted here</text>
  <text x="590" y="298" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">One billing account</text>
  <text x="590" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">ID: 6 to 30 characters</text>

  <rect x="576" y="330" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="590" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Any level</text>
  <text x="590" y="366" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">500 deny policies</text>
  <text x="590" y="380" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">500 deny rules total</text>

  <text x="44" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Deny policies are checked before allow policies, so a deny at any level above a resource wins over every role granted below it.</text>
</svg>
