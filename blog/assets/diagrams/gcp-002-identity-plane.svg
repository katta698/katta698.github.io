<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the identity plane and the resource plane on Google Cloud, showing a Cloud Identity or Workspace account bound to exactly one domain and one organization resource, with an external identity provider federated in and the two separate administrator roles">
  <title>Google Cloud identity plane: Cloud Identity account, domain, and the organization resource</title>
  <rect x="0" y="0" width="860" height="480" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Two planes, bound one-to-one</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">One account is associated with exactly one organization resource, and an organization with exactly one domain.</text>

  <text x="44" y="88" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Identity plane &#8212; who exists</text>
  <rect x="44" y="98" width="360" height="212" rx="8" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Cloud Identity or Google Workspace account</text>
  <text x="60" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">One technical platform, one set of APIs. Cloud Identity is</text>
  <text x="60" y="151" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">the subset without the productivity applications.</text>

  <rect x="60" y="164" width="328" height="60" rx="6" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="74" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Managed users and groups</text>
  <text x="74" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Primary email on your domain. Created, suspended and</text>
  <text x="74" y="215" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">deleted by an administrator, not by the person.</text>

  <rect x="60" y="234" width="328" height="60" rx="6" fill="#FFFFFF" stroke="#C46A4A" stroke-width="1"/>
  <text x="74" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Consumer and unmanaged accounts</text>
  <text x="74" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A self-signup account on your domain, owned by the person</text>
  <text x="74" y="285" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">who made it. IAM will still grant it access.</text>

  <text x="456" y="88" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Resource plane &#8212; what exists</text>
  <rect x="456" y="98" width="360" height="212" rx="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="472" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Organization resource</text>
  <text x="472" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Created automatically once the account has a domain. You</text>
  <text x="472" y="151" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">do not design it; you inherit it.</text>

  <rect x="472" y="164" width="328" height="46" rx="6" fill="#F4F8FC" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="486" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Folders and projects</text>
  <text x="486" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Everything from post #1 hangs here.</text>

  <rect x="472" y="220" width="328" height="74" rx="6" fill="#FFFFFF" stroke="#C46A4A" stroke-width="1"/>
  <text x="486" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Projects made before the organization existed</text>
  <text x="486" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Listed under &#8220;No organization&#8221;. They are not adopted</text>
  <text x="486" y="271" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">automatically and inherit no policy at all until</text>
  <text x="486" y="286" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">somebody moves them by hand.</text>

  <path d="M404 200 L456 200" stroke="#5A6260" stroke-width="1.5" fill="none"/>
  <path d="M456 200 l-7 -4 l0 8 z" fill="#5A6260"/>
  <text x="386" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">1:1</text>

  <rect x="44" y="326" width="360" height="60" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="60" y="346" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">External identity provider, optional</text>
  <text x="60" y="362" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Authentication is relayed to a SAML IdP, but the account</text>
  <text x="60" y="377" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">must already exist here before anyone can sign in.</text>

  <rect x="456" y="326" width="360" height="60" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="472" y="346" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Two administrators, not one</text>
  <text x="472" y="362" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Super admin governs the account. Organization Administrator</text>
  <text x="472" y="377" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">grants IAM roles &#8212; and cannot create folders or projects.</text>

  <text x="44" y="424" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The boundary of a Google Cloud estate is therefore set by whoever registered the identity domain, often years earlier.</text>
  <text x="44" y="443" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Keep super-admin users to a minimum and off day-to-day work: that account answers to no IAM policy in the resource plane.</text>
</svg>
