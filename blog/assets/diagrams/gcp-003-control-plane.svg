<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the Resource Manager control plane, showing a write call returning a long-running Operation rather than a resource, the poll loop until it reports done, and the separate access-propagation delay that continues after the operation completes">
  <title>Resource Manager control plane: asynchronous writes, and propagation after them</title>
  <rect x="0" y="0" width="860" height="500" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A write returns a receipt, not a result</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Two waits, not one: the operation has to finish, and then the change has to reach the systems that enforce it.</text>

  <rect x="44" y="78" width="228" height="112" rx="8" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">1. You call the API</text>
  <text x="60" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">create, delete, move, patch</text>
  <text x="60" y="133" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">and undelete are all</text>
  <text x="60" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">asynchronous.</text>
  <text x="60" y="169" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">get and list are not.</text>

  <path d="M272 134 L316 134" stroke="#5A6260" stroke-width="1.5" fill="none"/>
  <path d="M316 134 l-7 -4 l0 8 z" fill="#5A6260"/>

  <rect x="316" y="78" width="228" height="112" rx="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="332" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">2. You get an Operation</text>
  <text x="332" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Not the project. A handle you</text>
  <text x="332" y="133" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">poll until done is true.</text>
  <text x="332" y="154" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Reading the response as if it</text>
  <text x="332" y="169" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">were the resource is the bug.</text>

  <path d="M544 134 L588 134" stroke="#5A6260" stroke-width="1.5" fill="none"/>
  <path d="M588 134 l-7 -4 l0 8 z" fill="#5A6260"/>

  <rect x="588" y="78" width="228" height="112" rx="8" fill="#FFFFFF" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="604" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">3. Then it still propagates</text>
  <text x="604" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">An allow-policy change takes</text>
  <text x="604" y="133" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">typically 2 minutes, and</text>
  <text x="604" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">potentially 7 minutes or more.</text>
  <text x="604" y="169" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Group changes: longer still.</text>

  <text x="44" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Where automation actually breaks</text>
  <rect x="44" y="240" width="772" height="62" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="60" y="262" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Terraform creates a project, grants a service account a role, then immediately deploys as that service account.</text>
  <text x="60" y="278" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The operation reported done, so the pipeline proceeds and gets a permission error on a grant that plainly exists.</text>
  <text x="60" y="294" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Nothing failed. It was read before it had propagated, and a retry minutes later succeeds with no change made.</text>

  <text x="44" y="338" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Project lifecycle, and the two brakes on deletion</text>

  <rect x="44" y="352" width="180" height="58" rx="6" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="372" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">ACTIVE</text>
  <text x="58" y="390" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Normal operation.</text>

  <path d="M224 381 L268 381" stroke="#5A6260" stroke-width="1.5" fill="none"/>
  <path d="M268 381 l-7 -4 l0 8 z" fill="#5A6260"/>
  <text x="228" y="373" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">delete</text>

  <rect x="268" y="352" width="196" height="58" rx="6" fill="#FFFFFF" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="282" y="372" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">DELETE_REQUESTED</text>
  <text x="282" y="390" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Generally reversible by undelete.</text>

  <rect x="504" y="340" width="312" height="82" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="518" y="360" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">A lien blocks the delete outright</text>
  <text x="518" y="378" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">It blocks resourcemanager.projects.delete until</text>
  <text x="518" y="393" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">somebody removes it, and removing it needs its own</text>
  <text x="518" y="408" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">role rather than project ownership.</text>

  <text x="44" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Every one of these is a property of the control plane, not of any service: the same rules apply whether the project holds</text>
  <text x="44" y="470" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">one bucket or a thousand VMs. It is the layer every request passes through before it reaches anything you built.</text>
</svg>
