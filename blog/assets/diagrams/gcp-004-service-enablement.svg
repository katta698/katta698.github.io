<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: how a project's list of enabled services grows from three different sources, what disabling a service does and does not stop, and how the restrictServiceUsage organization policy constraint governs runtime access instead">
  <title>Service enablement on Google Cloud: how the list grows, and what disabling does not do</title>
  <rect x="0" y="0" width="860" height="510" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The enabled-services list is state, and it grows on its own</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Three things add to it. Only one of them is a decision somebody made and recorded.</text>

  <rect x="44" y="78" width="248" height="86" rx="7" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Enabled by default</text>
  <text x="58" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Some services are on from the</text>
  <text x="58" y="131" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">moment the project is created.</text>
  <text x="58" y="152" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Nobody chose them.</text>

  <rect x="306" y="78" width="248" height="86" rx="7" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="320" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Enabled deliberately</text>
  <text x="320" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">By gcloud or Terraform, as a</text>
  <text x="320" y="131" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">reviewable change.</text>
  <text x="320" y="152" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The only auditable route.</text>

  <rect x="568" y="78" width="248" height="86" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="582" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Enabled by using the console</text>
  <text x="582" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Some services switch on simply</text>
  <text x="582" y="131" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">because somebody opened the</text>
  <text x="582" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">page. No ticket, no review, and</text>
  <text x="582" y="161" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">no record of intent.</text>

  <text x="44" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">What disabling does &#8212; and the two things it does not</text>

  <rect x="44" y="212" width="380" height="118" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="58" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Disabling the API</text>
  <text x="58" y="252" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">It does NOT delete your data.</text>
  <text x="58" y="268" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">It does NOT stop the billing for it.</text>
  <text x="58" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">To stop future charges you delete the</text>
  <text x="58" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">data first, then disable the API. Doing</text>
  <text x="58" y="320" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">it the other way keeps paying quietly.</text>

  <rect x="436" y="212" width="380" height="118" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="450" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The dependency graph pushes back</text>
  <text x="450" y="252" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Disabling a service that other enabled</text>
  <text x="450" y="268" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">services depend on fails with an error.</text>
  <text x="450" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Useful, but it means clean-up order is</text>
  <text x="450" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">discovered by trial rather than read off</text>
  <text x="450" y="320" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">a list somewhere.</text>

  <text x="44" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The control that actually governs it is not enablement</text>

  <rect x="44" y="378" width="772" height="86" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="58" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">gcp.restrictServiceUsage &#8212; an organization policy constraint</text>
  <text x="58" y="418" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">It controls runtime access to in-scope resources, not just whether somebody may turn a service on. An update applies</text>
  <text x="58" y="433" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">immediately to all access to all resources in scope, so it reaches what already exists rather than only what comes next.</text>
  <text x="58" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Denylist: anything not denied is allowed. Allowlist: anything not allowed is denied. It also cascades to dependents.</text>

  <text x="44" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">So the audit question is not &#8220;who enabled this?&#8221; but &#8220;what is this project allowed to reach?&#8221; &#8212; a different question with a different answer.</text>
</svg>
