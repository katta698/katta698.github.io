<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the three identifiers a Google Cloud project carries, which of them can change, and where each one surfaces including the two default service accounts that use different identifiers">
  <title>Google Cloud project identifiers: name, ID and number, and where each appears</title>
  <rect x="0" y="0" width="860" height="500" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Three identifiers, one of them permanent and global</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Every project carries all three at once. They are not interchangeable, and only one can ever be corrected.</text>

  <rect x="44" y="78" width="248" height="150" rx="7" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Project name</text>
  <text x="58" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Human-readable display name.</text>
  <text x="58" y="134" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">4 to 30 characters. Letters,</text>
  <text x="58" y="149" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">numbers, spaces, hyphens,</text>
  <text x="58" y="164" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">quotes and exclamation marks.</text>
  <text x="58" y="188" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3D9970">Editable at any time</text>
  <text x="58" y="206" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The only one you can fix later.</text>

  <rect x="306" y="78" width="248" height="150" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="320" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Project ID</text>
  <text x="320" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Globally unique across all of</text>
  <text x="320" y="131" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Google Cloud. 6 to 30 chars,</text>
  <text x="320" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">lowercase, starts with a letter,</text>
  <text x="320" y="161" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">never ends with a hyphen.</text>
  <text x="320" y="188" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#C46A4A">Permanent, and never reusable</text>
  <text x="320" y="206" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Including after deletion.</text>

  <rect x="568" y="78" width="248" height="150" rx="7" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="582" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Project number</text>
  <text x="582" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Generated for you at creation.</text>
  <text x="582" y="131" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">You never choose it and you</text>
  <text x="582" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">cannot change it.</text>
  <text x="582" y="188" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#4A90D9">Read-only</text>
  <text x="582" y="206" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The canonical resource name.</text>

  <text x="44" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The same project, addressed two ways &#8212; by its own default service accounts</text>

  <rect x="44" y="280" width="380" height="76" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="58" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">App Engine default</text>
  <text x="58" y="320" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">project-id@appspot.gserviceaccount.com</text>
  <text x="58" y="342" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Uses the ID you chose.</text>

  <rect x="436" y="280" width="380" height="76" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="450" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Compute Engine default</text>
  <text x="450" y="320" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">project-number-compute@developer.gserviceaccount.com</text>
  <text x="450" y="342" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Uses the number you never picked.</text>

  <rect x="44" y="374" width="772" height="68" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="58" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Why that matters for anything that greps</text>
  <text x="58" y="413" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Search your IAM bindings for the project ID and you will miss every grant made to the Compute Engine default account.</text>
  <text x="58" y="430" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Search for the number and you miss the App Engine one. An audit that checks a single form is an audit with a blind spot.</text>

  <text x="44" y="470" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The ID namespace is append-only and shared by every Google Cloud customer, so a name burned on a proof of concept is gone permanently.</text>
</svg>
