<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the project lifecycle from ACTIVE through DELETE_REQUESTED to permanent deletion, showing that the thirty day window protects the project record while some services delete their data much sooner">
  <title>Google Cloud project lifecycle: ACTIVE, DELETE_REQUESTED, and what the 30 days actually protect</title>
  <rect x="0" y="0" width="860" height="470" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The 30 days protect the project, not necessarily the data</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Two clocks run at once, and only one of them is the documented thirty days.</text>

  <rect x="44" y="82" width="168" height="72" rx="7" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">ACTIVE</text>
  <text x="58" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Normal operation.</text>
  <text x="58" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A lien can block what follows.</text>

  <path d="M212 118 L262 118" stroke="#5A6260" stroke-width="1.5" fill="none"/>
  <path d="M262 118 l-7 -4 l0 8 z" fill="#5A6260"/>
  <text x="214" y="110" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">delete</text>

  <rect x="262" y="82" width="290" height="72" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="276" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">DELETE_REQUESTED</text>
  <text x="276" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Marked immediately, and unusable from that moment.</text>
  <text x="276" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Still counts against your project quota throughout.</text>

  <path d="M552 118 L602 118" stroke="#5A6260" stroke-width="1.5" fill="none"/>
  <path d="M602 118 l-7 -4 l0 8 z" fill="#5A6260"/>
  <text x="556" y="110" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">day 30</text>

  <rect x="602" y="82" width="214" height="72" rx="7" fill="#FFFFFF" stroke="#1D2322" stroke-width="1.5"/>
  <text x="616" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Permanently deleted</text>
  <text x="616" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Project and all resources gone.</text>
  <text x="616" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The ID is never reusable.</text>

  <text x="44" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The two clocks, drawn to the same scale</text>

  <rect x="44" y="212" width="772" height="34" rx="5" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1"/>
  <text x="58" y="234" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3D5A3D">Project record: restorable by an owner for the full 30 days, with resourcemanager.projects.undelete</text>

  <rect x="44" y="254" width="232" height="34" rx="5" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1"/>
  <text x="58" y="276" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A4A32">Some data: gone much sooner</text>
  <rect x="276" y="254" width="540" height="34" rx="5" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="290" y="276" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Restoring here returns a project whose contents may already have been removed</text>

  <text x="44" y="318" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Cloud Storage and Pub/Sub are the named examples: they may delete resources much sooner than 30 days.</text>

  <rect x="44" y="336" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="58" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Deleting needs</text>
  <text x="58" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">resourcemanager.projects.delete</text>
  <text x="58" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A lien refuses it until removed.</text>

  <rect x="436" y="336" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="450" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Restoring needs</text>
  <text x="450" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">resourcemanager.projects.undelete</text>
  <text x="450" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Held by project owners.</text>

  <text x="44" y="442" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">So &#8220;we can always restore it&#8221; is true of the project and unproven for its contents. Treat deletion as final and back up beforehand.</text>
</svg>
