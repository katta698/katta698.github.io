<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the anatomy of a Google Cloud lien, its two possible authors, the single operation it blocks, and the separation between the role that can delete a project and the role that can lift the lien">
  <title>Google Cloud project liens: the fields, who creates them, and what they block</title>
  <rect x="0" y="0" width="860" height="510" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A lien is an object, not a setting</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">It is attached to a project, it names the operation it blocks, and it carries the reason it exists.</text>

  <rect x="44" y="80" width="380" height="184" rx="8" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="60" y="102" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The Lien resource</text>
  <text x="60" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">name          liens/1234abcd   (system-generated)</text>
  <text x="60" y="142" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">parent        projects/1234    (the project NUMBER)</text>
  <text x="60" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">restrictions  a list of IAM permissions to block</text>
  <text x="60" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">reason        why, up to 200 characters</text>
  <text x="60" y="196" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">origin        who, up to 200 characters</text>
  <text x="60" y="214" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">createTime    when   (system-generated)</text>
  <text x="60" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A4A32">reason and origin are the only trace of intent it will ever have.</text>

  <rect x="444" y="80" width="372" height="86" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1"/>
  <text x="458" y="102" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">You create one</text>
  <text x="458" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">gcloud alpha resource-manager liens create</text>
  <text x="458" y="138" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">  --restrictions=resourcemanager.projects.delete</text>
  <text x="458" y="154" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">  --reason=... --origin=...</text>

  <rect x="444" y="178" width="372" height="86" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1"/>
  <text x="458" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Or Google creates one for you</text>
  <text x="458" y="220" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Liens can be placed automatically &#8212; for example when</text>
  <text x="458" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">service accounts from one project are attached to</text>
  <text x="458" y="252" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">resources elsewhere. origin names the service.</text>

  <text x="44" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">What it blocks, and what it does not</text>

  <rect x="44" y="312" width="380" height="82" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="58" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Blocks</text>
  <text x="58" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">resourcemanager.projects.delete</text>
  <text x="58" y="372" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The project cannot be deleted while it is attached.</text>

  <rect x="436" y="312" width="380" height="82" rx="7" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="450" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Does not block</text>
  <text x="450" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Anything inside the project. Buckets, databases and</text>
  <text x="450" y="372" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">clusters can still be deleted one by one.</text>

  <rect x="44" y="410" width="772" height="74" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="58" y="430" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The separation that makes it worth having</text>
  <text x="58" y="450" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Deleting needs resourcemanager.projects.delete. Lifting the lien needs roles/resourcemanager.lienModifier.</text>
  <text x="58" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">An owner who holds the first and not the second cannot clear their own obstacle.</text>
</svg>
