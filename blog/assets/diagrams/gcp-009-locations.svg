<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the three Cloud Storage location types compared by what they survive and how far behind the copy can be, with default replication targets against turbo replication">
  <title>Cloud Storage location types: region, dual-region and multi-region, and their replication targets</title>
  <rect x="0" y="0" width="860" height="500" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Three location types, and the lag you are agreeing to</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Choosing a location type is choosing what survives &#8212; and, for the cross-region types, how stale the surviving copy may be.</text>

  <rect x="44" y="80" width="248" height="168" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="58" y="102" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Region</text>
  <text x="58" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">One place, such as US-CENTRAL1.</text>
  <text x="58" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Redundant across zones within</text>
  <text x="58" y="159" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">that region, synchronously.</text>
  <text x="58" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8A4A32">Survives a zone</text>
  <text x="58" y="202" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Not a region.</text>
  <text x="58" y="228" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">No replication lag to reason about.</text>

  <rect x="306" y="80" width="248" height="168" rx="7" fill="#F4F8FC" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="320" y="102" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Dual-region</text>
  <text x="320" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A specific pair you name, such as</text>
  <text x="320" y="137" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Tokyo and Osaka (ASIA1).</text>
  <text x="320" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2A5578">Survives a region</text>
  <text x="320" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Replication is asynchronous.</text>
  <text x="320" y="202" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">You know exactly which two</text>
  <text x="320" y="217" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">places hold the data, which is</text>
  <text x="320" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">what residency rules ask for.</text>

  <rect x="568" y="80" width="248" height="168" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="582" y="102" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Multi-region</text>
  <text x="582" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A large geographic area holding</text>
  <text x="582" y="137" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">two or more regions, such as US.</text>
  <text x="582" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3D5A3D">Survives a region</text>
  <text x="582" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Widest footprint of the three.</text>
  <text x="582" y="202" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">You do not choose the constituent</text>
  <text x="582" y="217" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">regions, so it answers availability</text>
  <text x="582" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">but not &#8220;where exactly is it?&#8221;</text>

  <text x="44" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">How far behind the second copy can be</text>

  <rect x="44" y="304" width="772" height="60" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="58" y="324" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Default replication</text>
  <text x="58" y="344" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Targets 99.9% of newly written objects within one hour, and 100% within twelve hours.</text>
  <text x="58" y="358" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A4A32">That trailing 0.1% is the part a recovery plan has to survive.</text>

  <rect x="44" y="374" width="772" height="60" rx="6" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1"/>
  <text x="58" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Turbo replication &#8212; dual-region buckets only</text>
  <text x="58" y="414" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Targets 100% of newly written objects within a 15-minute RPO, regardless of object size.</text>
  <text x="58" y="428" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3D5A3D">Forty-eight times tighter than the twelve-hour target, and it is the only lever of its kind.</text>

  <text x="44" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">RTO is 0 for both cross-region types &#8212; failover and failback are automated. The number worth arguing about is the RPO, not the RTO.</text>
</svg>
