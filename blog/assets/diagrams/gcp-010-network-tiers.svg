<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: Premium and Standard network tiers compared by where traffic crosses between the public internet and Google's backbone, with the per-gibibyte rate cards and a ten-tebibyte worked example">
  <title>Network Service Tiers: where traffic crosses between the public internet and Google's network, and what the difference costs</title>
  <rect x="0" y="0" width="860" height="520" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The tier decides where the public internet ends</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Both tiers reach the same region. They differ in how much of the journey is carried on Google's own fibre rather than on someone else's.</text>

  <rect x="44" y="80" width="380" height="188" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Premium Tier</text>
  <text x="58" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Traffic enters at the PoP closest to the user.</text>

  <rect x="58" y="138" width="88" height="32" rx="5" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="102" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Internet user</text>
  <line x1="148" y1="154" x2="170" y2="154" stroke="#C46A4A" stroke-width="2"/>
  <polygon points="170,150 178,154 170,158" fill="#C46A4A"/>
  <rect x="180" y="138" width="104" height="32" rx="5" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="232" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">PoP near user</text>
  <line x1="286" y1="154" x2="302" y2="154" stroke="#8A9A5B" stroke-width="3"/>
  <polygon points="302,149 312,154 302,159" fill="#8A9A5B"/>
  <rect x="314" y="138" width="96" height="32" rx="5" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="362" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Your region</text>

  <text x="58" y="196" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A4A32">User to PoP: a short hop on a peering or transit network.</text>
  <text x="58" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3D5A3D">PoP to region: the long haul, on Google's private fibre.</text>
  <text x="58" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Global external IP addresses, Cloud CDN, Cloud VPN.</text>
  <text x="58" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3D5A3D">SLA 99.99% uptime &#183; the default tier</text>

  <rect x="436" y="80" width="380" height="188" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="450" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Standard Tier</text>
  <text x="450" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Traffic enters at a PoP close to the region instead.</text>

  <rect x="450" y="138" width="88" height="32" rx="5" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="494" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Internet user</text>
  <line x1="540" y1="154" x2="562" y2="154" stroke="#C46A4A" stroke-width="3"/>
  <polygon points="562,149 572,154 562,159" fill="#C46A4A"/>
  <rect x="574" y="138" width="112" height="32" rx="5" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="630" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">PoP near region</text>
  <line x1="688" y1="154" x2="702" y2="154" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="702,150 710,154 702,158" fill="#8A9A5B"/>
  <rect x="712" y="138" width="96" height="32" rx="5" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="760" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Your region</text>

  <text x="450" y="196" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A4A32">User to PoP: the long haul, on transit and ISP networks.</text>
  <text x="450" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3D5A3D">PoP to region: a short hop inside Google's network.</text>
  <text x="450" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Regional external IP addresses only. No CDN, no VPN.</text>
  <text x="450" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8A4A32">SLA 99.9% uptime &#183; must be asked for</text>

  <text x="44" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">What that difference costs, per GiB of data transfer out from us-central1</text>

  <rect x="44" y="314" width="380" height="92" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="58" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Premium Tier, to North America</text>
  <text x="58" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">First 1 GiB free, then $0.12 to 1,024 GiB,</text>
  <text x="58" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">$0.11 to 10,240 GiB, $0.08 above that.</text>
  <text x="58" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8A4A32">10 TiB in a month: $1,136.52</text>

  <rect x="436" y="314" width="380" height="92" rx="6" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1"/>
  <text x="450" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Standard Tier, from the same region</text>
  <text x="450" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">First 200 GiB free, then $0.085 to 10,240 GiB,</text>
  <text x="450" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">$0.065 to 153,600 GiB, $0.045 above that.</text>
  <text x="450" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3D5A3D">10 TiB in a month: $853.40</text>

  <rect x="44" y="420" width="772" height="56" rx="6" fill="#FFFFFF" stroke="#E0DCD5" stroke-width="1"/>
  <text x="58" y="442" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The discount shrinks as the bill grows</text>
  <text x="58" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">29.2% between the headline rates, 24.9% across a 10 TiB month, and 18.75% on everything above 10,240 GiB.</text>

  <text x="44" y="504" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The tiers draw from separate pools of external IP addresses, so changing tier changes the address.</text>
</svg>
