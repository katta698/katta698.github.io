<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: billing enabled as two conditions — a link to a Cloud Billing account and that account being active — the three routes to a disabled project, what stops and what is removed, and the recovery timings">
  <title>The project to billing account link: the two conditions that make billing enabled, the three ways it breaks, what breaks with it, and how long recovery takes</title>
  <rect x="0" y="0" width="860" height="700" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Billing is a link, not a switch</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The project owns one end of it. Two of the three ways it breaks happen without anyone touching the project.</text>

  <rect x="44" y="76" width="772" height="104" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Billing enabled &#183; both conditions, or neither</text>

  <rect x="58" y="112" width="330" height="54" rx="5" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="72" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">1. The project is linked to an account</text>
  <text x="72" y="152" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">billingAccountName is populated</text>

  <text x="404" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8A9A5B">AND</text>

  <rect x="450" y="112" width="352" height="54" rx="5" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="464" y="132" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">2. That account is active and in good standing</text>
  <text x="464" y="152" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">not closed, not suspended &#8212; billingEnabled: true</text>

  <line x1="430" y1="180" x2="430" y2="200" stroke="#C46A4A" stroke-width="2"/>
  <polygon points="425,200 430,208 435,200" fill="#C46A4A"/>

  <text x="44" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Three ways it breaks</text>

  <rect x="44" y="242" width="248" height="108" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="58" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The project is unlinked</text>
  <text x="58" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">billingAccountName set to empty.</text>
  <text x="58" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Needs a grant on the account OR</text>
  <text x="58" y="316" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">on the project &#8212; either alone.</text>
  <text x="58" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A4A32">Someone did this on purpose.</text>

  <rect x="306" y="242" width="248" height="108" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="320" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The account is closed</text>
  <text x="320" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Or suspended. Every project it</text>
  <text x="320" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">pays for stops, and every one of</text>
  <text x="320" y="316" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">them keeps its link.</text>
  <text x="320" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A4A32">Nothing changed on the project.</text>

  <rect x="568" y="242" width="248" height="108" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="582" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The project was restored</text>
  <text x="582" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Shut down, then restored inside</text>
  <text x="582" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">the 30-day recovery period. It</text>
  <text x="582" y="316" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">comes back with billing disabled.</text>
  <text x="582" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A4A32">Relinking is a separate step.</text>

  <line x1="430" y1="350" x2="430" y2="370" stroke="#C46A4A" stroke-width="2"/>
  <polygon points="425,370 430,378 435,370" fill="#C46A4A"/>

  <rect x="44" y="386" width="772" height="146" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="58" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">What happens, in all three cases</text>
  <text x="58" y="432" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">All Google Cloud and Google Maps Platform services in the project are stopped, and billing on the project stops.</text>
  <text x="58" y="452" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A4A32">Some resources might be removed and become non-recoverable. Back up first.</text>
  <text x="58" y="474" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Services that are free stop too &#8212; a project that costs nothing is not exempt from its payer's state.</text>
  <text x="58" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A Shared VPC host takes its service projects with it: their instances on that network are shut down.</text>
  <text x="58" y="510" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Firebase drops to the no-cost Spark plan; AI Studio drops to the free tier. Both are outages that do not look like one.</text>
  <text x="58" y="526" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Unbilled charges to date are still billed to the account the project was linked to.</text>

  <line x1="430" y1="532" x2="430" y2="552" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="425,552 430,560 435,552" fill="#8A9A5B"/>

  <rect x="44" y="568" width="772" height="106" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="592" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Coming back &#183; one click to re-enable, longer to recover</text>
  <text x="58" y="614" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Up to 24 hours for resources to start up again. VMs, ephemeral IPs and SSDs may need restarting by hand.</text>
  <text x="58" y="632" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">GKE clusters can take up to 60 minutes. Instances with local SSDs cannot be restarted at all.</text>
  <text x="58" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A restored project may reject the link for about 10 minutes, and in rare cases for up to 36 hours.</text>
  <text x="58" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4A5A2B">Prevention is the lock: while a project is locked to its account, billing cannot be changed or disabled.</text>
</svg>
