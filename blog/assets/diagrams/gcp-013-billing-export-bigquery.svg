<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the three Cloud Billing exports to BigQuery, the table each writes, what the console can and cannot answer, and the timing rules that govern when exported data appears">
  <title>Cloud Billing export to BigQuery: three exports, three tables, what the console cannot answer, and the timing rules</title>
  <rect x="0" y="0" width="860" height="760" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Three exports, three tables, one switch each</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Nothing is exported until you turn it on, and nothing before that day exists in a regional dataset.</text>

  <rect x="44" y="76" width="772" height="46" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="105" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Cloud Billing account &#183; billing export configuration</text>
  <text x="470" y="105" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Costs Manager or Billing Account Admin, plus BigQuery User</text>

  <line x1="180" y1="122" x2="180" y2="146" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="175,146 180,154 185,146" fill="#8A9A5B"/>
  <line x1="430" y1="122" x2="430" y2="146" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="425,146 430,154 435,146" fill="#8A9A5B"/>
  <line x1="680" y1="122" x2="680" y2="146" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="675,146 680,154 685,146" fill="#8A9A5B"/>

  <rect x="44" y="158" width="248" height="150" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Standard usage cost</text>
  <text x="58" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">gcp_billing_export_v1_&lt;ID&gt;</text>
  <text x="58" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Account, invoice date, services,</text>
  <text x="58" y="238" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">SKUs, projects, labels, locations,</text>
  <text x="58" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">cost, usage, credits, adjustments.</text>
  <text x="58" y="278" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Finest grain: SKU, hourly.</text>
  <text x="58" y="296" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">For broad trends.</text>

  <rect x="306" y="158" width="248" height="150" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="320" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Detailed usage cost</text>
  <text x="320" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">gcp_billing_export_resource_v1_&lt;ID&gt;</text>
  <text x="320" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Everything in standard, plus</text>
  <text x="320" y="238" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">resource.name, price,</text>
  <text x="320" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">cost_at_list, subscription.</text>
  <text x="320" y="278" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Finest grain: the VM or the disk.</text>
  <text x="320" y="296" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A named list of services only.</text>

  <rect x="568" y="158" width="248" height="150" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="582" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Pricing</text>
  <text x="582" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">cloud_pricing_export</text>
  <text x="582" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">SKUs, products, geo metadata,</text>
  <text x="582" y="238" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">units, currency, tiered rates,</text>
  <text x="582" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">list price and contract price.</text>
  <text x="582" y="278" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Generated once each day.</text>
  <text x="582" y="296" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">What you would pay, not what you did.</text>

  <text x="44" y="342" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Where the console stops</text>

  <rect x="44" y="356" width="378" height="164" rx="7" fill="#FDF6F2" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="58" y="378" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Reports and the cost table</text>
  <text x="58" y="400" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Usage and cost back to January 2017;</text>
  <text x="58" y="416" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">by billing period back to January 2019.</text>
  <text x="58" y="438" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Data at the sub-SKU level, for example by</text>
  <text x="58" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">resource ID, is not available.</text>
  <text x="58" y="476" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Date grouping disappears past 366 days.</text>
  <text x="58" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">CSV download: 4 million rows, 150 MB.</text>

  <rect x="438" y="356" width="378" height="164" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="452" y="378" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">What only the export answers</text>
  <text x="452" y="400" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Cost per virtual machine, disk or bucket.</text>
  <text x="452" y="422" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">List price against paid price, per SKU.</text>
  <text x="452" y="444" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Arbitrary joins onto your own tables.</text>
  <text x="452" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Any history you kept, at full grain.</text>
  <text x="452" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">The cost table still owns the invoice total.</text>

  <text x="44" y="554" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Timing rules that decide what you see</text>

  <rect x="44" y="568" width="772" height="152" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Multi-region dataset (EU or US): data from the start of the previous month is added retroactively.</text>
  <text x="58" y="614" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Regional dataset: data only from the date you enabled the export. No backfill, ever.</text>
  <text x="58" y="636" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Initial backfill can take up to five days before recent usage appears.</text>
  <text x="58" y="658" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Export runs at regular intervals with no delivery or latency guarantees.</text>
  <text x="58" y="680" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Reporting frequency varies by service, so recent usage is uneven across services.</text>
  <text x="58" y="702" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Corrections arrive as new rows that negate the old ones. Exported records are not changed.</text>

  <text x="44" y="744" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Turning the export on is the only step that cannot be done later &#8212; the days before it are not recoverable.</text>
</svg>
