<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 790" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: how a month of Google Cloud usage becomes an invoice, the three surfaces that describe the same month, and the invoice-level charges that sit between a subtotal and an invoice total">
  <title>Reading a Google Cloud invoice: the billing period, the document, the three surfaces, and the invoice-level charges</title>
  <rect x="0" y="0" width="860" height="790" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">One month of usage, one document, three places to read it</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The invoice is the only one of the three with a legal total, and the only one with no line items.</text>

  <rect x="44" y="76" width="772" height="96" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The billing period, and why it is not quite the calendar month</text>
  <text x="58" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The invoice total generally includes all costs incurred during a given calendar month &#8212; but usage reported</text>
  <text x="58" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">late at month end may roll over, so one invoice can carry costs from more than one calendar month.</text>
  <text x="58" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Available by the fifth business day of the following month. Terms per your agreement with Google, for example Net 30.</text>

  <line x1="430" y1="172" x2="430" y2="196" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="425,196 430,204 435,196" fill="#8A9A5B"/>

  <rect x="44" y="208" width="248" height="196" rx="7" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="230" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Invoice or statement</text>
  <text x="58" y="248" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Invoiced accounts get invoices.</text>
  <text x="58" y="263" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Self-serve accounts get statements.</text>
  <text x="58" y="286" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Address, tax IDs, payments made,</text>
  <text x="58" y="302" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">taxes, balance due, payment terms.</text>
  <text x="58" y="324" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">No cost detail since January 2021.</text>
  <text x="58" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The CSV now mirrors the PDF.</text>
  <text x="58" y="362" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Needs Billing Account Viewer or</text>
  <text x="58" y="378" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Billing Account Administrator.</text>
  <text x="58" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Answers: what do I owe, and by when.</text>

  <rect x="306" y="208" width="248" height="196" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="320" y="230" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Cost table report</text>
  <text x="320" y="248" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">One invoice at a time, by number.</text>
  <text x="320" y="271" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Header carries the billing account</text>
  <text x="320" y="287" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">ID, invoice number and date, total,</text>
  <text x="320" y="303" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">currency and the exchange rate.</text>
  <text x="320" y="325" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">With filters in their default state,</text>
  <text x="320" y="341" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">the totals match the invoice.</text>
  <text x="320" y="363" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Project, service and SKU detail,</text>
  <text x="320" y="379" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">downloadable to CSV.</text>
  <text x="320" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Answers: what is the invoice made of.</text>

  <rect x="568" y="208" width="248" height="196" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="582" y="230" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Reports and the BigQuery export</text>
  <text x="582" y="248" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Post 13&#8242;s tables, plus the console.</text>
  <text x="582" y="271" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Scoped by charge period or by</text>
  <text x="582" y="287" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">billing period, your choice.</text>
  <text x="582" y="309" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">A filtered total does not match</text>
  <text x="582" y="325" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">the invoice, and is not meant to.</text>
  <text x="582" y="347" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Joinable to your own tables, and</text>
  <text x="582" y="363" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">aggregated across every invoice</text>
  <text x="582" y="379" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">issued in a billing period.</text>
  <text x="582" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Answers: why the cost behaved that way.</text>

  <text x="44" y="440" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">From subtotal to invoice total: the charges that exist only at invoice level</text>

  <rect x="44" y="456" width="140" height="58" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Subtotal</text>
  <text x="58" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">After savings</text>
  <text x="58" y="509" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">and credits.</text>

  <text x="196" y="492" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8A9A5B">+</text>

  <rect x="216" y="456" width="140" height="58" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="230" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Adjustments</text>
  <text x="230" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Credit and debit</text>
  <text x="230" y="509" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">memos.</text>

  <text x="368" y="492" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8A9A5B">+</text>

  <rect x="388" y="456" width="140" height="58" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="402" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Tax</text>
  <text x="402" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Summed across every</text>
  <text x="402" y="509" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">invoice that month.</text>

  <text x="540" y="492" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8A9A5B">+</text>

  <rect x="560" y="456" width="140" height="58" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="574" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Rounding error</text>
  <text x="574" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">In the total, never</text>
  <text x="574" y="509" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">a line of its own.</text>

  <text x="712" y="492" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8A9A5B">=</text>

  <rect x="732" y="456" width="84" height="58" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="746" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Invoice</text>
  <text x="746" y="493" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">total</text>
  <text x="746" y="509" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">What you owe.</text>

  <rect x="44" y="534" width="772" height="70" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="556" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Set one filter, and the footer stops being an invoice total</text>
  <text x="58" y="576" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Filter by project, service, SKU or savings and the report shows a filtered total instead. Tax, adjustments and</text>
  <text x="58" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">rounding errors are excluded from it, and it does not match the invoice. Reset the filters before comparing.</text>

  <rect x="44" y="618" width="772" height="70" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="640" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Memos arrive on their own schedule</text>
  <text x="58" y="660" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A credit memo issued in April can document an adjustment applied to a March invoice, or to a June one. Debit</text>
  <text x="58" y="676" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">memos act as additional invoices and are attached to no invoice at all. None of it appears in the invoice PDF.</text>

  <rect x="44" y="702" width="772" height="64" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="724" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">One currency, one rate, fixed for the month</text>
  <text x="58" y="744" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A billing account operates in a single currency that cannot be changed after it is created. Non-USD exchange</text>
  <text x="58" y="760" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">rates are set at the beginning of every month, and the rate applied is exported as currency_conversion_rate.</text>
</svg>
