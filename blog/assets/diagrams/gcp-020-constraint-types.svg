<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 748" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the three kinds of Google Cloud organization policy constraint, the boolean and list rule types of a legacy managed constraint, the is under and in value prefixes, and the custom constraint YAML fields with their limits and the actionType inversion">
  <title>Constraint types on Google Cloud: legacy managed, managed and custom, and what each can express</title>
  <rect x="0" y="0" width="860" height="748" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A constraint is what a policy can say. Three kinds, and only one of them is yours.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Read the name, not the prose: constraints/ is legacy, .managed. is Google&#8217;s newer form, custom. is yours.</text>

  <rect x="44" y="78" width="248" height="152" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Legacy managed</text>
  <text x="58" y="118" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Written by Google. Once called</text>
  <text x="58" y="132" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">predefined constraints.</text>
  <text x="58" y="154" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">A constraint type of list or boolean,</text>
  <text x="58" y="168" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">which decides the values usable for</text>
  <text x="58" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">checking enforcement.</text>
  <text x="58" y="206" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6E7A45">constraints/compute.</text>
  <text x="58" y="219" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6E7A45">trustedImageProjects</text>

  <rect x="306" y="78" width="248" height="152" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="320" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Managed</text>
  <text x="320" y="118" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Written by Google. The newer form.</text>
  <text x="320" y="140" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Designed to replace the equivalent</text>
  <text x="320" y="154" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">legacy constraints, with more</text>
  <text x="320" y="168" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">flexibility and greater insight from</text>
  <text x="320" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Policy Intelligence tools.</text>
  <text x="320" y="206" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6E7A45">iam.managed.</text>
  <text x="320" y="219" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6E7A45">disableServiceAccountCreation</text>

  <rect x="568" y="78" width="248" height="152" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="582" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Custom</text>
  <text x="582" y="118" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Managed by your organization</text>
  <text x="582" y="132" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">instead of by Google.</text>
  <text x="582" y="154" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">A YAML file specifying the resources,</text>
  <text x="582" y="168" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">methods, conditions and actions</text>
  <text x="582" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">subject to the constraint.</text>
  <text x="582" y="206" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6E7A45">custom.disableGkeAutoUpgrade</text>
  <text x="582" y="219" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">letters and numbers only, max 70</text>

  <rect x="44" y="250" width="376" height="112" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Boolean rule &#8212; one word of vocabulary</text>
  <text x="58" y="292" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Either enforced or not enforced.</text>
  <text x="58" y="314" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6E7A45">rules:</text>
  <text x="58" y="328" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6E7A45">- enforce: true</text>
  <text x="58" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Nothing to misconfigure. Prefer it whenever it fits.</text>

  <rect x="440" y="250" width="376" height="112" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="454" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">List rule &#8212; the prefix is the meaning</text>
  <text x="454" y="292" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">is:      the exact value, and nothing beneath it</text>
  <text x="454" y="308" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">under:   the value and all of its child values</text>
  <text x="454" y="324" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">in:      all resources that include this value</text>
  <text x="454" y="348" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">An empty list is not off: the constraint default takes over.</text>

  <rect x="44" y="382" width="772" height="164" rx="7" fill="#FFFFFF" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">What a custom constraint is made of, and the limits you will meet</text>
  <text x="58" y="426" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">resourceTypes</text>
  <text x="188" y="426" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The fully qualified Google Cloud resource holding the field, e.g. container.googleapis.com/NodePool.</text>
  <text x="58" y="446" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">methodTypes</text>
  <text x="188" y="446" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">CREATE always; UPDATE where the resource supports it. CREATE-only misses later edits.</text>
  <text x="58" y="466" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">condition</text>
  <text x="188" y="466" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">A CEL expression, up to 1000 characters, combined with &amp;&amp; and ||.</text>
  <text x="58" y="486" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">actionType</text>
  <text x="188" y="486" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">ALLOW or DENY &#8212; and it inverts the condition. See below.</text>
  <text x="58" y="506" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">displayName / description</text>
  <text x="188" y="506" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">200 and 2000 characters. The description is the only context a future reader gets.</text>
  <text x="58" y="532" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Most resource types support up to 20 custom constraints. Past that, creation fails.</text>

  <rect x="44" y="566" width="772" height="106" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="588" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">actionType reads backwards, and Google&#8217;s own example shows it</text>
  <text x="58" y="610" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">ALLOW does not mean permit when the condition matches. It means permit ONLY when it matches, and deny the rest.</text>
  <text x="58" y="632" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">condition: resource.management.autoUpgrade == false     with     actionType: ALLOW</text>
  <text x="58" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">reads as &#8220;allow auto-upgrade to be off&#8221; and enforces &#8220;node pools may ONLY be created with auto-upgrade off&#8221;.</text>
  <text x="58" y="666" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">Rule of thumb: condition describes the correct state &#8594; ALLOW. Condition describes the wrong state &#8594; DENY.</text>

  <text x="44" y="700" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">The power increases and so do the ways to be quietly wrong.</text>
  <text x="44" y="718" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">An empty list meaning deny-all, a missing prefix matching a folder but not its contents, an actionType that inverts a</text>
  <text x="44" y="734" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">condition reading perfectly well in English. None of them error. Reach for the simplest constraint that fits.</text>
</svg>
