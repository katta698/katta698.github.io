<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: how a Cloud Asset Inventory feed delivers change notifications through Pub/Sub, the CEL condition that filters them, the ten-minute propagation delay before a feed is live, the per-parent feed limit, and the case where an oversized asset update is discarded rather than delayed">
  <title>Asset feeds: a delivery pipeline with a propagation delay at the front and a silent drop at the back</title>
  <rect x="0" y="0" width="860" height="720" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">A feed is a delivery pipeline, not a query</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">It has no memory by design &#8212; only latency. It trades completeness for speed, and the documentation says so.</text>

  <rect x="44" y="78" width="164" height="88" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The estate changes</text>
  <text x="58" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Resources, IAM policies,</text>
  <text x="58" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">access policies and org</text>
  <text x="58" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">policies.</text>

  <line x1="208" y1="122" x2="238" y2="122" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="238,117 246,122 238,127" fill="#8A9A5B"/>

  <rect x="250" y="78" width="180" height="88" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="264" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Feed + CEL condition</text>
  <text x="264" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Scoped to an organization,</text>
  <text x="264" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">folder or project &#8212; folders</text>
  <text x="264" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">work here, unlike history.</text>

  <line x1="430" y1="122" x2="460" y2="122" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="460,117 468,122 460,127" fill="#8A9A5B"/>

  <rect x="472" y="78" width="164" height="88" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="486" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Your Pub/Sub topic</text>
  <text x="486" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">First message is a plain</text>
  <text x="486" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">string welcome message.</text>
  <text x="486" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Then TemporalAsset.</text>

  <line x1="636" y1="122" x2="666" y2="122" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="666,117 674,122 666,127" fill="#8A9A5B"/>

  <rect x="678" y="78" width="138" height="88" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="692" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Your consumer</text>
  <text x="692" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Reads the prior asset</text>
  <text x="692" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">state: PRESENT,</text>
  <text x="692" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">DOES_NOT_EXIST, DELETED.</text>

  <rect x="44" y="188" width="376" height="104" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">At the front: ten minutes of nothing</text>
  <text x="58" y="232" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">It can take up to 10 minutes for any feed creation,</text>
  <text x="58" y="246" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">update or deletion to take effect.</text>
  <text x="58" y="268" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">Long enough to assume it is misconfigured, edit it,</text>
  <text x="58" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">and restart the same ten minutes.</text>

  <rect x="440" y="188" width="376" height="104" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="454" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">At the back: a silent drop</text>
  <text x="454" y="232" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">If the payload of your asset update exceeds the limit,</text>
  <text x="454" y="246" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">your asset update is discarded.</text>
  <text x="454" y="268" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">Not truncated, not retried, not late. No error to</text>
  <text x="454" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">catch &#8212; from the consumer, nothing happened.</text>

  <rect x="44" y="314" width="772" height="96" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="336" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The loss is not random &#8212; it is concentrated in the interesting tail</text>
  <text x="58" y="358" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Payload size scales with the configuration attached to a resource, so the updates most likely to exceed the limit</text>
  <text x="58" y="374" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">are the large, heavily-configured ones: a sprawling IAM policy, a big instance template, a cluster with many pools.</text>
  <text x="58" y="396" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Those are also the changes most worth being notified about.</text>

  <rect x="44" y="432" width="376" height="106" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The ceiling is per node, not per estate</text>
  <text x="58" y="476" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">You can create up to 200 feeds on a parent, counting</text>
  <text x="58" y="490" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">only feeds directly on it, not its children&#8217;s.</text>
  <text x="58" y="512" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Ten projects each get 200, and the organization gets</text>
  <text x="58" y="526" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">200 of its own on top. Hitting it is a design smell.</text>

  <rect x="440" y="432" width="376" height="106" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="454" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Cloud Asset Owner is an egress permission</text>
  <text x="454" y="476" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Viewer reads metadata. Owner reads metadata and</text>
  <text x="454" y="490" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">works with feeds.</text>
  <text x="454" y="512" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">The difference is not how much data is reachable &#8212; it</text>
  <text x="454" y="526" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">is a standing stream to a topic of their choosing.</text>

  <rect x="44" y="560" width="772" height="94" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="582" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Feed and export fail in opposite directions, which is why running both is not redundancy</text>
  <text x="58" y="604" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The feed gives seconds-to-minutes notice and drops what it cannot carry. The export from #23 gives a complete</text>
  <text x="58" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">snapshot on a schedule and tells you nothing in between. Asset history covers only the last 35 days.</text>
  <text x="58" y="642" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#6E7A45">Use the feed as a trigger: notice this, then go and look. Use the export as the evidence.</text>

  <text x="44" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">If a compliance question ever depends on &#8220;we were notified of every change&#8221;, a feed alone cannot support that claim.</text>
  <text x="44" y="704" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">No amount of subscriber engineering fixes it, because the drop happens before the message reaches your topic.</text>
</svg>
