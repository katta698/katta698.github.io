<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: how Config Connector turns Google Cloud resources into Kubernetes objects, why deleting the object deletes the resource by default, the abandon annotation, continuous drift correction and its blind spots, and the per-namespace identity model compared with the previous two posts">
  <title>Config Connector: the Kubernetes object owns the cloud resource, and what follows from that</title>
  <rect x="0" y="0" width="860" height="740" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The object is not a description of the resource. It is the thing that owns it.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Terraform converges when you run apply. This is a control loop that never finishes.</text>

  <rect x="44" y="78" width="230" height="86" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">You apply YAML</text>
  <text x="58" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">A Cloud SQL instance becomes</text>
  <text x="58" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">a custom resource. There is no</text>
  <text x="58" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">plan step to read first.</text>

  <line x1="274" y1="121" x2="304" y2="121" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="304,116 312,121 304,126" fill="#8A9A5B"/>

  <rect x="316" y="78" width="230" height="86" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="330" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">A controller reconciles</text>
  <text x="330" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Continuously, asynchronously,</text>
  <text x="330" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">on its own schedule.</text>
  <text x="330" y="152" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">etcd is the state. No state file.</text>

  <line x1="546" y1="121" x2="576" y2="121" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="576,116 584,121 576,126" fill="#8A9A5B"/>

  <rect x="588" y="78" width="228" height="86" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="602" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Google Cloud APIs</text>
  <text x="602" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">A console change is drift, and</text>
  <text x="602" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">drift gets corrected without</text>
  <text x="602" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">anyone being asked.</text>

  <rect x="44" y="184" width="772" height="98" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Delete is the one to internalise</text>
  <text x="58" y="228" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Delete the Kubernetes object and the associated Google Cloud resource is deleted by default. Not orphaned &#8212; deleted.</text>
  <text x="58" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">So kubectl delete namespace now reaches production infrastructure. Every habit around that command was formed</text>
  <text x="58" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">when the worst outcome was a rescheduled pod. One annotation stands between the habit and the consequence.</text>

  <rect x="44" y="302" width="376" height="112" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="324" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The annotation, set in advance</text>
  <text x="58" y="346" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6E7A45">metadata:</text>
  <text x="58" y="360" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6E7A45">  annotations:</text>
  <text x="58" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6E7A45">    cnrm.cloud.google.com/deletion-policy: abandon</text>
  <text x="58" y="398" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Also the routine way to change an immutable field:</text>
  <text x="58" y="404" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">abandon, edit, re-acquire.</text>

  <rect x="440" y="302" width="376" height="112" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="454" y="324" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Two things reconciliation cannot see</text>
  <text x="454" y="346" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Resources are not recreated when modifying</text>
  <text x="454" y="360" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">immutable fields &#8212; it raises UpdateFailed and stops,</text>
  <text x="454" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">where Terraform would plan a replacement.</text>
  <text x="454" y="396" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Mutable but unreadable fields update only when the</text>
  <text x="454" y="406" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">custom resource is modified &#8212; drift there is invisible.</text>

  <rect x="44" y="434" width="772" height="120" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">The same question, a third time &#8212; what has authority, and who may use it</text>
  <text x="58" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">#25 Terraform</text>
  <text x="220" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Who can read the state bucket. At least a bucket looks like storage worth protecting.</text>
  <text x="58" y="500" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">#26 Infra Manager</text>
  <text x="220" y="500" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Who can act as the deploy service account. An IAM binding, which looks like nothing.</text>
  <text x="58" y="522" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">#27 Config Connector</text>
  <text x="220" y="522" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Who can create in a namespace. Each namespace binds its own IAM service account.</text>
  <text x="58" y="544" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">RBAC scoped to &#8220;can deploy workloads&#8221; now also means &#8220;can provision infrastructure&#8221;, and nothing in it says so.</text>

  <rect x="44" y="574" width="376" height="94" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="596" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Where it earns its complexity</text>
  <text x="58" y="618" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">You want drift closed, not reported &#8212; neither</text>
  <text x="58" y="632" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Terraform post can offer that.</text>
  <text x="58" y="652" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">App and infrastructure in one kubectl apply.</text>

  <rect x="440" y="574" width="376" height="94" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="454" y="596" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Where it does not</text>
  <text x="454" y="618" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">No plan step, so the pull request is the only gate.</text>
  <text x="454" y="638" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Org policies and folders sit oddly in a workload</text>
  <text x="454" y="652" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">cluster. Loose RBAC becomes loose infrastructure.</text>

  <text x="44" y="700" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Drift correction is the feature and the hazard: at 3am somebody widens a firewall rule to restore service, and the</text>
  <text x="44" y="716" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">controller closes it again. reconcile-interval-in-seconds set to zero halts that while spec updates still apply.</text>
  <text x="44" y="732" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Know that annotation before the incident, not during it.</text>
</svg>
