<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 726" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the console, gcloud and client libraries as three faces over one Google Cloud REST API, the Operation object every mutating request returns, the difference between the get and wait polling methods and the two-minute deadline, and the hidden local gcloud configuration state">
  <title>One REST API, three faces: the Operation object, the polling methods, and the conveniences each face adds</title>
  <rect x="0" y="0" width="860" height="726" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The API hands you a receipt, not a result</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Every convenience above it is invisible until you step outside it &#8212; at which point it arrives as a bug.</text>

  <rect x="44" y="78" width="240" height="94" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Console</text>
  <text x="58" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Best at discovery, and reading</text>
  <text x="58" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">state you did not create.</text>
  <text x="58" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Hides the calls, the defaults it</text>
  <text x="58" y="166" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">chose, and the polling.</text>

  <rect x="310" y="78" width="240" height="94" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="324" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">gcloud</text>
  <text x="324" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Best at operating, scripting, and</text>
  <text x="324" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">learning the API.</text>
  <text x="324" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Hides local configuration, so the</text>
  <text x="324" y="166" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">same command is not the same.</text>

  <rect x="576" y="78" width="240" height="94" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="590" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">REST or a client library</text>
  <text x="590" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Best for anything a program</text>
  <text x="590" y="134" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">owns.</text>
  <text x="590" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Hides nothing &#8212; which is the</text>
  <text x="590" y="166" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">point, and the cost.</text>

  <line x1="164" y1="172" x2="164" y2="196" stroke="#8A9A5B" stroke-width="2"/>
  <line x1="430" y1="172" x2="430" y2="196" stroke="#8A9A5B" stroke-width="2"/>
  <line x1="696" y1="172" x2="696" y2="196" stroke="#8A9A5B" stroke-width="2"/>
  <line x1="164" y1="196" x2="696" y2="196" stroke="#8A9A5B" stroke-width="2"/>
  <line x1="430" y1="196" x2="430" y2="212" stroke="#8A9A5B" stroke-width="2"/>
  <polygon points="425,212 430,220 435,212" fill="#8A9A5B"/>

  <rect x="44" y="230" width="772" height="94" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="252" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">One REST API &#8212; and everything that changes something returns an Operation</text>
  <text x="58" y="274" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A mutating request returns an Operation object that you then poll to get the status of your request. The 200</text>
  <text x="58" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">acknowledges the instruction and says nothing about the outcome.</text>
  <text x="58" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">The console&#8217;s spinner is a poll loop. gcloud blocking is a poll loop. A synchronous client call is a poll loop.</text>

  <rect x="44" y="344" width="376" height="112" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="366" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">get &#8212; returns immediately</text>
  <text x="58" y="388" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">The Operation comes back whatever its state.</text>
  <text x="58" y="410" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Polling this on a one-second timer burns sixty</text>
  <text x="58" y="424" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">calls a minute against your rate quota to learn</text>
  <text x="58" y="438" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">nothing sixty times.</text>

  <rect x="440" y="344" width="376" height="112" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="454" y="366" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">wait &#8212; returns on DONE</text>
  <text x="454" y="388" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Or when the request is approaching the 2 minute</text>
  <text x="454" y="402" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">deadline. A bounded block, not a promise.</text>
  <text x="454" y="424" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">So a five-minute create needs three wait calls &#8212;</text>
  <text x="454" y="438" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">the loop is the design, not a workaround.</text>

  <rect x="44" y="476" width="376" height="112" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">gcloud is a program with memory</text>
  <text x="58" y="520" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Properties are settings that affect the behavior of</text>
  <text x="58" y="534" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">the tools; a configuration is a set of them.</text>
  <text x="58" y="556" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">So the same command, byte for byte, creates a</text>
  <text x="58" y="570" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">resource in different projects on two machines &#8212;</text>
  <text x="58" y="584" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">and nothing in the command records which.</text>

  <rect x="440" y="476" width="376" height="112" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="454" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">--quiet answers, it does not skip</text>
  <text x="454" y="520" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">It disables all interactive prompts &#8212; and if input is</text>
  <text x="454" y="534" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">required, defaults will be used.</text>
  <text x="454" y="556" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">So a confirmation you meant to avoid may have</text>
  <text x="454" y="570" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">been accepted on your behalf, and nothing in the</text>
  <text x="454" y="584" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">log shows which prompt existed.</text>

  <rect x="44" y="608" width="772" height="72" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="630" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">One flag replaces most of the guessing</text>
  <text x="58" y="652" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">--log-http logs all HTTP server requests and responses to stderr: which endpoint, how many calls one command</text>
  <text x="58" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">actually makes, what the body contained, and which of your arguments quietly became defaults.</text>

  <text x="44" y="706" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Run something familiar with it once. Afterwards the platform&#8217;s odder behaviours were just the API showing through.</text>
</svg>
