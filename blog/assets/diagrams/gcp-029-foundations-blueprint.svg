<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the enterprise foundations blueprint folder structure, its six deployment stages split across the foundation and infrastructure pipelines, the bootstrap step that cannot be automated by the pipeline it creates, and the two network topologies on offer">
  <title>The enterprise foundations blueprint: six folders, six stages, two pipelines, and one manual step</title>
  <rect x="0" y="0" width="860" height="740" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The useful thing is not that it is right. It is that it is complete.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">It takes a position on every question, in an order that works, with the dependencies made explicit by stage number.</text>

  <text x="44" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Six folders</text>

  <rect x="44" y="102" width="248" height="58" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Bootstrap</text>
  <text x="58" y="139" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">The projects used to deploy foundation</text>
  <text x="58" y="152" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">components. In the hierarchy, on purpose.</text>

  <rect x="306" y="102" width="248" height="58" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="320" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Common &#183; Networking</text>
  <text x="320" y="139" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">Resources shared by all environments,</text>
  <text x="320" y="152" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">and the shared networking.</text>

  <rect x="568" y="102" width="248" height="58" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="582" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Development &#183; Nonproduction &#183; Production</text>
  <text x="582" y="139" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1D2322">Nonproduction is a COPY of production &#8212;</text>
  <text x="582" y="152" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1D2322">not a cheaper approximation of it.</text>

  <text x="44" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Six stages, and the boundary that matters falls between 3 and 4</text>

  <rect x="44" y="206" width="772" height="62" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">0-bootstrap</text>
  <text x="170" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Bootstraps the organization and configures the CI/CD pipeline for every later stage.</text>
  <text x="58" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">Run by hand. The machinery cannot create itself, so this is the one step outside the pipeline.</text>
  <text x="58" y="262" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A6A3F">Human credentials, an organisation with no guardrails yet, and the state bucket created in that hour.</text>

  <rect x="44" y="280" width="376" height="104" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Foundation pipeline &#8212; the platform team</text>
  <text x="58" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">1-org</text>
  <text x="150" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">structure and baseline security</text>
  <text x="58" y="338" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">2-environments</text>
  <text x="150" y="338" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">dev, nonproduction, production</text>
  <text x="58" y="356" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">3-networks</text>
  <text x="150" y="356" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Shared VPCs and network resources</text>
  <text x="58" y="376" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Deploys what is used across the platform.</text>

  <rect x="440" y="280" width="376" height="104" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="454" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Infrastructure pipeline &#8212; the workload teams</text>
  <text x="454" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">4-projects</text>
  <text x="560" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">folder structure, projects, AND the</text>
  <text x="560" y="333" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">infrastructure pipeline itself</text>
  <text x="454" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">5-app-infra</text>
  <text x="560" y="352" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">an example workload deployment</text>
  <text x="454" y="376" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Stage 4 is the hinge: self-service without the org&#8217;s credentials.</text>

  <rect x="44" y="404" width="772" height="78" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">If you take one idea and implement nothing else, take the two-pipeline split</text>
  <text x="58" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The service account able to create a folder is never the one a workload team can reach. Post #26 made this</text>
  <text x="58" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">argument for a single deploy identity; the blueprint makes it structural &#8212; different pipelines, projects and accounts.</text>
  <text x="58" y="476" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Cheaper to keep than to retrofit: unpicking it later means changing how every team deploys.</text>

  <text x="44" y="514" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D2322">Two network topologies &#8212; the decision lives in the topology, not in firewall rules</text>

  <rect x="44" y="526" width="376" height="94" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="548" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Separate Shared VPC per environment</text>
  <text x="58" y="570" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">With no network traffic directly allowed between</text>
  <text x="58" y="584" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">environments.</text>
  <text x="58" y="606" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Isolation by absence of a path &#8212; the strongest kind.</text>

  <rect x="440" y="526" width="376" height="94" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="454" y="548" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Hub-and-spoke</text>
  <text x="454" y="570" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">A hub network connects each environment, with</text>
  <text x="454" y="584" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">traffic between them gated by an NVA.</text>
  <text x="454" y="606" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">Connectivity, with one place to inspect it.</text>

  <text x="44" y="654" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Read it as the answer sheet to questions you have already tried to answer.</text>
  <text x="44" y="672" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Read cold it produces cargo-cult adoption: a nonproduction folder a third the size of production, two pipelines</text>
  <text x="44" y="688" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">merged for convenience, day-one policies deferred until after the first workload.</text>
  <text x="44" y="710" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Every one of those is defensible made deliberately, and corrosive made by default. For an estate already running,</text>
  <text x="44" y="726" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">it is worth more as a gap analysis than as a deployment.</text>
</svg>
