<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the five fields of a Google Cloud IAM deny rule, the evaluation order placing deny before allow, the four ways deny policies are deliberately asymmetrical with allow policies, and the fail-closed behaviour of a denial condition that cannot be evaluated">
  <title>Deny policies: a separate machine, evaluated first, that fails closed</title>
  <rect x="0" y="0" width="860" height="760" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">The subtraction #33 said did not exist &#8212; and it is not allow with a minus sign.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">A separate policy type with its own syntax, attachment model and condition language. Four differences will catch you.</text>

  <rect x="44" y="78" width="772" height="64" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Evaluation order &#8212; the one sentence that governs everything</text>
  <text x="58" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#6E7A45">IAM always checks relevant DENY policies before checking relevant ALLOW policies.</text>
  <text x="520" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">No set of roles overcomes a match.</text>

  <rect x="44" y="158" width="376" height="152" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Five fields of a deny rule</text>
  <text x="58" y="202" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">deniedPrincipals</text>
  <text x="200" y="202" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">who loses it</text>
  <text x="58" y="222" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">exceptionPrincipals</text>
  <text x="200" y="222" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">exempt, even via group</text>
  <text x="58" y="242" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">deniedPermissions</text>
  <text x="200" y="242" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">v2 FQDN format</text>
  <text x="58" y="262" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">exceptionPermissions</text>
  <text x="200" y="262" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">holes in a group</text>
  <text x="58" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">denialCondition</text>
  <text x="200" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A6A3F">tags only &#8212; fails closed</text>
  <text x="58" y="302" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">500 policies per resource, 500 rules in total.</text>

  <rect x="440" y="158" width="376" height="152" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="454" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">The idiomatic guardrail</text>
  <text x="454" y="202" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Not a narrow denial of a few named people &#8212;</text>
  <text x="454" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">a TOTAL denial with a named exemption.</text>
  <text x="454" y="240" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">deniedPrincipals: public:all</text>
  <text x="454" y="256" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">exceptionPrincipals: the one group</text>
  <text x="454" y="280" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Reads as &#8220;only this team may do this&#8221;, and</text>
  <text x="454" y="294" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">survives new people, roles and projects.</text>

  <rect x="44" y="326" width="772" height="130" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="348" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Four ways deny is NOT the mirror of allow</text>
  <text x="58" y="372" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Allow policy</text>
  <text x="440" y="372" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Deny policy</text>
  <text x="58" y="392" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">iam.roles.delete</text>
  <text x="440" y="392" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A6A3F">iam.googleapis.com/roles.delete &#8212; v2, FQDN</text>
  <text x="58" y="412" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">no wildcards, ever</text>
  <text x="440" y="412" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6E7A45">wildcards, in supported permission groups</text>
  <text x="58" y="432" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">org / folder / project / RESOURCE</text>
  <text x="440" y="432" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A6A3F">org / folder / project only</text>
  <text x="58" y="450" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">full IAM Conditions attribute set</text>
  <text x="440" y="450" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A6A3F">resource tag functions only, failing closed</text>

  <rect x="44" y="472" width="772" height="110" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="494" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">The wildcard asymmetry is the interesting one</text>
  <text x="58" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">#35: a custom role cannot use wildcards, so its list ages &#8212; a permission added next quarter is NOT granted.</text>
  <text x="58" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">#36: a permission group includes all current AND FUTURE permissions matching the pattern &#8212; no edit needed.</text>
  <text x="58" y="556" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#6E7A45">Grants do not grow on their own. Prohibitions do. That is the right way round.</text>
  <text x="58" y="574" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Bounded, though: wildcards work only where Google defines a group, not wherever you would like one.</text>

  <rect x="44" y="598" width="772" height="102" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="620" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">The catch: the one field in IAM that fails closed</text>
  <text x="58" y="642" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Every other optional field narrows a rule when unsatisfied. This one reverses: if the condition is true</text>
  <text x="58" y="660" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">OR CANNOT BE EVALUATED, the deny applies. Only an explicit false spares the principal.</text>
  <text x="58" y="682" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1D2322">Unevaluable condition + public:all = everyone denied, everywhere under the attachment point.</text>

  <text x="44" y="726" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Test denial conditions against an UNTAGGED resource &#8212; the case that fails closed is the one nobody tries.</text>
  <text x="44" y="746" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A control that switches itself off when confused is not a control. Harder to change is the point.</text>
</svg>
