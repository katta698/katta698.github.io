<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 754" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the four short-lived credential types from the Service Account Credentials API, what validates each one, the two different twelve-hour limits for access tokens and self-signed JWTs, and how a delegation chain passes a request without conferring access">
  <title>Short-lived credentials: four outputs, one escrowed key, two different clocks</title>
  <rect x="0" y="0" width="860" height="754" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">You cannot hold the key. You can still ask it to sign &#8212; four ways.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The escrow from #40 restricts POSSESSION, not capability. Choose the type by who validates the result.</text>

  <rect x="44" y="78" width="772" height="136" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Four types, by who checks them</text>
  <text x="58" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Type</text>
  <text x="290" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Carries</text>
  <text x="450" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Validated by</text>
  <text x="58" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">OAuth 2.0 access token</text>
  <text x="290" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">permissions</text>
  <text x="450" y="148" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Google &#8212; most Google APIs accept it</text>
  <text x="58" y="170" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">OIDC ID token</text>
  <text x="290" y="170" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">identity</text>
  <text x="450" y="170" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">whatever the audience names</text>
  <text x="58" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Self-signed JWT</text>
  <text x="290" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">claims you write</text>
  <text x="450" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">your app, API Gateway, or Google</text>
  <text x="58" y="208" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Self-signed blob</text>
  <text x="290" y="208" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">arbitrary bytes</text>
  <text x="450" y="208" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">anything that verifies a signature</text>

  <rect x="44" y="232" width="772" height="74" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="254" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">All four are #40&#8217;s escrowed key, working for you</text>
  <text x="58" y="276" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Both signing methods say it: they use the service account&#8217;s SYSTEM-MANAGED PRIVATE KEY.</text>
  <text x="58" y="298" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#6E7A45">You keep every capability. You lose only the ability to copy the key onto a laptop.</text>

  <rect x="44" y="324" width="772" height="138" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="346" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">The catch: two unrelated things both called twelve hours</text>
  <text x="290" y="370" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Access token</text>
  <text x="560" y="370" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Self-signed JWT</text>
  <text x="58" y="392" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Default maximum</text>
  <text x="290" y="392" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">1 hour (3,600s)</text>
  <text x="560" y="392" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">you set exp; ceiling 12 hours</text>
  <text x="58" y="414" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Raised to 12 hours by</text>
  <text x="290" y="414" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">a list constraint, per account</text>
  <text x="560" y="414" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">nothing &#8212; 12h is the ceiling</text>
  <text x="58" y="436" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Calling a Google API</text>
  <text x="290" y="436" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">same limits</text>
  <text x="560" y="436" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">1 HOUR MAX, regardless</text>
  <text x="58" y="456" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">Enforced by</text>
  <text x="290" y="456" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">the issuer, at generation</text>
  <text x="560" y="456" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">the RECIPIENT, at validation</text>

  <rect x="44" y="480" width="772" height="58" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="502" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">So the same mistake is a build-time error for one and a runtime error for the other &#8212; an over-long access token</text>
  <text x="58" y="524" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">fails when you ask for it; an over-long JWT is minted happily and rejected later, by a service you may not control.</text>

  <rect x="44" y="556" width="376" height="112" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="578" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Delegation chains carry nothing</text>
  <text x="58" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">SA_1 &#8594; SA_2 &#8594; SA_3. Each account grants Token</text>
  <text x="58" y="614" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Creator to the previous one.</text>
  <text x="58" y="636" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">The middle ONLY PASSES ON THE REQUEST &#8212;</text>
  <text x="58" y="650" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">it gives neither end any additional access.</text>
  <text x="58" y="664" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">A route, not an accumulation.</text>

  <rect x="440" y="556" width="376" height="112" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="454" y="578" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">A service account as identity provider</text>
  <text x="454" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Sign a JWT with arbitrary claims about a user,</text>
  <text x="454" y="614" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">account or device &#8212; verifiable by anyone,</text>
  <text x="454" y="628" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">with a key held by nobody.</text>
  <text x="454" y="650" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">But nothing validates the CONTENT. Whoever can</text>
  <text x="454" y="664" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">impersonate the account can assert anything.</text>

  <text x="44" y="702" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">There is no refresh token. Renewal is re-impersonation &#8212; which is what forces the caller to re-present their identity.</text>
  <text x="44" y="726" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">Possession was never what made the key useful. It bought the ability to use it WITHOUT ASKING &#8212; which is</text>
  <text x="44" y="742" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">the same as using it without being recorded.</text>
</svg>
