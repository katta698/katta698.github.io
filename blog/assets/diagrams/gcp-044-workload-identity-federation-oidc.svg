<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 754" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: why a multi-tenant OIDC issuer URL such as GitHub Actions does not identify an organisation, how the attribute condition becomes the trust boundary, which GitHub claims are stable and non-reusable, and three further ways the federation trust can be subverted after configuration">
  <title>OIDC federation: the issuer is all of GitHub, so the attribute condition is the boundary</title>
  <rect x="0" y="0" width="860" height="754" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">One issuer URL for every customer GitHub has. Without a condition, that is who you trusted.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">The issuer identifies all of GitHub or Terraform Cloud &#8212; not a specific organization.</text>

  <rect x="44" y="78" width="772" height="124" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Where the trust boundary moved</text>
  <text x="330" y="122" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">AWS (#43)</text>
  <text x="560" y="122" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">GitHub / GitLab / Terraform Cloud</text>
  <text x="58" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">What the issuer identifies</text>
  <text x="330" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">your AWS account</text>
  <text x="560" y="144" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">ALL of GitHub</text>
  <text x="58" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">Who can get a token</text>
  <text x="330" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">principals in your account</text>
  <text x="560" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">anybody with an account</text>
  <text x="58" y="184" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1D2322">The trust boundary</text>
  <text x="330" y="184" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">implicit in the provider</text>
  <text x="560" y="184" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">the attribute condition, and nothing else</text>

  <rect x="44" y="222" width="772" height="88" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="244" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">And forgetting it is not an error</text>
  <text x="58" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The pool works. The pipeline authenticates. The deploy succeeds. The audit log shows your pipeline</text>
  <text x="58" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">doing exactly what it should. Every test you would think to run passes.</text>
  <text x="58" y="302" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">The right question is unnatural: not &#8220;does our pipeline work&#8221; but &#8220;whose tokens does this issuer sign&#8221;.</text>

  <rect x="44" y="330" width="376" height="140" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">GitHub claims, ranked by trustworthiness</text>
  <text x="58" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">repository_owner_id &#183; repository_id</text>
  <text x="58" y="388" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">numeric, cannot be reclaimed</text>
  <text x="58" y="410" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A6A3F">repository_owner &#183; repository</text>
  <text x="58" y="424" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A6A3F">names &#8212; renameable, then reclaimable</text>
  <text x="58" y="446" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">ref &#8212; useful: require refs/heads/main</text>
  <text x="58" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">sub &#8212; VARIES by source event. Not an identity.</text>

  <rect x="440" y="330" width="376" height="140" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="454" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Two Google pages, two answers</text>
  <text x="454" y="374" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Setup guide: condition on repository_owner</text>
  <text x="454" y="388" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">&#8212; the organisation NAME.</text>
  <text x="454" y="410" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">Best practices (#43): use attributes that</text>
  <text x="454" y="424" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">cannot be reused over time.</text>
  <text x="454" y="446" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">Org names can be renamed and reclaimed.</text>
  <text x="454" y="462" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">The guide is the one people follow.</text>

  <rect x="44" y="490" width="772" height="140" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="512" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">Three more ways the trust gets subverted after setup</text>
  <text x="58" y="536" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">1. Federating twice</text>
  <text x="58" y="552" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">One identity becomes two principals. Revoke one; an admin may be unaware of the other, and access survives.</text>
  <text x="58" y="574" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">2. JWKS swapping</text>
  <text x="58" y="590" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">TLS to a proxy authenticates the PROXY, not the IdP. Swapped keys sign tokens Google considers valid.</text>
  <text x="58" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">3. A credential configuration you were handed</text>
  <text x="58" y="626" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">It holds URLs and paths. Validate the JSON, or the workload is pointed at malicious endpoints.</text>

  <text x="44" y="666" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">The condition appears as an optional field described as a way to &#8220;restrict access&#8221; &#8212; language that suggests</text>
  <text x="44" y="682" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">narrowing something already bounded. For a shared issuer it narrows nothing. It IS the boundary.</text>
  <text x="44" y="710" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">A shared-tenancy IdP proves a true thing &#8212; this came from GitHub &#8212; which is not the thing you wanted proved.</text>
  <text x="44" y="734" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">An empty condition is not a simpler configuration. It is a different one.</text>
</svg>
