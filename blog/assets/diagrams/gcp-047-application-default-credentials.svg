<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 748" style="width:100%;max-width:860px;" role="img" aria-label="Diagram: the three locations Application Default Credentials searches in order, what credential type each yields, why the preferred production credential is checked last, and how the search order determines whether the resulting access token is revocable or introspectable">
  <title>Application Default Credentials: a search path, not a ranking</title>
  <rect x="0" y="0" width="860" height="748" fill="#F8F7F5"/>

  <text x="44" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D2322">Three locations, one fixed order &#8212; and the best one is checked last.</text>
  <text x="44" y="58" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6260">Google states it plainly: the order ADC checks is NOT related to the relative merit of each location.</text>

  <rect x="44" y="78" width="772" height="150" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">The search order</text>
  <text x="58" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">1. GOOGLE_APPLICATION_CREDENTIALS</text>
  <text x="380" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">a federation config &#8212; or a service account KEY</text>
  <text x="58" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">2. The local ADC file</text>
  <text x="380" y="150" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">your USER credentials, or an impersonated account</text>
  <text x="58" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5A6260">$HOME/.config/gcloud/application_default_credentials.json</text>
  <text x="58" y="190" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#6E7A45">3. The metadata server</text>
  <text x="380" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">the ATTACHED service account</text>
  <text x="58" y="212" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">&#8212; which Google names the PREFERRED method in a production environment. And it is third.</text>

  <rect x="44" y="248" width="772" height="112" rx="7" fill="#FDF8F1" stroke="#B5885B" stroke-width="1.5"/>
  <text x="58" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">So everything the last eight posts built can be overridden by one environment variable</text>
  <text x="58" y="292" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Set in a Dockerfile, a systemd unit, a CI runner config, a shell profile. No error. No warning. No log line.</text>
  <text x="58" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A6A3F">The application authenticates, does its work, and is simply a different principal than you designed.</text>
  <text x="58" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Same shape as #45&#8217;s hostNetwork Pods and #41&#8217;s SSH session: an identity substituted by something that</text>
  <text x="58" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">does not look like an identity decision.</text>

  <rect x="44" y="384" width="772" height="140" rx="7" fill="#FFFFFF" stroke="#C9C4BC" stroke-width="1"/>
  <text x="58" y="406" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D2322">The search order also chooses your TOKEN &#8212; and its security properties</text>
  <text x="58" y="430" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">ADC finds</text>
  <text x="330" y="430" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Token</text>
  <text x="540" y="430" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Lifetime</text>
  <text x="690" y="430" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5A6260">Revocable</text>
  <text x="58" y="452" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">local ADC, user credentials</text>
  <text x="330" y="452" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">user access token</text>
  <text x="540" y="452" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">1 hour</text>
  <text x="690" y="452" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6E7A45">YES</text>
  <text x="58" y="474" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">attached service account</text>
  <text x="330" y="474" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">service account token</text>
  <text x="540" y="474" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">5 min &#8211; 12 hours</text>
  <text x="690" y="474" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">NO</text>
  <text x="58" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1D2322">a federation config</text>
  <text x="330" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">federated access token</text>
  <text x="540" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6260">see docs</text>
  <text x="690" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A6A3F">not introspectable</text>
  <text x="58" y="516" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8A6A3F">A leaked service account token CANNOT be revoked. You wait for expiry &#8212; up to twelve hours.</text>

  <rect x="44" y="548" width="772" height="84" rx="7" fill="#F7F8F1" stroke="#8A9A5B" stroke-width="1.5"/>
  <text x="58" y="570" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D2322">Not all credential files are equally bad to lose</text>
  <text x="58" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">A leaked federation config describes HOW to exchange an external identity &#8212; useless without that identity.</text>
  <text x="58" y="612" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#6E7A45">A compromised KEY can be used with no additional information. One is a map; the other is the door.</text>

  <text x="44" y="656" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">Two credential sets on a developer machine: gcloud auth login is NOT gcloud auth application-default login.</text>
  <text x="44" y="672" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A6260">And local ADC from user credentials is cloud-wide by default &#8212; the laptop is often the most privileged place.</text>
  <text x="44" y="700" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">The decision moved out of the code and into the environment, where nothing about it looks like a</text>
  <text x="44" y="716" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1D2322">security control. ADC searched, found, returned. From its point of view nothing went wrong.</text>
</svg>
