<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Jayanth Katta</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1D2322; color: #F5F5F3;
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #161A1A; border: 1px solid #2E3635;
    border-radius: 12px; padding: 2.5rem 2rem; width: 100%; max-width: 360px;
  }
  .logo { font-size: 0.7rem; letter-spacing: 0.15em; color: #C4A484; text-transform: uppercase; margin-bottom: 1.75rem; }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.4rem; }
  .sub { font-size: 0.82rem; color: #7E8584; margin-bottom: 2rem; }
  label { display: block; font-size: 0.72rem; color: #7E8584; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.4rem; }
  input[type="password"] {
    width: 100%; background: #1D2322; border: 1px solid #2E3635;
    border-radius: 6px; padding: 0.7rem 1rem; font-size: 0.9rem;
    color: #F5F5F3; outline: none; margin-bottom: 1.25rem;
    transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: #C4A484; }
  button {
    width: 100%; background: #C4A484; color: #1D2322;
    border: none; border-radius: 6px; padding: 0.75rem;
    font-size: 0.88rem; font-weight: 700; cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #b09173; }
  .error { font-size: 0.78rem; color: #e05a5a; margin-top: 0.75rem; display: none; }
  .back { display: block; text-align: center; margin-top: 1.25rem; font-size: 0.75rem; color: #7E8584; text-decoration: none; }
  .back:hover { color: #C4A484; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">jayanthkatta.com</div>
  <h1>Private Dashboard</h1>
  <p class="sub">Sign in to continue</p>
  <label for="pwd">Password</label>
  <input type="password" id="pwd" placeholder="Enter password" autofocus />
  <button onclick="login()">Continue →</button>
  <p class="error" id="err">Incorrect password. Try again.</p>
  <a class="back" href="/blog/">← Back to blog</a>
</div>
<script>
  var HASH = 'f5e3a3d8179a6f87d2063ee90d313db07e825c9ee1b725896d1f610b5da09b84';
  var DEST  = 'https://d2gzeansw218bi.cloudfront.net/?key=77023a79f00d0615aa31df50bd72e35c';

  if (localStorage.getItem('jk_dash') === HASH) {
    window.location.replace(DEST);
  }

  function login() {
    var val = document.getElementById('pwd').value;
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(val)).then(function(buf) {
      var hex = Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      if (hex === HASH) {
        localStorage.setItem('jk_dash', HASH);
        window.location.replace(DEST);
      } else {
        document.getElementById('err').style.display = 'block';
      }
    });
  }

  document.getElementById('pwd').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
