<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8dcc8">
<meta name="robots" content="noindex,nofollow">
<title>Connect card-match preview (not live)</title>
<style>
  :root {
    --paper: #efe6d6;
    --ink: #211f1c;
    --muted: #6c6659;
    --line: rgba(33,31,28,.16);
    --rust: #a8432a;
    --rust-d: #8a3520;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    min-height: 100dvh;
    background: #e8dcc8;
    color: var(--ink);
    font: 400 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    position: sticky; top: 0; z-index: 20;
    padding: 8px 12px;
    background: #211f1c; color: #f7f1e5;
    font: 650 12px/1.3 system-ui, sans-serif;
    text-align: center;
  }
  .page {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 30% 40%, rgba(90,74,50,.03) 0 .5px, transparent .9px) 0 0/13px 15px,
      linear-gradient(180deg, #f3ebdc 0%, var(--paper) 50%, #e8dcc8 100%);
  }
  /* ONE intact print — no crops, no layered ghosts */
  .card-art {
    display: block;
    width: 100%;
    height: auto;
    vertical-align: top;
  }
  .actions {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 14px 18px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .note {
    margin: 0 0 4px;
    color: var(--muted);
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .act {
    display: flex; align-items: center; gap: 12px;
    min-height: 52px; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,252,246,.94), rgba(243,236,223,.8));
    box-shadow: 0 1px 0 rgba(255,255,255,.75) inset, 0 2px 6px rgba(78,62,38,.05);
    color: inherit; text-decoration: none;
    font-size: .94rem; font-weight: 650;
  }
  .act-main {
    min-height: 58px;
    border-color: var(--rust-d);
    background: linear-gradient(180deg, #b44a2f, var(--rust) 62%, var(--rust-d));
    color: #fdf7ee; font-weight: 700;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .go { margin-left: auto; opacity: .45; }
  .act-main .go { opacity: .85; }
  .li {
    display: grid; place-items: center;
    width: 24px; height: 24px; flex: none;
    border: 1.6px solid currentColor; border-radius: 5px;
    font-size: .72rem; font-weight: 800;
  }
</style>
</head>
<body>
  <div class="banner">Preview only — full print card + actions. Not live.</div>
  <main class="page">
    <img class="card-art" src="print-card.webp" width="1200" height="1600"
         alt="Jayanth Katta — print connect card art">
    <nav class="actions" aria-label="Ways to connect">
      <p class="note">Tap to connect</p>
      <a class="act act-main" href="https://www.linkedin.com/in/jayanthkatta" target="_blank" rel="noopener noreferrer">
        <span class="li" aria-hidden="true">in</span>Connect on LinkedIn<span class="go" aria-hidden="true">&#8599;</span>
      </a>
      <div class="pair">
        <a class="act" href="/connect/jayanth-katta.vcf">Save Contact</a>
        <a class="act" href="/">View Website</a>
        <a class="act" href="https://github.com/katta698" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a class="act" href="mailto:katta.jayant@gmail.com">Email Me</a>
      </div>
    </nav>
  </main>
</body>
</html>
