<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#efe6d6">
<title>Connect composed preview (not live)</title>
<style>
  :root {
    --paper: #efe6d6;
    --ink: #1a1814;
    --muted: #6a6358;
    --rust: #a8432a;
    --rust-d: #8a3520;
    --line: rgba(26,24,20,.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    position: sticky; top: 0; z-index: 5;
    padding: 8px 12px; text-align: center;
    background: #1a1814; color: #f4efe4;
    font: 650 11px/1.3 system-ui, sans-serif; letter-spacing: .04em;
  }
  .stage {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 0 0 calc(12px + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(circle at 30% 40%, rgba(90,74,50,.03) 0 .5px, transparent .9px) 0 0/13px 15px,
      var(--paper);
  }
  .hero {
    position: relative;
    height: clamp(240px, 38svh, 320px);
    background:
      linear-gradient(180deg, transparent 55%, var(--paper) 100%),
      url("print-art.webp") 62% 18% / cover no-repeat;
  }
  .copy {
    padding: 4px 22px 0;
  }
  .creed {
    margin: 0;
    color: var(--muted);
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .18em;
    line-height: 1.85;
    text-transform: uppercase;
  }
  .name {
    margin: 14px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.6rem, 11vw, 3.4rem);
    font-weight: 400;
    letter-spacing: -.03em;
    line-height: .95;
  }
  .name .dot {
    display: inline-block;
    width: .18em; height: .18em;
    margin-left: .08em;
    border-radius: 50%;
    background: var(--rust);
    vertical-align: .2em;
  }
  .role {
    margin: 12px 0 0;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .brush {
    display: block;
    width: 88px; height: 6px;
    margin: 12px 0 0;
    border-radius: 60% 40% 55% 45%;
    background: linear-gradient(90deg, rgba(168,67,42,.92), rgba(168,67,42,.2) 75%, transparent);
    transform: rotate(-1.5deg) skewX(-14deg);
  }
  .mantra {
    margin: 18px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.2rem;
    font-style: italic;
    line-height: 1.45;
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    margin-top: 14px;
  }
  .seal {
    display: grid; place-items: center;
    width: 34px; height: 34px; flex: none;
    border: 1px solid rgba(168,67,42,.7);
    border-radius: 3px;
    color: var(--rust);
    font-size: .72rem; font-weight: 700;
    letter-spacing: -.08em;
    transform: rotate(-5deg);
  }
  .acts {
    padding: 18px 22px 8px;
    display: grid;
    gap: 9px;
  }
  .act {
    display: flex; align-items: center; gap: 12px;
    min-height: 54px; padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,252,246,.95), rgba(243,236,223,.82));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 2px 6px rgba(78,62,38,.05);
    color: inherit; text-decoration: none;
    font-size: .94rem; font-weight: 650;
  }
  .act-main {
    min-height: 58px;
    border-color: var(--rust-d);
    background: linear-gradient(180deg, #b44a2f, var(--rust) 60%, var(--rust-d));
    color: #fdf7ee; font-weight: 700;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .go { margin-left: auto; opacity: .4; }
  .act-main .go { opacity: .85; }
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    margin: 4px 22px 0;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .6rem; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="banner">Composed preview — art from print, type + actions in-page (not live)</div>
  <main class="stage">
    <div class="hero" role="img" aria-label="Ink landscape with traveler under pine"></div>
    <div class="copy">
      <p class="creed">Tech / People / Ideas / A kinder / Cloud</p>
      <h1 class="name">Jayanth<br>Katta<span class="dot" aria-hidden="true"></span></h1>
      <p class="role">Cloud Infrastructure Engineer</p>
      <span class="brush" aria-hidden="true"></span>
      <p class="mantra">Build / Learn / Share / Repeat</p>
      <div class="row">
        <span class="seal" lang="ja" aria-hidden="true">継続</span>
      </div>
    </div>
    <div>
      <nav class="acts" aria-label="Ways to connect">
        <a class="act act-main" href="https://www.linkedin.com/in/jayanthkatta" target="_blank" rel="noopener noreferrer">
          Connect on LinkedIn<span class="go" aria-hidden="true">↗</span>
        </a>
        <div class="pair">
          <a class="act" href="/connect/jayanth-katta.vcf">Save Contact</a>
          <a class="act" href="/">Website</a>
          <a class="act" href="https://github.com/katta698" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a class="act" href="mailto:katta.jayant@gmail.com">Email</a>
        </div>
      </nav>
      <footer class="foot">
        <span>A more curious tomorrow</span>
      </footer>
    </div>
  </main>
</body>
</html>
