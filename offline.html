<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Offline | Jayanth Katta Blog</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#1D2322"/>
<link rel="icon" href="/favicon-transparent.png" type="image/png"/>
<style>
  /* Styles are inline: this page has to render when blog.css is not cached. */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F8F7F5;
    color: #1C2120;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 420px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-family: Georgia, serif; font-size: 24px; font-weight: 600; margin: 20px 0 8px; }
  p { font-size: 15px; line-height: 1.65; color: #5A615F; margin: 0 0 22px; }
  a.btn {
    display: inline-block; text-decoration: none;
    padding: 10px 22px; border-radius: 10px;
    background: #C4A484; color: #2C2117; font-size: 14px;
  }
  .hint { font-size: 13px; color: #7E8584; margin-top: 20px; }
  @media (prefers-color-scheme: dark) {
    body { background: #161A1A; color: #F5F5F3; }
    p { color: #A3ABA9; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/blog/assets/icons/icon-192.png" alt=""/>
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline reading yet. Posts you've already opened are still available.</p>
    <a class="btn" href="/blog/">Back to saved posts</a>
    <p class="hint">This page will load normally once you're back online.</p>
  </div>
</body>
</html>
