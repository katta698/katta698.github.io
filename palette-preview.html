<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette preview — the real pages</title>
<!-- A development tool, deliberately public but unlisted: not linked from
     anywhere, absent from the sitemap and RSS, and noindex so it stays out
     of search. It was _preview-week.html until the underscore was found to
     be the reason it could never be served: this repo has no .nojekyll, so
     Pages runs Jekyll, which excludes underscore-prefixed paths. That is
     also why /_templates/ and /_archive/ return 404 on the live site while
     existing in the repo -- deliberate for those two, fatal for this one. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#101010;color:#EDEBE6}
  header{padding:11px 16px;border-bottom:1px solid #2F3131;display:flex;flex-wrap:wrap;
    gap:14px;align-items:center;position:sticky;top:0;background:#101010;z-index:5}
  .grp{display:flex;gap:5px;align-items:center}
  .lbl{font:700 9.5px/1 sans-serif;letter-spacing:.15em;text-transform:uppercase;
    color:#8A8D86;margin-right:3px}
  button,select{font:600 12px/1 'DM Sans',system-ui,sans-serif;color:#EDEBE6;background:#1C1F1C;
    border:1px solid #343834;border-radius:7px;padding:7px 11px;cursor:pointer}
  button:hover{border-color:#55605A}
  button.on{background:#B85D46;border-color:#B85D46;color:#fff}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;
    vertical-align:-1px;border:1px solid rgba(255,255,255,.22)}
  .hint{font-size:11.5px;color:#8A8D86;margin-left:auto}
  .hint b{color:#EDEBE6;font-family:ui-monospace,Consolas,monospace;font-weight:400}
  iframe{display:block;width:100%;height:calc(100vh - 56px);border:0;background:#fff}
</style>

<header>
  <div class="grp" id="days"><span class="lbl">Day</span></div>
  <div class="grp"><span class="lbl">Theme</span>
    <button id="b-light" class="on">Light</button>
    <button id="b-dark">Dark</button>
  </div>
  <div class="grp"><span class="lbl">Page</span>
    <select id="page">
      <option value="/blog/">Blog index</option>
      <option value="/">Home</option>
      <option value="/now.html">Now</option>
      <option value="/resume.html">Resume</option>
      <option value="/blog/week-13-waf-shield-protection/">A post (Week 13)</option>
      <option value="/blog/aws-architecture-aurora-global-database/">An arch post</option>
    </select>
  </div>
  <div class="hint" id="hint"></div>
</header>

<iframe id="f" src="/blog/"></iframe>

<script>
/* The seven live palettes, read from blog.css. If they change there, change them
   here -- these drive only the swatches and the readout, not the pages
   themselves, which take their colour from the stylesheet like any visitor. */
var DAYS = [
  ['mon','Mon','Stone blue', '#EFF7FB', '#191E20'],
  ['tue','Tue','Bone',       '#F7F4EF', '#1F1D1B'],
  ['wed','Wed','Teal stone', '#EFF8F7', '#191F1E'],
  ['thu','Thu','Clay',       '#FAF2F2', '#211C1C'],
  ['fri','Fri','Sage',       '#F2F8F3', '#1B1E1B'],
  ['sat','Sat','Ash violet', '#F4F4FA', '#1D1D21'],
  ['sun','Sun','Moss grey',  '#F5F7F2', '#1D1E1B']
];

var day = DAYS[(new Date().getDay() + 6) % 7][0];   // today, Mon-indexed
var dark = false;
var f = document.getElementById('f');

DAYS.forEach(function (d) {
  var b = document.createElement('button');
  b.dataset.day = d[0];
  b.innerHTML = '<span class="swatch" style="background:' + d[3] + '"></span>' + d[1];
  b.title = d[2];
  b.onclick = function () { day = d[0]; apply(); };
  document.getElementById('days').appendChild(b);
});

function apply() {
  DAYS.forEach(function (d) {
    var btn = document.querySelector('[data-day="' + d[0] + '"]');
    btn.classList.toggle('on', d[0] === day);
    btn.querySelector('.swatch').style.background = dark ? d[4] : d[3];
  });
  document.getElementById('b-light').classList.toggle('on', !dark);
  document.getElementById('b-dark').classList.toggle('on', dark);

  var row = DAYS.filter(function (d) { return d[0] === day; })[0];
  document.getElementById('hint').innerHTML =
    row[2] + ' &nbsp; <b>' + (dark ? row[4] : row[3]) + '</b>';

  paint();
}

/* The site's own inline setter reads the weekday on load and its theme script
   reads localStorage, so both have to be overridden AFTER the frame settles --
   and again on a short delay, because blog.js injects site-footer.js post-load.
   A single override on 'load' would be undone. */
function paint() {
  try {
    var d = f.contentDocument;
    if (!d || !d.documentElement) return;
    d.documentElement.setAttribute('data-palette', day);
    /* The blog is light-by-default with body.dark; the home page and now.html
       are dark-by-default with body.light. Setting both classes correctly means
       one control drives every page rather than only the blog. */
    var home = /^\/(index\.html)?$|now\.html|resume\.html/.test(d.location.pathname);
    if (home) { d.body.classList.toggle('light', !dark); d.body.classList.remove('dark'); }
    else      { d.body.classList.toggle('dark', dark);   d.body.classList.remove('light'); }
  } catch (e) {}
}

f.addEventListener('load', function () { paint(); setTimeout(paint, 120); setTimeout(paint, 500); });
setInterval(paint, 700);   // cheap, and survives in-frame navigation

document.getElementById('b-light').onclick = function () { dark = false; apply(); };
document.getElementById('b-dark').onclick  = function () { dark = true;  apply(); };
document.getElementById('page').onchange = function () { f.src = this.value; };

apply();
</script>
