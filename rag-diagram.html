<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Ask My Blog — RAG Pipeline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1117; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  .title { color: #f0f0f0; font-size: 14px; letter-spacing: 2px; margin-bottom: 24px; font-weight: bold; }
  svg { width: 720px; height: 420px; }
  .label-sm { font-size: 9px; fill: #888; font-family: 'Courier New', monospace; }
  .label-md { font-size: 11px; fill: #f0f0f0; font-family: 'Courier New', monospace; font-weight: bold; }
  .label-sub { font-size: 9px; fill: #aaa; font-family: 'Courier New', monospace; }
  .section-label { font-size: 9px; fill: #555; letter-spacing: 3px; font-family: 'Courier New', monospace; }
  .arrow { stroke: #333; stroke-width: 1.5; fill: none; }
  .arrow-blue { stroke: #6ea8fe; stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; }
  #status { color: #f0a500; font-size: 11px; letter-spacing: 1px; margin-top: 16px; height: 18px; font-family: 'Courier New', monospace; }
  .tab-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 5px 14px; font-size: 10px; letter-spacing: 1px; border: 1px solid #333; border-radius: 4px; color: #888; cursor: pointer; font-family: 'Courier New', monospace; background: transparent; transition: all 0.2s; }
  .tab.active { border-color: #f0a500; color: #f0a500; }
</style>
</head>
<body>

<div class="title">ASK MY BLOG — RAG PIPELINE</div>

<div class="tab-row">
  <button class="tab active" onclick="runMode('index', event)">DAILY INDEXING</button>
  <button class="tab" onclick="runMode('query', event)">QUERY FLOW</button>
</div>

<svg id="svg" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#444"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6ea8fe"/>
    </marker>
  </defs>

  <text x="30" y="30" class="section-label">EVERY DAY</text>

  <g id="n-eb" style="opacity:0.3">
    <rect x="30" y="40" width="110" height="58" rx="5" fill="#1a1d2e" stroke="#f0a500" stroke-width="1.5"/>
    <text x="85" y="63" text-anchor="middle" class="label-md">EventBridge</text>
    <text x="85" y="78" text-anchor="middle" class="label-sub">fires daily</text>
    <text x="85" y="91" text-anchor="middle" class="label-sub">at midnight</text>
  </g>
  <line x1="140" y1="69" x2="170" y2="69" class="arrow" marker-end="url(#arr)"/>

  <g id="n-il" style="opacity:0.3">
    <rect x="170" y="40" width="130" height="58" rx="5" fill="#1a1d2e" stroke="#f0a500" stroke-width="1.5"/>
    <text x="235" y="63" text-anchor="middle" class="label-md">Indexer Lambda</text>
    <text x="235" y="78" text-anchor="middle" class="label-sub">fetch + chunk posts</text>
    <text x="235" y="91" text-anchor="middle" class="label-sub">~400 words each</text>
  </g>
  <line x1="300" y1="69" x2="330" y2="69" class="arrow" marker-end="url(#arr)"/>

  <g id="n-te" style="opacity:0.3">
    <rect x="330" y="40" width="130" height="58" rx="5" fill="#1a1d2e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="395" y="63" text-anchor="middle" class="label-md">Titan Embed v2</text>
    <text x="395" y="78" text-anchor="middle" class="label-sub">text → numbers</text>
    <text x="395" y="91" text-anchor="middle" class="label-sub">captures meaning</text>
  </g>
  <line x1="460" y1="69" x2="490" y2="69" class="arrow" marker-end="url(#arr)"/>

  <g id="n-s3" style="opacity:0.3">
    <rect x="490" y="40" width="110" height="58" rx="5" fill="#1a1d2e" stroke="#34d399" stroke-width="1.5"/>
    <text x="545" y="63" text-anchor="middle" class="label-md">S3 Bucket</text>
    <text x="545" y="78" text-anchor="middle" class="label-sub">chunks + vectors</text>
    <text x="545" y="91" text-anchor="middle" class="label-sub">saved as index</text>
  </g>

  <line x1="30" y1="130" x2="690" y2="130" stroke="#222" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="30" y="158" class="section-label">WHEN YOU ASK</text>

  <g id="n-user" style="opacity:0.3">
    <rect x="30" y="168" width="110" height="58" rx="5" fill="#1a1d2e" stroke="#6ea8fe" stroke-width="1.5"/>
    <text x="85" y="191" text-anchor="middle" class="label-md">You</text>
    <text x="85" y="206" text-anchor="middle" class="label-sub">type a question</text>
    <text x="85" y="219" text-anchor="middle" class="label-sub">jayanthkatta.com</text>
  </g>
  <line x1="140" y1="197" x2="170" y2="197" class="arrow" marker-end="url(#arr)"/>

  <g id="n-apig" style="opacity:0.3">
    <rect x="170" y="168" width="110" height="58" rx="5" fill="#1a1d2e" stroke="#f0a500" stroke-width="1.5"/>
    <text x="225" y="191" text-anchor="middle" class="label-md">API Gateway</text>
    <text x="225" y="206" text-anchor="middle" class="label-sub">POST /search</text>
    <text x="225" y="219" text-anchor="middle" class="label-sub">routes request</text>
  </g>
  <line x1="280" y1="197" x2="310" y2="197" class="arrow" marker-end="url(#arr)"/>

  <g id="n-ql" style="opacity:0.3">
    <rect x="310" y="168" width="140" height="58" rx="5" fill="#1a1d2e" stroke="#f0a500" stroke-width="1.5"/>
    <text x="380" y="191" text-anchor="middle" class="label-md">Query Lambda</text>
    <text x="380" y="206" text-anchor="middle" class="label-sub">embed question</text>
    <text x="380" y="219" text-anchor="middle" class="label-sub">cosine sim → top 4</text>
  </g>
  <line x1="450" y1="197" x2="480" y2="197" class="arrow" marker-end="url(#arr)"/>

  <g id="n-nova" style="opacity:0.3">
    <rect x="480" y="168" width="130" height="58" rx="5" fill="#1a1d2e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="545" y="191" text-anchor="middle" class="label-md">Nova Micro</text>
    <text x="545" y="206" text-anchor="middle" class="label-sub">reads chunks</text>
    <text x="545" y="219" text-anchor="middle" class="label-sub">writes answer</text>
  </g>

  <line x1="545" y1="98" x2="545" y2="148" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="545" y1="148" x2="380" y2="148" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="380" y1="148" x2="380" y2="168" stroke="#333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="462" y="143" text-anchor="middle" class="label-sm">load index</text>

  <path d="M610 226 Q660 310 85 310 L85 226" fill="none" class="arrow-blue" marker-end="url(#arr-blue)"/>
  <text x="370" y="330" text-anchor="middle" class="label-sm" fill="#6ea8fe">answer + source links</text>

  <circle id="dot" r="5" cx="0" cy="0" fill="#f0a500" opacity="0"/>
</svg>

<div id="status"></div>

<script>
  const status = document.getElementById('status');
  const dot = document.getElementById('dot');
  let mode = 'index';
  let loopId = null;

  function setOpacity(id, val) {
    const el = document.getElementById(id);
    if (el) el.style.opacity = val;
  }

  function resetAll() {
    ['n-eb','n-il','n-te','n-s3','n-user','n-apig','n-ql','n-nova'].forEach(id => setOpacity(id, 0.25));
    dot.style.opacity = 0;
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function animateDot(x1, y1, x2, y2, color) {
    dot.setAttribute('fill', color || '#f0a500');
    dot.setAttribute('cx', x1);
    dot.setAttribute('cy', y1);
    dot.style.opacity = 1;
    const steps = 30;
    for (let i = 0; i <= steps; i++) {
      dot.setAttribute('cx', x1 + (x2 - x1) * i / steps);
      dot.setAttribute('cy', y1 + (y2 - y1) * i / steps);
      await sleep(14);
    }
    dot.style.opacity = 0;
  }

  async function runIndex() {
    resetAll();
    status.textContent = '▶ EventBridge fires...';
    setOpacity('n-eb', 1); await sleep(800);
    await animateDot(140, 69, 170, 69);
    status.textContent = '▶ Fetching + chunking blog posts...';
    setOpacity('n-il', 1); await sleep(900);
    await animateDot(300, 69, 330, 69);
    status.textContent = '▶ Converting text to embeddings (Titan Embed v2)...';
    setOpacity('n-te', 1); await sleep(900);
    await animateDot(460, 69, 490, 69);
    status.textContent = '▶ Saving index to S3...';
    setOpacity('n-s3', 1); await sleep(900);
    status.textContent = '✓ Index updated. Done in ~30s.';
    await sleep(2000);
    if (mode === 'index') runIndex();
  }

  async function runQuery() {
    resetAll();
    status.textContent = '▶ You type a question...';
    setOpacity('n-user', 1); await sleep(800);
    await animateDot(140, 197, 170, 197);
    status.textContent = '▶ API Gateway routes request...';
    setOpacity('n-apig', 1); await sleep(700);
    await animateDot(280, 197, 310, 197);
    status.textContent = '▶ Query Lambda embeds question + finds top 4 chunks...';
    setOpacity('n-ql', 1);
    await sleep(300); setOpacity('n-s3', 1); await sleep(700);
    await animateDot(450, 197, 480, 197, '#a78bfa');
    status.textContent = '▶ Nova Micro reads chunks + writes answer...';
    setOpacity('n-nova', 1); await sleep(900);
    status.textContent = '✓ Answer + sources returned in ~2s.';
    await sleep(2000);
    if (mode === 'query') runQuery();
  }

  function runMode(m, e) {
    mode = m;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    if (m === 'index') runIndex();
    else runQuery();
  }

  runIndex();
</script>
</body>
</html>
