<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Arial,sans-serif;}
.hero {
  background: #0f1923;
  color: #fff;
  padding: 3.5rem 2rem 2.5rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, #FF9900, transparent);
  opacity: .5;
}
.hero-eyebrow {
  display: inline-block;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #FF9900;
  margin-bottom: .75rem;
}
.hero h1 {
  font-size: 2.5rem;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-bottom: .6rem;
  line-height: 1.2;
}
.hero-sub {
  color: rgba(255,255,255,.58);
  font-size: .95rem;
  max-width: 480px;
  margin: 0 auto 1.5rem;
}
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 2rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.hero-stat { text-align: center; }
.hero-stat-n { display: block; font-size: 1.5rem; font-weight: 700; color: #FF9900; line-height: 1; }
.hero-stat-l { display: block; font-size: .7rem; font-weight: 500; color: rgba(255,255,255,.45); text-transform: uppercase; }

.hero-typer {
  font-family: 'Courier New', monospace;
  font-size: .82rem;
  color: #FF9900;
  opacity: .85;
}
.hero-typer .cursor { animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<section class="hero">
  <span class="hero-eyebrow">Engineering &amp; Life</span>
  <h1>Jayanth's Blog</h1>
  <p class="hero-sub">Thoughts on AWS, Terraform, Kubernetes, platform engineering, and the quieter things in life.</p>
  <div class="hero-stats">
    <div class="hero-stat"><span class="hero-stat-n">57</span><span class="hero-stat-l">Posts</span></div>
    <div class="hero-stat"><span class="hero-stat-n">6</span><span class="hero-stat-l">Topics</span></div>
    <div class="hero-stat"><span class="hero-stat-n">221</span><span class="hero-stat-l">Min of reading</span></div>
    <div class="hero-stat"><span class="hero-stat-n">Jun 2026</span><span class="hero-stat-l">Latest</span></div>
  </div>
  <div class="hero-typer">$ <span id="typed"></span><span class="cursor">|</span></div>
</section>

<script>
  var lines = ["deploying ideas...", "terraform apply --auto-approve", "still debugging life, one day at a time"];
  var li = 0, ci = 0, el = document.getElementById('typed');
  function type() {
    var line = lines[li];
    if (ci <= line.length) {
      el.textContent = line.slice(0, ci);
      ci++;
      setTimeout(type, 70);
    } else {
      setTimeout(erase, 1600);
    }
  }
  function erase() {
    var line = lines[li];
    if (ci > 0) {
      ci--;
      el.textContent = line.slice(0, ci);
      setTimeout(erase, 30);
    } else {
      li = (li + 1) % lines.length;
      setTimeout(type, 400);
    }
  }
  type();
</script>

</body>
</html>
