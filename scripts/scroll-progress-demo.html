<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#16191F;color:#fff;}
#progress-bar{position:fixed;top:0;left:0;height:4px;background:#FF9900;width:0%;z-index:999;transition:width 0.1s;}
.section{height:100vh;display:flex;align-items:center;justify-content:center;font-size:2rem;border-bottom:1px solid #333;}
.label{position:fixed;top:20px;right:20px;background:#000;padding:10px 16px;font-family:monospace;font-size:14px;color:#FF9900;border-radius:4px;z-index:998;}
</style>
</head>
<body>
<div id="progress-bar"></div>
<div class="label" id="pct">0%</div>
<div class="section">Section 1 — top of page</div>
<div class="section">Section 2 — scrolling down</div>
<div class="section">Section 3 — almost there</div>
<div class="section">Section 4 — bottom of page</div>
<script>
  var bar = document.getElementById('progress-bar');
  var pct = document.getElementById('pct');
  function update() {
    var scrolled = window.scrollY;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p = max > 0 ? (scrolled / max) * 100 : 0;
    bar.style.width = p + '%';
    pct.textContent = Math.round(p) + '%';
  }
  window.addEventListener('scroll', update);
  update();
</script>
</body>
</html>
