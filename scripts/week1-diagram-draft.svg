<svg viewBox="0 -70 1080 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<title>Week 1: Enterprise Self-Service EC2 Provisioning</title>
<rect x="0" y="-70" width="1080" height="380" fill="#ffffff"/>

<!-- AWS Cloud boundary (outer) -->
<rect x="360" y="15" width="650" height="175" rx="6" fill="none" stroke="#545B64" stroke-width="2"/>
<rect x="370" y="-3" width="20" height="20" rx="3" fill="#545B64"/>
<text x="396" y="12" font-size="13" font-weight="700" fill="#545B64">AWS Cloud</text>

<!-- AWS Account boundary (inner) -->
<rect x="380" y="40" width="610" height="140" rx="6" fill="none" stroke="#E0117D" stroke-width="2"/>
<rect x="390" y="14" width="20" height="20" rx="3" fill="#E0117D"/>
<text x="416" y="29" font-size="13" font-weight="700" fill="#E0117D">AWS Account</text>

<!-- Requester (person icon, no box) -->
<g>
  <circle cx="60" cy="73" r="12" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M38 110 Q38 88 60 88 Q82 88 82 110" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="60" y="136" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">Requester</text>
</g>

<!-- ServiceNow -->
<g>
  <rect x="170" y="58" width="60" height="60" rx="10" fill="#475569"/>
  <path d="M186 88 h28 M186 78 h28 M186 98 h20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="136" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">ServiceNow</text>
  <text x="200" y="151" font-size="9.5" text-anchor="middle" fill="#666">Catalog item</text>
</g>

<!-- API Gateway -->
<g>
  <rect x="400" y="58" width="60" height="60" rx="10" fill="#E7157B"/>
  <path d="M418 76 l-10 12 l10 12 M442 76 l10 12 l-10 12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="136" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">API Gateway</text>
  <text x="430" y="151" font-size="9.5" text-anchor="middle" fill="#666">REST endpoint</text>
</g>

<!-- Lambda -->
<g>
  <rect x="560" y="58" width="60" height="60" rx="10" fill="#ED7100"/>
  <path d="M580 100 L596 68 M596 68 h16 M588 84 h20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="590" y="136" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">Lambda</text>
  <text x="590" y="151" font-size="9.5" text-anchor="middle" fill="#666">Validate · start SF</text>
</g>

<!-- Step Functions -->
<g>
  <rect x="720" y="58" width="60" height="60" rx="10" fill="#E7157B"/>
  <circle cx="738" cy="74" r="4" fill="#ffffff"/>
  <circle cx="762" cy="74" r="4" fill="#ffffff"/>
  <circle cx="738" cy="102" r="4" fill="#ffffff"/>
  <circle cx="762" cy="102" r="4" fill="#ffffff"/>
  <path d="M738 74 L762 74 M738 74 L738 102 M762 74 L762 102 M738 102 L762 102" stroke="#ffffff" stroke-width="2"/>
  <text x="750" y="136" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">Step Functions</text>
  <text x="750" y="151" font-size="9.5" text-anchor="middle" fill="#666">Orchestration</text>
</g>

<!-- EC2 -->
<g>
  <rect x="880" y="58" width="60" height="60" rx="10" fill="#ED7100"/>
  <rect x="896" y="74" width="28" height="28" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="903" y="81" width="14" height="14" fill="#ffffff"/>
  <text x="910" y="136" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">EC2</text>
  <text x="910" y="151" font-size="9.5" text-anchor="middle" fill="#666">Auto Scaling Group</text>
</g>

<!-- GitHub Actions (outside boundary, below) -->
<g>
  <rect x="720" y="230" width="60" height="60" rx="10" fill="#24292e"/>
  <circle cx="750" cy="252" r="9" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M736 272 Q750 264 764 272" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="750" y="308" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">GitHub Actions</text>
  <text x="750" y="323" font-size="9.5" text-anchor="middle" fill="#666">OIDC · terraform apply</text>
</g>

<!-- Arrows + numbered steps -->
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#1a1a2e"/>
  </marker>
</defs>

<!-- 1: Requester -> ServiceNow -->
<line x1="95" y1="88" x2="165" y2="88" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="130" cy="88" r="10" fill="#1a1a2e"/>
<text x="130" y="92" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>

<!-- 2: ServiceNow -> API Gateway -->
<line x1="232" y1="88" x2="396" y2="88" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="314" cy="88" r="10" fill="#1a1a2e"/>
<text x="314" y="92" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>

<!-- 3: API Gateway -> Lambda -->
<line x1="462" y1="88" x2="556" y2="88" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="509" cy="88" r="10" fill="#1a1a2e"/>
<text x="509" y="92" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>

<!-- 4: Lambda -> Step Functions -->
<line x1="622" y1="88" x2="716" y2="88" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="669" cy="88" r="10" fill="#1a1a2e"/>
<text x="669" y="92" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>

<!-- 5: Step Functions -> GitHub Actions (right-angle elbow, offset from the GH caption) -->
<path d="M780 88 L828 88 L828 200 L750 200 L750 226" fill="none" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="828" cy="155" r="10" fill="#1a1a2e"/>
<text x="828" y="159" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>

<!-- 6: GitHub Actions -> EC2 (right-angle elbow, enters EC2's right edge) -->
<path d="M780 260 L970 260 L970 88 L940 88" fill="none" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="970" cy="200" r="10" fill="#1a1a2e"/>
<text x="970" y="204" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>

<!-- 7: EC2 -> Step Functions (callback, dashed, right-angle elbow inside the boundary's header gap) -->
<path d="M910 58 L910 25 L770 25 L770 54" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<circle cx="830" cy="25" r="9" fill="#1a1a2e"/>
<text x="830" y="29" font-size="9.5" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>

<!-- 8: Step Functions -> ServiceNow (writeback, dashed, right-angle elbow above the boundary) -->
<path d="M730 58 L730 -45 L200 -45 L200 54" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<circle cx="475" cy="-45" r="10" fill="#1a1a2e"/>
<text x="475" y="-41" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">8</text>

</svg>
